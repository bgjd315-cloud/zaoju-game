<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>造句積木工坊</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Chiron+GoRound+TC:wght@400;700&display=swap">
<style>
/* 版面概念：作文稿紙＋句子積木。淺色是白天的稿紙，深色是教室黑板。關聯詞永遠是橘色的「鑰匙積木」。 */
:root{
  --paper:#f6f5ec; --card:#ffffff; --ink:#1f2a24; --muted:#5b6a61; --line:#d8e1da;
  --grid:#9cc9b0; --grid-strong:#2f7d5b; --tile:#edf3ee; --tile-ink:#1f2a24;
  --key:#d95f22; --key-bg:#fde5d3; --star:#e9a51a; --ok:#2c8549; --no:#c4432c;
  --r-who:#2a64d6; --r-time:#8447cc; --r-place:#0f8378; --r-how:#c23d78;
  --font-text:"ZaojuKai","LXGW WenKai TC","BiauKai","DFKai-SB","標楷體",serif;
  --font-ui:"ZaojuKai","Chiron GoRound TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --cell:clamp(30px,8.4vw,44px);
  --radius:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#16221c; --card:#1e2d26; --ink:#eef1e8; --muted:#a6b6ac; --line:#30463b;
  --grid:#3d6a54; --grid-strong:#7cc39f; --tile:#273a31; --tile-ink:#eef1e8;
  --key:#ff9a5c; --key-bg:#4b2d1d; --star:#ffc94a; --ok:#6fd08f; --no:#ff8a73;
  --r-who:#7ea6ff; --r-time:#c49bff; --r-place:#5fd0c3; --r-how:#ff8fbd; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#16221c; --card:#1e2d26; --ink:#eef1e8; --muted:#a6b6ac; --line:#30463b;
  --grid:#3d6a54; --grid-strong:#7cc39f; --tile:#273a31; --tile-ink:#eef1e8;
  --key:#ff9a5c; --key-bg:#4b2d1d; --star:#ffc94a; --ok:#6fd08f; --no:#ff8a73;
  --r-who:#7ea6ff; --r-time:#c49bff; --r-place:#5fd0c3; --r-how:#ff8fbd; color-scheme:dark}

html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--font-ui);font-size:17px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.wrap{max-width:880px;margin:0 auto;padding-block:0 48px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid var(--grid-strong);outline-offset:2px}
h1,h2,h3{text-wrap:balance;margin:0;line-height:1.3}

/* 頂列 */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);display:flex;align-items:center;gap:12px;padding-block:12px;border-bottom:2px solid var(--grid)}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0}
.brand-mark{display:grid;grid-template-columns:repeat(2,18px);gap:2px}
.brand-mark span{width:18px;height:18px;border:1.5px solid var(--grid-strong);font:700 13px/15px var(--font-text);text-align:center;color:var(--grid-strong)}
.brand-mark span.k{background:var(--key);border-color:var(--key);color:#fff}
.brand h1{font:700 21px/1.2 var(--font-text);letter-spacing:.06em}
.top .sp{flex:1}
.stars{font-variant-numeric:tabular-nums;font-weight:700;color:var(--ink);display:flex;align-items:center;gap:4px;white-space:nowrap}
.stars svg{width:20px;height:20px;fill:var(--star)}
.ghost{background:none;border:1.5px solid var(--line);border-radius:999px;padding:4px 14px;font-size:15px;white-space:nowrap}
.ghost:hover{border-color:var(--grid-strong)}

/* 首頁 */
.intro{display:grid;gap:6px;padding-block:22px 6px}
.intro h2{font:700 clamp(24px,5vw,32px)/1.3 var(--font-text)}
.intro p{margin:0;color:var(--muted)}
.seg{display:inline-flex;border:2px solid var(--grid-strong);border-radius:999px;overflow:hidden;margin-block:16px 4px}
.seg button{border:0;background:none;padding:6px 20px;font-weight:700}
.seg button[aria-pressed="true"]{background:var(--grid-strong);color:var(--paper)}
.lessons{display:grid;gap:12px;margin-top:14px}
.lesson{background:var(--card);border:1.5px solid var(--line);border-radius:var(--radius);padding:12px 14px;display:grid;gap:8px}
.lesson-name{font:700 18px/1.3 var(--font-text)}
.lesson-name small{font:400 13px var(--font-ui);color:var(--muted);margin-left:6px}
.pat-row{display:flex;flex-wrap:wrap;gap:8px}
.pat-btn{display:flex;align-items:center;gap:10px;border:2px solid var(--key);background:var(--key-bg);color:var(--ink);border-radius:12px;padding:6px 12px;font:700 18px var(--font-text)}
.pat-btn:hover{transform:translateY(-1px)}
.dots{display:inline-flex;gap:3px}
.dots i{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--star)}
.dots i.on{background:var(--star)}
.grow-card{margin-top:18px;display:flex;flex-wrap:wrap;align-items:center;gap:14px;background:var(--card);border:2px dashed var(--grid-strong);border-radius:var(--radius);padding:14px 16px}
.grow-card .txt{flex:1;min-width:200px}
.grow-card h3{font:700 19px var(--font-text)}
.grow-card p{margin:2px 0 0;color:var(--muted);font-size:15px}
.legend{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:14px;border-radius:999px;padding:1px 10px;border:1.5px solid currentColor;font-weight:700}
.c-who{color:var(--r-who)}.c-time{color:var(--r-time)}.c-place{color:var(--r-place)}.c-how{color:var(--r-how)}.c-act{color:var(--grid-strong)}

.primary{background:var(--grid-strong);color:var(--paper);border:0;border-radius:12px;padding:10px 20px;font-weight:700;font-size:17px}
.primary:disabled{opacity:.4;cursor:not-allowed}
.secondary{background:var(--card);border:2px solid var(--grid-strong);color:var(--grid-strong);border-radius:12px;padding:8px 16px;font-weight:700}
.btn-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

/* 關卡頁 */
.back{background:none;border:0;padding:14px 0 4px;color:var(--muted);font-size:15px}
.pat-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px}
.pat-head h2{font:700 clamp(26px,6vw,36px)/1.2 var(--font-text);color:var(--key)}
.pat-head .from{color:var(--muted);font-size:15px}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-block:16px}
.step{border:2px solid var(--line);background:var(--card);border-radius:12px;padding:6px 4px;display:grid;justify-items:center;gap:0;font-size:14px;color:var(--muted)}
.step b{font:700 18px var(--font-text);color:var(--ink)}
.step[aria-current="step"]{border-color:var(--grid-strong);box-shadow:0 0 0 2px var(--grid-strong) inset}
.step.done b::after{content:" ★";color:var(--star)}
.panel{background:var(--card);border:1.5px solid var(--line);border-radius:var(--radius);padding:18px;display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
.panel>*{min-width:0}
.ask{font:700 20px/1.45 var(--font-text)}
.hint{color:var(--muted);font-size:15px;margin:0}

/* 稿紙 */
.gz{display:flex;flex-wrap:wrap;border-top:1.5px solid var(--grid-strong);border-left:1.5px solid var(--grid-strong);width:fit-content;max-width:100%}
.gz span{width:var(--cell);height:var(--cell);border-right:1.5px solid var(--grid);border-bottom:1.5px solid var(--grid);display:grid;place-items:center;font:400 calc(var(--cell)*.6)/1 var(--font-text);color:var(--ink)}
.gz span.k{background:var(--key-bg);color:var(--key);font-weight:700}
.gz span.new{animation:pop .5s ease}
.gz span.r-who{color:var(--r-who);font-weight:700}.gz span.r-time{color:var(--r-time);font-weight:700}
.gz span.r-place{color:var(--r-place);font-weight:700}.gz span.r-how{color:var(--r-how);font-weight:700}
.gz.empty span{color:var(--muted)}
@keyframes pop{0%{transform:scale(.4);opacity:.2}70%{transform:scale(1.15)}100%{transform:scale(1)}}

/* 公式 */
.formula{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.f-key{background:var(--key);color:#fff;border-radius:10px;padding:6px 12px;font:700 22px var(--font-text)}
.f-blank{border:2.5px dashed var(--muted);border-radius:10px;padding:6px 12px;min-width:64px;text-align:center;color:var(--muted);font-size:15px}
.f-p{font:700 22px var(--font-text)}

/* 積木 */
.tray{display:flex;flex-wrap:wrap;gap:8px;min-height:56px;padding:10px;border-radius:12px;background:var(--tile)}
.answer{background:transparent;border:2.5px dashed var(--grid);}
.tile{border:2px solid var(--line);background:var(--card);color:var(--tile-ink);border-radius:10px;padding:6px 12px;font:400 21px var(--font-text);box-shadow:0 2px 0 var(--line)}
.tile.k{border-color:var(--key);background:var(--key-bg);color:var(--key);font-weight:700;box-shadow:0 2px 0 var(--key)}
.tile:active{transform:translateY(2px);box-shadow:none}
.tile.pick{outline:3px solid var(--grid-strong)}
.tile.wrong{border-color:var(--no);animation:shake .4s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

.opts{display:grid;gap:10px}
.opt{text-align:left;border:2px solid var(--line);background:var(--card);border-radius:12px;padding:10px 14px;font:400 20px/1.5 var(--font-text)}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--card))}
.opt.no{border-color:var(--no);opacity:.75}
.fb{border-radius:12px;padding:10px 14px;font-size:16px;margin:0}
.fb.ok{background:color-mix(in srgb,var(--ok) 14%,var(--card));color:var(--ink);border:1.5px solid var(--ok)}
.fb.no{background:color-mix(in srgb,var(--no) 12%,var(--card));color:var(--ink);border:1.5px solid var(--no)}

/* 寫一寫 */
.modes{display:flex;gap:8px;flex-wrap:wrap}
.modes button{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:4px 14px;font-weight:700;font-size:15px}
.modes button[aria-pressed="true"]{border-color:var(--grid-strong);color:var(--grid-strong)}
.frame{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.slot{border:2.5px dashed var(--grid-strong);background:none;border-radius:10px;padding:6px 12px;min-width:84px;font:400 20px var(--font-text);color:var(--muted)}
.slot.filled{border-style:solid;color:var(--ink);background:var(--tile)}
.slot.active{box-shadow:0 0 0 3px var(--star)}
.bank{display:flex;flex-wrap:wrap;gap:8px}
textarea{width:100%;box-sizing:border-box;min-height:90px;border:2px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font:400 22px/1.6 var(--font-text);padding:10px 12px;resize:vertical}
.checks{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.checks li{display:flex;gap:10px;align-items:center;font-size:16px}
.checks .mk{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:700;border:2px solid var(--line);flex:none;color:var(--muted)}
.checks li.pass .mk{background:var(--ok);border-color:var(--ok);color:var(--card)}
.checks label{display:flex;gap:10px;align-items:center;cursor:pointer}
.checks input{width:22px;height:22px;accent-color:var(--ok)}
.tutor{border-left:4px solid var(--star);background:var(--tile);border-radius:0 12px 12px 0;padding:10px 14px;font-size:16px}
.tutor b{font-family:var(--font-text)}
.win{display:flex;align-items:center;gap:10px;font:700 20px var(--font-text);color:var(--ok)}
.win svg{width:34px;height:34px;fill:var(--star);animation:pop .6s ease}

/* 句子長大了 */
.bases{display:flex;flex-wrap:wrap;gap:8px}
.grow-step{display:grid;gap:8px}
.quiz-cards{display:grid;gap:12px;margin-top:18px}
.quiz-cards .grow-card{margin-top:0}
.pic{margin:0;display:grid;gap:6px;justify-items:start}
.pic img{width:100%;max-width:560px;aspect-ratio:4/3;object-fit:cover;border-radius:12px;border:2px solid var(--grid)}
.pic figcaption{font-size:15px;color:var(--muted)}
.howto{margin:0;padding-left:1.3em;display:grid;gap:4px;font-size:16px}
.pic-list{display:grid;gap:12px;margin-top:14px}
.pic-row{background:var(--card);border:1.5px solid var(--line);border-radius:var(--radius);padding:14px;display:grid;grid-template-columns:minmax(0,1fr) minmax(180px,300px);gap:14px;align-items:start}
.pic-row.done{border-color:var(--ok)}
.pic-info{display:grid;gap:8px;min-width:0}
.drop{border:2.5px dashed var(--grid-strong);border-radius:12px;aspect-ratio:4/3;display:grid;place-items:center;text-align:center;padding:10px;color:var(--muted);cursor:pointer;overflow:hidden;background:var(--tile);font-size:15px}
.drop.has{padding:0;border-style:solid}
.drop img{width:100%;height:100%;object-fit:cover}
.drop.active{box-shadow:0 0 0 4px var(--star);border-color:var(--star)}
.prompt{white-space:pre-wrap;word-break:break-word;background:var(--tile);border-radius:10px;padding:10px;font:400 14px/1.6 var(--font-ui);margin:6px 0 0}
details summary{cursor:pointer;color:var(--grid-strong);font-weight:700;font-size:15px}
@media (max-width:600px){.pic-row{grid-template-columns:1fr}}
.grow-step h3{font:700 17px var(--font-ui);display:flex;gap:8px;align-items:center}

/* 老師區 */
.t-sec{display:grid;gap:8px}
.t-sec h3{font:700 20px var(--font-text);padding-bottom:4px;border-bottom:2px solid var(--grid)}
.t-sec p,.t-sec li{font-size:16px}
.t-sec ul{margin:0;padding-left:1.2em;display:grid;gap:4px}
.codes{display:grid;gap:6px}
.code{display:grid;grid-template-columns:5.5em 1fr;gap:10px;font-size:16px}
.code b{font-variant-numeric:tabular-nums;color:var(--grid-strong)}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px;min-width:420px}
th,td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
th{color:var(--muted);font-weight:700}
td.kw{font:700 17px var(--font-text);color:var(--key);white-space:nowrap}
.works{display:grid;gap:6px}
.work{display:flex;gap:10px;align-items:baseline;font-size:16px;border-bottom:1px dashed var(--line);padding-bottom:4px}
.work .tag{font-size:13px;color:var(--key);font-weight:700;white-space:nowrap}
.work .s{font-family:var(--font-text);font-size:19px;flex:1;min-width:0}
a{color:var(--grid-strong)}
.small{font-size:14px;color:var(--muted)}
/* ---- 遊戲化 ---- */
.primary{box-shadow:0 4px 0 color-mix(in srgb,var(--grid-strong) 55%,#000);transition:transform .08s}
.primary:active{transform:translateY(3px);box-shadow:0 1px 0 color-mix(in srgb,var(--grid-strong) 55%,#000)}
.buddy-btn{width:40px;height:40px;border-radius:50%;padding:0;border:2.5px solid var(--star);background:#fff;overflow:hidden;flex:none}
.buddy-btn img{width:100%;height:100%;object-fit:cover;display:block}
.album-btn span{font-variant-numeric:tabular-nums;font-weight:700;color:var(--key)}
.hero{display:flex;gap:14px;align-items:center;padding-block:20px 4px}
.hero-buddy{width:96px;height:96px;flex:none;border-radius:50%;border:4px solid var(--star);background:#fff;padding:0;overflow:hidden;animation:bob 3s ease-in-out infinite}
.hero-buddy img{width:100%;height:100%;object-fit:cover;display:block}
@keyframes bob{50%{transform:translateY(-5px) rotate(-2deg)}}
.hero-txt{display:grid;gap:10px;min-width:0;flex:1}
.bubble{position:relative;margin:0;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:10px 14px;font:700 clamp(18px,4.4vw,22px)/1.45 var(--font-text)}
.bubble::before{content:"";position:absolute;left:-10px;top:22px;border:8px solid transparent;border-right-color:var(--line);border-left:0}
.lv{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.lv b{font:700 16px var(--font-ui);color:var(--key);background:var(--key-bg);border-radius:999px;padding:2px 12px}
.lv-bar{flex:1;min-width:120px;height:12px;border-radius:999px;background:var(--tile);overflow:hidden;border:1.5px solid var(--line)}
.lv-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--star),var(--key));border-radius:999px}
.map{list-style:none;margin:14px 0 0;padding:0 0 0 28px;display:grid;gap:18px;position:relative}
.map::before{content:"";position:absolute;left:11px;top:8px;bottom:8px;border-left:4px dashed var(--grid)}
.stop{position:relative;display:grid;gap:8px;counter-increment:stop}
.stop::before{content:counter(stop);position:absolute;left:-28px;top:0;width:26px;height:26px;border-radius:50%;background:var(--card);border:3px solid var(--grid-strong);display:grid;place-items:center;font:700 13px var(--font-ui);color:var(--grid-strong)}
.map{counter-reset:stop}
.stop.clear::before{content:"★";background:var(--star);border-color:var(--star);color:#fff}
.stop-name{font:700 18px/1.3 var(--font-text)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.tile-card{display:grid;gap:6px;text-align:left;background:var(--card);border:2.5px solid var(--line);border-radius:16px;padding:8px;box-shadow:0 4px 0 var(--line);transition:transform .12s}
.tile-card:hover{transform:translateY(-3px) rotate(-.5deg)}
.tile-card:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.tile-card.full{border-color:var(--star);box-shadow:0 4px 0 var(--star)}
.tc-img{position:relative;display:block;border-radius:10px;overflow:hidden;aspect-ratio:4/3;background:var(--tile)}
.tc-img img{width:100%;height:100%;object-fit:cover;display:block}
.badge{position:absolute;top:6px;right:6px;background:var(--star);color:#3a2a00;font:700 12px var(--font-ui);border-radius:999px;padding:1px 8px}
.tc-name{font:700 17px/1.35 var(--font-text);color:var(--key)}
.gc-img{width:96px;aspect-ratio:4/3;object-fit:cover;border-radius:10px}
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translate(-50%,140%);display:flex;align-items:center;gap:10px;background:var(--card);border:2.5px solid var(--grid-strong);border-radius:999px;padding:6px 18px 6px 6px;font:700 18px var(--font-text);box-shadow:0 8px 24px rgb(0 0 0 / .18);z-index:30;transition:transform .25s;max-width:calc(100% - 32px)}
.toast.show{transform:translate(-50%,0)}
.toast.try{border-color:var(--key)}
.toast img{width:44px;height:44px;border-radius:50%;object-fit:cover;flex:none;background:#fff}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:40}
.modal{position:fixed;inset:0;z-index:50;background:rgb(0 0 0 / .45);display:grid;place-items:center;padding:16px}
.modal-box{background:var(--card);border-radius:20px;padding:20px;max-width:520px;width:100%;max-height:calc(100% - 32px);overflow:auto;display:grid;gap:12px;animation:pop .35s ease}
.modal-kicker{margin:0;text-align:center;font:700 15px var(--font-ui);color:var(--key);letter-spacing:.08em}
.modal-title{margin:0;text-align:center;font:700 22px/1.4 var(--font-text)}
.sticker-big{width:100%;border-radius:14px;border:6px solid #fff;box-shadow:0 6px 18px rgb(0 0 0 / .2);transform:rotate(-2deg)}
.buddy-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.buddy{display:grid;justify-items:center;gap:4px;background:var(--tile);border:3px solid transparent;border-radius:16px;padding:8px 4px;font:700 16px var(--font-text)}
.buddy img{width:100%;max-width:90px;aspect-ratio:1;border-radius:50%;object-fit:cover;background:#fff}
.buddy.sel{border-color:var(--star);background:var(--key-bg)}
.name-row{display:grid;gap:6px;font-size:15px;color:var(--muted)}
.name-row input{font:400 20px var(--font-text);padding:8px 12px;border:2px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink)}
.album-h{font:700 19px var(--font-text);margin:18px 0 8px}
.album{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.stk{display:grid;gap:4px;padding:6px;background:var(--card);border:2px dashed var(--line);border-radius:14px;font:700 14px/1.3 var(--font-text);color:var(--muted)}
.stk img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:8px;filter:grayscale(1) blur(3px);opacity:.45}

 {id:'g4-yimian',img:'g4u11-tuzi',g:4,b:'上',l:'十一、兔子先生等等我',p:'……，以免……',rel:'目的',k:['以免'],

 {id:'g4-lianjie',img:'g4d01-xianhua',g:4,b:'下',l:'一、一束鮮花',p:'連接詞語：並且・甚至・因此',rel:'並列・遞進・因果',k:['並且','甚至','因此'],any:true,kl:'用「並且」「甚至」「因此」其中一個連接句子',

 {id:'g4-yinguo',img:'g4d04-mishi',g:4,b:'下',l:'四、米食飄香',p:'因果句（可省略關聯詞）',rel:'因果',k:['由於','因此','因為','所以'],any:true,kl:'寫出原因和結果，可用因為、由於、所以、因此',
  cmp:'為了讓句子簡潔，在不影響意思時，可以省略「由於」「所以」「因此」等詞語，前後仍是因果關係。',
  tip:'因果句前面說原因、後面說結果。可以用「由於……因此……」，有時也能省略部分詞語，讓句子更簡潔有力。',
  ex:'由於粽葉有特殊的香氣，因此包出來的粽子特別好吃。',
  det:[{q:'「由於下了一整夜的雨，因此操場積滿了水。」哪一個是原因？',o:[['下了一整夜的雨',1,'下雨是原因，積水是結果。'],['操場積滿了水',0,'這是結果，不是原因。'],['操場',0,'操場是地點，不是原因。']]},
   {q:'「從前生活不方便，所以人們用米做出各種糕點。」刪掉「所以」後，意思會怎樣？',o:[['仍然是因果關係',1,'省略關聯詞後，前後還是原因和結果。'],['變成轉折關係',0,'前後沒有轉彎的意思。'],['句子完全看不懂',0,'不影響意思，仍然讀得懂。']]},
   {q:'哪一句的原因和結果放對了？',o:[['由於艾草有特別的香氣，因此草仔粿聞起來很香。',1,'艾草的香氣是原因，粿很香是結果。'],['由於草仔粿聞起來很香，因此艾草有特別的香氣。',0,'原因和結果放反了。'],['由於艾草有特別的香氣，可是草仔粿聞起來很香。',0,'「由於」要和「因此」搭配。']]},
   {q:'哪一組是「因果句」省略關聯詞後的樣子？',o:[['因為天氣太冷，所以我多穿了一件外套。→天氣太冷，我多穿了一件外套。',1,'省略後還看得出因為冷才加衣服。'],['雖然天氣很冷，但是他只穿短袖。→天氣很冷，他只穿短袖。',0,'這是轉折句，不是因果句。'],['如果明天下雨，就不去爬山。→明天下雨，不去爬山。',0,'這是假設句，不是因果句。']]}],
  fix:{c:['由於這家店的米粉又香又有嚼勁','，','可是','門口總是大排長龍','。'],w:2,o:['因此','可是','雖然'],a:'因此',why:'米粉好吃是原因，大排長龍是結果，要用「因此」。'},
  fix2:[{c:['因為','碗粿是用米漿蒸成的','，所以','吃起來甜甜的像糖果','。'],w:3,o:['吃起來軟嫩又有米香','吃起來甜甜的像糖果','聞起來像花香'],a:'吃起來軟嫩又有米香',why:'米漿蒸成的結果是軟嫩、有米香，結果要和原因相配。'},
   {c:['由於颱風來襲','，','因此','稻田裡的稻子','長得又高又好','。'],w:4,o:['倒了一大片','長得又高又好','開滿了花'],a:'倒了一大片',why:'颱風帶來的結果是稻子被吹倒，不是長得好。'}],
  fr:['由於',0,'，因此',1,'。'],bk:[['今年雨水充足','粽子裡包了香菇和鹹蛋黃','媽媽在麻糬上沾了花生粉','新米剛收成'],['稻子長得又高又壯','吃起來特別香','吃起來香甜可口','煮出來的飯又香又軟']]},

 {id:'g4-bingju',img:'g4d05-lanran',g:4,b:'下',l:'五、讀書報告―藍色小洋裝',p:'修改病句：重複・缺動詞',rel:'修改句子',k:[],kl:'檢查有沒有重複的動詞，或少了動詞',

 {id:'g4-budan',img:'g4d06-lugang',g:4,b:'下',l:'六、我愛鹿港',p:'不但……也……／不只……還……',rel:'遞進',k:['不但','也'],re:'(不但|不只).*(也|還)',kl:'用「不但……也……」或「不只……還……」',

 {id:'g4-chufei',img:'g4d08-zhihui',g:4,b:'下',l:'八、動物老師的智慧',p:'除非……才……／無論……都……',rel:'條件',k:['除非','才'],re:'(除非.*才|無論.*都)',kl:'用「除非……才……」或「無論……都……」',
  cmp:'「除非……才……」和三年級的「只有……才……」意思相近。',
  tip:'「除非……才……」表示一定要有前面的條件，才會有後面的結果；「無論……都……」表示不管什麼條件，結果都一樣。',
  ex:'無論颳風還是下雨，郵差伯伯都準時把信送到。',
  det:[{q:'＿＿你把功課寫完，＿＿可以去看電視。',o:[['除非……才……',1,'寫完功課是一定要有的條件。'],['無論……都……',0,'這裡有條件限制，不是不管怎樣都可以。'],['雖然……可是……',0,'前後沒有轉彎。']]},
   {q:'＿＿遇到多大的困難，他＿＿不會放棄。',o:[['無論……都……',1,'不管困難多大，結果都一樣不放棄。'],['除非……才……',0,'這裡不是說一定要有的條件。'],['因為……所以……',0,'困難不是不放棄的原因。']]},
   {q:'哪一句的意思是「不管怎樣，結果都一樣」？',o:[['無論晴天或雨天，爺爺都會去公園散步。',1,'天氣怎樣都不影響結果。'],['除非天氣放晴，爺爺才會去公園散步。',0,'這是說一定要放晴的條件。'],['因為天氣放晴，爺爺去公園散步。',0,'這是因果句。']]},
   {q:'哪一句的「除非……才……」用得對？',o:[['除非大家一起節約用電，才能減緩地球暖化。',1,'節約用電是一定要有的條件。'],['除非大家一起浪費用電，才能減緩地球暖化。',0,'浪費用電不會減緩暖化，條件不合理。'],['除非大家一起節約用電，都能減緩地球暖化。',0,'「除非」要和「才」搭配。']]}],
  fix:{c:['無論題目有多難','，','他','才','能想出解決的方法','。'],w:3,o:['都','才','卻'],a:'都',why:'「無論」要和「都」搭配，表示不管多難結果都一樣。'},
  fix2:[{c:['除非你親自去試一試','，','都','會知道自己行不行','。'],w:2,o:['才','都','也'],a:'才',why:'「除非」要和「才」搭配，表示一定要有這個條件。'},
   {c:['無論','颳風還是下雨','，','郵差伯伯','都不送信','。'],w:4,o:['都準時把信送到','都不送信','才送信'],a:'都準時把信送到',why:'「無論……都……」要寫出不受影響的堅持，風雨中仍送信才合理。'}],
  fr:['除非',0,'，',1,'才',2,'。'],bk:[['你每天認真練習','大家一起保護森林','把房間整理乾淨','種子吸收足夠的水分'],['你','動物們','我們','它'],['能在比賽中得獎','能有安全的家','能找到遺失的拼圖','會發芽長大']]},

 {id:'g4-wenju',img:'g4d09-taikong',g:4,b:'下',l:'九、向太空出發',p:'文章中的問句',rel:'句子的語氣：提問',k:['？'],kl:'用問句引發讀者好奇或思考',

  {w:'驚訝', mean:'覺得意外、很吃驚。', ex:['打開房門，看到滿桌的生日禮物，我驚訝得張大嘴巴，說不出話。','小螞蟻竟然能搬動比自己大好多倍的餅乾，弟弟覺得好驚訝。']},
  {w:'奇特', mean:'很特別，和一般的不一樣。', ex:['這朵花的形狀很奇特，張開的花瓣，像一隻正要飛起的小鳥。','海底住著許多長相奇特的魚，有的像石頭，有的會發光。']}
 ],
 'w3d01':[ // 一、許願
  {w:'柔和', mean:'溫和不刺激，讓人覺得舒服。', ex:['夜晚的臥室裡，檯燈的光線很柔和，像月光輕輕灑在床上。','這首歌的旋律很柔和，聽著聽著，我就慢慢閉上了眼睛。']},
  {w:'晨光', mean:'早晨的陽光。', ex:['早上，金黃色的晨光從窗簾縫溜進來，輕輕把我叫醒。','公園裡，爺爺奶奶們迎著晨光做體操，個個精神都很好。']},
  {w:'徐徐', mean:'慢慢的、輕輕的。', ex:['夏天的傍晚，涼風徐徐吹來，稻田像綠色的海浪一樣起伏。','坐在湖邊的大樹下，微風徐徐的吹著，讓人好想睡個午覺。']},
  {w:'粗壯', mean:'又粗又結實。', ex:['這棵老榕樹的樹幹很粗壯，我們三個人手牽手，才抱得住它。','爸爸的手臂粗壯有力，一下子就能把我舉得高高的。']},
  {w:'開創', mean:'開始創造新的事物。', ex:['叔叔離開了家鄉，到大城市打拚，開創屬於自己的事業。','這群年輕人想要開創一家特別的書店，讓大家可以邊喝茶邊看書。']},
  {w:'青翠', mean:'綠得很鮮亮。', ex:['下過一場雨，遠遠的山林一片青翠，好像剛洗過澡一樣。','春天一到，田裡長出青翠的秧苗，在風中輕輕的點頭。']},
  {w:'虔誠', mean:'心裡非常恭敬、真誠。', ex:['奶奶點了三炷香，閉上眼睛，虔誠的在廟裡祈求全家平安。','新年的鐘聲響起時，我雙手合十，虔誠的許下一個願望。']},
  {w:'燦爛', mean:'光彩明亮又耀眼。', ex:['今天陽光燦爛，天空藍得像大海，正適合到公園野餐。','妹妹打開禮物盒，看到心愛的娃娃，露出燦爛的笑容。']},
  {w:'鮮豔', mean:'顏色明亮好看。', ex:['花園裡開滿了鮮豔的花朵，紅的像火，黃的像金子。','小丑穿著一件顏色鮮豔的衣服，在臺上翻著跟斗逗大家笑。']},
  {w:'溫暖', mean:'不冷不熱，讓人覺得暖和舒服。', ex:['寒冷的冬夜，全家圍著熱騰騰的火鍋，屋子裡好溫暖。','媽媽的擁抱好溫暖，像一條厚厚的棉被，讓我不再害怕。']},
  {w:'夢想', mean:'心裡很想實現的願望。', ex:['我的夢想是當一位老師，站在講臺上，教小朋友認識世界。','他每天放學都留下來練球，希望有一天能實現當棒球選手的夢想。']},
  {w:'飛翔', mean:'在天空中飛。', ex:['一群白鷺鷥張開翅膀，在綠油油的田野上，自由自在的飛翔。','我真希望自己能長出一對翅膀，像老鷹一樣在藍天中飛翔。']}
 ],
 'w3d02':[ // 二、下雨的時候
  {w:'欣賞', mean:'用喜歡的心情觀看。', ex:['中秋節的晚上，我們坐在河堤上，一邊吃月餅，一邊欣賞明月。','美術館裡好安靜，大家都慢慢走著，用心的欣賞每一幅畫。']},
  {w:'溼答答', mean:'很溼的樣子。', ex:['放學時忘了帶傘，我被大雨淋得溼答答，像一隻落湯雞。','小狗從水坑裡跳出來，全身溼答答的，還用力甩了我一身水。']},
  {w:'來來往往', mean:'來的去的人或車很多。', ex:['車站裡的旅客來來往往，有的拖著行李，有的在找月臺。','十字路口的車子來來往往，過馬路時一定要牽好大人的手。']},
  {w:'各式各樣', mean:'各種不同的樣子。', ex:['文具店的架子上，擺著各式各樣的鉛筆，有的還有香味呢。','麵包店裡擺著各式各樣的麵包，有圓的、長的，還有像小熊的。']},
  {w:'五顏六色', mean:'有很多種顏色。', ex:['遊行隊伍經過時，天空中飄著五顏六色的氣球，好像一場彩色的雨。','雨過天晴，天邊掛起一道彩虹，五顏六色的真好看。']},
  {w:'屋簷', mean:'屋頂伸出牆外的部分。', ex:['突然下起了大雨，我們躲在屋簷下，聽雨滴答滴答的落下。','春天來了，一對燕子飛回來，在屋簷下築了一個小小的巢。']},
  {w:'垂掛', mean:'從高處往下掛著。', ex:['夏天到了，龍眼樹上垂掛著一串串果實，像一串串小鈴鐺。','聖誕樹上垂掛著亮晶晶的彩球，在燈光下閃個不停。']},
  {w:'清涼', mean:'涼快舒爽。', ex:['走進濃密的樹林裡，一陣清涼的風迎面吹來，汗水一下子就乾了。','大熱天裡喝一杯冰涼的檸檬水，從喉嚨一路清涼到肚子裡。']},
  {w:'舒服', mean:'身體或心裡覺得很好、很輕鬆。', ex:['洗完熱水澡，躺在軟綿綿的床上，全身好舒服，一下子就睡著了。','媽媽幫我按摩痠痛的肩膀，我舒服得瞇起了眼睛。']},
  {w:'想念', mean:'心裡掛念，很想見到。', ex:['外婆住在很遠的鄉下，每當看到月亮，我就會想念她。','搬家以後，我常常想念以前的老朋友，想念我們一起玩的日子。']},
  {w:'探險', mean:'到不熟悉或有危險的地方去探查。', ex:['暑假的晚上，我們拿著手電筒，小心翼翼的到後山探險。','故事裡的小男孩駕著小船，到一座沒有人住的小島探險。']},
  {w:'連忙', mean:'趕快、急忙。', ex:['公車上，看到白髮的老奶奶上車，哥哥連忙站起來讓座。','電話鈴鈴鈴的響了，正在洗碗的媽媽連忙擦乾手跑去接。']}
 ],
 'w3d03':[ // 三、遇見美如奶奶
  {w:'臉蛋', mean:'臉，多用在小孩或女孩。', ex:['寶寶的臉蛋紅通通的，像一顆熟透的蘋果，讓人好想捏一捏。','冬天的寒風好冷，妹妹的臉蛋凍得紅紅的，像兩顆小番茄。']},
  {w:'圍裙', mean:'做事時圍在身前，防止弄髒衣服的布。', ex:['媽媽繫上花花的圍裙，拿起鍋鏟，開始煮香噴噴的晚餐。','上烹飪課以前，大家都要先繫好圍裙，免得把衣服弄髒。']},
  {w:'笑容', mean:'臉上笑的樣子。', ex:['老師的臉上總是帶著笑容，像春天的陽光，讓人覺得好溫暖。','看到我考了一百分，爸爸露出開心的笑容，摸了摸我的頭。']},
  {w:'活力', mean:'很有精神、動起來很有力氣。', ex:['早上做完體操，同學們個個臉頰紅紅的，充滿了活力。','小狗在草地上跑來跑去，一刻也停不下來，看起來好有活力。']},
  {w:'仔細', mean:'很細心、很用心，不馬虎。', ex:['寫完考卷以後，我拿起鉛筆，一題一題仔細的再檢查一遍。','醫生把聽診器貼在我胸前，仔細的聽著我的心跳聲。']},
  {w:'收拾', mean:'整理，把東西放好。', ex:['玩完積木以後，我把它們一塊一塊收拾好，放回玩具箱裡。','放學前，同學們把抽屜收拾得整整齊齊，才背起書包回家。']},
  {w:'忍不住', mean:'控制不了自己。', ex:['看到小狗追著自己的尾巴轉圈圈，我忍不住哈哈大笑起來。','桌上的蛋糕看起來太好吃了，弟弟忍不住偷偷挖了一口。']},
  {w:'討論', mean:'大家一起說出想法、交換意見。', ex:['我們圍坐成一圈，分組討論要怎麼布置教室，每個人都有好點子。','大家討論了好久，最後決定這次的郊遊要去動物園。']},
  {w:'吵鬧', mean:'聲音很大、很亂。', ex:['下課時走廊上好吵鬧，嘰嘰喳喳的，像一群麻雀在開會。','弟弟和妹妹為了搶遙控器又在吵鬧，媽媽只好出來勸架。']},
  {w:'暗號', mean:'只有自己人知道的祕密信號。', ex:['我和好朋友約好了，只要拍兩下手，就是要集合的暗號。','哥哥對我眨了眨眼睛，那是我們要偷偷溜出去玩的暗號。']},
  {w:'特製', mean:'特別做出來的。', ex:['妹妹生日那天，麵包店送來一個特製的蛋糕，上面有她最愛的小熊。','爺爺的腿不方便，爸爸請木工師傅為他做了一張特製的椅子。']},
  {w:'標語', mean:'寫在牌子上、提醒大家的簡短句子。', ex:['學校的走廊上，貼著「節約用水」的標語，提醒大家隨手關水龍頭。','公園門口立著一塊牌子，上面的標語寫著「請勿亂丟垃圾」。']}
 ],
 'w3d04':[ // 四、工匠之祖
  {w:'著名', mean:'名字很多人都知道。', ex:['臺南有很多著名的小吃，擔仔麵、碗粿，每一樣都讓人流口水。','這位著名的畫家來我們學校演講，還當場畫了一隻小貓。']},
  {w:'傳說', mean:'很久以來大家傳來傳去的故事。', ex:['中秋節的晚上，奶奶告訴我，傳說月亮上住著嫦娥和玉兔。','爺爺坐在大樹下，說了一個關於這座山的傳說，大家都聽得入迷。']},
  {w:'著急', mean:'心裡很急，很不安。', ex:['弟弟在百貨公司裡找不到媽媽，著急得哭了起來，眼淚一直掉。','鬧鐘沒響，眼看就要遲到了，我著急得連早餐都忘了吃。']},
  {w:'苦惱', mean:'心裡很煩，不知道怎麼辦。', ex:['作文題目好難，我咬著鉛筆想了好久，苦惱得寫不出一個字。','房間太小，放不下新買的書桌，媽媽覺得好苦惱。']},
  {w:'親自', mean:'自己去做，不叫別人代替。', ex:['頒獎典禮上，校長親自走下臺，把獎狀交給得獎的同學。','這張卡片是我親自畫的，每一朵花都塗上了不同的顏色。']},
  {w:'鋒利', mean:'刀口很尖、很利。', ex:['老鷹從天空俯衝下來，用鋒利的爪子，一下子就抓住了獵物。','這把剪刀非常鋒利，連厚紙板都剪得開，使用時要小心。']},
  {w:'速度', mean:'快慢的程度。', ex:['獵豹奔跑的速度好快，像一支射出去的箭，一眨眼就不見了。','下雨天的路面又溼又滑，爸爸開車時特別放慢了速度。']},
  {w:'固定', mean:'讓東西不會移動。', ex:['颱風來之前，爸爸用繩子，把陽臺上的花盆一個一個固定好。','我用膠帶把海報的四個角固定在牆上，風一吹也不會掉。']},
  {w:'觀察', mean:'仔細的看，發現事物的變化。', ex:['自然課時，我們拿著放大鏡，蹲在草地上觀察小螞蟻搬家。','我每天早上都會觀察綠豆發芽的樣子，再把它畫在本子上。']},
  {w:'實用', mean:'用起來很方便、有用處。', ex:['這個筆筒又好看又實用，可以放筆，還可以放橡皮擦。','媽媽送我一個實用的便當袋，可以裝便當，也能放餐具。']},
  {w:'發明', mean:'想出或做出從來沒有的新東西。', ex:['愛迪生發明了電燈，從此以後，黑漆漆的夜晚也變得亮晶晶。','哥哥發明了一個會自動澆花的小工具，讓陽臺的花不再口渴。']},
  {w:'不起眼', mean:'不引人注意、看起來很普通。', ex:['巷子裡的這間小麵店看起來不起眼，煮出來的麵卻香得不得了。','一顆不起眼的小種子，經過好多年，竟然長成了一棵大樹。']}
 ],
 'w3d05':[ // 五、學田鼠開路
  {w:'交通', mean:'車輛和行人來往的情形。', ex:['下班時間到了，路上的車子一輛接一輛，交通變得好混亂。','我家附近有捷運站，也有公車站，交通非常方便，去哪裡都很快。']},
  {w:'頭痛', mean:'比喻事情很麻煩，讓人煩惱。', ex:['弟弟不愛吃青菜，每次都把菜挑到一邊，讓媽媽好頭痛。','城市裡的停車位太少，是許多開車的人最頭痛的問題。']},
  {w:'解決', mean:'把問題處理好。', ex:['兩個同學為了掃地吵架，老師耐心的聽完，幫他們解決了問題。','這道數學題好難，我們一起動動腦，想辦法把它解決吧！']},
  {w:'糾紛', mean:'爭吵、不和的事。', ex:['兩戶鄰居為了停車位吵了起來，發生了一場不愉快的糾紛。','為了避免糾紛，玩遊戲以前，大家要先說好規則。']},
  {w:'改善', mean:'變得比原來更好。', ex:['爺爺每天早上去公園散步，身體的健康改善了很多，臉色也紅潤了。','教室裝了電風扇以後，悶熱的情形改善了不少，大家上課更有精神。']},
  {w:'擁擠', mean:'人或東西很多，擠在一起。', ex:['過年回家的人好多，車站裡擁擠得像沙丁魚罐頭，連轉身都很難。','上班時間的捷運車廂好擁擠，大家擠得動也動不了。']},
  {w:'設計', mean:'事先想好做法和樣子，畫出計畫。', ex:['姐姐拿起彩色筆，在紙上畫畫改改，設計出一件漂亮的裙子。','這座公園的溜滑梯設計得好特別，像一條彎彎的大蛇。']},
  {w:'同意', mean:'意見相同，答應別人。', ex:['我答應每天都會幫忙遛狗，媽媽終於同意，讓我養一隻小狗。','班長問大家這次班遊去哪裡，大家都同意去海邊玩水。']},
  {w:'費用', mean:'要花的錢。', ex:['這次畢業旅行的費用，要在下星期以前，交給班上的老師。','參加夏令營要付一筆費用，爸爸說這筆錢花得很值得。']},
  {w:'建議', mean:'提出自己的想法給別人參考。', ex:['為了讓教室更乾淨，我建議大家，把垃圾分類後再丟進垃圾桶。','醫生給了爺爺一些關於飲食的建議，要他少吃鹹，多吃青菜。']},
  {w:'紛紛', mean:'一個接一個，很多。', ex:['秋風一吹，樹上的黃葉紛紛落下，像一隻隻飛舞的蝴蝶。','下課鐘一響，同學們紛紛跑出教室，衝向操場玩耍。']},
  {w:'特色', mean:'和別的不一樣、特別的地方。', ex:['這家餐廳的特色，是用自己種的新鮮蔬菜，做出好吃的料理。','每個地方都有自己的特色小吃，像臺南的擔仔麵就很有名。']}
 ],
 'w3d06':[ // 六、神奇密碼
  {w:'校慶', mean:'每年紀念學校成立的慶祝活動。', ex:['今年的校慶好熱鬧，操場上有園遊會，還有精采的表演。','為了準備校慶的表演，我們每天放學後都留下來練習跳舞。']},
  {w:'安排', mean:'事先把事情規劃好。', ex:['老師把班上的工作安排好，有人擦黑板，有人倒垃圾。','爸爸早就安排好暑假的旅行計畫，連住的地方都訂好了。']},
  {w:'掃描', mean:'用機器照一照，讀出上面的訊息。', ex:['超市的店員拿起機器，嗶的一聲，掃描了商品上的條碼。','用手機掃描課本上的小方塊，就能看到會動的影片。']},
  {w:'圖案', mean:'畫出來的花紋或圖形。', ex:['我的鉛筆盒上有可愛的小熊圖案，每次打開，心情都會變好。','姐姐用巧克力醬，在餅乾上畫了一個愛心的圖案，送給媽媽。']},
  {w:'資料', mean:'用來參考、查詢的內容。', ex:['為了寫昆蟲報告，我到圖書館翻了好多本書，找到很多資料。','老師要我們上網查一查有關海豚的資料，下星期上臺分享。']},
  {w:'精采', mean:'好看，非常出色。', ex:['昨天的魔術表演好精采，魔術師從空箱子裡，變出了一隻白鴿。','這場籃球賽雙方的比數一直很接近，真是精采極了！']},
  {w:'新奇', mean:'新鮮又特別。', ex:['第一次搭飛機，我看著窗外的白雲，覺得一切都好新奇。','弟弟第一次看到會說話的機器人，覺得好新奇，一直圍著它轉。']},
  {w:'一清二楚', mean:'非常清楚。', ex:['站在高高的山頂往下看，整個小鎮的房子和小路，都看得一清二楚。','老師把遊戲規則說得一清二楚，大家一聽就懂了。']},
  {w:'節省', mean:'少用，不浪費。', ex:['離開教室時隨手關燈，可以節省用電，也能保護地球。','走這條小路到學校比較近，可以節省好幾分鐘的時間。']},
  {w:'大開眼界', mean:'看到從來沒看過的東西，增加見識。', ex:['參觀太空展時，我看到真正的太空衣，還摸到了隕石，真是大開眼界。','這次在動物園看到好多稀有的動物，真讓我大開眼界。']},
  {w:'科技', mean:'科學和技術。', ex:['科技越來越進步，以前要寫信，現在拿起手機就能和遠方的人說話。','現在的科技好厲害，機器人可以幫忙掃地，還會陪老人聊天。']},
  {w:'便利', mean:'方便、容易。', ex:['家附近開了一家超商，買東西、繳費都好便利，走兩步路就到了。','有了捷運以後，阿姨上班變得更便利，再也不怕塞車了。']}
 ],
 'w3d07':[ // 七、油桐花‧五月雪
  {w:'初夏', mean:'夏天剛開始的時候。', ex:['初夏的早晨，樹上的蟬開始唱歌，知了知了，叫醒了整個夏天。','到了初夏，池塘裡的荷花慢慢張開了粉紅色的花瓣。']},
  {w:'時節', mean:'一年中的某段時候、季節。', ex:['清明時節，天空常常飄著毛毛雨，山上一片霧濛濛的。','秋天是柚子成熟的時節，果園裡飄著酸酸甜甜的香味。']},
  {w:'覆蓋', mean:'蓋在上面，把東西遮住。', ex:['冬天的合歡山上覆蓋著白雪，遠遠看去，像戴了一頂白帽子。','一夜秋風過後，厚厚的落葉覆蓋了整條小路，踩上去沙沙作響。']},
  {w:'抬頭', mean:'把頭往上抬起來。', ex:['聽到嘎嘎的叫聲，我抬頭一看，一群大雁正排成人字飛過天空。','晚上躺在草地上，我抬頭望著滿天的星星，一顆一顆數著。']},
  {w:'舞動', mean:'搖動、擺動，像在跳舞。', ex:['運動會上，啦啦隊員舞動著手中的彩球，像一朵朵盛開的花。','一陣風吹過稻田，金黃色的稻子就跟著風輕輕的舞動起來。']},
  {w:'樹梢', mean:'樹枝的最上頭。', ex:['清晨，一隻小鳥停在樹梢上，歪著頭，唱著清脆的歌。','圓圓的月亮慢慢爬上了樹梢，把整個院子照得亮亮的。']},
  {w:'禮服', mean:'參加重要場合時穿的正式衣服。', ex:['婚禮上，新娘穿著雪白的禮服，裙襬長長的，像一朵盛開的百合。','參加音樂會那天，姐姐穿上一件長長的禮服，看起來好像公主。']},
  {w:'飄落', mean:'輕輕的從空中落下來。', ex:['秋天到了，樹葉一片片飄落，像一封封寫給大地的信。','雪花從灰白的天空慢慢飄落，不一會兒，地上就鋪滿了白色。']},
  {w:'伸展', mean:'向外張開、展開。', ex:['早上起床後，我站在窗前，伸展一下手腳，深深吸一口新鮮空氣。','大榕樹把枝葉向四面八方伸展開來，像一把撐開的綠色大傘。']},
  {w:'散發', mean:'向四周發出。', ex:['剛出爐的麵包，散發出陣陣香味，整條街都聞得到。','院子裡的桂花開了，小小的花朵散發出甜甜的香味。']},
  {w:'清香', mean:'淡淡的、清新的香味。', ex:['白色的茉莉花開了，一股淡淡的清香，隨著微風飄進屋裡。','剛晒乾的衣服帶著陽光和肥皂的清香，聞起來好舒服。']},
  {w:'心動', mean:'心裡受到吸引，很喜歡。', ex:['櫥窗裡擺著一隻會走路的機器狗，弟弟看了好心動，捨不得離開。','聽到暑假要去海邊玩水、撿貝殼，大家都好心動。']}
 ],
 'w3d08':[ // 八、大自然的美術館
  {w:'觀光', mean:'到外地參觀、遊覽風景。', ex:['這座小島的海水好藍，一年四季都有很多遊客，來這裡觀光。','很多外國人來臺灣觀光，最喜歡到熱鬧的夜市吃小吃。']},
  {w:'特地', mean:'專為某件事而去做。', ex:['知道我生日，舅舅特地從臺北搭車回來，還帶了一個大蛋糕。','聽說我感冒了，好朋友特地打電話來關心我，叫我多喝水。']},
  {w:'高貴', mean:'看起來很有氣質、不平凡。', ex:['那隻白天鵝在湖上慢慢游著，脖子彎彎的，姿態好高貴。','公主穿著閃亮的長裙，頭上戴著皇冠，看起來十分高貴。']},
  {w:'等待', mean:'等著人或事情到來。', ex:['放學時下著雨，我站在校門口，等待爸爸開車來接我。','花苞在寒冷的冬天裡靜靜的等待，等到春天來了才開花。']},
  {w:'排列', mean:'按照順序放好。', ex:['書架上的書，按照高高矮矮的順序排列，看起來好整齊。','升旗時，同學們依照身高排列成一直線，像一列小火車。']},
  {w:'散落', mean:'分散的掉在各處。', ex:['窗外一陣風吹進來，桌上的紙張被吹得散落一地。','奶奶的項鍊突然斷了，一顆顆小珠子散落在地上，滾來滾去。']},
  {w:'圓潤', mean:'又圓又光滑。', ex:['果園裡的蘋果長得又紅又圓潤，像一張張害羞的笑臉。','河邊的小石頭，被溪水沖了好多年，變得光滑又圓潤。']},
  {w:'珍珠', mean:'貝殼裡長出來的圓形寶石，白白亮亮的。', ex:['奶奶戴著一串白色的珍珠項鍊，在燈光下閃著柔和的光。','清晨的荷葉上滾著一顆顆露珠，好像一粒粒閃亮的珍珠。']},
  {w:'造型', mean:'做出來的樣子。', ex:['姐姐的生日蛋糕好特別，造型像一座粉紅色的城堡，還有小旗子。','這間咖啡店的杯子造型好可愛，像一隻胖胖的小貓。']},
  {w:'趣味', mean:'讓人覺得有趣、好玩的感覺。', ex:['老師把數學變成闖關遊戲，大家一邊玩一邊算，上課充滿了趣味。','這本繪本充滿了趣味，每一頁都藏著一隻小老鼠等你找。']},
  {w:'雕塑', mean:'用石頭、木頭等刻出或捏出的作品。', ex:['公園的草地上，站著一座小鹿的雕塑，好像正要跳起來。','藝術家用黏土捏呀捏，做出一件小女孩抱著小狗的雕塑。']},
  {w:'鬼斧神工', mean:'形容技術巧妙，不像人能做出來的。', ex:['太魯閣峽谷的大石壁又高又直，真是鬼斧神工，讓人看呆了。','海邊的奇石有的像蘑菇，有的像女王的頭，真是鬼斧神工。']}
 ],
 'w3d09':[ // 九、臺灣的山椒魚
  {w:'氣候', mean:'一個地方長時間的天氣情形。', ex:['臺灣的氣候溫暖又潮溼，一年四季，都能看到綠油油的樹。','沙漠的氣候很乾燥，白天熱得像火爐，晚上卻冷得發抖。']},
  {w:'呼吸', mean:'把空氣吸進去再吐出來。', ex:['跑完八百公尺以後，我滿臉通紅，彎著腰大口大口的呼吸。','魚兒用鰓在水中呼吸，所以能一直待在水裡不會悶壞。']},
  {w:'陸地', mean:'地球上不是水的地方。', ex:['青蛙真厲害，可以在水裡游，也可以在陸地上蹦蹦跳跳。','船在大海上航行了好幾天，大家終於看到遠方的陸地了。']},
  {w:'皮膚', mean:'包在身體外面的一層。', ex:['夏天的太陽好毒辣，出門前要擦防晒乳，才能保護皮膚。','寶寶的皮膚又白又嫩，摸起來就像剛蒸好的饅頭一樣軟。']},
  {w:'保持', mean:'讓情形一直維持不變。', ex:['打掃完以後，我們要一起保持教室的整潔，讓它天天乾乾淨淨。','圖書館裡有很多人在看書，請大家保持安靜，不要大聲說話。']},
  {w:'溼潤', mean:'有點溼、不乾燥。', ex:['下過一場春雨，泥土變得好溼潤，小草都喝飽了水。','嘴脣乾得裂開了，擦上一點護脣膏，很快就變得溼潤了。']},
  {w:'敵人', mean:'會傷害自己、和自己作對的人或動物。', ex:['刺蝟遇到敵人時，會把身體縮成一顆刺刺的球，讓對方不敢碰。','老鷹是小雞的敵人，牠一飛過來，母雞就張開翅膀保護小雞。']},
  {w:'接近', mean:'靠得很近，離得不遠。', ex:['小狗正在吃飯的時候，千萬不要接近牠，免得被牠咬一口。','天色漸漸接近黃昏，西邊的雲紅得像火，我們該回家了。']},
  {w:'縫隙', mean:'東西中間裂開的小空間。', ex:['早上的陽光從窗簾的縫隙鑽進來，在地板上畫出一條金線。','一隻小螞蟻鑽進牆壁的縫隙裡，一下子就不見了。']},
  {w:'照顧', mean:'關心並幫忙。', ex:['小貓生病了，姐姐每天餵牠吃藥，細心的照顧牠，直到牠好起來。','爸爸媽媽出門買菜時，我要在家照顧弟弟，陪他玩積木。']},
  {w:'砍伐', mean:'用刀斧把樹木砍倒。', ex:['森林裡的大樹不能隨便砍伐，不然動物們就會沒有家了。','山上的樹被大量砍伐以後，一下大雨就容易發生土石流。']},
  {w:'危機', mean:'危險的情形。', ex:['地球越來越熱，北極的冰慢慢融化，北極熊面臨了生存的危機。','船遇上了大風浪，船長冷靜的指揮大家，終於度過了這次危機。']}
 ],
 'w3d10':[ // 十、漁夫和金魚
  {w:'恩情', mean:'別人給的幫助和好處。', ex:['老師像一盞明亮的燈，照亮我前進的路，這份恩情我永遠記得。','爸媽辛辛苦苦把我們養大，這份恩情比山還高，比海還深。']},
  {w:'回報', mean:'用行動報答別人的幫忙。', ex:['你在我跌倒時扶我起來，我一定會記在心裡，好好回報你。','被救起的小狗每天守在門口，用忠心來回報主人。']},
  {w:'一五一十', mean:'從頭到尾，一點也不漏的說出來。', ex:['打破杯子以後，弟弟低著頭，把事情一五一十的告訴媽媽。','晚餐時，我把今天在學校發生的趣事，一五一十的說給奶奶聽。']},
  {w:'報告', mean:'把事情的經過或結果告訴別人。', ex:['每天早上，班長都會站起來，向老師報告今天的出席人數。','我拿著自己畫的圖表，站在臺上報告豆子發芽的觀察結果。']},
  {w:'滿意', mean:'心裡覺得很好，沒有不足。', ex:['媽媽走進我的房間，看到書桌和床都整理好了，滿意的點點頭。','這次考試我用心準備，得到的成績讓我自己也很滿意。']},
  {w:'波濤', mean:'很大的波浪。', ex:['颱風來了，海上波濤洶湧，巨大的浪花一波一波撲向岸邊。','小漁船在洶湧的波濤中搖來搖去，像一片快被吞掉的葉子。']},
  {w:'平靜', mean:'安靜，沒有變化或起伏。', ex:['風停了，湖面變得好平靜，像一面大鏡子，映著藍天白雲。','我閉上眼睛，深深吸了幾口氣，緊張的心情慢慢平靜下來。']},
  {w:'無聊', mean:'沒事做，覺得沒有意思。', ex:['下雨天不能出門，弟弟趴在窗邊數雨滴，覺得好無聊。','爸媽都去上班了，一個人在家沒有事做，真是無聊極了。']},
  {w:'貪心', mean:'想要得到更多，不知道滿足。', ex:['那隻貪心的小狗，嘴裡咬著一塊肉，還想去搶別人的骨頭。','糖果一人只能拿一顆，不要貪心多拿，要留給其他同學喔！']},
  {w:'轟隆', mean:'打雷或東西倒下時很大的聲音。', ex:['天空突然暗了下來，接著傳來轟隆的雷聲，嚇得小狗躲到床下。','轟隆一聲，山上的大石頭滾了下來，擋住了整條路。']},
  {w:'嚇一跳', mean:'突然被嚇到。', ex:['我正專心看書，弟弟突然從門後跳出來，害我嚇一跳。','窗外突然傳來一聲巨響，大家都嚇一跳，原來是氣球破了。']}
 ],
 'w3d11':[ // 十一、聰明的鼠鹿
  {w:'有氣無力', mean:'沒有精神、沒有力氣的樣子。', ex:['感冒的弟弟躺在床上，聲音小小的，有氣無力的喊著媽媽。','大熱天裡，小狗趴在樹蔭下，吐著舌頭，有氣無力的喘著氣。']},
  {w:'威風', mean:'很有氣勢，讓人敬畏。', ex:['獅子站在大石頭上，抬起頭大吼一聲，看起來好威風。','穿上警察制服的叔叔，挺著胸膛站在路口，看起來好威風。']},
  {w:'填飽', mean:'吃東西讓肚子飽。', ex:['早上起床晚了，我在路上買了一個麵包，先填飽肚子再說。','打完一場籃球，大家餓得咕嚕咕嚕叫，趕快去吃東西填飽肚子。']},
  {w:'隨便', mean:'不認真，想怎樣就怎樣。', ex:['寫字不可以隨便，要一筆一畫，像蓋房子一樣慢慢寫好。','別人的東西不能隨便拿，要先問一聲，得到同意才可以。']},
  {w:'道理', mean:'事情的原因和規則。', ex:['媽媽常說，種瓜得瓜，種豆得豆，這句話真有道理。','這本書用一個個有趣的小故事，告訴我們做人要誠實的道理。']},
  {w:'說服', mean:'用話讓別人相信、同意。', ex:['我說了好多游泳的好處，終於說服爸爸，週末帶我去游泳池。','弟弟很想養一隻小貓，可是說了好久，還是說服不了媽媽。']},
  {w:'沉重', mean:'很重，也可以形容心情很不輕鬆。', ex:['放學時，哥哥背著沉重的書包，一步一步慢慢的爬上樓梯。','聽到小狗生病住院的消息，全家人的心情都好沉重。']},
  {w:'慢吞吞', mean:'動作很慢的樣子。', ex:['小烏龜背著重重的殼，慢吞吞的往前爬，一點也不著急。','校車快來了，弟弟還在慢吞吞的穿鞋子，急得媽媽一直催。']},
  {w:'胃口', mean:'想吃東西的感覺。', ex:['生病的那幾天，我一點胃口也沒有，看到最愛的雞腿也不想吃。','天氣熱得像蒸籠，大家都沒什麼胃口，只想喝冰涼的綠豆湯。']},
  {w:'美味可口', mean:'味道很好，非常好吃。', ex:['奶奶做的紅燒肉美味可口，一端上桌，大家的筷子就搶著夾。','這盤水果沙拉色彩繽紛，吃起來美味可口，一下子就被吃光了。']},
  {w:'興奮', mean:'非常高興、激動。', ex:['明天就要去遊樂園了，我興奮得在床上翻來翻去，怎麼也睡不著。','廣播說明天放颱風假，同學們都興奮得跳了起來。']},
  {w:'慌忙', mean:'急急忙忙，很慌張。', ex:['轟隆一聲雷響，小貓嚇得豎起尾巴，慌忙躲到床底下。','哥哥睡過頭了，他慌忙的抓起書包，連鞋帶都沒綁就衝出門。']}
 ],
 'w3d12':[ // 十二、還要跌幾次

  {w:'可貴', mean:'很難得，值得重視。', ex:['雖然只是一張小卡片，卻是同學親手畫的，這份心意非常可貴。','在別人困難的時候伸出援手，這份善良的心最可貴，比黃金還要閃亮。']},
  {w:'寧靜', mean:'安安靜靜，很平和的樣子。', ex:['清晨的湖邊，白色的霧氣輕輕飄著，四周寧靜得只聽見鳥叫聲。','夜深了，月光灑在小村莊上，到處都是一片寧靜，連小狗都睡著了。']},
  {w:'愉悅', mean:'心情快樂、舒服。', ex:['春天的早晨，微風輕輕吹過臉頰，小鳥在枝頭唱歌，我的心情十分愉悅。','聽著輕快的音樂，大家一邊打掃一邊哼歌，每個人的心情都愉悅極了。']},
  {w:'驚訝', mean:'遇到沒想到的事，感到吃驚。', ex:['打開禮物盒的那一刻，我驚訝的張大嘴巴，裡面竟然是一隻小倉鼠。','看到弟弟一口氣吃完三大碗飯，全家人都驚訝得張大了嘴巴，說不出話來。']},
  {w:'綻放', mean:'花朵打開、開放。', ex:['春天來了，公園裡的杜鵑花一朵朵綻放，像一張張粉紅色的笑臉。','一場春雨過後，院子裡的玫瑰花悄悄綻放，散發出淡淡的香氣。']},
  {w:'舒適', mean:'舒服、自在，讓人很放鬆。', ex:['下過雨的午後，涼涼的風從窗外吹進來，讓人覺得好舒適。','這張沙發又軟又寬，躺在上面舒適極了，就像躺在一大朵棉花糖上一樣。']},
  {w:'渴望', mean:'心裡非常想要得到。', ex:['被關在籠子裡的小鳥，望著窗外的藍天，心裡渴望能自由的飛翔。','他從小就渴望能養一隻自己的小狗，每天都在日記本上畫小狗的樣子。']},
  {w:'五彩繽紛', mean:'顏色很多，鮮豔又好看。', ex:['國慶日的晚上，煙火一朵朵在夜空中開花，五彩繽紛，美極了。','花園裡開滿了紅的、黃的、紫的花，五彩繽紛，好像有人打翻了顏料盒。']},
  {w:'視而不見', mean:'看到了卻當作沒看到，不去理會。', ex:['看到地上有垃圾，我們不能視而不見，應該順手撿起來，丟進垃圾桶。','弟弟玩電動玩得太入迷，對媽媽放在桌上的作業簿完全視而不見。']},
  {w:'盡情', mean:'照自己的心意，盡量去做，玩得很痛快。', ex:['到了海邊，我們脫下鞋子，在沙灘上盡情的奔跑，笑聲隨著海風飄得好遠。','暑假的第一天，我們在游泳池裡盡情的玩水，一直玩到天黑才肯回家。']},
  {w:'注意', mean:'把心思放在某件事情上，仔細留心。', ex:['過馬路的時候，要注意左右的來車，等綠燈亮了，再慢慢走過去。','下雨天走廊的地板溼溼滑滑的，老師提醒我們走路要注意，不要滑倒了。']}
 ],
 'w4u06':[
  {w:'攀登', mean:'抓著東西往高處爬上去。', ex:['我們一步一步往上爬，終於攀登上山頂，看見雪白的雲海在腳下翻滾。','登山隊員背著重重的背包，花了整整五天的時間，終於攀登上玉山的山頂。']},
  {w:'開朗', mean:'個性開心、樂觀，不容易難過。', ex:['表姐的個性很開朗，臉上總是掛著笑容，像一顆暖暖的小太陽。','她天生個性開朗，就算遇到不開心的事，也能很快的笑出聲來。']},
  {w:'千變萬化', mean:'變化非常多，一直不一樣。', ex:['天上的雲千變萬化，一會兒像小狗，一會兒又變成了一頭大象。','萬花筒裡的圖案千變萬化，只要輕輕一轉，就出現一朵全新的花。']},
  {w:'不知不覺', mean:'自己沒有發覺的時候。', ex:['和好朋友在公園裡玩得太開心了，不知不覺，天色已經暗了下來。','這本故事書太精彩了，我讀著讀著，不知不覺就讀到了最後一頁。']},
  {w:'磨練', mean:'在困難的環境中練習，讓自己更堅強。', ex:['經過一次又一次的磨練，他的球技越來越好，成了球隊裡的主力。','爸爸說，吃苦是一種磨練，就像鐵要經過火燒，才能變得更堅硬。']},
  {w:'壯麗', mean:'景色雄偉又美麗。', ex:['站在太魯閣的峽谷裡，抬頭望著高高的山壁，景色十分壯麗。','清晨的阿里山上，金色的陽光照在翻騰的雲海上，景色壯麗極了。']},
  {w:'目標', mean:'想要達到的地方或結果。', ex:['新學期開始了，我給自己訂下一個目標，每個星期都要讀完一本書。','他把考上體育班當作自己的目標，每天天一亮就到操場上跑步。']},
  {w:'訓練', mean:'有計畫的反覆練習，讓能力變好。', ex:['為了參加游泳比賽，哥哥每天放學後都到泳池訓練，從來不偷懶。','經過警察叔叔細心的訓練，這隻小狗學會了用鼻子幫忙找尋失物。']},
  {w:'忍受', mean:'把痛苦或不舒服的感覺勉強撐住。', ex:['夏天的教室熱得像蒸籠，大家都快忍受不了，盼望電扇趕快修好。','樓上的鄰居半夜還在敲敲打打，吵得我們全家人都快無法忍受了。']},
  {w:'不知所措', mean:'不知道該怎麼辦才好。', ex:['第一次上臺演講時，我的腦袋一片空白，站在臺上不知所措。','在百貨公司和媽媽走散了，小男孩站在人群中，急得不知所措。']},
  {w:'鼓舞', mean:'讓人更有勇氣和信心。', ex:['比賽時聽到全班同學的加油聲，我受到很大的鼓舞，跑得更快了。','老師溫暖的一句話鼓舞了我，讓我重新提起勇氣，再試一次。']},
  {w:'始終', mean:'從開始到最後，一直都這樣。', ex:['不管風吹雨打，那棵老榕樹始終站在校門口，靜靜的守護著我們。','雖然試了好幾次都沒有成功，他始終不肯放棄，最後終於做到了。']}
 ],
 'w4u07':[
  {w:'分享', mean:'把自己的東西或經驗和別人一起享受。', ex:['下課的時候，我把媽媽烤的餅乾拿出來，和同學一起分享，大家都吃得好開心。','他把旅行時拍的照片帶到班上和大家分享，教室裡響起一陣陣驚呼聲。']},
  {w:'見聞', mean:'看到和聽到的事情。', ex:['爸爸出差回來，在餐桌上說著國外的見聞，我聽得入迷了。','旅行回來以後，我把一路上的見聞寫成日記，裡面有高山，也有大海。']},
  {w:'享用', mean:'使用或吃喝美好的東西，並且覺得很享受。', ex:['晚餐時間到了，一家人圍坐在餐桌前，開心的享用媽媽煮的大餐。','中秋節的晚上，我們在院子裡一邊賞月，一邊享用香甜的月餅。']},
  {w:'口感', mean:'食物吃在嘴裡的感覺。', ex:['這碗剉冰上鋪滿了芒果，冰冰涼涼，口感綿密，吃一口就愛上了。','剛煮好的湯圓軟軟黏黏的，咬下去口感好極了，芝麻餡還慢慢的流了出來。']},
  {w:'竟然', mean:'表示事情出乎意料，沒想到。', ex:['我以為小烏龜爬得很慢，沒想到牠竟然爬上了大石頭，還曬起了太陽。','我找了一整個早上的鑰匙，最後竟然發現它就躺在自己的口袋裡。']},
  {w:'大開眼界', mean:'看到新奇的事物，增加了見識。', ex:['參觀海洋館時，看到五顏六色的魚兒游來游去，真是讓我大開眼界。','魔術師從空空的帽子裡變出一隻又一隻鴿子，讓全場的觀眾都大開眼界。']},
  {w:'濃郁', mean:'香味或味道很濃很重。', ex:['外婆燉的雞湯香味濃郁，還沒走進廚房，就聞到一陣陣的香氣。','這杯熱可可的巧克力香味好濃郁，喝一口，整個人都暖和起來了。']},
  {w:'念念不忘', mean:'一直記在心裡，忘不了。', ex:['去年在花蓮吃到的麻糬，又軟又香，讓我到現在都還念念不忘。','外公對小時候家鄉那條清清的小河念念不忘，常常說給我們聽。']},
  {w:'道地', mean:'真正從當地出來的，正宗的。', ex:['到了臺南，我們走進老街上的小吃店，品嘗一碗道地的擔仔麵。','這家拉麵店的老闆是從日本來的，煮出來的拉麵味道非常道地。']},
  {w:'別具特色', mean:'有自己特別的樣子，和別人不一樣。', ex:['這間民宿的房間布置成小木屋，牆上掛滿了貝殼，看起來別具特色。','這座橋的樣子像一道彎彎的彩虹，別具特色，吸引很多人來拍照。']},
  {w:'雀躍', mean:'高興得像麻雀一樣跳起來。', ex:['聽到明天要去遠足，全班同學都雀躍不已，下課時一直討論要帶什麼點心。','收到筆友寄來的信，我的心雀躍得像一隻在枝頭上跳上跳下的小麻雀。']},
  {w:'探索', mean:'到處尋找，想弄清楚不知道的事。', ex:['走進神祕的森林裡，我們拿著放大鏡，一起探索大自然的奧祕。','小狗剛到新家，好奇的到處嗅來嗅去，忙著探索屋子裡的每一個角落。']}
 ],
 'w4u08':[
  {w:'居高臨下', mean:'站在高的地方往下看。', ex:['站在一百零一大樓的觀景臺上，居高臨下，整個臺北市都在我的腳下。','老鷹停在高高的山崖上，居高臨下的看著山谷裡的一舉一動。']},
  {w:'功能', mean:'東西能發揮的作用。', ex:['這支新手機的功能很多，可以拍照、聽音樂，還能當手電筒。','這張書桌有很多功能，桌面可以調高，抽屜裡還能放文具。']},
  {w:'景觀', mean:'一個地方可以看到的風景樣子。', ex:['從山頂往下看，綠油油的梯田一層一層排列，景觀十分特別。','這座公園種了許多花草樹木，還有小橋流水，景觀十分優美。']},
  {w:'著名', mean:'很有名，很多人都知道。', ex:['日月潭是臺灣著名的風景區，湖水清清的，像一面大大的鏡子。','這家店是鎮上著名的老店，賣的豆花已經有五十年的歷史了。']},
  {w:'避免', mean:'想辦法讓不好的事不要發生。', ex:['出門前要先看天氣預報，記得帶好雨傘，避免被雨淋得溼答答。','下課走樓梯時要靠右邊，一步一步慢慢的走，才能避免和別人撞在一起。']},
  {w:'迎接', mean:'到前面去接待來的人或事。', ex:['除夕那天，家家戶戶貼上紅紅的春聯，熱熱鬧鬧的迎接新年。','爸爸出差回來那天，我和妹妹早早就站在門口，等著迎接他。']},
  {w:'散發', mean:'向四周發出光、熱或氣味。', ex:['秋天桂花開了，小小的花朵散發出淡淡的香味，飄滿了整個院子。','剛出爐的蛋糕散發著甜甜的奶油香，讓人忍不住吞了吞口水。']},
  {w:'耀眼', mean:'光線很強，亮得讓人睜不開眼。', ex:['夏天中午的陽光十分耀眼，照得海面閃閃發亮，像撒了一層金粉。','她穿上亮片禮服站在舞臺中央，在燈光的照射下顯得特別耀眼。']},
  {w:'改善', mean:'把不好的地方改得更好。', ex:['社區種了很多樹以後，空氣變得清新了，環境也改善了不少。','自從每天早睡早起以後，弟弟的身體改善了很多，很少再感冒了。']},
  {w:'可觀', mean:'數量很多，或是很值得一看。', ex:['這棵老樹已經活了五百年，樹幹粗得要五個人才抱得住，十分可觀。','他每天存下十元，一年下來，竟然存了一筆數目可觀的零用錢。']},
  {w:'四面八方', mean:'各個方向、各個地方。', ex:['跨年晚會快開始了，人潮從四面八方湧進來，把廣場擠得滿滿的。','一聽到冰淇淋車的音樂，孩子們就從四面八方跑過來，排起長長的隊伍。']},
  {w:'印象', mean:'看過或聽過以後，留在心裡的樣子。', ex:['第一次見到新老師時，她溫柔的笑容，給我留下了深刻的印象。','那次全家去墾丁看海的旅行，在我心裡留下了很美好的印象。']}
 ],
 'w4u09':[
  {w:'華麗', mean:'很美麗、很氣派，裝飾得很多。', ex:['這座古老的宮殿裡，屋頂雕著金色的龍，裝飾得十分華麗。','公主穿著一件華麗的禮服，裙子上繡滿了閃閃發亮的花朵。']},
  {w:'清靜', mean:'安靜、不吵鬧的。', ex:['離開熱鬧的大街，走進山裡的小廟，四周一下子變得好清靜。','爺爺喜歡住在鄉下，因為那裡聽不到車子的喇叭聲，十分清靜。']},
  {w:'信奉', mean:'相信並且遵守某種宗教或想法。', ex:['很多漁民信奉媽祖，出海前都會來到廟裡，祈求能平安回來。','這個村子的人都信奉土地公，每逢初一、十五都會準備水果祭拜。']},
  {w:'往來', mean:'互相走動、交流，來來去去。', ex:['港口邊，大大小小的船隻往來不停，汽笛聲一聲接著一聲。','這條老街從前是商人往來的地方，路上的石板被走得光光亮亮。']},
  {w:'熱鬧', mean:'人很多，聲音和活動很多的樣子。', ex:['過年的時候，街上掛滿紅燈籠，舞龍舞獅敲鑼打鼓，十分熱鬧。','夜市裡擠滿了人，叫賣聲和笑聲混在一起，真是熱鬧極了。']},
  {w:'景象', mean:'眼前看到的情形和樣子。', ex:['春天來了，田野裡開滿黃色的油菜花，一片生氣勃勃的景象。','颱風過後，街上到處是倒下的樹枝和招牌，景象十分凌亂。']},
  {w:'聞名', mean:'名氣很大，大家都聽說過。', ex:['鹿港的老街以美食和古蹟聞名，紅磚小巷彎彎曲曲，每到假日都擠滿了遊客。','這裡的溫泉聞名全臺灣，冬天一到，白色的熱氣裊裊升起，來泡湯的人特別多。']},
  {w:'地勢', mean:'土地高高低低的樣子。', ex:['這座小鎮的地勢很高，站在街口，就能看見遠方藍藍的大海。','因為這裡的地勢又低又平，每次下起嘩啦嘩啦的大雨，街道就很容易淹水。']},
  {w:'合適', mean:'剛剛好，很適合。', ex:['天氣變冷了，媽媽幫我挑了一件合適的外套，穿起來暖呼呼的。','這雙球鞋大小剛剛好，穿起來很合適，跑步時腳一點也不痛。']},
  {w:'特產', mean:'某個地方特別出產、很有名的東西。', ex:['每次到新竹，我們都會買米粉和貢丸，這些都是當地的特產。','池上出產的米粒又香又軟，煮好時白胖胖的冒著熱氣，是當地有名的特產。']},
  {w:'氣息', mean:'讓人感覺到的味道或氣氛。', ex:['一走進老廟裡，就聞到淡淡的香火味，四處充滿了古老的氣息。','窗外的樹冒出新芽，鳥兒也唱起歌來，到處都是春天的氣息。']}
 ],
 'w4u10':[
  {w:'天馬行空', mean:'想法自由奔放，不受限制。', ex:['弟弟的想法天馬行空，他說要蓋一座雲朵做的城堡，讓大家都住進去。','這本故事書的內容天馬行空，有會說話的茶壺，還有會在天上游泳的鯨魚。']},
  {w:'奇幻', mean:'神奇又不真實，像夢一樣。', ex:['走進這座主題樂園，彷彿來到奇幻的世界，到處都是城堡和精靈。','這部電影充滿了奇幻的色彩，主角騎著一條銀色的龍穿過彩虹。']},
  {w:'旋律', mean:'一首歌或音樂高高低低的曲調。', ex:['音樂教室裡傳來鋼琴聲，輕快的旋律，像小溪在石頭間跳舞。','這首兒歌的旋律很好聽，我聽了一次，就忍不住跟著哼唱起來。']},
  {w:'一瞬間', mean:'非常短的時間，眼睛一眨的時候。', ex:['煙火咻的一聲衝上夜空，一瞬間，黑漆漆的天空開滿了金色的花朵。','流星劃過天空，只亮了一瞬間，我還來不及許願，它就不見了。']},
  {w:'體驗', mean:'親自去做、去感受。', ex:['這次去農場，我們體驗了擠牛奶，手摸到牛肚子時暖暖的。','到了陶藝教室，我第一次體驗捏陶土的樂趣，雙手都沾滿了泥巴。']},
  {w:'飛翔', mean:'在空中盤旋飛行。', ex:['一群白鷺鷥從稻田裡起飛，在藍天下自由的飛翔，好像一片片白色的雲。','我夢見自己長出一對雪白的翅膀，像小鳥一樣，在白雲之間快樂的飛翔。']},
  {w:'邁開', mean:'把腳步跨出去，大步向前走。', ex:['槍聲砰的一響，選手們立刻邁開大步，像一陣風一樣衝了出去。','小寶寶扶著沙發，搖搖晃晃的邁開第一步，全家人都拍手叫好。']},
  {w:'貪念', mean:'想要得到更多、不知足的念頭。', ex:['故事裡的漁夫起了貪念，向金魚要的東西越來越多，最後什麼都沒有了。','看到路邊有一個掉落的錢包，他沒有起貪念，馬上送到警察局。']},
  {w:'祕密', mean:'不讓別人知道的事。', ex:['我和好朋友躲在大樹下，偷偷交換了一個祕密，約好誰都不能說出去。','妹妹把日記本鎖起來，說裡面藏著她的小祕密，不准我偷看。']},
  {w:'報答', mean:'用實際行動感謝別人的幫助或恩情。', ex:['小鹿被獵人救了一命，後來牠常常送來野果，想要報答獵人的恩情。','父母辛苦的照顧我們長大，我要用功讀書，將來好好報答他們。']},
  {w:'山珍海味', mean:'山上和海裡出產的珍貴食物，形容非常豐盛的菜。', ex:['外婆八十歲大壽那天，餐桌上擺滿了山珍海味，大家吃得好開心。','爺爺說，再多的山珍海味，也比不上奶奶煮的一碗熱湯麵。']},
  {w:'榮華富貴', mean:'有錢又有地位，生活很好。', ex:['故事裡的國王擁有榮華富貴，卻一點也不快樂，因為他沒有朋友。','他說比起榮華富貴，一家人平平安安的在一起才是最重要的。']}
 ],
 'w4u11':[
  {w:'深不見底', mean:'非常深，看不到底部。', ex:['我們站在山洞口往下看，黑漆漆的洞穴深不見底，讓人心裡發毛。','這口古井深不見底，丟一顆小石頭進去，好久才聽見咚的一聲。']},
  {w:'東張西望', mean:'一下看這邊，一下看那邊，到處張望。', ex:['第一次到臺北車站，弟弟東張西望，看什麼都覺得很新奇。','小松鼠抱著松果，站在樹枝上東張西望，好像怕被別人搶走。']},
  {w:'說不定', mean:'也許、可能會這樣。', ex:['天上的烏雲越來越厚，說不定等一下就會下大雨，我們快回家吧。','這隻小狗一直跟在我們後面，說不定是迷路了，正在找回家的路。']},
  {w:'居然', mean:'沒想到，事情出乎意料。', ex:['我們以為今天的比賽一定會輸，沒想到最後居然贏了，大家高興得跳起來。','平常一看到水就發抖的表弟，這次居然一口氣游了二十五公尺，大家都看傻了眼。']},
  {w:'不慌不忙', mean:'態度很鎮定，一點也不緊張。', ex:['地震來的時候，老師不慌不忙的指揮大家，躲到桌子底下。','考試時間只剩下一分鐘，他還是不慌不忙的拿起筆，把最後一題一字一字的寫完。']},
  {w:'半信半疑', mean:'有點相信，又有點懷疑。', ex:['聽到弟弟說他看見外星人，我半信半疑，跟著他跑到窗邊看。','同學說這顆種子會開出很大的花，我半信半疑的把它種進花盆裡。']},
  {w:'迫不及待', mean:'急得不能再等下去。', ex:['放學鐘聲一響，我就迫不及待的跑回家，因為今天是我的生日，媽媽烤了蛋糕。','新買的故事書一拿到手，妹妹就迫不及待的翻開來讀，連晚飯都忘了吃。']},
  {w:'不由自主', mean:'控制不了自己，自然就這樣做了。', ex:['聽到這首輕快的歌，我的腳就不由自主的跟著打起拍子，噠噠噠的好像在跳舞。','看到小狗搖著尾巴、汪汪叫著撲過來，我不由自主的蹲下來，緊緊抱住牠。']},
  {w:'得意', mean:'事情做得好，覺得很滿意、很驕傲。', ex:['弟弟第一次自己綁好鞋帶，抬起小下巴，得意的笑了起來，好像打了一場勝仗。','他考了一百分，得意的把考卷拿給每個人看，尾巴都快翹起來了。']},
  {w:'著急', mean:'心裡很急，很擔心。', ex:['上學快遲到了，我卻找不到聯絡簿，心裡著急得像熱鍋上的螞蟻。','小貓爬到高高的樹上喵喵叫，就是下不來，小女孩在樹下著急得快哭了。']},
  {w:'以免', mean:'免得發生不好的事。', ex:['出門前要記得鎖好門窗，以免小偷跑進來，偷走家裡的東西。','下雨天走路要放慢腳步，看清楚路面，以免踩到水坑，弄髒了白白的新鞋子。']},
  {w:'解決', mean:'把問題或困難處理好。', ex:['遇到困難時不要哭，冷靜下來想一想，一定能找到辦法解決。','我和哥哥坐在書桌前一起動腦筋，想了整整一個晚上，終於解決了這道數學難題。']}
 ],
 'w4u12':[
  {w:'遠近知名', mean:'不管遠方或近處的人都知道，很有名。', ex:['巷口那家牛肉麵店，湯頭又香又濃，麵條Ｑ彈有勁，是遠近知名的老店。','這座小鎮的草莓又大又甜，遠近知名，每年冬天都吸引很多遊客。']},
  {w:'親切', mean:'對人熱情、和氣，讓人感到溫暖。', ex:['新來的老師說話輕聲細語，臉上總是帶著笑，讓人覺得好親切。','便利商店的店員阿姨對每位客人都很親切，總是笑著說謝謝光臨。']},
  {w:'耐心', mean:'不急躁、不怕麻煩，能慢慢做下去的心。', ex:['我不會綁鞋帶時，姐姐很有耐心的教我，一次又一次的示範。','釣魚要很有耐心，像一棵安靜的樹一樣坐在河邊，等著魚兒慢慢上鉤。']},
  {w:'失望', mean:'希望沒有實現，心裡很難過。', ex:['原本要去遊樂園，卻突然下起大雨，大家都失望的嘆了一口氣。','我期待了好久的煙火秀因為颱風取消了，心裡好失望，像洩了氣的氣球。']},
  {w:'喜出望外', mean:'遇到想不到的好事，特別高興。', ex:['打開門的那一刻，看見遠方的表哥來看我，我喜出望外，衝上去抱住他。','原本以為弄丟了小狗，沒想到牠自己跑回家，我真是喜出望外。']},
  {w:'謎團', mean:'讓人想不通、不明白的事情。', ex:['桌上的餅乾一塊塊不見了，這個謎團，直到看見小狗嘴邊的餅乾屑才解開。','古老的金字塔是怎麼用一塊塊大石頭蓋起來的，到現在還是一個解不開的謎團。']},
  {w:'百思不解', mean:'想了很多次，還是想不明白。', ex:['明明放在書包裡的鉛筆盒，怎麼會跑到冰箱裡，我百思不解。','魔術師是怎麼把硬幣變不見的，我想了好久還是百思不解。']},
  {w:'觀察', mean:'仔細的看，了解事物的變化。', ex:['自然課時，我們拿著放大鏡，仔細觀察葉子上的紋路，像在看一張小小的地圖。','我每天記錄豆芽長高了多少，用心觀察它的變化，看它一天天從黃色變成綠色。']},
  {w:'靈巧', mean:'動作靈活又巧妙。', ex:['小猴子在樹枝間跳來跳去，動作十分靈巧，像在表演特技。','奶奶的手很靈巧，一張紅紙剪幾下，就變成一朵漂亮的窗花。']},
  {w:'目不轉睛', mean:'眼睛一直看著，一下也不轉開。', ex:['魔術表演開始了，臺下的小朋友目不轉睛，連眼睛都捨不得眨一下。','弟弟趴在桌邊，目不轉睛的盯著魚缸，看小魚吐出一串串圓圓的泡泡。']},
  {w:'嘖嘖稱奇', mean:'發出嘖嘖的聲音，表示讚嘆、覺得很奇妙。', ex:['這位老爺爺用一根竹子，編出一隻活靈活現的蚱蜢，大家都嘖嘖稱奇。','小狗會自己開門，還會幫忙拿報紙，鄰居看了都嘖嘖稱奇。']},
  {w:'手舞足蹈', mean:'手揮動、腳跳動，形容非常開心。', ex:['聽到要去動物園的消息，妹妹高興得手舞足蹈，在客廳轉起圈圈。','看到雪花從天上飄下來，弟弟開心得手舞足蹈，在雪地裡又跑又跳。']}
 ],
 'w4d01':[
  {w:'潔白', mean:'乾淨又很白的顏色。', ex:['一夜大雪過後，山頂鋪上了一層潔白的雪，像蓋著一條軟綿綿的棉被。','剛洗好的床單晾在陽光下，潔白得像天上的雲朵，聞起來還有太陽的味道。']},
  {w:'環境', mean:'我們生活周圍的地方和情況。', ex:['我們每天打掃教室，認真做好垃圾分類，讓學習的環境乾淨又整齊。','這座公園的環境清幽，綠樹成蔭，還有小鳥在枝頭唱歌，是散步的好地方。']},
  {w:'懶散', mean:'懶惰、做事不認真，提不起精神。', ex:['放暑假以後，哥哥每天睡到中午，整個人變得好懶散，像一隻曬太陽的貓。','小熊整個冬天都懶散的躺在洞裡，一動也不想動，連打個哈欠都慢吞吞的。']},
  {w:'欣賞', mean:'用喜愛的心情去看、去聽、去感受。', ex:['星期天的傍晚，我們全家坐在草地上，一起欣賞天邊紅通通的晚霞。','走進美術館，我一幅一幅慢慢的欣賞牆上的畫，好像走進了顏色的森林。']},
  {w:'相稱', mean:'互相配合，看起來很搭。', ex:['這頂紅色的小帽子，配上她白色的洋裝，顏色十分相稱，看起來好可愛。','小小的花盆裡種著一棵大樹，看起來一點也不相稱，好像小孩穿著大人的鞋子。']},
  {w:'收拾', mean:'把東西整理好，放回原處。', ex:['玩完積木以後，我把玩具一個一個收拾好，整整齊齊的放回箱子裡。','吃完晚餐，我幫媽媽收拾桌上的碗盤，再把餐桌擦得亮晶晶的。']},
  {w:'環顧', mean:'向四周看一看。', ex:['走進新教室，我好奇的環顧四周，看見窗邊擺著一排綠油油的盆栽。','站在山頂上環顧四周，層層疊疊的山峰像海浪一樣，一路延伸到天邊。']},
  {w:'對比', mean:'把兩樣東西放在一起比較，看出不同。', ex:['黑色的夜空和金黃色的月亮，形成強烈的對比，讓月亮顯得更加明亮。','把我小時候和現在的照片放在一起對比，才發現自己長高了好多好多。']},
  {w:'雜草叢生', mean:'雜亂的草長得又多又密。', ex:['這棟老房子很久沒有人住了，院子裡雜草叢生，連小路都看不見了。','荒廢的花園裡雜草叢生，長得比我還要高，風一吹就沙沙作響。']},
  {w:'舒暢', mean:'心情或身體感到舒服、痛快。', ex:['爬上山頂，迎著涼爽的山風，深深吸一口氣，全身都覺得好舒暢。','把心裡的委屈說給媽媽聽以後，我的心情就像被雨洗過的天空一樣舒暢。']},
  {w:'格格不入', mean:'和周圍的人或東西不能配合，不協調。', ex:['大家都穿著輕便的運動服，只有他穿著西裝，看起來和大家格格不入。','在一排紅磚老房子中間，突然冒出一棟亮晶晶的玻璃大樓，顯得格格不入。']},
  {w:'自言自語', mean:'自己跟自己說話。', ex:['妹妹一邊畫畫，一邊自言自語，好像在和畫裡的小兔子說悄悄話。','爺爺坐在院子裡，對著盛開的蘭花自言自語，說它今年開得特別美。']}
 ],
 'w4d02':[
  {w:'衣食無缺', mean:'穿的和吃的都不缺少，生活不用煩惱。', ex:['我們現在衣食無缺，每天都有熱騰騰的飯菜可以吃，更要懂得感恩。','爸爸媽媽辛苦工作，讓我們過著衣食無缺的生活，冬天有暖暖的外套可以穿。']},
  {w:'三餐不繼', mean:'連一天三頓飯都吃不飽，形容非常窮。', ex:['很久很久以前，村子遇到大旱災，許多人家三餐不繼，只能挖野菜充飢。','那位老爺爺小時候家裡很窮，常常三餐不繼，只好餓著肚子走好遠的路去上學。']},
  {w:'窮困', mean:'很窮，生活很困難。', ex:['故事裡的小女孩家境窮困，冬天沒有厚衣服，只能縮在角落裡發抖。','雖然生活窮困，這對夫妻還是常常把僅有的米，分給更需要幫助的鄰居。']},
  {w:'為難', mean:'覺得事情很難辦，不知道怎麼做才好。', ex:['兩個好朋友同時約我星期天出去玩，我不知道該答應誰，心裡十分為難。','媽媽正在廚房忙著煮飯，弟弟卻一直拉著她的衣角吵著要出去玩，讓媽媽好為難。']},
  {w:'準備', mean:'事先把要用的東西或要做的事安排好。', ex:['明天就要去露營了，我把睡袋、手電筒和水壺，一樣一樣放進背包，做好準備。','天色暗了下來，烏雲越來越厚，我們趕快把衣服收進屋裡，準備迎接大雨。']},
  {w:'不以為然', mean:'心裡不認為是對的，不贊同。', ex:['弟弟說蝸牛跑得比烏龜還要快，姐姐聽了搖搖頭，一臉不以為然。','他誇口說自己一天可以讀完十本書，大家聽了都不以為然的笑了笑。']},
  {w:'餐風露宿', mean:'在風中吃飯，在野外睡覺，形容路途很辛苦。', ex:['為了拍到臺灣黑熊的照片，攝影師在深山裡餐風露宿，一住就是好幾個月。','古時候的旅人沒有旅館可以住，常常在野外餐風露宿，吹著冷冷的夜風過夜。']},
  {w:'吃盡苦頭', mean:'受了很多的苦。', ex:['第一次學騎腳踏車時，我摔了好多次，膝蓋都破皮了，真是吃盡苦頭。','這群登山客在暴風雨中迷了路，又冷又餓，吃盡苦頭才平安的回到山下。']},
  {w:'慚愧', mean:'覺得自己做得不夠好，心裡很不好意思。', ex:['我不小心把弟弟的玩具弄壞了，他卻沒有生氣，還反過來安慰我，讓我覺得好慚愧。','看到同學每天認真練習，自己卻常常偷懶，我心裡覺得很慚愧，臉都紅了。']},
  {w:'思前想後', mean:'前前後後想了很多遍。', ex:['要不要把存了一年的零用錢拿去買玩具，我思前想後，還是決定先存起來。','他躺在床上思前想後了一整個晚上，終於決定明天要向同學說聲對不起。']},
  {w:'顧慮', mean:'心裡有擔心，因此不敢放手去做。', ex:['小華很想參加演講比賽，可是又怕上臺會緊張，心裡有許多顧慮。','老師拍拍我的肩膀，溫柔的說：「放下心裡的顧慮，大膽的試試看吧！」']},
  {w:'絆腳石', mean:'擋住去路的石頭，比喻妨礙成功的東西。', ex:['粗心是學習路上的絆腳石，只要細心一點，就能少犯很多錯誤。','懶惰就像路上的絆腳石，會讓我們跌倒，也會讓我們離夢想越來越遠。']}
 ],
 'w4d03':[
  {w:'命令', mean:'上面的人要下面的人一定要照著做的話。', ex:['將軍一聲命令，士兵們立刻排好隊伍，踏著整齊的步伐往前走。','國王發出命令，要全國的工匠在一個月內，為公主打造一頂閃亮的皇冠。']},
  {w:'連忙', mean:'趕快、急忙去做。', ex:['看到老奶奶提著重重的菜籃，我連忙跑過去，幫她把菜提回家。','天空突然下起大雨，我們連忙跑到屋簷下躲雨，衣服還是溼了一大片。']},
  {w:'宣傳', mean:'向大家說明，讓更多人知道。', ex:['為了讓更多人來參加園遊會，我們站在校門口發傳單，大聲的宣傳。','社區要舉辦淨灘活動，里長伯拿著擴音器，沿著大街小巷四處宣傳。']},
  {w:'選拔', mean:'從很多人裡面挑出優秀的人。', ex:['學校要選拔參加說故事比賽的同學，大家都躍躍欲試，想要上臺表現。','籃球隊下個月要選拔新隊員，哥哥每天放學後都在球場上流著汗練球。']},
  {w:'特質', mean:'一個人或東西特別的性質。', ex:['她做事認真又有愛心，這些美好的特質，讓她成為大家心目中的好班長。','誠實是一種很珍貴的特質，就像一顆閃閃發亮的寶石，讓別人願意信任你。']},
  {w:'堅持', mean:'不放棄，一直做下去。', ex:['雖然練琴練得手指好痠，但是我堅持每天練習，終於能彈完一整首曲子。','小樹苗在狂風中搖來搖去，還是堅持站得直直的，一點也不肯彎下腰。']},
  {w:'勤奮', mean:'認真努力，不偷懶。', ex:['螞蟻們排成一條長長的隊伍，勤奮的搬運食物，準備過一個溫暖的冬天。','阿公是一位勤奮的農夫，每天太陽還沒升起，就扛著鋤頭到田裡工作。']},
  {w:'踴躍', mean:'很熱烈、搶著參加。', ex:['學校舉辦愛心義賣活動，同學們都踴躍參加，把每個攤位擠得滿滿的。','老師問誰想上臺分享故事，大家都踴躍的舉起手，一隻隻小手舉得高高的。']},
  {w:'懷疑', mean:'心裡不相信，覺得可能不是這樣。', ex:['桌上的蛋糕少了一大塊，媽媽懷疑是小狗偷吃的，因為牠的嘴邊沾著奶油。','聽到妹妹說她看見會飛的魚，我懷疑的看著她，以為她在跟我開玩笑。']},
  {w:'厲害', mean:'本領很強，很了不起。', ex:['表哥的魔術真厲害，一張撲克牌在他手上，一下子就變不見了。','這隻小狗好厲害，會自己用鼻子推開門，還會把拖鞋叼到爸爸的腳邊。']},
  {w:'獨特', mean:'特別的，和別人都不一樣。', ex:['每一片雪花的形狀都不一樣，像小小的六角星，有著自己獨特的花紋。','這間餐廳的裝潢很獨特，桌椅都是用漂流木做的，充滿了大海的味道。']},
  {w:'拭目以待', mean:'擦亮眼睛等著看，形容很期待結果。', ex:['新的遊樂設施下個月就要開放了，大家都拭目以待，想看看它有多好玩。','這位小畫家下一次會畫出什麼樣的作品呢？讓我們一起拭目以待吧！']}
 ],
 'w4d04':[
  {w:'收成', mean:'把成熟的農作物收回來。', ex:['秋天到了，田裡的稻穗金黃飽滿，農夫伯伯笑著說今年的收成很好。','今年颱風來了好幾次，果園裡的芒果掉滿地，收成比往年少了很多。']},
  {w:'溫飽', mean:'穿得暖、吃得飽。', ex:['從前的人每天辛苦工作，只希望全家能吃得溫飽，平平安安的過日子。','寒冷的冬夜裡，志工送來熱粥和棉被，讓街上的遊民也能得到溫飽。']},
  {w:'便利', mean:'方便、容易做到。', ex:['自從家旁邊開了一間超市，買菜變得好便利，走路三分鐘就到了。','捷運通車以後，交通變得十分便利，我們去動物園只要半個小時就到了。']},
  {w:'息息相關', mean:'彼此關係非常密切。', ex:['森林和小動物的生活息息相關，樹木被砍光了，牠們就沒有家了。','我們每天的心情和睡眠息息相關，睡得飽飽的，整天都會精神百倍。']},
  {w:'必備', mean:'一定要準備的。', ex:['夏天去海邊玩的時候，防曬乳和帽子是必備的東西，才不會曬傷。','雨傘是梅雨季節的必備用品，每天出門前，一定要記得放進書包裡。']},
  {w:'期望', mean:'心裡盼望著會有好的結果。', ex:['爸爸媽媽對我的期望很高，希望我像一棵挺直的大樹，做個誠實又善良的人。','我沒有辜負老師的期望，在比賽中認真表現，開心的捧回了第一名的獎盃。']},
  {w:'保健', mean:'保護身體健康。', ex:['每天早睡早起，多吃蔬菜水果，再到公園散散步，都是保健身體的好方法。','護理師阿姨來班上教大家保健牙齒的方法，提醒我們吃完東西要刷牙。']},
  {w:'應景', mean:'配合節日或當時的情況做事。', ex:['端午節到了，媽媽買了香噴噴的粽子，還幫我們掛上香包，十分應景。','中秋節快到了，商店裡擺滿了應景的月餅和柚子，空氣裡都是節日的香味。']},
  {w:'傳統', mean:'從以前一代一代傳下來的習慣或文化。', ex:['過年時包紅包、貼春聯，都是我們一代一代流傳下來的傳統習俗。','外婆會做傳統的紅龜粿，每次拜拜，廚房裡都飄著甜甜的香味。']},
  {w:'五花八門', mean:'種類很多，變化很多。', ex:['夜市裡的小吃五花八門，有臭豆腐、雞排，還有亮晶晶的糖葫蘆。','文具店裡的鉛筆盒五花八門，有的像汽車，有的像小貓，讓人看得眼花撩亂。']},
  {w:'推陳出新', mean:'去掉舊的，想出新的方法或東西。', ex:['這家麵包店常常推陳出新，這個月又做出了芋頭口味的新麵包。','手機的功能不斷推陳出新，現在不但能打電話，還能把外國話翻譯出來。']},
  {w:'創意', mean:'新的、與眾不同的想法。', ex:['弟弟用紙箱和寶特瓶，做出一臺會動的小火車，真是充滿了創意。','她把舊牛仔褲改成一個可愛的小包包，這個創意讓大家都拍手叫好。']}
 ],
 'w4d05':[
  {w:'哭泣', mean:'流著眼淚，小聲的哭。', ex:['小女孩在人群中找不到媽媽，坐在路邊哭泣，眼淚一顆一顆往下掉。','天空灰濛濛的，雨滴滴答答下個不停，好像有人坐在雲上難過的哭泣。']},
  {w:'過敏', mean:'身體碰到某些東西時，出現發癢、打噴嚏等不舒服的反應。', ex:['弟弟對花粉過敏，春天一到，鼻子就癢癢的，噴嚏打個不停。','我吃了蝦子以後皮膚過敏，身上冒出一顆顆紅紅的小疹子，好癢好癢。']},
  {w:'天然', mean:'自然生成的，不是人工做的。', ex:['這瓶果汁是用新鮮的水果打成的，沒有加糖，喝起來是天然的甜味。','山中的這座湖泊像一面天然的大鏡子，清清楚楚的倒映著藍天和白雲。']},
  {w:'搓揉', mean:'用手來回的揉。', ex:['做湯圓時，我把糯米糰放在手心，輕輕搓揉，變成一顆顆圓滾滾的小球。','冬天的早晨手凍得冰冰的，我把雙手合在一起搓揉，一會兒就暖和起來了。']},
  {w:'印象深刻', mean:'在心裡留下很清楚，不容易忘記的記憶。', ex:['去年在海邊看到的日出，金光灑滿了整片海面，讓我印象深刻。','電影裡小狗每天在車站等主人回家的畫面，讓我印象深刻，看完還一直想著。']},
  {w:'角色', mean:'故事或戲劇裡的人物。', ex:['在班上的話劇表演裡，我扮演一隻愛唱歌的小青蛙，這個角色好有趣。','在這個故事裡，最讓我喜歡的角色，是那位勇敢又善良的小公主。']},
  {w:'困境', mean:'困難、不容易解決的處境。', ex:['小貓被困在高高的樹上，消防員叔叔架起梯子，幫牠脫離了困境。','他遇到困境時從不灰心，總是握緊拳頭告訴自己：「再試一次就好。」']},
  {w:'好奇', mean:'對不知道的事物很有興趣，想去了解。', ex:['小狗第一次看到雪，好奇的用鼻子聞了聞，又用腳掌輕輕拍了拍。','我對宇宙充滿了好奇，常常望著星空，想知道星星後面還藏著什麼。']},
  {w:'發酵', mean:'食物裡的微生物作用，讓它起變化，像麵團變膨。', ex:['媽媽把麵糰放在溫暖的地方發酵，過了一個小時，它就胖了一倍。','牛奶經過發酵以後，就變成酸酸甜甜的優格，加上水果更是好吃。']},
  {w:'環保', mean:'保護環境，減少汙染和浪費。', ex:['去超市買東西時，我都會帶著自己的購物袋，既方便又環保。','我們把寶特瓶洗乾淨後剪成花盆，種上紅紅黃黃的小花，又美麗又環保。']},
  {w:'讚嘆', mean:'看到很好的東西，忍不住稱讚。', ex:['站在山頂看著翻騰的雲海，大家都忍不住發出讚嘆的聲音。','看到這幅栩栩如生的畫，參觀的人都忍不住讚嘆畫家的好手藝。']},
  {w:'興趣', mean:'喜歡去做某件事的心情。', ex:['我對畫畫很有興趣，每天放學後，都會拿出彩色筆畫上一張。','弟弟對恐龍很有興趣，家裡的恐龍書已經堆得像一座小山一樣高。']}
 ],
 'w4d06':[
  {w:'記憶', mean:'記在心裡，以前發生過的事。', ex:['小時候和外公一起去河邊釣魚的日子，是我記憶中最快樂的時光。','那首童年的兒歌一響起，許多美好的記憶，就像泡泡一樣一顆顆冒了出來。']},
  {w:'穿越', mean:'從一邊通過到另一邊。', ex:['我們騎著腳踏車，穿越一片綠油油的稻田，涼風吹得好舒服。','火車轟隆轟隆的穿越長長的隧道，眼前突然出現一片藍藍的大海。']},
  {w:'格外', mean:'特別、比平常更加。', ex:['下過一場大雨以後，天空格外的藍，遠處的山也看得特別清楚。','中秋節的月亮格外的圓、格外的亮，像一個掛在天上的大白玉盤。']},
  {w:'昂貴', mean:'價錢很高，很貴。', ex:['這顆鑽石非常昂貴，在燈光下閃閃發亮，大家都不敢靠得太近。','這件衣服的價錢很昂貴，媽媽看了看標籤，又輕輕的把它放回架上。']},
  {w:'繁榮', mean:'經濟發達，非常興盛。', ex:['這座小鎮以前很冷清，自從蓋了火車站以後，就變得越來越繁榮。','從前這條老街十分繁榮，到處都是商店和人潮，叫賣聲從早響到晚。']},
  {w:'交錯', mean:'互相交叉、穿插在一起。', ex:['夜晚的市區裡，車燈和霓虹燈交錯閃爍，好像一條流動的光河。','田邊的小路縱橫交錯，從高處往下看，就像一張畫在大地上的棋盤。']},
  {w:'彎彎曲曲', mean:'很多轉彎，不是直的。', ex:['一條彎彎曲曲的小溪，像銀色的緞帶，從山腳下慢慢的流過。','這條山路彎彎曲曲的，車子一下往左轉，一下往右轉，讓我有點頭暈。']},
  {w:'狹窄', mean:'又窄又小，不寬。', ex:['這條巷子非常狹窄，兩個人並排走都有點擠，只能一前一後的走。','小貓鑽進牆角狹窄的縫隙裡，不管我怎麼喵喵叫，牠都不肯出來。']},
  {w:'出沒', mean:'有時出現，有時躲起來。', ex:['這片森林常常有野生的獼猴出沒，遊客要小心保管手上的食物。','夏天的晚上，田埂邊常有螢火蟲出沒，一閃一閃的，像提著小燈籠。']},
  {w:'家喻戶曉', mean:'每一家每一戶都知道，非常有名。', ex:['白雪公主的故事家喻戶曉，從小朋友到老爺爺，大家都聽過。','這首歌好聽又好唱，現在已經家喻戶曉，連三歲的小妹妹都會唱。']},
  {w:'古色古香', mean:'帶有古代的色彩和味道，很有古老的美感。', ex:['走進這座老廟，紅色的柱子和雕花的窗戶，充滿了古色古香的味道。','外婆家有一張古色古香的木頭桌子，上面刻著漂亮的花朵和小鳥。']},
  {w:'芬芳', mean:'香氣很好聞。', ex:['春天的花園裡，百花盛開，蝴蝶飛舞，空氣中飄著淡淡的芬芳。','茉莉花的香氣十分芬芳，一陣微風吹來，整個院子都香香的。']}
 ],
 'w4d07':[
  {w:'模樣', mean:'人或東西的樣子。', ex:['小貓喝牛奶的模樣好可愛，舌頭一伸一縮，鬍子上還沾著白白的奶。','爸爸說我坐在書桌前認真讀書的模樣，和他小時候簡直一模一樣。']},
  {w:'足跡', mean:'腳走過留下的痕跡，也指去過的地方。', ex:['雪地上留下一串小小的足跡，彎彎的，原來是小兔子剛剛跳過去。','爺爺年輕時背著背包走遍了臺灣，每一座高山都留下了他的足跡。']},
  {w:'拜訪', mean:'到別人家裡或某地去探望。', ex:['過年的時候，我們全家帶著水果和禮盒，到外婆家拜訪親戚。','新鄰居搬來的那天，媽媽烤了一盤香香的餅乾，帶著我去拜訪他們。']},
  {w:'連結', mean:'把兩樣以上的東西連在一起。', ex:['這座長長的大橋，像一道彩虹，連結了河的兩岸，大家往來變得很方便。','網路把世界各地的人連結在一起，讓我們可以和遠方的朋友視訊聊天。']},
  {w:'彼此', mean:'雙方，你和我。', ex:['我和好朋友常常互相幫忙，遇到困難的時候，彼此加油打氣。','兩隻小狗第一次見面，彼此嗅了嗅對方的鼻子，很快就玩在一起了。']},
  {w:'充足', mean:'很多，足夠用。', ex:['種花要給它充足的陽光和水，花朵才會開得又大又美，像一張張燦爛的笑臉。','睡眠充足的時候，我上課的精神特別好，就像一顆剛充飽電的電池。']},
  {w:'饑荒', mean:'農作物收成很差，大家沒有東西吃。', ex:['很久以前，這裡連續好幾年沒有下雨，發生了嚴重的饑荒，人們都沒有東西吃。','那一年發生饑荒，田裡一粒米都收不到，大家只好挖樹根來吃。']},
  {w:'分配', mean:'按照標準把東西分給大家。', ex:['大掃除時，老師把工作分配給每一組，有人掃地，有人擦窗戶。','媽媽把蛋糕切好分配給全家人，每個人的盤子上都有一顆紅紅的草莓。']},
  {w:'平均', mean:'數量一樣多，沒有誰多誰少。', ex:['媽媽把一盒餅乾平均分給我們三個人，每個人都拿到五塊。','這次考試全班的平均分數是九十分，老師高興得笑瞇了眼睛。']},
  {w:'惡化', mean:'情況變得越來越壞。', ex:['如果大家繼續亂丟垃圾，河川的汙染就會越來越惡化，魚兒也活不下去。','爺爺感冒了卻沒有好好休息，病情惡化了，只好到醫院去打點滴。']},
  {w:'期盼', mean:'心裡很希望、很盼望。', ex:['每到放暑假之前，我總是期盼著，能和家人一起去海邊玩水。','農夫伯伯望著乾裂的田地，期盼著老天爺快點下一場大雨。']},
  {w:'攜手', mean:'手牽著手，比喻大家一起合作。', ex:['全班同學攜手合作，花了一個下午，把教室布置得像一座花園。','只要大家攜手努力，少用塑膠袋，就能讓地球變得更乾淨、更美麗。']}
 ],
 'w4d08':[
  {w:'與眾不同', mean:'和大家都不一樣，很特別。', ex:['這隻小鴨的羽毛是灰色的，和兄弟姐妹們與眾不同，後來才知道牠是天鵝。','她的畫總是與眾不同，別人畫紅紅的太陽，她卻畫出一顆彩虹色的太陽。']},

function choiceRound(item,onOk){
  const opts=shuffle(item.o);const fb=h('div',{class:'btn-row'});
  const list=h('div',{class:'opts'},opts.map(([s,ok,why])=>h('button',{class:'opt',onclick:e=>{
    const b=e.currentTarget;
    if(ok){good();b.classList.add('ok');[...list.children].forEach(x=>x.disabled=true);fb.replaceChildren(h('p',{class:'fb ok'},'答對了！'+why));onOk(fb)}
    else{oops();b.classList.add('no');b.disabled=true;fb.replaceChildren(h('p',{class:'fb no'},why+' 再選一次。'))}
  }},s)));
  return [h('p',{class:'ask'},item.q),list,fb];
}

function fixOne(p,f,panel,r,n,onOk){
  let tries=0;
  const fb=h('div',{style:'display:grid;gap:10px'});
  const row=h('div',{class:'tray'});
  const pick=()=>{
    row.replaceChildren(...f.c.map((c,i)=>h('button',{class:'tile',onclick:e=>{
      if(i===f.w){sfx('tap');e.currentTarget.classList.add('pick');[...row.children].forEach(x=>x.disabled=true);choose()}
      else{oops();tries++;e.currentTarget.classList.add('wrong');fb.replaceChildren(h('p',{class:'fb no'},tries>=2?`提示：生病的地方是「${f.c[f.w]}」。`:'這裡沒有生病喔！再唸一次，哪裡怪怪的？'))}
    }},c)));
  };
  const choose=()=>{
    fb.replaceChildren(h('p',{class:'ask'},`找到了！「${f.c[f.w]}」要換成什麼？`),
      h('div',{class:'bank'},shuffle(f.o).map(o=>h('button',{class:'tile',onclick:e=>{
        if(o===f.a){good();
          const fixed=f.c.map((c,i)=>i===f.w?f.a:c).join('');
          fb.replaceChildren(h('p',{class:'fb ok'},'治好了！'+f.why),gaozhi(keySegs(fixed,p.any?p.k.filter(k=>fixed.includes(k)):p.k)),
            h('div',{class:'btn-row'},speakBtn(()=>fixed)));
          onOk(fb);
        }else{oops();e.currentTarget.classList.add('wrong');e.currentTarget.disabled=true}
      }},o))));
  };
  panel.append(h('p',{class:'hint'},`第 ${r+1} 題／共 ${n} 題`),h('p',{class:'ask'},'這個句子生病了！先點出生病的地方。'),row,fb);
  pick();
}

function quiz(id){
  setGrade(3);
  const q=QUIZ[id];const items=shuffle(q.items);let r=0,right=0,firstTry=true;
  const panel=h('section',{class:'panel'});
  app.replaceChildren(h('button',{class:'back',onclick:home},'← 回到課次列表'),
    h('div',{class:'pat-head',style:'margin-bottom:14px'},h('h2',{},q.name),h('span',{class:'from'},'三年級小遊戲')),panel);

  };
  run();window.scrollTo(0,0);
}

function keySegs(text,keys){
  const mark=new Array(text.length).fill(false);let cur=0;
  for(const k of keys){const i=text.indexOf(k,cur);if(i<0)continue;for(let j=i;j<i+k.length;j++)mark[j]=true;cur=i+k.length}
  return [...text].map((c,i)=>({t:c,cls:mark[i]?'k':''}));
}
function gaozhi(cells,minCells=0){
  const g=h('div',{class:'gz','aria-label':cells.map(c=>c.t).join('')});
  let vs=[];if(zyOn()){const z=[...zyText(cells.map(c=>c.t).join(''))];let k=-1;for(const ch of z){if(VS_RE.test(ch)){if(k>=0)vs[k]=ch}else k++}}
  cells.forEach((c,i)=>g.append(h('span',{class:c.cls||'','aria-hidden':'true'},c.t+(vs[i]||''))));
  for(let i=cells.length;i<minCells;i++)g.append(h('span',{'aria-hidden':'true'}));
  return g;
}

function hasKeys(text,p){
  if(p.re)return new RegExp(p.re).test(text);
  if(!p.k.length)return true;
  if(p.any)return p.k.some(k=>text.includes(k));
  let cur=0;for(const k of p.k){const i=text.indexOf(k,cur);if(i<0)return false;cur=i+k.length}return true;
}

let actx=null;
function sfx(kind){
  if(muted)return;
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    const seq={ok:[[660,.09],[990,.14]],no:[[260,.12],[200,.18]],star:[[784,.08],[988,.08],[1175,.18]],sticker:[[523,.1],[659,.1],[784,.1],[1047,.3]],tap:[[600,.03]]}[kind]||[];
    let t=actx.currentTime;
    for(const[f,d]of seq){const o=actx.createOscillator(),g=actx.createGain();o.type=kind==='no'?'triangle':'sine';o.frequency.value=f;
      g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.22,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+d);
      o.connect(g);g.connect(actx.destination);o.start(t);o.stop(t+d+.03);t+=d*.92}
  }catch(e){}
}

function confetti(){
  if(reduceMotion())return;
  const c=h('canvas',{class:'confetti','aria-hidden':'true'});document.body.append(c);
  const W=c.width=innerWidth,H=c.height=innerHeight,ctx=c.getContext('2d');
  if(!ctx){c.remove();return}
  const cols=['#f0ad1e','#d95f22','#2f7d5b','#2a64d6','#c23d78','#8447cc'];
  const ps=Array.from({length:90},()=>({x:W/2,y:H*.35,vx:(Math.random()-.5)*12,vy:-Math.random()*11-3,r:Math.random()*6+4,c:pickOne(cols),a:Math.random()*6}));
  let f=0;(function tick(){ctx.clearRect(0,0,W,H);for(const p of ps){p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.a+=.2;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.a);ctx.fillStyle=p.c;ctx.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);ctx.restore()}
    if(++f<80)requestAnimationFrame(tick);else c.remove()})();
}

/* ============ 加碼遊戲：泡泡挑詞、翻牌配對、對錯快閃（題目由每個句型的句子自動產生） ============ */
const GAME_STEPS=[['泡泡挑詞','選詞填空'],['翻牌配對','句子配對'],['對錯快閃','限時挑戰']];
const isSent=s=>typeof s==='string'&&/[。！？」]$/.test(s)&&s.length>=6&&!/[＿→✗✓]|句：/.test(s)&&!/。/.test(s.replace(/「[^」]*」/g,'「」').slice(0,-1));
const hasKey=(c,p)=>p.k.some(k=>k.length&&c.includes(k));
const CONFUSE=[['不過','但是','可是','卻'],['因為','由於'],['所以','因此','使'],['而且','還','也'],['像','就像','好像','如'],['如果','只有'],['接著','然後']];
const sameGroup=(a,b)=>CONFUSE.some(g=>g.some(w=>a.includes(w))&&g.some(w=>b.includes(w)));
/* 每個句型的「分塊句子」：二年級用排一排的句子，三年級用句子診所改好的句子；key = 要挖空的那一塊 */
function chunkSents(p){
  if(p.g>=3)return [p.fix,...(p.fix2||[])].map(f=>({c:f.c.map((x,i)=>i===f.w?f.a:x),key:f.w}));
  return p.scr.map(c=>{let key=c.findIndex(x=>hasKey(x,p));if(key<0)key=Math.floor(c.length/2);return {c,key}});
}
function goodSents(p){
  const out=chunkSents(p).map(s=>s.c.join(''));
  if(isSent(p.ex))out.push(p.ex);
  const chs=p.g>=3?p.det:[p.ch,...(p.ch2||[])];
  chs.forEach(q=>q.o.forEach(([s,ok])=>{if(ok&&isSent(s)&&!/少了|例如|句：/.test(s))out.push(s)}));
  for(const v of [0,1]){const s=p.fr.map(t=>typeof t==='number'?p.bk[t][Math.min(v,p.bk[t].length-1)]:t).join('');if(isSent(s))out.push(s)}
  return [...new Set(out)];
}
function badSents(p){
  const out=[];
  const chs=p.g>=3?p.det:[p.ch,...(p.ch2||[])];
  chs.forEach(q=>q.o.forEach(([s,ok,why])=>{if(!ok&&isSent(s))out.push([s,why])}));
  if(p.g>=3)[p.fix,...(p.fix2||[])].forEach(f=>{const s=f.c.join('');if(isSent(s))out.push([s,f.why])});
  if(out.length<4){
    const pool=[...new Set(P.filter(q=>q.id!==p.id&&q.g===p.g).flatMap(q=>chunkSents(q).map(s=>s.c[s.key])))].filter(x=>/[一-鿿]/.test(x));
    for(const it of chunkSents(p)){if(out.length>=4)break;const ans=it.c[it.key];
      const sw=shuffle(pool.filter(x=>x!==ans&&!sameGroup(x,ans)&&!hasKey(x,p)))[0];if(!sw)continue;
      const s=it.c.map((c,i)=>i===it.key?sw:c).join('');if(isSent(s))out.push([s,`「${sw.replace(/^[，、]/,'')}」放在這裡不對，原本應該用「${ans.replace(/^[，、]/,'')}」。`])}
  }
  const seen=new Set();return out.filter(([s])=>!seen.has(s)&&seen.add(s));
}

/* 泡泡挑詞 */
function stBubble(p,panel,done){
  const items=shuffle(chunkSents(p)).slice(0,3);let r=0;
  const pool=[...new Set(P.filter(q=>q.id!==p.id).flatMap(q=>chunkSents(q).map(s=>s.c[s.key])))];
  const run=()=>{
    const it=items[r];const ans=it.c[it.key];
    const dis=shuffle(pool.filter(x=>x!==ans&&!sameGroup(x,ans)&&!it.c.includes(x))).slice(0,3);
    const opts=shuffle([ans,...dis]);
    const line=h('div',{class:'bb-line'},it.c.map((c,i)=>i===it.key?h('span',{class:'bb-slot'},'？'):h('span',{},c)));
    const fb=h('div',{class:'btn-row'});
    const field=h('div',{class:'bb-field'},opts.map((o,i)=>h('button',{class:'bubble-btn',style:`--d:${(i*0.7).toFixed(1)}s;--x:${[8,30,54,76][i]}%`,onclick:e=>{
      const b=e.currentTarget;
      if(o===ans){good();b.classList.add('pop');line.querySelector('.bb-slot').textContent=ans;line.querySelector('.bb-slot').classList.add('filled');
        [...field.children].forEach(x=>x.disabled=true);
        fb.replaceChildren(speakBtn(()=>it.c.join(''),'唸一遍'));
        if(r<items.length-1)fb.append(h('button',{class:'primary',onclick:()=>{r++;run()}},'下一題'));
        else{done();fb.append(winLine('泡泡全部戳對了！得到一顆星'),nextBtn(p,4))}
      }else{oops();b.classList.add('miss');b.disabled=true}
    }},o)));
    panel.replaceChildren(h('p',{class:'hint'},`第 ${r+1} 題／共 ${items.length} 題`),h('p',{class:'ask'},'戳一戳泡泡，把句子補完整！'),line,field,fb);
  };
  run();
}

/* 翻牌配對 */
const realTxt=x=>x.replace(/[，。！？；：「」、]/g,'').length>=1;
function splitSent(s,p,strict){
  const q=s.indexOf('：「');if(q>1)return [s.slice(0,q+1),s.slice(q+1)];
  const body=s.slice(0,-1);const at=Math.max(body.lastIndexOf('，'),body.lastIndexOf('；'));
  if(at>0)return [s.slice(0,at+1),s.slice(at+1)];
  const keys=p.k.filter(k=>k.length).sort((x,y)=>y.length-x.length);
  for(const k of keys){const i=s.lastIndexOf(k);if(i>1&&realTxt(s.slice(i)))return [s.slice(0,i),s.slice(i)]}
  if(strict)return null;
  const mid=s.length/2;let best=-1;
  for(const w of ['是不是','可以','在','把','被','去','會','都','就','也','還','很','到']){let i=s.indexOf(w);while(i>=0){if(i>=2&&(best<0||Math.abs(i-mid)<Math.abs(best-mid)))best=i;i=s.indexOf(w,i+1)}}
  const m=best>0?best:Math.ceil(mid);return [s.slice(0,m),s.slice(m)];
}
function stMemory(p,panel,done){
  const pairs=[];const add=sp=>{if(sp&&realTxt(sp[0])&&realTxt(sp[1])&&pairs.length<4&&!pairs.some(x=>x[0]===sp[0]||x[1]===sp[1]))pairs.push(sp)};
  for(const it of chunkSents(p)){const s=it.c.join('');let sp=splitSent(s,p,true);
    if(!sp){const k=it.key>0?it.key:Math.max(1,Math.ceil(it.c.length/2));sp=[it.c.slice(0,k).join(''),it.c.slice(k).join('')]}add(sp)}
  for(const s of goodSents(p))add(splitSent(s,p,true));
  for(const s of goodSents(p))add(splitSent(s,p,false));
  const use=pairs.slice(0,4);let open=[],found=0,moves=0,lock=false;
  const cards=shuffle(use.flatMap(([a,b],i)=>[{t:a,i,side:'L'},{t:b,i,side:'R'}]));
  const info=h('p',{class:'hint'});const fb=h('div',{class:'btn-row'});
  const grid=h('div',{class:'mem'},cards.map(c=>{
    const el=h('button',{class:'mem-card','aria-label':'翻開卡片'},h('span',{class:'mem-back'},h('img',{src:BUDDIES[me?.buddy||'he'].img,alt:''})),h('span',{class:'mem-face '+c.side},c.t));
    el.addEventListener('click',()=>{
      if(lock||el.classList.contains('up'))return;
      sfx('tap');el.classList.add('up');el.setAttribute('aria-label',c.t);open.push([el,c]);
      if(open.length===2){
        moves++;const [[e1,c1],[e2,c2]]=open;open=[];
        if(c1.i===c2.i&&c1.side!==c2.side){found++;good();e1.classList.add('match');e2.classList.add('match');
          const full=(c1.side==='L'?c1.t+c2.t:c2.t+c1.t);fb.replaceChildren(h('p',{class:'fb ok'},'配對成功：'+full),speakBtn(()=>full,'唸一遍'));
          if(found===use.length){done();fb.append(winLine(`全部配對完成！用了 ${moves} 次`),nextBtn(p,5))}
        }else{lock=true;oops();setTimeout(()=>{e1.classList.remove('up');e2.classList.remove('up');lock=false},1000)}
      }
      info.textContent=`找到 ${found}／${use.length} 對・翻了 ${moves} 次`;
    });
    return el;
  }));
  info.textContent=`找到 0／${use.length} 對・翻了 0 次`;
  panel.replaceChildren(h('p',{class:'ask'},'翻開兩張牌，找出同一句話的「前半句」和「後半句」！'),h('p',{class:'hint'},'藍色是前半句，橘色是後半句。'),info,grid,fb);
}

/* 對錯快閃 */
function stFlash(p,panel,done){
  const goods=shuffle(goodSents(p)).slice(0,5).map(s=>({s,ok:true}));
  const bads=shuffle(badSents(p)).slice(0,Math.max(3,8-goods.length)).map(([s,why])=>({s,ok:false,why}));
  const items=shuffle([...goods,...bads]);const T=45;
  let r=0,right=0,combo=0,best=0,left=T,timer=null,over=false;
  const bar=h('div',{class:'fl-bar'},h('i',{}));const meta=h('div',{class:'fl-meta'});const card=h('div',{class:'fl-card'});const fb=h('div',{class:'btn-row'});
  const btns=h('div',{class:'fl-btns'},
    h('button',{class:'fl-yes',onclick:()=>answer(true)},'⭕ 通順'),
    h('button',{class:'fl-no',onclick:()=>answer(false)},'❌ 怪怪的'));
  const show=()=>{card.textContent=items[r].s;card.classList.remove('flip');void card.offsetWidth;card.classList.add('flip');meta.textContent=`第 ${r+1}／${items.length} 題・答對 ${right}・連擊 ${combo}`};
  const finish=()=>{over=true;clearInterval(timer);btns.remove();
    const pass=right>=Math.ceil(items.length*0.7);
    card.textContent=pass?`挑戰成功！答對 ${right}／${items.length} 題，最高連擊 ${best}！`:`答對 ${right}／${items.length} 題，再挑戰一次就能過關！`;
    if(pass){done();fb.replaceChildren(winLine('快閃挑戰成功！得到一顆星'),h('button',{class:'secondary',onclick:()=>stFlash(p,panel,done)},'再挑戰一次'),nextBtn(p,6))}
    else{sfx('no');fb.replaceChildren(h('button',{class:'primary',onclick:()=>stFlash(p,panel,done)},'再挑戰一次'))}};
  function answer(yes){
    if(over)return;const it=items[r];
    if(yes===it.ok){right++;combo++;best=Math.max(best,combo);good();if(combo>=3)say(`${combo} 連擊！好厲害！`,true);fb.replaceChildren()}
    else{combo=0;oops();fb.replaceChildren(h('p',{class:'fb no'},it.ok?'這句其實是通順的喔！':'這句有問題：'+(it.why||'意思不通順。')))}
    r++;if(r>=items.length)finish();else show();
  }
  panel.replaceChildren(h('p',{class:'ask'},`${T} 秒內判斷：這個句子通順嗎？`),h('p',{class:'hint'},`答對 ${Math.ceil(items.length*0.7)} 題以上就過關。`),bar,meta,card,btns,fb);
  show();
  timer=setInterval(()=>{if(!panel.isConnected){clearInterval(timer);return}left--;bar.firstChild.style.width=(left/T*100)+'%';if(left<=10)bar.classList.add('hurry');if(left<=0){finish()}},1000);
}

const coreDone=id=>[0,1,2,3].every(i=>(prog[id]||[]).includes(i));

/* ============ 四年級：造詞實驗室（依第二學習階段 4-Ⅱ、Ab-Ⅱ 字詞學習重點設計；題目為原創） ============ */
// 選擇題格式：[題目, [選項...], 答案, 字理說明, 收藏的詞]
/* ============ 四年級綜合挑戰：題目全部取自四上、四下課本的造詞題庫與課文詞彙 ============ */
const SKILLS=(()=>{
  const W=typeof W4!=='undefined'?W4:[];const V=typeof V4!=='undefined'?V4:{};
  const lessonOf=id=>{const w=W.find(x=>x.id===id);return w?BOOKN['4'+w.b]+w.l.replace(/、.*/,'')+'課':''};
  const allV=Object.entries(V).flatMap(([id,list])=>list.map(v=>({...v,id})));
  const four=allV.filter(v=>[...v.w].length===4&&v.ex&&v.ex[1]);
  const idiom=four.map(v=>{const others=[...new Set(shuffle(four.filter(o=>o.w!==v.w)).map(o=>o.w))].slice(0,3);
    return [v.ex[1].replace(v.w,'＿＿＿＿')+`（${lessonOf(v.id)}）`,[v.w,...others],v.w,'「'+v.w+'」：'+v.mean,v.w]});
  const meanQ=allV.filter(v=>v.mean).map(v=>{const others=[...new Set(shuffle(allV.filter(o=>o.w!==v.w&&o.mean&&o.mean!==v.mean)).map(o=>o.mean))].slice(0,2);
    return ['「'+v.w+'」是什麼意思？',[v.mean,...others],v.mean,'例句：'+((v.ex||[])[0]||''),v.w]});
  const words=allV.map(v=>v.w);
  return [
    {id:'w4-rz',glyph:'辨',name:'字形字音大挑戰',goal:'四上、四下各課的字族、部首、形近字和多音字，全部混在一起考。',type:'choice',items:W.flatMap(w=>w.rz),words},
    {id:'w4-cy',glyph:'義',name:'詞語辨析擂台',goal:'近義詞、反義詞、一詞多義、四字語詞的用法，看語境選出最恰當的詞。',type:'choice',items:W.flatMap(w=>w.cy),words},
    {id:'w4-idiom',glyph:'語',name:'四字語詞填空',goal:'課文裡出現的四字語詞，放進新的句子裡，選出最貼切的一個。',type:'choice',items:idiom,words:four.map(v=>v.w)},
    {id:'w4-mean',glyph:'思',name:'詞義判斷',goal:'四年級課文詞彙的意思，三個解釋裡只有一個對。',type:'choice',items:meanQ,words},
    {id:'w4-multi',glyph:'字',name:'一字變多詞',goal:'用四年級的生字組出所有真正的詞語。',type:'multi',items:W.flatMap(w=>w.mu)},
  ];
})();

const POYIN_DEF={"得": 1};
delete POYIN['一'];delete POYIN['不'];   // 課本標本調，不做變調
let zyPref=store.get('zjgf-zy','on');let zyGrade=2;
const VS_RE=/[\u{E0100}-\u{E01EF}]/u;
function zyText(s){
  const arr=[...s];let out='';
  for(let i=0;i<arr.length;i++){
    const c=arr[i];out+=c;const rs=POYIN[c];if(!rs)continue;
    let best=-1,bestLen=0;
    rs.forEach((pats,ri)=>pats.forEach(p=>{const k=p.indexOf('*');if(k<0)return;
      const pre=p.slice(0,k).replaceAll('*',c),post=p.slice(k+1).replaceAll('*',c);
      if(arr.slice(Math.max(0,i-[...pre].length),i).join('')===pre&&arr.slice(i+1,i+1+[...post].length).join('')===post&&p.length>bestLen){best=ri;bestLen=p.length}}));
    const pick=best>=0?best:(POYIN_DEF[c]||0);if(pick>0)out+=String.fromCodePoint(0xE01E0+pick);
  }
  return out;
}
const zyOn=()=>document.documentElement.classList.contains('zy');
function zyNode(n){if(n.nodeType===3){const v=n.nodeValue;if(v&&!VS_RE.test(v)&&/[㐀-鿿]/.test(v)){const z=zyText(v);if(z!==v)n.nodeValue=z}}else if(n.nodeType===1&&!/^(SCRIPT|STYLE|TEXTAREA|INPUT)$/.test(n.tagName)){n.childNodes.forEach(zyNode)}}
const zyObs=new MutationObserver(ms=>{if(!zyOn())return;for(const m of ms){if(m.type==='characterData')zyNode(m.target);else m.addedNodes.forEach(zyNode)}});
zyObs.observe(document.body,{childList:true,subtree:true,characterData:true});
function setGrade(g){
  zyGrade=g;const on=g<=3&&zyPref!=='off';
  document.documentElement.classList.toggle('zy',on);if(on)zyNode(document.body);
  const b=$('#zyBtn');if(b){b.hidden=g>3;b.textContent=zyPref==='off'?'注音關':'注音開';b.setAttribute('aria-pressed',String(zyPref!=='off'))}
}

function runChoice(box,items,opt){
  let i=0,right=0;const need=opt.pass;
  const draw=()=>{
    if(i>=items.length){const pass=right>=need;

  const list=(typeof MX!=='undefined'&&MX[p.id])||[];if(!list.length)return null;
  if(!title&&list.some(m=>m.bad))title='病句改改看：先找出哪裡不對，再看怎麼改';
  const keys=p.any?p.k:p.k;
  const mark=s=>{const out=[];let rest=s;
    while(rest){let best=-1,bk='';for(const k of keys){const i=rest.indexOf(k);if(i>=0&&(best<0||i<best||(i===best&&k.length>bk.length))){best=i;bk=k}}
      if(best<0){out.push(rest);break}
      if(best)out.push(rest.slice(0,best));out.push(h('b',{class:'mx-key'},bk));rest=rest.slice(best+bk.length)}
    return out};
  return h('div',{class:'mx'},
    h('p',{class:'ask'},title||'美句示範：讀一讀，學一學'),
    ...list.map((m,i)=>h('div',{class:'mx-card'},
      m.bad?h('p',{class:'mx-bad'},h('span',{class:'mx-tag bad'},'病句'),h('span',{class:'mx-strike'},m.bad)):null,
      h('p',{class:'mx-s'},h('span',{class:m.bad?'mx-tag good':'mx-no'},m.bad?'改好':String(i+1)),...mark(m.s)),
      h('p',{class:'mx-note'},'💡 ',m.note),
      h('div',{class:'btn-row'},speakBtn(()=>m.s,'唸給我聽')))));
}

function stOrder(p,panel,done){
  let round=0;
  const run=()=>{
    panel.replaceChildren();
    const chunks=p.scr[round];
    let pool=shuffle(chunks.map((c,i)=>i));let guard=0;
    while(pool.every((v,i)=>v===i)&&guard++<10)pool=shuffle(pool);
    const placed=[];let tries=0;
    const ans=h('div',{class:'tray answer','aria-label':'排好的句子'});
    const tray=h('div',{class:'tray','aria-label':'積木'});
    const fb=h('div');
    const isKey=c=>p.k.some(k=>c.includes(k));
    const draw=()=>{
      ans.replaceChildren(...(placed.length?placed.map((ci,pos)=>h('button',{class:'tile'+(isKey(chunks[ci])?' k':''),onclick:()=>{placed.splice(pos,1);pool.push(ci);draw()}},chunks[ci])):[h('span',{class:'hint'},'點下面的積木，放到這裡')]));
      tray.replaceChildren(...pool.map((ci,pos)=>h('button',{class:'tile'+(isKey(chunks[ci])?' k':''),onclick:()=>{pool.splice(pos,1);placed.push(ci);draw();if(!pool.length)check()}},chunks[ci])));
    };
    const check=()=>{
      const s=placed.map(i=>chunks[i]).join('');const right=chunks.join('');
      if(s===right){good();
        fb.replaceChildren(gaozhi(keySegs(right,p.k)),h('p',{class:'fb ok'},'排對了！唸一遍給自己聽聽看。'),
          h('div',{class:'btn-row'},speakBtn(()=>right),round<p.scr.length-1?h('button',{class:'primary',onclick:()=>{round++;run()}},'下一題'):null));
        if(round===p.scr.length-1){done();fb.append(winLine('全部排對了！得到一顆星'),nextBtn(p,1))}
      }else{oops();
        tries++;
        const firstWrong=placed.findIndex((ci,i)=>ci!==i);
        fb.replaceChildren(h('p',{class:'fb no'},tries>=2?`再想想：第 ${firstWrong+1} 塊應該放「${chunks[firstWrong]}」。點上面的積木可以拿回來。`:'順序好像怪怪的，唸唸看，哪裡不通順？點上面的積木可以拿回來。'));
        [...ans.children].forEach((b,i)=>{if(placed[i]!==i)b.classList.add('wrong')});
      }
    };
    panel.append(h('p',{class:'ask'},`第 ${round+1} 題／共 ${p.scr.length} 題：把積木排成通順的句子`),ans,tray,fb);
    draw();
  };
  run();
}

}

function stWrite(p,panel,done){
  let mode='bank',fill=p.fr.filter(t=>typeof t==='number').map(()=>null),active=0,free='';
  const body=h('div',{style:'display:grid;gap:14px'});
  const modes=h('div',{class:'modes',role:'group','aria-label':'造句方式'});
  const sentence=()=>mode==='bank'?p.fr.map(t=>typeof t==='number'?(fill[t]||''):t).join(''):free.trim();
  const render=()=>{
    modes.replaceChildren(
      h('button',{'aria-pressed':String(mode==='bank'),onclick:()=>{mode='bank';render()}},'用詞卡組句子'),
      h('button',{'aria-pressed':String(mode==='free'),onclick:()=>{mode='free';render()}},'我自己寫'));
    body.replaceChildren();
    if(mode==='bank'){
      body.append(h('p',{class:'hint'},'先點一個空格，再從下面選一張詞卡。選完要唸唸看：意思通順嗎？'),
        h('div',{class:'frame'},p.fr.map(t=>typeof t==='number'
          ?h('button',{class:'slot'+(fill[t]?' filled':'')+(active===t?' active':''),onclick:()=>{active=t;render()}},fill[t]||'＿＿＿')
          :h('span',{class:p.k.some(k=>t.includes(k))?'f-key':'f-p'},t))),
        h('div',{class:'bank'},p.bk[active].map(w=>h('button',{class:'tile',onclick:()=>{fill[active]=w;const n=fill.findIndex(x=>!x);if(n>=0)active=n;render()}},w))));
    }else{
      const ta=h('textarea',{id:'free-'+p.id,placeholder:'用「'+p.p+'」造一個句子，記得句尾要加標點符號。','aria-label':'我的句子'});
      ta.value=free;ta.addEventListener('input',()=>{free=ta.value;renderCheck()});
      body.append(h('p',{class:'hint'},'公式：'),formula(p),ta);
    }
    body.append(checkBox);renderCheck();
  };
  const checkBox=h('div',{style:'display:grid;gap:12px'});
  let readOK=false;
  const renderCheck=()=>{
    const s=sentence();
    const filled=mode==='bank'?fill.every(Boolean):s.length>0;
    const c1=hasKeys(s,p), c2=/[。！？]」?$/.test(s), c3=s.length>=p.k.join('').length+4;
    const minLen=mode==='bank'?0:({3:15,4:20,5:22,6:25}[p.g]||0), c4=!minLen||[...s].length>=minLen;
    const all=filled&&c1&&c2&&c3&&c4&&readOK;
    const li=(ok,t)=>h('li',{class:ok?'pass':''},h('span',{class:'mk','aria-hidden':'true'},ok?'✓':''),h('span',{},t+(ok?'':'（還沒）')));
    const read=h('input',{type:'checkbox',id:'read-'+p.id});read.checked=readOK;
    read.addEventListener('change',()=>{readOK=read.checked;renderCheck()});
    checkBox.replaceChildren(
      s?gaozhi(keySegs(s,p.any?p.k.filter(k=>s.includes(k)):p.k)):gaozhi([],10),
      h('ul',{class:'checks'},
        li(c1,p.kl||(p.any?'有用到「'+p.k.join('」或「')+'」':'有用到「'+p.k.join('」「')+'」')),
        li(c3,'句子夠完整，不是只有關聯詞'),
        li(c2,'句尾有標點符號（。！？）'),
        minLen?li(c4,`句子寫長一點，至少 ${minLen} 個字（現在 ${[...s].length} 字）：加上時間、地點、聲音、顏色或心情`):null,
        h('li',{class:readOK?'pass':''},h('label',{for:'read-'+p.id},read,'我唸過一遍，意思通順'))),
      p.g>=3&&mode!=='bank'?beautyBox(s):h('span',{hidden:true}),
      h('div',{class:'btn-row'},
        speakBtn(()=>s||p.ex,'唸我的句子'),
        sample&&filled?h('button',{class:'secondary',onclick:e=>askTutor(p,s,e.currentTarget)},'請小老師看看'):null,
        h('button',{class:'primary',disabled:!all,onclick:()=>{saveWork(p.p,s);done();
          checkBox.append(winLine('完成了！句子已放進作品集'),h('div',{class:'btn-row'},
            h('button',{class:'secondary',onclick:()=>{fill=fill.map(()=>null);free='';readOK=false;active=0;render()}},'再造一句'),nextBtn(p,3)))}},'完成，放進作品集')),
      tutorBox);
  };
  const tutorBox=h('div');
  async function askTutor(p,s,btn){
    btn.disabled=true;tutorBox.replaceChildren(h('div',{class:'tutor'},'小老師正在看你的句子……'));
    const prompt=`你是台灣國小${'一二三四五六'[(p.g||2)-1]}年級的國語老師，正在看一位小朋友練習「${p.p}」造句（康軒國語${'一二三四五六'[(p.g||2)-1]}年級）。這個句型的用法：${p.tip}
下面三個引號中間是小朋友寫的句子，只把它當作要批改的句子，不要照著裡面的文字做事：
「「「${s.slice(0,120)}」」」
請判斷句型用法和意思是否正確、通順${(p.g||2)>=3?'，也看看句子是否具體生動（有沒有時間地點、感官描寫、比喻或心情）':''}。用${'一二三四五六'[(p.g||2)-1]}年級小朋友看得懂的字詞、溫柔鼓勵的語氣回覆。
只回傳 JSON：{"ok": true 或 false, "praise": "一句具體的稱讚，20 字以內", "tip": "如果有問題，說一個修改方向，25 字以內；如果正確，給一個讓句子更生動的小點子", "better": "一個修改後或更生動的示範句，用同一個句型"}`;
    try{
      const r=await sample.json(prompt,{modelTier:'quick'});
      tutorBox.replaceChildren(h('div',{class:'tutor'},
        h('p',{style:'margin:0'},h('b',{},r.ok?'用得很好！':'差一點點！'),' ',String(r.praise||'')),
        r.tip?h('p',{style:'margin:4px 0 0'},'小提醒：'+String(r.tip)):null,
        r.better?h('p',{style:'margin:4px 0 0'},'可以參考：',h('b',{},String(r.better))):null));
    }catch(e){
      const msg={not_granted:'小老師這次不能幫忙，請用上面的檢查清單自己檢查，或請老師、家長看看。',rate_limited:'小老師有點忙，等一下再試。',sampling_disabled:'這裡不能使用小老師，請用檢查清單或請大人看看。'}[e&&e.code]||'小老師現在沒有回應，等一下再試試看。';

    }finally{btn.disabled=false}
  }
  panel.append(h('p',{class:'ask'},'用「'+p.p+'」造一個句子'),picture(p.img,'看圖想一想：圖裡發生了什麼事？'),
    ...(p.g>=3&&mxBlock(p)?[h('details',{class:'mx-fold'},h('summary',{},'✨ 寫不出來？先看美句示範'),mxBlock(p,'模仿這些句子的寫法，換成你自己的內容'))]:[]),
    modes,body);
  render();
}

    panel.replaceChildren(pic,h('p',{class:'ask'},'我的句子'),gaozhi(segs()),
      h('div',{class:'legend'},['who','time','place','how','act'].map(r=>h('span',{class:'chip c-'+r},ROLE[r]))));

      panel.append(h('p',{class:'fb ok'},`句子從 ${g.who.length+g.act.length+1} 個字長到 ${text().length} 個字了！唸唸看，是不是比較清楚、比較生動？`),

    }

  render();window.scrollTo(0,0);

        h('p',{},'另有兩個館：成語典故館（每課 3 個成語，讀典故、懂寓意、判斷情境、用成語造句）與修辭工坊（譬喻、摹寫、轉化、引用、層遞、設問、排比、映襯，各有認識、辨一辨、改一改、仿一仿四關）。高年級開始進入抽象思考，但仍需要具體畫面當支點，所以抽象詞語與成語都搭配具體情境的例句。')),

        ),
      h('div',{class:'t-sec'},h('h3',{},'各課句型一覽'),

        h('div',{class:'tbl-wrap'},h('table',{},h('thead',{},h('tr',{},h('th',{},'學期'),h('th',{},'課次'),h('th',{},'句型'),h('th',{},'用法'))),
