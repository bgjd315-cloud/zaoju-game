const POYIN_DEF={"得": 1};
delete POYIN['一'];delete POYIN['不'];   // 課本標本調，不做變調
let zyPref=store.get('zjgf-zy','on');let zyGrade=2;
const VS_RE=/[\u{E0100}-\u{E01EF}]/u;
function zyText(s){
  const arr=[...s];let out='';
  for(let i=0;i<arr.length;i++){
    const c=arr[i];out+=c;const rs=POYIN[c];if(!rs)continue;
    let best=-1,bestLen=0;
    rs.forEach((pats,ri)=>pats.forEach(p=>{const k=p.indexOf('*');if(k<0)return;
      const pre=p.slice(0,k).replaceAll('*',c),post=p.slice(k+1).replaceAll('*',c);
      if(arr.slice(Math.max(0,i-[...pre].length),i).join('')===pre&&arr.slice(i+1,i+1+[...post].length).join('')===post&&p.length>bestLen){best=ri;bestLen=p.length}}));
    const pick=best>=0?best:(POYIN_DEF[c]||0);if(pick>0)out+=String.fromCodePoint(0xE01E0+pick);
  }
  return out;
}
const zyOn=()=>document.documentElement.classList.contains('zy');
function zyNode(n){if(n.nodeType===3){const v=n.nodeValue;if(v&&!VS_RE.test(v)&&/[㐀-鿿]/.test(v)){const z=zyText(v);if(z!==v)n.nodeValue=z}}else if(n.nodeType===1&&!/^(SCRIPT|STYLE|TEXTAREA|INPUT)$/.test(n.tagName)){n.childNodes.forEach(zyNode)}}
const zyObs=new MutationObserver(ms=>{if(!zyOn())return;for(const m of ms){if(m.type==='characterData')zyNode(m.target);else m.addedNodes.forEach(zyNode)}});
zyObs.observe(document.body,{childList:true,subtree:true,characterData:true});
function setGrade(g){
  zyGrade=g;const on=g<=3&&zyPref!=='off';
  document.documentElement.classList.toggle('zy',on);if(on)zyNode(document.body);
  const b=$('#zyBtn');if(b){b.hidden=g>3;b.textContent=zyPref==='off'?'注音關':'注音開';b.setAttribute('aria-pressed',String(zyPref!=='off'))}
}

function runChoice(box,items,opt){
  let i=0,right=0;const need=opt.pass;
  const draw=()=>{
    if(i>=items.length){const pass=right>=need;

function mxBlock(p,title){
  const list=(typeof MX!=='undefined'&&MX[p.id])||[];if(!list.length)return null;
  if(!title&&list.some(m=>m.bad))title='病句改改看：先找出哪裡不對，再看怎麼改';

    while(rest){let best=-1,bk='';for(const k of keys){const i=rest.indexOf(k);if(i>=0&&(best<0||i<best||(i===best&&k.length>bk.length))){best=i;bk=k}}
      if(best<0){out.push(rest);break}
      if(best)out.push(rest.slice(0,best));out.push(h('b',{class:'mx-key'},bk));rest=rest.slice(best+bk.length)}
    return out};
  return h('div',{class:'mx'},
    h('p',{class:'ask'},title||'美句示範：讀一讀，學一學'),

function stOrder(p,panel,done){
  let round=0;
  const run=()=>{
    panel.replaceChildren();
    const chunks=p.scr[round];
    let pool=shuffle(chunks.map((c,i)=>i));let guard=0;
    while(pool.every((v,i)=>v===i)&&guard++<10)pool=shuffle(pool);
    const placed=[];let tries=0;
    const ans=h('div',{class:'tray answer','aria-label':'排好的句子'});
    const tray=h('div',{class:'tray','aria-label':'積木'});
    const fb=h('div');
    const isKey=c=>p.k.some(k=>c.includes(k));
    const draw=()=>{
      ans.replaceChildren(...(placed.length?placed.map((ci,pos)=>h('button',{class:'tile'+(isKey(chunks[ci])?' k':''),onclick:()=>{placed.splice(pos,1);pool.push(ci);draw()}},chunks[ci])):[h('span',{class:'hint'},'點下面的積木，放到這裡')]));
      tray.replaceChildren(...pool.map((ci,pos)=>h('button',{class:'tile'+(isKey(chunks[ci])?' k':''),onclick:()=>{pool.splice(pos,1);placed.push(ci);draw();if(!pool.length)check()}},chunks[ci])));
    };
    const check=()=>{
      const s=placed.map(i=>chunks[i]).join('');const right=chunks.join('');
      if(s===right){good();
        fb.replaceChildren(gaozhi(keySegs(right,p.k)),h('p',{class:'fb ok'},'排對了！唸一遍給自己聽聽看。'),
          h('div',{class:'btn-row'},speakBtn(()=>right),round<p.scr.length-1?h('button',{class:'primary',onclick:()=>{round++;run()}},'下一題'):null));
        if(round===p.scr.length-1){done();fb.append(winLine('全部排對了！得到一顆星'),nextBtn(p,1))}
      }else{oops();
        tries++;
        const firstWrong=placed.findIndex((ci,i)=>ci!==i);
        fb.replaceChildren(h('p',{class:'fb no'},tries>=2?`再想想：第 ${firstWrong+1} 塊應該放「${chunks[firstWrong]}」。點上面的積木可以拿回來。`:'順序好像怪怪的，唸唸看，哪裡不通順？點上面的積木可以拿回來。'));
        [...ans.children].forEach((b,i)=>{if(placed[i]!==i)b.classList.add('wrong')});
      }
    };
    panel.append(h('p',{class:'ask'},`第 ${round+1} 題／共 ${p.scr.length} 題：把積木排成通順的句子`),ans,tray,fb);
    draw();
  };
  run();
}

        h('p',{style:'margin:0'},h('b',{},r.ok?'用得很好！':'差一點點！'),' ',String(r.praise||'')),

        r.better?h('p',{style:'margin:4px 0 0'},'可以參考：',h('b',{},String(r.better))):null));
    }catch(e){
      const msg={not_granted:'小老師這次不能幫忙，請用上面的檢查清單自己檢查，或請老師、家長看看。',rate_limited:'小老師有點忙，等一下再試。',sampling_disabled:'這裡不能使用小老師，請用檢查清單或請大人看看。'}[e&&e.code]||'小老師現在沒有回應，等一下再試試看。';
      tutorBox.replaceChildren(h('div',{class:'tutor'},msg));
      if(e&&['not_granted','sampling_disabled','not_declared','capability_disabled'].includes(e.code))sample=null;
    }finally{btn.disabled=false}
  }
  panel.append(h('p',{class:'ask'},'用「'+p.p+'」造一個句子'),picture(p.img,'看圖想一想：圖裡發生了什麼事？'),
    ...(p.g>=3&&mxBlock(p)?[h('details',{class:'mx-fold'},h('summary',{},'✨ 寫不出來？先看美句示範'),mxBlock(p,'模仿這些句子的寫法，換成你自己的內容'))]:[]),
    modes,body);
  render();
}

/* ============ 句子長大了 ============ */
function grow(bi){
  app.replaceChildren();setGrade(2);
  const g=GROW[bi];const pick={};let lastNew=null;
  app.append(h('button',{class:'back',onclick:home},'← 回到課次列表'),
    h('div',{class:'pat-head'},h('h2',{},'句子長大了'),h('span',{class:'from'},'人、事、時、地，一步一步加上去')),
    h('div',{class:'bases',style:'margin-block:14px'},h('span',{class:'hint'},'從哪個句子開始？'),GROW.map((x,i)=>h('button',{class:'ghost','aria-pressed':String(i===bi),style:i===bi?'border-color:var(--grid-strong);font-weight:700':'',onclick:()=>grow(i)},x.who+x.act))));
  const panel=h('section',{class:'panel'});app.append(panel);
  const pic=picture(g.img);
  const segs=()=>{
    const out=[];const add=(t,r)=>{if(t)out.push(...[...t].map(c=>({t:c,cls:'r-'+r+(lastNew===r?' new':'')})))};
    add(pick.time,'time');add(pick.who,'who');add(g.who,'who');add(pick.place,'place');add(pick.how,'how');add(g.act,'act');out.push({t:'。',cls:''});
    return out;
  };
  const text=()=>[pick.time,pick.who,g.who,pick.place,pick.how,g.act].filter(Boolean).join('')+'。';
  const render=()=>{
    panel.replaceChildren(pic,h('p',{class:'ask'},'我的句子'),gaozhi(segs()),
      h('div',{class:'legend'},['who','time','place','how','act'].map(r=>h('span',{class:'chip c-'+r},ROLE[r]))));
    g.steps.forEach((s,i)=>{
      const open=i===0||pick[g.steps[i-1].r];
      if(!open)return;
      panel.append(h('div',{class:'grow-step'},h('h3',{},h('span',{class:'chip c-'+s.r},ROLE[s.r]),s.lab),
        h('div',{class:'bank'},s.o.map(o=>h('button',{class:'tile'+(pick[s.r]===o?' pick':''),onclick:()=>{pick[s.r]=o;lastNew=s.r;render()}},o)))));
    });
    if(g.steps.every(s=>pick[s.r])){
      panel.append(h('p',{class:'fb ok'},`句子從 ${g.who.length+g.act.length+1} 個字長到 ${text().length} 個字了！唸唸看，是不是比較清楚、比較生動？`),
        h('div',{class:'btn-row'},speakBtn(text),h('button',{class:'primary',onclick:e=>{saveWork('句子長大了',text());e.currentTarget.disabled=true;e.currentTarget.textContent='已放進作品集';markDone('grow-'+bi,0)}},'放進作品集'),
          h('button',{class:'secondary',onclick:()=>grow((bi+1)%GROW.length)},'換一個句子')));
    }
  };
  render();window.scrollTo(0,0);
}

 ['up05-yibian','上','第五課 坐竹籃船','一邊……一邊……',['he','dad'],'假日在湖上划船，爸爸一邊划船一邊唱歌，小禾一邊吃冰棒一邊看風景。','爸爸一邊划船，一邊唱歌。小禾一邊吃冰棒，一邊看風景。','晴朗假日的湖面，一艘木頭小船。爸爸坐在船尾划槳，嘴巴張開正在唱歌，旁邊飄著音符。小禾坐在船頭，一手拿著冰棒在吃，一邊轉頭看著湖邊的山和樹，水面有白鵝。'],
 ['up06-chuleye','上','第六課 小鎮的柿餅節','除了……也……',['he','mom'],'秋天的柿餅市集，小禾一手提著一袋柿餅，另一手拿著麻糬咬了一口。','小禾除了買柿餅，也買了麻糬。','秋天熱鬧的客家小鎮市集，攤位上擺滿一籃一籃橘紅色的柿子和柿餅，陽光金黃。小禾一手提著一袋柿餅，另一手拿著一顆白白的麻糬咬了一口，臉頰鼓鼓的很滿足。媽媽在旁邊付錢。'],
 ['up07-mingming','上','第七課 國王的新衣裳','明明……怎麼……',['gpa','he'],'阿公的眼鏡明明掛在額頭上，他卻翻遍抽屜到處找眼鏡，小禾在一旁偷笑。','阿公明明把眼鏡戴在頭上，怎麼還在找眼鏡呢？','客廳裡，阿公彎著腰拉開櫃子抽屜，東翻西找，表情困惑。他的老花眼鏡其實就推在他自己的額頭上。小禾站在旁邊用手摀著嘴偷笑，手指著阿公的額頭。'],
 ['up08-weile','上','第八課 「聰明」的小熊','……為了……',['le','mom'],'阿樂站在小凳子上，踮起腳尖伸長手，想拿書架最上層的故事書，媽媽在旁邊扶著凳子。','阿樂為了拿到最上面的故事書，站到小凳子上。','家裡的書房，一座高高的木頭書架。阿樂站在一張穩固的小凳子上，踮起腳尖、伸長手臂，指尖快碰到最上層一本紅色封面的故事書。媽媽在旁邊用雙手扶穩凳子，抬頭看著他。'],
 ['up09a-jingran','上','第九課 大象有多重？','……竟然……',['he'],'公園地上，一隻小螞蟻扛著比自己大好多倍的餅乾，小禾蹲著看，驚訝得張大嘴巴。','小小的螞蟻，竟然搬得動一大塊餅乾！','公園草地旁的石板路，近景特寫。一隻小螞蟻高高扛著一塊比牠身體大好多倍的圓形餅乾往前走。小禾蹲在旁邊，雙手捧著臉頰，眼睛睜得大大、嘴巴張成圓形，非常驚訝。'],
 ['up09b-shouxian','上','第九課 大象有多重？','首先……接著……然後……最後……',['he'],'四格圖：小禾種花的四個步驟（挖洞、放種子、蓋上土、澆水）。','首先挖一個洞，接著放進種子，然後蓋上泥土，最後澆一點水。','一張圖分成田字形的四格小圖，格子之間用白色粗線分開，格子裡不要有數字。依照左上、右上、左下、右下的順序：第一格小禾用小鏟子在花盆裡挖一個小洞；第二格小禾把一顆種子放進洞裡；第三格小禾用手把泥土蓋上；第四格小禾拿著小澆水壺澆水。四格裡的小禾和花盆要一模一樣。'],
 ['up10-suiran','上','第十課 新年樂','雖然……但是……',['he','dou'],'下雨天，小禾和豆豆雖然淋得溼答答，但是穿著雨鞋在水坑裡踩水花，笑得好開心。','雖然下雨了，但是小禾和豆豆玩得很開心。','下著毛毛雨的社區小公園，天空灰灰的。小禾和豆豆穿著雨衣和雨鞋，頭髮被雨淋溼了，正開心的在水坑裡踩出大大的水花，兩人都笑得很燦爛。'],
 ['up11-jiuxiang','上','第十一課 遠方來的黑皮','……就像……',['he','le'],'冬天的河口溼地，一群黑面琵鷺張開白色翅膀飛起來，小禾和阿樂拿望遠鏡觀察。','黑面琵鷺張開翅膀，就像在空中跳舞。','台灣冬天的河口溼地，水面映著藍天。幾隻黑面琵鷺張開雪白的翅膀優雅的飛起來，牠們有黑色湯匙狀的長嘴和黑色的臉。前景的木棧道上，小禾和阿樂拿著望遠鏡專心觀察。'],
 ['up12-rangwo','上','第十二課 我愛冬天','……讓我想到……，啊！多……呀！',['he','dou','mom'],'寒冷的冬天早晨，小禾和豆豆捧著熱豆漿，說話時嘴巴冒出白煙。','冬天讓我想到熱熱的豆漿，啊！多暖和呀！','寒冷冬天的早晨，早餐店的騎樓下，小禾和豆豆穿著厚厚的羽絨外套，圍著圍巾，雙手捧著冒著熱氣的豆漿杯。兩人說話時嘴巴吐出白白的霧氣，臉頰紅紅的。媽媽在後面買燒餅。'],
 ['down01-yiyan','下','第一課 春天的顏色','……一眼就看見……',['mochi'],'春天早上，麻糬從狗屋跑出來，一眼就看見滿院子黃色的油菜花和蝴蝶。','麻糬跑出狗屋，一眼就看見黃黃的油菜花。','春天的早晨，鄉下房子的前院。麻糬正從木頭狗屋裡衝出來，耳朵豎起、眼睛發亮。院子外面是一大片金黃色的油菜花田，幾隻白色蝴蝶在花上飛。'],
 ['down02a-yinwei','下','第二課 花衣裳','因為……所以……',['he','mom'],'放學下大雨，小禾忘了帶傘，站在校門口屋簷下發愁；媽媽撐著傘走過來接她。','因為小禾忘了帶雨傘，所以媽媽來學校接她。','放學時下著大雨的國小校門口。小禾背著書包站在屋簷下，雙手空空沒有雨傘，眉頭皺皺的看著雨。媽媽撐著一把大傘、手上還拿著一把小傘，正從雨中走向她。'],
 ['down02b-fengong','下','第二課 花衣裳','分工合作，……很快就……',['he','dou','mom','dad'],'全家一起包水餃：爸爸桿皮、媽媽包餡、小禾和豆豆把水餃排整齊。','我們分工合作，爸爸桿皮，媽媽包餡，我排水餃，水餃很快就包好了。','溫暖的家中餐桌，全家一起包水餃。爸爸用桿麵棍桿水餃皮，媽媽把餡料包進皮裡，小禾把包好的水餃一顆顆排在盤子上，豆豆站在椅子上幫忙數。桌上已經排了好多整齊的水餃。'],
 ['down03-babei','下','第三課 彩色王國','……把……／……被……',['he','mochi'],'公園裡一陣大風，把小禾的草帽吹到樹枝上，小禾和麻糬抬頭看。','風把小禾的帽子吹到樹上。小禾的帽子被風吹到樹上。','颳著大風的公園，樹葉和小草都往同一邊飄，畫面有風的線條。小禾的草帽被風吹到一棵大樹的樹枝上掛著。小禾按著頭髮、抬頭張嘴看著帽子，麻糬也抬頭對著樹叫。'],
 ['down04-dang','下','第四課 爸爸','當……的時候，……',['he','dou'],'操場上豆豆跌倒了，小禾馬上跑過去，蹲下來扶他起來。','當豆豆跌倒的時候，小禾馬上扶他起來。','學校操場旁的草地。豆豆跌坐在地上，膝蓋有點擦傷，眼眶含著淚。小禾蹲在他身邊，一手扶著他的手臂，一手輕拍他的背，表情很關心。'],
 ['down05-buguan','下','第五課 我的家人','不管……都……',['gpa','mochi'],'三格圖：晴天、下雨天、颳風天，阿公每天早上都帶著麻糬去公園散步。','不管晴天還是下雨，阿公都會帶麻糬去散步。','一張圖分成橫排三格，格子之間用白色粗線分開。三格都是同一個公園的早晨，阿公牽著麻糬散步：左格是大太陽的晴天；中格是下雨天，阿公撐著傘；右格是颳大風的天，樹葉亂飛，阿公壓著帽子。三格裡阿公和麻糬都在走路、表情開心。'],
 ['down06-zhongyu','下','第六課 愛笑的大樹','……終於……',['dou','dad'],'豆豆練騎腳踏車，地上散著摔倒過的痕跡，這次他終於騎起來了，爸爸在後面拍手。','豆豆練習了好多次，終於學會騎腳踏車了！','社區公園的步道。豆豆戴著安全帽，膝蓋貼著兩片OK繃，正穩穩的騎著小腳踏車往前，臉上笑得非常開心、很驕傲。爸爸在後面放開手，高興的拍手歡呼。'],
 ['down07-chuledou','下','第七課 月光河','除了……都……',['le','he'],'放學排隊遇到下雨，大家都撐著雨傘，只有阿樂穿著雨衣沒撐傘。','除了阿樂，大家都撐著雨傘。','下雨天的放學路隊，一排小學生走在人行道上。隊伍裡每個小朋友都撐著不同顏色的雨傘，只有阿樂沒有撐傘，穿著一件透明雨衣，戴著雨衣帽子。小禾撐著紅色雨傘走在他前面。'],
 ['down08-ruguo','下','第八課 黃狗生蛋','如果……就……',['he','mom'],'週末早上，小禾提著野餐籃站在窗邊，看著外面烏雲密布，表情擔心。','如果下雨了，我們就不能去野餐了。','週末早上的客廳，小禾提著一個藤編野餐籃，站在大窗戶前。窗外天空布滿厚厚的灰色烏雲，樹被風吹得搖晃。小禾嘟著嘴、眉頭皺起來，很擔心。媽媽在後面準備三明治。'],
 ['down09-buran','下','第九課 神筆馬良','……不然……',['he','mom'],'早上鬧鐘響了，小禾還縮在被窩裡；媽媽在房門口指著時鐘叫她起床。','快起床，不然就要遲到了！','早晨陽光照進臥室。床頭的鬧鐘正在響（畫出震動的線條，鐘面不要有數字）。小禾整個人縮在棉被裡只露出頭，睡眼惺忪。媽媽站在房門口，一手叉腰，一手指著牆上的時鐘（鐘面不要有數字）。'],
 ['down11-budan','下','第十一課 小讀者樂園','不但……而且……',['mochi','he'],'麻糬嘴裡叼著球，同時舉起前腳跟小禾握手。','麻糬不但會握手，而且會撿球。','家門前的草坪。麻糬坐得端正，嘴裡叼著一顆紅色小球，同時抬起一隻前腳放在小禾的手心上握手。小禾蹲著，開心的稱讚牠。'],
 ['down12-ru','下','第十二課 巨人山','……如……，……像……，……和……一樣',['gpa'],'阿公的半身特寫，讓孩子找出三個特色來比喻：白白的濃眉毛、圓圓的大肚子、哈哈大笑的大嘴巴。','阿公的眉毛如白白的雪，肚子像一顆大西瓜，笑聲和打雷一樣大。','阿公的半身特寫肖像，背景是簡單的淺色牆面。突出他的三個特色：一對又白又濃的眉毛、圓滾滾像西瓜的大肚子、正仰頭哈哈大笑張大的嘴巴。表情溫暖可愛，有點誇張的漫畫感。'],
 ['grow-1','extra','加分遊戲 句子長大了','小狗跑來跑去',['mochi'],'放學後的公園，麻糬開心的在草地上跑來跑去。','放學後，可愛的小狗在公園裡開心的跑來跑去。','傍晚夕陽下的公園草地，麻糬搖著尾巴、耳朵飛起來，開心的在草地上跑來跑去，身後有跑動的線條。遠處有溜滑梯。'],
 ['grow-2','extra','加分遊戲 句子長大了','弟弟畫畫',['dou'],'下雨天，豆豆趴在客廳地板的大紙上用彩色筆畫畫。','下雨天，愛笑的弟弟在客廳的大紙上認真的畫畫。','下雨天的客廳，窗外有雨滴。豆豆趴在地板上一張很大的白紙上，手拿彩色筆認真畫畫，旁邊散著好多支彩色筆，紙上畫著彩色的恐龍和太陽。'],
 ['grow-3','extra','加分遊戲 句子長大了','小鳥唱歌',[],'清晨，一隻藍色小鳥站在窗前的樹枝上唱歌。','每天早上，藍色的小鳥在我的窗前快樂的唱歌。','清晨的陽光，從房間窗戶往外看，一根開著小白花的樹枝上站著一隻藍色小鳥，抬頭張嘴唱歌，旁邊飄著幾個音符。'],
];
// 三年級情境圖（角色升上三年級，九歲）
const G3NOTE='（小禾和阿樂現在是三年級，九歲，比二年級時高一點；豆豆六歲。）';
ITEMS.push(...[
 ['g3u01-yiwen','3上','三上第一課 心的悄悄話','陳述句・疑問句',['he','mom'],'小禾站在窗邊，指著窗外越來越黑的烏雲，轉頭問媽媽問題。','媽媽，等一下是不是會下雨呢？','客廳的大窗戶旁，窗外天空布滿越來越黑的烏雲。小禾一手指著窗外，轉頭看著正在摺衣服的媽媽，表情好奇、像在發問。'],
 ['g3u02-suiran','3上','三上第二課 妙故事點點名','雖然……可是……',['le'],'籃球場上，個子最矮的阿樂跳起來投籃，球漂亮的進了籃框，旁邊高個子同學都看呆了。','雖然阿樂的個子不高，可是他投籃很準。','學校的戶外籃球場。阿樂是場上個子最矮的孩子，他跳起來投籃，籃球正好落進籃框。旁邊幾個比他高很多的同學張大嘴巴看著，表情驚訝。'],
 ['g3u03-youyu','3上','三上第三課 繞口令村','由於……因此……',['he','dou','mom','dad'],'颱風天窗外狂風暴雨，全家人待在客廳一起玩桌遊。','由於颱風來了，因此今天不用上學，全家在家玩桌遊。','颱風天的白天，窗外狂風暴雨，樹被吹得彎腰，玻璃上都是雨水。屋內溫暖明亮，小禾、豆豆、爸爸、媽媽圍坐在地毯上玩桌遊，大家笑得很開心。'],
 ['g3u04-yijiu','3上','三上第四課 小丑魚和海葵','一……就……',['dou'],'冰淇淋車的音樂從巷口傳來，豆豆一聽到，就丟下玩具衝出家門。','豆豆一聽到冰淇淋車的音樂，就衝出家門。','住宅巷口停著一輛小小的冰淇淋車，旁邊飄著音符。豆豆剛從家門衝出來，手裡的玩具恐龍還在半空中掉落，他張大嘴巴、伸長手往冰淇淋車跑。'],
 ['g3u05-ganqi','3上','三上第五課 飛舞的絲帶','感嘆句・祈使句',['he','le'],'校慶晚會的夜空放起煙火，小禾張開雙手驚嘆；一旁的老師舉起手，提醒大家坐好、不要推擠。','這場煙火好美啊！請大家坐好，不要推擠。','學校操場的晚上，天空綻放五顏六色的煙火。小禾抬頭張開雙手，一臉驚喜讚嘆；阿樂坐在她旁邊仰頭看。畫面一側，一位女老師舉起一隻手、比出安靜坐好的手勢。'],
 ['g3u06-fenhao','3上','三上第六課 小女生','分號連起來的並列句',['he','le'],'左右分成兩半的對照畫面：左邊阿樂在操場踢足球，右邊小禾在圖書館看書。','阿樂在操場踢足球；小禾在圖書館看書。','一張圖從中間用白色粗線分成左右兩格。左格：陽光下的學校操場，阿樂正在用力踢足球。右格：安靜的學校圖書館，小禾坐在書架旁專心看書。兩格的構圖大小對稱。'],
 ['g3u07-tongshi','3上','三上第七課 淡水小鎮','仿寫童詩：是在……還是在……？',['he'],'黃昏的河邊，一隻白鷺鷥站在水裡一動也不動，小禾坐在岸邊托著下巴看著牠。','白鷺鷥哪！你站在水裡一動也不動，是在等小魚，還是在看夕陽？','黃昏的河岸，夕陽把河面染成金黃色。一隻白鷺鷥單腳站在淺水裡，一動也不動。小禾坐在岸邊的石階上，雙手托著下巴，好奇的看著白鷺鷥，畫面安靜有詩意。'],
 ['g3u08-youyou','3上','三上第八課 安平古堡參觀記','有……有……還有……',['he','le'],'熱鬧的夜市裡，三個攤位一字排開：雞排、雞蛋糕、珍珠奶茶，小禾和阿樂看得眼睛發亮。','夜市裡有許多小吃：有香噴噴的雞排，有甜甜的雞蛋糕，還有冰涼的珍珠奶茶。','台灣夜市的晚上，燈泡串成一排暖黃色的光。三個小吃攤並排，分別是炸雞排、雞蛋糕、珍珠奶茶，招牌不要有文字。小禾和阿樂站在攤位前，眼睛發亮、口水快流下來。'],
 ['g3u09-xingrong','3上','三上第九課 馬太鞍的巴拉告','加上形容詞',['he'],'清澈的溪邊長著翠綠的竹子，水裡有一群銀色的小魚，小禾蹲在石頭上看。','清澈的溪水裡，一群銀色的小魚游來游去。','花東山邊一條清澈見底的小溪，岸邊長著一排筆直翠綠的竹子。水裡有一群閃著銀光的小魚，底下是圓圓的鵝卵石。小禾蹲在溪邊大石頭上，低頭專心看小魚。'],
 ['g3u10-biaoqing','3上','三上第十課 狐狸的故事','說話加上表情和動作',['dou','mochi'],'豆豆的積木城堡被撞倒了，他跺著腳、雙手握拳生氣；麻糬在旁邊低著頭，一臉心虛。','豆豆跺著腳，氣呼呼的說：「是誰把我的積木弄倒的？」','客廳地板上散落一堆倒塌的彩色積木。豆豆站在積木旁邊，雙手握拳、一隻腳跺地、臉頰氣得鼓起來。麻糬趴在旁邊，耳朵垂下、眼睛往旁邊看，一臉心虛。'],
 ['g3u11-miande','3上','三上第十一課 巨人的花園','……免得……',['he','mom'],'早上出門前，媽媽把一把摺疊傘塞進小禾的書包側袋，窗外是灰灰的天空。','媽媽幫我帶了一把傘，免得我被雨淋溼。','早晨的家門口玄關。小禾背著書包準備出門，媽媽彎腰把一把摺疊傘塞進書包側邊的口袋。門外的天空灰灰的，像快要下雨。'],
 ['g3u12-wanzheng','3上','三上第十二課 小王子','把句子說完整',['gpa'],'清晨的公園裡，阿公和幾位長輩一起打太極拳。','阿公每天早上都在公園裡打太極拳。','清晨淡淡陽光的社區公園，草地上有幾位長輩在打太極拳。最前面的阿公穿著白色汗衫，雙手緩緩推出，表情專注又放鬆。'],
 ['g3d01-shi','3下','三下第一課 許願','……使……',['he'],'小禾把一盆向日葵放到窗邊，原本暗暗的房間一下子變得明亮又有精神。','窗邊多了一盆向日葵，使房間變得好有精神。','小禾的房間，她雙手捧著一盆盛開的向日葵，正放到窗臺上。陽光照進來，房間變得明亮溫暖，向日葵金黃色的花瓣很顯眼。'],
 ['g3d02-wugan','3下','三下第二課 下雨的時候','用五種感官描寫',['he'],'下雨天，小禾站在屋簷下伸手接雨水，閉著眼睛深呼吸，好像在聞雨的味道。','我伸手接住雨水，冰冰涼涼的，還聞到青草的味道。','下著小雨的鄉下屋簷下，雨水一滴一滴從屋簷落下。小禾一手伸出去接雨水，閉著眼睛、仰起頭深深吸氣，表情很舒服。旁邊有綠油油的草地和水窪。'],
 ['g3d03-liangci','3下','三下第三課 遇見美如奶奶','量詞',['gpa'],'阿公的書桌近景：桌上有一副眼鏡、一束花、一本書、一盞檯燈和一杯茶。','阿公的桌上有一副眼鏡、一束花和一本書。','溫暖的木頭書桌近景，桌上清楚擺著：一副老花眼鏡、一束插在瓶子裡的花、一本攤開的書、一盞檯燈、一杯冒著熱氣的茶。阿公坐在桌子後面微笑。每樣東西分開擺放，容易數清楚。'],
 ['g3d04-ruguo','3下','三下第四課 工匠之祖','如果……就……',['he'],'小禾背著重重的書包，頭上的想像泡泡裡，她背著長了翅膀、會自己飛的書包。','如果我發明會飛的書包，就不用背得那麼累了。','上學路上，小禾背著一個鼓鼓的重書包，彎著腰、表情很累。她頭上方飄著一個想像泡泡，泡泡裡的她輕鬆的走著，書包長出一對小翅膀，自己飛在她旁邊。'],
 ['g3d05-zhongyu','3下','三下第五課 學田鼠開路','……終於……',['le'],'阿樂練溜直排輪，膝蓋貼著 OK 繃，這次終於穩穩的滑出去，高興的舉起雙手。','經過好多次練習，阿樂終於學會溜直排輪了。','社區廣場的平地上。阿樂穿著直排輪、戴著安全帽和護膝，膝蓋上貼著兩片 OK 繃，正穩穩的往前滑，雙手高舉、臉上笑得非常開心。地上有幾個小小的跌倒痕跡線條。'],
 ['g3d06-yubing','3下','三下第六課 神奇密碼','語病診所：竟然・如果',['he'],'陽臺上一株小小的番茄苗，竟然結了滿滿的紅番茄，小禾驚訝得張大嘴巴。','這株小小的番茄苗，竟然結了好多顆番茄！','家裡的陽臺，一個小花盆裡種著一株不高的番茄苗，卻掛滿了一顆顆紅通通的小番茄。小禾蹲在旁邊，雙手摀著臉頰、眼睛睜得大大的，非常驚訝。'],
 ['g3d07-diezi','3下','三下第七課 油桐花‧五月雪','疊字讓動作更清楚',['he','le'],'五月的山上，白色的油桐花紛紛落下，好像在下雪；小禾和阿樂站在步道上遠遠望去。','白色的油桐花紛紛落下，我們遠遠望去，好像在下雪。','五月台灣的山林步道，兩旁的油桐樹開滿白色的花，花朵一朵朵從空中飄落，地上也鋪滿白花，像下過雪。小禾和阿樂站在步道上，抬頭往遠方望去，伸手接住飄下來的花。'],
 ['g3d08-jinyi','3下','三下第八課 大自然的美術館','近義詞：特地・特別',['gpa','he'],'阿公提著一籃水果站在家門口，小禾開門看到阿公，開心的撲過去。','阿公特地從鄉下帶了一籃水果來看我。','家門口，阿公戴著草帽、提著一個裝滿芒果和香蕉的竹籃，笑咪咪的站著。小禾剛打開門，開心的張開雙手撲向阿公。背景可以看到門外停著一台機車。'],
 ['g3d09-budan','3下','三下第九課 臺灣的山椒魚','不但……還……',['he','le'],'學校的空拍感畫面：一邊是很大的操場，另一邊有一座小農場，小禾和阿樂在菜園裡澆水。','我們學校不但有很大的操場，還有一座小農場。','從高處往下看的學校校園：畫面左邊是一個很大的紅色跑道操場，右邊是一塊種滿蔬菜的小農場。小禾和阿樂在農場裡，一個拿澆水壺、一個蹲著拔草。'],
 ['g3d10-lianxu','3下','三下第十課 漁夫和金魚','連續動作',['he'],'三格連續圖：小禾打開冰箱、拿出牛奶、把牛奶倒進杯子。','小禾打開冰箱，拿出牛奶，倒了滿滿一杯。','一張圖分成橫排三格，格子之間用白色粗線分開，格子裡不要有數字。三格都是同一個廚房：左格小禾打開冰箱門；中格小禾手上拿著一瓶牛奶；右格小禾把牛奶倒進玻璃杯，杯子快滿了。三格裡的小禾一模一樣。'],
 ['g3d11-zhiyou','3下','三下第十一課 聰明的鼠鹿','只有……才……',['le','dad'],'遊樂園入口，工作人員在剪票，大家拿著票排隊進場；阿樂翻著口袋找票，爸爸把票拿給他。','只有買了票的人，才可以進去玩。','遊樂園的入口大門，背景有摩天輪和雲霄飛車，招牌不要有文字。排隊的人手上都拿著門票，工作人員站在閘門前驗票。阿樂在隊伍裡著急的翻口袋，爸爸在旁邊笑著把兩張票遞給他。'],
 ['g3d12-shihaishi','3下','三下第十二課 還要跌幾次','是……還是……',['he'],'冰淇淋店的櫃檯前，小禾看著草莓和巧克力兩種口味，歪著頭猶豫不決。','你是想吃草莓口味，還是巧克力口味？','冰淇淋店的玻璃櫃檯，裡面有粉紅色的草莓冰淇淋和咖啡色的巧克力冰淇淋，櫃檯沒有任何文字標籤。小禾站在櫃檯前，一手指著草莓、眼睛看著巧克力，歪著頭、皺著眉頭，很難決定。店員微笑等她。'],
].map(it=>{it[7]=it[7]+G3NOTE;return it}));

// 四年級情境圖（角色升上四年級，十歲）：畫面放進該課要學的字詞，讓孩子看圖找詞、用詞造句

ITEMS.push(...[
 ['g4u01-shuilu','4上','四上第一課 水陸小高手','耳旁、女旁：聆聽・姿勢',['he','le'],'游泳課，小禾在泳池裡游自由式，姿勢漂亮；阿樂在池邊側著耳朵，專心聆聽教練的哨聲。','小禾游泳的姿勢很漂亮，阿樂專心聆聽教練說話。','明亮的室內游泳池。小禾戴著泳帽、蛙鏡，在水道中游自由式，水花漂亮。池邊的阿樂穿著泳褲、披著毛巾，側著頭、手放在耳朵旁，專心聆聽一位拿著哨子的教練說話。'],
 ['g4u02-fangxue','4上','四上第二課 放學後','警／驚、幸／辛：感官描寫',['he','dou','mom'],'小禾放學一進門，桌上擺著香氣撲鼻的奶油餅乾、層次分明的千層糕和熱騰騰的紅豆湯。','回到家，桌上有香氣撲鼻的餅乾和熱騰騰的紅豆湯，真幸福！','傍晚的家中餐桌。小禾背著書包剛走進家門，眼睛發亮、用鼻子聞香味。桌上擺著一盤奶油餅乾、一塊層次分明的千層糕、一碗冒著熱氣的紅豆湯。豆豆已經坐在椅子上吃點心，媽媽在旁邊微笑。'],
 ['g4u03-lanqiu','4上','四上第三課 我的籃球夢','熟／熱、彈的多音',['le'],'夕陽下的籃球場，阿樂滿頭大汗、熱情的練習投籃，場邊同學熱烈歡呼。','阿樂熱情的練習投籃，動作越來越熟練。','夕陽下的戶外籃球場。阿樂穿著球衣，滿頭大汗，正跳起來投籃，球在空中劃出弧線。場邊三位同學舉手熱烈歡呼，地上有一個水壺和毛巾。'],
 ['g4u04-majie','4上','四上第四課 永遠的馬偕','皆的字族：階梯・和諧',['he','dad','mom'],'淡水老街附近的石階梯，小禾和爸媽沿著階梯往上走，坡上是一棟紅磚老建築，畫面和諧安靜。','我們沿著長長的階梯往上走，看到一棟紅磚老房子。','台灣淡水風格的老街坡道，一段長長的石頭階梯通往坡上，坡上有一棟有拱廊的紅磚老建築（不要畫任何真實人物的肖像，也不要有文字招牌）。小禾和爸爸媽媽手牽手沿著階梯往上走，遠處可以看到河口和夕陽。'],
 ['g4u05-guangming','4上','四上第五課 假如給我三天光明','毛部：毯・毽・毫；觸覺',['he','mochi'],'小禾用布矇住眼睛，用手摸柔軟的地毯、羽毛毽子和麻糬的毛，用觸覺認識東西。','我閉上眼睛，用手摸到柔軟的地毯和毛茸茸的毽子。','溫暖的客廳地板上鋪著一張柔軟的毛地毯。小禾用一條布輕輕矇住眼睛，跪坐著，一手摸著一個插著彩色羽毛的毽子，另一手摸著趴在旁邊的麻糬的白毛，臉上露出專心又好奇的微笑。'],
 ['g4u06-gaofeng','4上','四上第六課 攀登生命的高峰','頂的詞語：山頂；千變萬化',['le','dad'],'清晨，阿樂和爸爸站在山頂，看著千變萬化的雲海和日出，遠方有深深的山谷。','我們站在山頂，看見千變萬化的雲海。','清晨的高山山頂，阿樂和爸爸背著登山背包、拿著登山杖站在岩石上。眼前是一片翻騰的雲海，太陽正從雲海中升起，天空由紫轉橘。遠處山巒之間有深深的山谷。'],
 ['g4u07-meiwei','4上','四上第七課 美味的一堂課','酉部：醬・醋・配；嘆詞',['he','le'],'料理教室裡，小禾和阿樂一起調配醬料，桌上有醬油、醋和各種造型的義大利麵，阿樂驚訝的「哇」了一聲。','哇！沒想到義大利麵竟然有這麼多種造型！','明亮的料理教室，小禾和阿樂穿著圍裙站在料理台前。小禾正把一小匙醋倒進碗裡調配醬料，桌上有醬油瓶、醋瓶（瓶子上不要有文字）。旁邊的盤子裡擺著螺旋、蝴蝶結、貝殼等各種造型的義大利麵，阿樂張大嘴巴一臉驚訝。'],
 ['g4u08-changjinglu','4上','四上第八課 建築界的長頸鹿','塔／搭、建築的兩種意思',['he','dad'],'城市裡一棟棟高聳入雲的大樓，像長頸鹿一樣抬著頭；小禾仰頭看，想像大樓變成了長頸鹿。','高聳入雲的大樓，就像建築界的長頸鹿。','現代城市的街道，幾棟非常高的摩天大樓聳入雲端（不要畫成任何真實的知名大樓，也不要有文字）。小禾站在人行道上仰頭看，頭上方飄著一個想像泡泡，泡泡裡是一隻和大樓一樣高的長頸鹿。爸爸在旁邊指著大樓。'],
 ['g4u09-jiaxiang','4上','四上第九課 請到我的家鄉來','堤／提／題；熱鬧／清靜',['he','le'],'清晨熱鬧的水上市場，許多小船載著水果和花在河上交易；遠處是清靜的寺廟和河堤。','清晨的水上市場好熱鬧，遠處的寺廟卻很清靜。','東南亞風格的清晨水上市場，河面上擠滿小木船，船上堆滿熱帶水果和鮮花，戴斗笠的船家互相交易。小禾和阿樂坐在一艘小船上好奇的看著。遠方的河堤上有一座安靜的金色屋頂寺廟，招牌不要有文字。'],
 ['g4u10-qihuan','4上','四上第十課 奇幻旋律','扁的字族：翩翩；山水四字詞語',['he','le'],'小禾和阿樂坐在一張飛天魔毯上，翩翩飛過青山綠水和依山傍水的小村莊。','我們坐著魔毯，翩翩飛過青山綠水。','一張有花紋的飛天魔毯在空中飛翔，小禾和阿樂坐在上面，頭髮被風吹起，開心的往下看。下方是一片青山綠水：連綿的翠綠山巒、彎彎的河流，河邊有一座依山傍水的小村莊。'],
 ['g4u11-tuzi','4上','四上第十一課 兔子先生等等我','皿部：盆・盒；深不見底',['he'],'花園裡，小禾追著一隻拿著懷錶、穿著背心的兔子，兔子跳進一個深不見底的洞；旁邊有花盆和翻倒的點心盒。','小禾追著兔子，跑到一個深不見底的洞旁邊。','奇幻的花園草地，一隻穿著背心、手拿懷錶的白兔正急急忙忙跳進一個樹根下深不見底的黑洞。小禾彎著腰、伸手往洞裡看，表情好奇又緊張。旁邊有一個陶土花盆和一個打開的點心盒。原創畫風，不要模仿任何電影或卡通的角色設計。'],
 ['g4u12-xiejiang','4上','四上第十二課 老鞋匠和小精靈','鐘／鍾；摹聲詞：滴答',['gpa'],'深夜的鞋店工作坊，牆上時鐘滴答滴答，幾個小精靈在桌上縫鞋、敲鐵鎚；老鞋匠躲在門後偷看。','深夜裡，時鐘滴答滴答響，小精靈正忙著做鞋子。','深夜的老鞋店工作坊，燭光溫暖。牆上掛著一個老式時鐘（鐘面不要有數字）。工作桌上有三個戴尖帽的小精靈，一個拿針線縫皮革、一個舉著小鐵鎚敲鞋底、一個抱著一隻新鞋。一位白眉毛的老鞋匠（長得像阿公）穿著圍裙躲在門後，瞪大眼睛偷看。'],
 ['g4d01-xianhua','4下','四下第一課 一束鮮花','境／鏡、調的多音',['gpa'],'阿公把一束潔白的鮮花插進擦得發亮的花瓶，原本雜亂的房間也整理得乾乾淨淨。','一束潔白的鮮花，讓整個房間的環境都變得不一樣了。','陽光照進一間整理得乾淨整齊的小客廳。阿公穿著乾淨的襯衫，正把一束潔白的百合花插進擦得發亮的玻璃花瓶。桌上鋪著乾淨的桌巾，牆上有一面小鏡子映出鮮花。角落有一個收好的掃把和整齊的書架。'],
 ['g4d02-xingdong','4下','四下第二課 心動不如行動','半的字族：陪伴・攪拌',['he','mom'],'廚房裡，小禾在媽媽的陪伴下，認真的攪拌麵糊，練習做鬆餅。','我在媽媽的陪伴下，認真的攪拌麵糊。','溫馨的家中廚房。小禾戴著廚師帽、穿著圍裙，雙手抱著一個大碗，用打蛋器認真攪拌麵糊，臉頰沾到一點麵粉。媽媽站在旁邊扶著碗、微笑陪伴。桌上有雞蛋、麵粉、牛奶和一個鬆餅機。'],
 ['g4d03-dongwu','4下','四下第三課 選拔動物之星','各的字族：駱駝；厲害',['he','le'],'森林裡的「動物之星」選拔大會，駱駝、蝸牛、猴子排隊上台展現本領，一隻小鳥拿著麥克風主持。','森林裡正在選拔動物之星，每一隻動物都很厲害。','森林空地上搭了一個木頭舞台，掛著彩旗（不要有文字）。舞台上一隻駱駝自信的走台步，旁邊的蝸牛、猴子、烏龜排隊等著上場。一隻小鳥站在麥克風架上主持。台下小禾和阿樂坐在樹樁上拍手。'],
 ['g4d04-mishi','4下','四下第四課 米食飄香','將的字族：豆漿・槳・獎',['he','dou','dad'],'端午節的河邊，龍舟隊奮力划槳比賽；岸上的小禾一手拿豆漿、一手拿粽子加油。','龍舟選手奮力划槳，要拿下首獎！','端午節的河邊，兩艘龍舟在河上比賽，選手們整齊的奮力划槳，船頭有人打鼓，水花四濺。岸上的小禾一手拿著一杯豆漿、一手拿著粽子揮手加油，豆豆坐在爸爸肩膀上歡呼。'],
 ['g4d05-lanran','4下','四下第五課 讀書報告：藍色小洋裝','疒部字；修改病句',['he'],'藍染工作坊裡，小禾把白布浸進藍色的染缸，拿起來時布上出現漂亮的藍色花紋。','我在藍染工作坊，親手把白布染成藍色。','傳統藍染工作坊，屋簷下晾著好幾塊深淺不同的藍染布。小禾戴著手套和圍裙，正把一塊白布從大染缸裡拉起來，布上出現深藍色的花紋，她的表情很驚喜。'],
 ['g4d06-lugang','4下','四下第六課 我愛鹿港','家喻戶曉；不但……也……',['he','le','dad'],'古色古香的老街上，紅磚牆夾著一條狹窄的小巷，小禾和阿樂側著身子走過，爸爸在巷口拍照。','走在古色古香的老街上，我們不但看到紅磚老屋，也走過狹窄的小巷。','台灣古色古香的老街，兩旁是紅磚老房子，掛著紅燈籠（不要有文字招牌）。一條非常狹窄、只容一人側身通過的紅磚小巷，小禾和阿樂一前一後側著身子走過，表情有趣。爸爸在巷口舉著相機拍照。'],
 ['g4d07-weilai','4下','四下第七課 未來的模樣','鍵／健／毽、荒／慌／謊',['he','le'],'想像中的未來城市：天上有飛行車、路上有機器人；小禾在透明鍵盤上打字，阿樂在旁邊踢毽子。','未來的城市裡，飛行車在天上飛，機器人在路上走。','想像中的未來城市，高樓之間有綠色植物，天空中有幾台小型飛行車，地上有友善的機器人在幫忙澆花。前景的小禾在一個發光的透明鍵盤上打字，阿樂在旁邊開心的踢一個彩色毽子。'],
 ['g4d08-zhihui','4下','四下第八課 動物老師的智慧','決／絕、構／講／溝；難如登天↔輕而易舉',['le'],'阿樂拿著放大鏡，觀察一隻在垂直牆面上輕鬆爬行的壁虎，頭上的想像泡泡是會爬牆的機器人手套。','對壁虎來說，在牆上爬行輕而易舉。','白天的磚牆前，一隻壁虎在垂直的牆面上輕鬆爬行。阿樂拿著一個放大鏡靠近觀察，表情專注又佩服。阿樂頭上方飄著一個想像泡泡，泡泡裡是一副像壁虎腳掌一樣的吸附手套，有人戴著它爬牆。'],
 ['g4d09-taikong','4下','四下第九課 向太空出發','號的多音；聿的字族：筆記・建議',['he','le'],'天文館裡，小禾和阿樂抬頭看巨大的火箭模型和月球，小禾一邊看一邊在筆記本上寫筆記。','我在天文館認真做筆記，夢想有一天能到太空旅行。','天文館的展示大廳，天花板是星空，中央立著一座巨大的白色火箭模型，旁邊掛著月球和行星模型。小禾一手拿筆記本、一手拿鉛筆認真寫筆記，阿樂指著火箭，滿臉嚮往。展示牌不要有文字。'],
 ['g4d10-qingwa','4下','四下第十課 小青蛙想看海','干的字族：乾旱・汗水；禁不住',['he'],'井底的小青蛙抬頭望著井口，一隻大海龜從井口探頭，跟牠說外面的大海有多寬廣。','小青蛙禁不住好奇，抬頭聽海龜說大海的故事。','從井底往上看的構圖：一隻綠色小青蛙坐在井底的石頭上，抬頭望著圓圓的井口，眼睛閃閃發亮。一隻大海龜從井口探出頭來，張嘴說話，井口外是藍天白雲。井壁長著青苔。'],
 ['g4d11-yueguang','4下','四下第十一課 窗前的月光','雨部字：霜・霧・露',['he'],'寒冷的冬夜，窗外一輪明亮的圓月，窗玻璃起了霧，地上鋪著一層白霜；小禾披著毯子靠在窗邊看月亮。','窗外的月光照在地上，像鋪了一層白白的霜。','寒冷的冬天夜晚，一扇大窗戶，窗外是又大又亮的圓月和幾朵薄雲。窗玻璃下緣起了白霧，窗台和窗外的地面覆蓋著一層薄薄的白霜，月光灑進屋內。小禾披著毛毯坐在窗邊，托著下巴安靜的看月亮。'],
 ['g4d12-shouzhang','4下','四下第十二課 如來佛的手掌心','方位詞：往・從・在・向',['le'],'一隻穿戰袍的猴子駕著筋斗雲，從雲霧間往西方飛，前方升起五根巨大的淡橘色柱子；阿樂在畫面一角看得目瞪口呆。','猴子駕著雲從雲霧間往西方飛去，前面竟然出現五根大柱子。','奇幻的天空雲海，一隻穿著金色戰袍、拿著長棍的猴子駕著一朵筋斗雲，從雲霧間快速往前飛，身後有速度線。前方雲中升起五根巨大的淡橘色柱子。畫面左下角的阿樂站在一朵小雲上，張大嘴巴看得目瞪口呆。原創畫風，不要模仿任何電影或卡通的角色設計。'],
].map(it=>{it[7]=it[7]+G4NOTE;return it}));

ITEMS.push(...[
["g5u01","5上","五上第一課 蚊帳大使","總結的寫法：統整成果、點出主旨",[],"黃昏的非洲村落，一頂頂白色蚊帳在油燈下發著微光，孩子們安心的入睡。","暮色籠罩村莊，一頂頂蚊帳在燈光下守護著熟睡的孩子。","非洲草原邊的小村落，黃昏轉入夜晚，天空是橘紅漸層到深藍，遠方有一棵孤立的金合歡樹剪影。前景是一間泥牆草頂的屋子，門口半開，屋內一頂白色蚊帳從屋梁垂下，在油燈暖光下發出柔和的光，帳內兩個孩子安穩熟睡。旁邊幾間屋子也透出同樣溫暖的燈光。氣氛安寧、充滿希望。不要畫任何真實人物的肖像。畫面要有細膩的光影與空氣感，色調和諧、構圖有遠近層次，氣氛成熟而優美，適合十一、十二歲的高年級學生，不要幼稚的卡通感。畫面中不要出現任何文字、中文字、英文字母、數字、招牌字或對話框。"],
["g5u02","5上","五上第二課 從空中看臺灣","對照、比較：美麗與哀愁",[],"從高空俯瞰臺灣東部，蜿蜒的溪流穿過翠綠山谷流入大海，一側山坡卻被開挖得光禿禿。","從雲端往下看，碧綠的山谷旁竟有一片被挖空的山坡。","空拍視角俯瞰臺灣東部山海：雲層在畫面上方散開，一條蜿蜒的溪流像銀色緞帶穿過翠綠山谷，流向湛藍的太平洋，海岸線有白色浪花。畫面左側是層層梯田和小村莊，右側的一片山坡卻被開挖成裸露的黃土，有細小的怪手和土石流痕跡，形成強烈對照。晨光從側面照來，山稜有金邊。不要出現飛行器本體。畫面要有細膩的光影與空氣感，色調和諧、構圖有遠近層次，氣氛成熟而優美，適合十一、十二歲的高年級學生，不要幼稚的卡通感。畫面中不要出現任何文字、中文字、英文字母、數字、招牌字或對話框。"],
["g5u03","5上","五上第三課 攀岩高手","想像：把風雨聯想成具體的事物",[],"狂風暴雨中，爬牆虎的嫩綠藤蔓用細小吸盤緊緊貼住高聳的紅磚牆，一步步往上攀。","狂風拉扯著它的後腿，爬牆虎仍用吸盤一步步攀向雲端。","仰角構圖：一面高聳陡峭的老紅磚牆直入灰色天空，一株爬牆虎的藤蔓從牆腳一路往上攀爬，藤尖的細小吸盤緊緊吸住磚縫，嫩綠新葉在風中翻飛。斜斜的雨絲和被吹彎的雨線像無形的繩索拉扯著藤蔓，牆頂上方的雲層裂開一道縫，透出一束金色陽光照在最高的那片葉子上，象徵堅持與希望。畫面要有細膩的光影與空氣感，色調和諧、構圖有遠近層次，氣氛成熟而優美，適合十一、十二歲的高年級學生，不要幼稚的卡通感。畫面中不要出現任何文字、中文字、英文字母、數字、招牌字或對話框。"],
["g5u04","5上","五上第四課 恆久的美","詳細描寫裝扮、動作與解讀",["he"],"火車行經南部平原，小禾靠在車窗邊，望著窗外一片金黃稻田和彎腰拾穗的農人。","窗外金黃的稻田一望無際，彎腰拾穗的身影顯得寧靜而莊嚴。","火車車廂內，傍晚的陽光斜斜照進車窗。小禾側坐在靠窗座位，額頭輕靠玻璃，若有所思的望向窗外。窗外是臺灣南部平原，一大片黃澄澄的稻田延伸到遠方，稻穗飽滿低垂，遠處幾位戴斗笠的農人彎著腰在田邊拾起掉落的稻穗，天空是溫暖的金色與淡紫色。畫面安靜、莊嚴，帶有古典油畫般的光感。（小禾和阿樂現在是五年級，十一歲，身形比四年級時抽高，神情更沉穩；豆豆八歲。）畫面要有細膩的光影與空氣感，色調和諧、構圖有遠近層次，氣氛成熟而優美，適合十一、十二歲的高年級學生，不要幼稚的卡通感。畫面中不要出現任何文字、中文字、英文字母、數字、招牌字或對話框。"],
["g5u05","5上","五上第五課 它抓得住你─商標的故事","說明文：舉例說明",[],"北宋城鎮的熱鬧街道，一家針鋪門前掛著白兔搗藥的圖案，往來客人一眼就認出它。","北宋針鋪門前掛著白兔圖案，讓往來的客人一眼就記住它。","北宋時代的城鎮街景，木造店鋪屋簷相連，灰瓦飛簷，街上有穿宋代服飾的行人、挑擔小販和孩童。畫面中央是一家小小的針鋪，門前高掛一面木牌，上面只畫著一隻拿著杵在搗藥的白兔圖案（只有圖，沒有任何文字）。店主在櫃檯前拿著細針給客人看，幾位婦人駐足觀看。清晨柔和的陽光，古樸溫暖。畫面要有細膩的光影與空氣感，色調和諧、構圖有遠近層次，氣氛成熟而優美，適合十一、十二歲的高年級學生，不要幼稚的卡通感。畫面中不要出現任何文字、中文字、英文字母、數字、招牌字或對話框。"],
["g5u06","5上","五上第六課 故事「動」起來","說明文：依時間順序介紹發展",["le"],"深夜的書桌前，阿樂專注的在一張張描圖紙上畫動作分格，畫中的小鳥彷彿要從紙上飛出來。","檯燈下，阿樂一張張畫著分格，紙上的小鳥彷彿就要振翅飛起。","深夜的房間，只有一盞檯燈的暖黃光。阿樂坐在書桌前，手拿鉛筆，專注的在半透明描圖紙上畫圖，桌上散落著一疊疊畫滿連續動作的紙張和一本翻頁動畫小冊。從紙堆上方，一隻用鉛筆線條畫出的小鳥正一格一格「活」起來，由線稿漸漸變成彩色，振翅飛向窗外的星空。不要模仿任何現有動畫公司的角色造型。（小禾和阿樂現在是五年級，十一歲，身形比四年級時抽高，神情更沉穩；豆豆八歲。）畫面要有細膩的光影與空氣感，色調和諧、構圖有遠近層次，氣氛成熟而優美，適合十一、十二歲的高年級學生，不要幼稚的卡通感。畫面中不要出現任何文字、中文字、英文字母、數字、招牌字或對話框。"],
["g5u07","5上","五上第七課 為生命找出口","摘要：誰＋逆境＋如何做＋結果",[],"海邊陡峭的峭壁上，一隻年輕的老鷹迎著強風展開翅膀，在氣流中奮力起飛。","小鷹迎著強風張開翅膀，在呼嘯的氣流中飛得更高更遠。","面海的陡峭峭壁，海浪拍打岩石激起白色浪花，天空有快速流動的雲。一隻羽翼還沒完全豐滿的年輕老鷹，從崖邊的鳥巢迎著強風展開翅膀，身體被氣流托起，羽毛被風吹得翻動。遠方另一隻成鷹在更高處盤旋。雲縫中透出光束，畫面充滿力量與逆風而上的勇氣。畫面要有細膩的光影與空氣感，色調和諧、構圖有遠近層次，氣氛成熟而優美，適合十一、十二歲的高年級學生，不要幼稚的卡通感。畫面中不要出現任何文字、中文字、英文字母、數字、招牌字或對話框。"],
["g5u08","5上","五上第八課 最勇敢的女孩","人物描寫：從事件看出人物特質",[],"清晨的山谷小村，幾個披著頭巾的女孩抱著書本，沿著石子小路勇敢的走向學校。","晨光灑在山谷，女孩們抱著書本，堅定的走在上學的小路上。","南亞山區的小村落，清晨的山谷，遠方是積雪的高山，近處是梯田與泥磚房屋。三個披著素色頭巾的女孩抱著書本和筆記本，背影朝向觀者，沿著石子小路往山坡上一所小學校走去，其中一個女孩回頭微笑，眼神堅定。晨霧散開，陽光正從山頭灑下。不要畫成任何真實人物的肖像。畫面要有細膩的光影與空氣感，色調和諧、構圖有遠近層次，氣氛成熟而優美，適合十一、十二歲的高年級學生，不要幼稚的卡通感。畫面中不要出現任何文字、中文字、英文字母、數字、招牌字或對話框。"],
["g5u09","5上","五上第九課 在挫折中成長","人物故事：歸納事件與精神",[],"清晨空蕩的拳擊館，一位年輕女選手獨自纏著手帶，高窗灑下的光照亮她堅毅的側臉。","天還沒亮，她獨自在拳擊館纏好手帶，準備再一次站起來。","清晨空蕩安靜的拳擊訓練館，高處的窗戶灑下一道道斜斜的光柱，空氣中有細小的灰塵飄浮。一位年輕的女拳擊選手坐在擂臺邊的木長椅上，低頭專心纏著手上的手帶，側臉堅毅、汗水微微發亮，身旁放著拳擊手套和水壺，背景有懸掛的沙包。氣氛沉靜而有力量。不要畫成任何真實人物的肖像。畫面要有細膩的光影與空氣感，色調和諧、構圖有遠近層次，氣氛成熟而優美，適合十一、十二歲的高年級學生，不要幼稚的卡通感。畫面中不要出現任何文字、中文字、英文字母、數字、招牌字或對話框。"],
["g5u10","5上","五上第十課 山中寄情","繪圖想像詩境：山中相送罷",[],"暮色中的山居，送走友人後，主人緩緩掩上柴門，門外春草青青，小路伸向遠山。","送別友人後，他在暮色中掩上柴門，心中盼著明年春草再綠。","唐代山水意境：黃昏的山間，遠山層疊、雲霧繚繞，天邊有淡淡晚霞。近景是一間簡樸的茅草屋和竹籬笆，一位穿著唐代長袍的男子站在柴門內，正緩緩掩上門扉，回望門外。門外一條小路穿過青綠的春草，蜿蜒伸向遠山，小路盡頭隱約有一個騎驢遠去的小小身影。色調淡雅，帶有水墨暈染的詩意。畫面要有細膩的光影與空氣感，色調和諧、構圖有遠近層次，氣氛成熟而優美，適合十一、十二歲的高年級學生，不要幼稚的卡通感。畫面中不要出現任何文字、中文字、英文字母、數字、招牌字或對話框。"],
["g5u11","5上","五上第十一課 與達駭黑熊走入山林","記敘描寫：危急時刻的動作與心情",[],"雷雨過後的森林，布農族獵人爺爺和孫子合力移開倒下的樹枝，救出受傷的小黑熊。","雷雨過後的森林裡，爺孫倆合力移開樹枝，救出奄奄一息的小黑熊。","臺灣中央山脈的原始森林，雷雨剛停，地上積水、巨木倒下，林間瀰漫水氣，陽光從樹梢縫隙斜射進來。一位身形高壯、臉上有一道疤痕、穿著布農族傳統紅黑色背心的獵人爺爺，和一位約十一歲的布農族男孩，正合力抬起壓在地上的粗大樹枝，下面是一隻胸前有白色V字斑紋的臺灣小黑熊，虛弱的抬起頭。爺爺神情嚴肅又溫柔。畫面要有細膩的光影與空氣感，色調和諧、構圖有遠近層次，氣氛成熟而優美，適合十一、十二歲的高年級學生，不要幼稚的卡通感。畫面中不要出現任何文字、中文字、英文字母、數字、招牌字或對話框。"],
["g5u12","5上","五上第十二課 荒島上的國王","故事情節發展與心情起伏",[],"荒島沙灘上，一位留著長鬍子、穿獸皮衣的男子站在自己蓋的木屋前，望著海上的夕陽。","他站在親手蓋的木屋前，望著夕陽染紅的大海，心中平靜而感恩。","熱帶荒島的海灘黃昏，天空是金橘色與紫色，海面映著夕陽。一位留著長鬍子、頭戴獸皮帽、穿著粗糙獸皮衣的男子，手持長木杖，站在用木頭和棕櫚葉自己搭建的小屋和柵欄前，旁邊有晒乾的魚、陶罐、一隻山羊和一隻鸚鵡。遠方是一望無際的大海，沙灘上留下一排腳印。氣氛孤獨卻平靜堅毅。畫面要有細膩的光影與空氣感，色調和諧、構圖有遠近層次，氣氛成熟而優美，適合十一、十二歲的高年級學生，不要幼稚的卡通感。畫面中不要出現任何文字、中文字、英文字母、數字、招牌字或對話框。"],
["g5d01","5下","五下第一課 你會怎麼回答？","故事脈絡：遇到問題→如何回應→結果",[],"廣場上的講臺，一位紳士低頭看了看手中的紙條，神態自若的微笑，臺下聽眾屏息等待。","面對臺下遞來的紙條，他神態自若的微笑，一句話化解了尷尬。","二十世紀中期的歐洲城市廣場，陰天的柔和光線，遠處有石造建築和鐘樓。廣場中央的木造講臺上，一位微胖、穿深色西裝的年長紳士，一手拿著水杯，一手看著一張小紙條（紙條上沒有字），嘴角帶著從容的微笑。臺下聚集許多戴帽子的聽眾，有人好奇、有人緊張。不要畫成任何真實人物的肖像。畫面要有細膩的光影與空氣感，色調和諧、構圖有遠近層次，氣氛成熟而優美，適合十一、十二歲的高年級學生，不要幼稚的卡通感。畫面中不要出現任何文字、中文字、英文字母、數字、招牌字或對話框。"],
["g5d02","5下","五下第二課 智救養馬人","從表情與動作推論人物心情",[],"春秋時代的宮殿裡，國君怒氣沖沖，一位矮小沉著的大臣拱手進言，跪在地上的養馬人瑟瑟發抖。","國君怒氣沖沖，大臣卻沉著的拱手進言，跪著的養馬人嚇得發抖。","春秋時代的古代宮殿大殿，木柱和帷幕，光線從高處斜照。高臺上的國君穿著華麗的古代王服，皺眉怒目、一手拍案。殿中央一位身材矮小、氣度沉穩的大臣拱手向前，神情從容。大臣身旁，一位穿粗布衣的養馬人跪在地上，低頭顫抖，臉色慘白。兩旁有手持戈的衛士。殿外可以看見馬廄和幾匹駿馬。畫面要有細膩的光影與空氣感，色調和諧、構圖有遠近層次，氣氛成熟而優美，適合十一、十二歲的高年級學生，不要幼稚的卡通感。畫面中不要出現任何文字、中文字、英文字母、數字、招牌字或對話框。"],
["g5d03","5下","五下第三課 真正的「聰明」","議論文：舉例子支持論點",[],"狹窄的老巷弄裡，一輛圓圓的小車靈巧的穿梭前進，華麗的大跑車卻卡在巷口動彈不得。","大跑車卡在巷口動彈不得，圓圓的小車卻在窄巷裡穿梭自如。","臺灣老城區的狹窄巷弄，兩旁是紅磚老屋、盆栽和曬衣竿，午後陽光從屋簷間灑下。一輛圓圓胖胖、只有兩個座位的小汽車，輕快的穿過窄巷，車身反射著陽光。巷口另一端，一輛線條流線、光彩耀眼的大跑車因為太寬而卡住，進退兩難。畫面幽默但不誇張，車子上不要有任何品牌標誌或車牌文字。畫面要有細膩的光影與空氣感，色調和諧、構圖有遠近層次，氣氛成熟而優美，適合十一、十二歲的高年級學生，不要幼稚的卡通感。畫面中不要出現任何文字、中文字、英文字母、數字、招牌字或對話框。"],
["g5d04","5下","五下第四課 小記者，出動！","訪問：用六何法安排提問",["he","le"],"醫院的休息室裡，小禾拿著筆記本提問，阿樂握著錄音筆，一位剛下班的急診醫師耐心的回答。","小禾認真提問，阿樂拿著錄音筆，醫師耐心的分享急診室的故事。","醫院員工休息室，窗外是傍晚的城市天際線。一位穿著藍綠色手術服、披著白袍、面帶疲倦卻親切微笑的年輕男醫師坐在沙發上，比著手勢說話。小禾坐在對面，手拿筆記本和筆，專注的看著醫師提問；阿樂坐在旁邊，雙手把錄音筆遞向前方，認真聆聽。桌上有兩杯熱茶。筆記本上不要有字。（小禾和阿樂現在是五年級，十一歲，身形比四年級時抽高，神情更沉穩；豆豆八歲。）畫面要有細膩的光影與空氣感，色調和諧、構圖有遠近層次，氣氛成熟而優美，適合十一、十二歲的高年級學生，不要幼稚的卡通感。畫面中不要出現任何文字、中文字、英文字母、數字、招牌字或對話框。"],
["g5d05","5下","五下第五課 奇幻光芒的祕密","提問與回答：作者分享創作歷程",["he"],"夜晚的山谷，一棵巨大的奇幻古樹每片葉子都像星星一樣閃閃發光，小禾仰頭望得出神。","山谷裡的古樹在夜裡閃閃發光，每一片葉子都像墜落的星星。","奇幻的夜晚山谷，天空滿是星辰。山谷中央一棵巨大古老的樹，樹幹盤根錯節，數千片葉子像星星一樣發出銀白與淡金色的光，光點緩緩飄落。樹下草地上，小禾抱著一本打開的書，仰頭望著古樹，臉被光照亮，神情驚奇又陶醉。遠方山頭有若隱若現的雲霧。畫面夢幻、靜謐。（小禾和阿樂現在是五年級，十一歲，身形比四年級時抽高，神情更沉穩；豆豆八歲。）畫面要有細膩的光影與空氣感，色調和諧、構圖有遠近層次，氣氛成熟而優美，適合十一、十二歲的高年級學生，不要幼稚的卡通感。畫面中不要出現任何文字、中文字、英文字母、數字、招牌字或對話框。"],
["g5d06","5下","五下第六課 人「聲」就是戲","語氣與情緒：用聲音表現角色",["le"],"錄音室裡，阿樂戴著耳機站在麥克風前，表情投入的配音，玻璃窗後的錄音師豎起大拇指。","阿樂戴上耳機站在麥克風前，用聲音讓畫面中的角色活了起來。","專業錄音室，牆面有吸音板，燈光是低調的暖色與藍色。阿樂戴著大耳機，站在一支懸吊式麥克風前，手拿劇本（紙上不要有字），臉部表情投入，一手做出誇張的手勢，彷彿正在演一個角色。前方的螢幕播放著模糊的彩色動畫畫面（不要畫出任何現有卡通角色）。後方隔著玻璃窗的控制室裡，一位錄音師戴著耳機豎起大拇指。（小禾和阿樂現在是五年級，十一歲，身形比四年級時抽高，神情更沉穩；豆豆八歲。）畫面要有細膩的光影與空氣感，色調和諧、構圖有遠近層次，氣氛成熟而優美，適合十一、十二歲的高年級學生，不要幼稚的卡通感。畫面中不要出現任何文字、中文字、英文字母、數字、招牌字或對話框。"],
["g5d07","5下","五下第七課 題西林壁","讀古詩：知作者、懂詞語、讀賞析、寫感想",[],"廬山的群峰在雲霧中層層疊疊，橫看成嶺、側看成峰，一位詩人站在山路上靜靜凝望。","雲霧繚繞的群峰層層疊疊，從不同角度看去，竟是不同的模樣。","中國山水畫意境：廬山的群峰在晨霧中層層疊疊，近處是連綿的山嶺，遠處是一座座陡峭的山峰，雲海在山腰流動，松樹點綴岩壁。山路的轉彎處，一位穿著宋代長袍、戴著高帽的文人拄杖站立，背影朝向觀者，仰望眼前看不清全貌的山。山腰隱約有一座寺院的屋簷。色調以青綠、淡墨與晨光的淡金色為主。畫面要有細膩的光影與空氣感，色調和諧、構圖有遠近層次，氣氛成熟而優美，適合十一、十二歲的高年級學生，不要幼稚的卡通感。畫面中不要出現任何文字、中文字、英文字母、數字、招牌字或對話框。"],
["g5d08","5下","五下第八課 海洋的殺手","層遞：一層比一層更嚴重",[],"遙遠的無人小島，白色沙灘上堆滿各色塑膠垃圾，幾隻黃色塑膠小鴨隨著浪花漂上岸。","夕陽下的無人島沙灘堆滿塑膠垃圾，黃色小鴨隨著浪花漂上岸。","南太平洋上一座遙遠的珊瑚礁無人小島，傍晚的夕陽把海面染成橘紅色。原本潔白的沙灘上，散落、堆積著大量五顏六色的塑膠瓶、漁網、拖鞋和瓶蓋，幾隻褪色的黃色塑膠小鴨隨著浪花漂上岸。一隻寄居蟹躲在塑膠瓶蓋裡，一隻海鳥站在漁網堆上。遠方海天一色，畫面美麗卻令人心痛。畫面要有細膩的光影與空氣感，色調和諧、構圖有遠近層次，氣氛成熟而優美，適合十一、十二歲的高年級學生，不要幼稚的卡通感。畫面中不要出現任何文字、中文字、英文字母、數字、招牌字或對話框。"],
["g5d09","5下","五下第九課 你想做人魚嗎？","設問：用問句引發思考",["he"],"湛藍的大海裡，小禾像人魚一樣潛入深海，身旁有珊瑚、海星、鯨魚和沉船上生鏽的錨。","小禾潛入湛藍的海洋，看見珊瑚、鯨魚，還有沉睡在海底的古老船錨。","剖面構圖的大海：上方海面有一頭大翅鯨正噴出壯麗水柱，陽光從海面穿透下來形成光束。小禾穿著潛水衣、戴著蛙鏡和蛙鞋，像人魚一樣優雅的向深處游去，長髮在水中飄動。周圍有色彩繽紛的珊瑚、海葵、海星、成群小魚、水母和一隻海豚，海底深處有一艘覆滿珊瑚的沉船和一支生鏽的大鐵錨。色調從淺藍漸變到深藍，神秘遼闊。（小禾和阿樂現在是五年級，十一歲，身形比四年級時抽高，神情更沉穩；豆豆八歲。）畫面要有細膩的光影與空氣感，色調和諧、構圖有遠近層次，氣氛成熟而優美，適合十一、十二歲的高年級學生，不要幼稚的卡通感。畫面中不要出現任何文字、中文字、英文字母、數字、招牌字或對話框。"],
["g5d10","5下","五下第十課 玉米人的奇蹟","廣播劇：旁白、對話推進情節",[],"遠古的天地間，天空之神與海洋之神俯身凝望，金黃的玉米在祂們的話語中化成第一批人類。","在天神的話語中，金黃的玉米漸漸化成了第一批人類。","遠古神話的世界，只有天空與海洋。畫面上方是由星雲與閃電構成的巨大天空之神，畫面下方是由浪花與潮水構成的巨大海洋之神，祂們的形體半透明、帶有中美洲古文明的幾何紋飾。兩位神祇俯身凝望中央：一片金黃的玉米田在光芒中升起，幾個由玉米粒的光點組成的人形正慢慢站起來。色調金黃、湛藍與翡翠綠，莊嚴壯麗。畫面要有細膩的光影與空氣感，色調和諧、構圖有遠近層次，氣氛成熟而優美，適合十一、十二歲的高年級學生，不要幼稚的卡通感。畫面中不要出現任何文字、中文字、英文字母、數字、招牌字或對話框。"],
["g5d11","5下","五下第十一課 幸福的火苗","從對話和情節看人物形象",[],"寒冷的冬夜，一位高大的天神手持火炬走進山洞，火光照亮了縮在一起發抖的人們。","天神手中的火光照亮寒冷的山洞，也點燃了人們眼中的希望。","遠古時代的冬夜，雪地上月光微弱，山洞外遠方有幾對狼群發光的眼睛。山洞口，一位高大健壯、披著古希臘長袍的天神，手中高舉一支燃燒的火炬，火焰是溫暖的橘紅色。洞內原本縮在一起發抖、穿著破舊獸皮的男女老少，紛紛抬頭望向火光，臉上從恐懼轉為驚喜，有人伸出雙手取暖。冷藍與暖橘的強烈對比。畫面要有細膩的光影與空氣感，色調和諧、構圖有遠近層次，氣氛成熟而優美，適合十一、十二歲的高年級學生，不要幼稚的卡通感。畫面中不要出現任何文字、中文字、英文字母、數字、招牌字或對話框。"],
["g5d12","5下","五下第十二課 神農嘗百草","神話人物的外形、物品與事件",[],"深山的晨霧裡，頭上長著一對牛角、腹部像琉璃般透明的炎帝，手持赭紅色神鞭，細細品嘗一株草藥。","晨霧中的炎帝手持神鞭，細細品嘗百草，只為替人們找到救命的藥。","上古時代的深山，晨霧瀰漫，岩壁上長滿各式各樣的草藥和花朵，遠處有瀑布。一位頭上長著一對彎曲牛角、穿著樹葉與麻布衣裳的上古神人，腹部像琉璃一樣半透明，可以隱約看見草葉在裡面發出淡淡的綠光。他一手拿著赭紅色的長鞭，一手捏著一片草葉放進嘴裡細細品嘗，神情專注慈悲。身後背著裝滿草藥的竹簍。畫面要有細膩的光影與空氣感，色調和諧、構圖有遠近層次，氣氛成熟而優美，適合十一、十二歲的高年級學生，不要幼稚的卡通感。畫面中不要出現任何文字、中文字、英文字母、數字、招牌字或對話框。"],
["g6u01","6上","六上第一課 跑道","從物品、動作與內心獨白掌握情緒",["le"],"夕陽下的運動會接力決賽，阿樂握緊接力棒衝向最後一棒，全身緊繃、眼神專注。","夕陽染紅了跑道，阿樂握緊接力棒，用盡全力衝向最後一棒。","國小運動會的紅色PU跑道，傍晚的夕陽把整個操場染成金紅色，看臺上同學們揮舞彩帶加油。阿樂穿著班服、綁著頭帶，正以全速衝刺，手中緊握接力棒伸向前方，前方的同學已回頭伸手準備接棒。阿樂咬緊牙關、汗水飛濺，影子在跑道上拉得很長。採用略低的動態視角，有速度感。班服上不要有文字或號碼。（小禾和阿樂現在是六年級，十二歲，接近國中生的身高與氣質；豆豆九歲。）畫面要有細膩的光影與空氣感，色調和諧、構圖有遠近層次，氣氛成熟而優美，適合十一、十二歲的高年級學生，不要幼稚的卡通感。畫面中不要出現任何文字、中文字、英文字母、數字、招牌字或對話框。"],
["g6u02","6上","六上第二課 朱子治家格言選","讀古文：逐步理解文意",["he"],"天剛破曉，三合院的庭院還籠罩在薄霧中，小禾拿著竹掃帚認真灑掃庭除。","天剛破曉，小禾就拿起掃帚，把三合院的庭院掃得乾乾淨淨。","黎明時分的臺灣傳統紅磚三合院，天空是淡藍與淡粉的漸層，庭院地上鋪著紅磚，晨霧輕輕飄散，屋簷下有燕子。小禾穿著樸素的上衣和長褲，雙手握著一支竹掃帚，正專心的掃地，腳邊有一小堆落葉，身旁放著一個灑過水的鐵桶，地面微濕反光。正廳的門剛打開，透出溫暖燈光。氣氛清新、勤勉、安靜。（小禾和阿樂現在是六年級，十二歲，接近國中生的身高與氣質；豆豆九歲。）畫面要有細膩的光影與空氣感，色調和諧、構圖有遠近層次，氣氛成熟而優美，適合十一、十二歲的高年級學生，不要幼稚的卡通感。畫面中不要出現任何文字、中文字、英文字母、數字、招牌字或對話框。"],
["g6u03","6上","六上第三課 談遇見更好的自己","議論文：提出正反兩面的論據",["he"],"清晨的山坡步道，小禾一步步跑上長長的石階，回頭望見朝陽升起，雲海在腳下展開。","小禾一步步跑上長長的石階，回頭時，朝陽正從雲海中升起。","清晨山間的長石階步道，兩旁是蒼翠的樹林。小禾穿著運動服，剛跑上最高一段石階，一手扶著膝蓋喘氣，一手擦汗，轉身回望。她身後的山谷下是翻騰的雲海，一輪朝陽正從遠方山稜升起，金色陽光照亮她的臉和長長的石階。她的神情疲累卻充滿成就感。畫面開闊，象徵超越自己。（小禾和阿樂現在是六年級，十二歲，接近國中生的身高與氣質；豆豆九歲。）畫面要有細膩的光影與空氣感，色調和諧、構圖有遠近層次，氣氛成熟而優美，適合十一、十二歲的高年級學生，不要幼稚的卡通感。畫面中不要出現任何文字、中文字、英文字母、數字、招牌字或對話框。"],
["g6u04","6上","六上第四課 臺灣美食詩選","讀詩歌：查資料探索背景與內涵",[],"華燈初上的廟口夜市，熱騰騰的大鍋冒著白煙，雪白的米漿沿著滾燙的鍋邊緩緩滑行。","華燈初上，雪白的米漿沿著鍋邊緩緩滑行，蒸出一碗溫暖的記憶。","臺灣老廟口的夜市，夜幕初降，背景是古老廟宇的燕尾屋脊和一串串紅燈籠的暖光（燈籠上沒有字）。前景是一口巨大的鐵鍋，鍋中熱湯翻滾、白色蒸氣裊裊升起，一雙長滿歲月痕跡的手正把雪白的米漿沿著滾燙鍋邊淋下，米漿緩緩滑行凝固。旁邊攤位上蒸籠裡排著晶瑩透亮的肉圓。人來人往的身影模糊溫暖，懷舊而有煙火氣。畫面要有細膩的光影與空氣感，色調和諧、構圖有遠近層次，氣氛成熟而優美，適合十一、十二歲的高年級學生，不要幼稚的卡通感。畫面中不要出現任何文字、中文字、英文字母、數字、招牌字或對話框。"],
["g6u05","6上","六上第五課 最好的味覺禮物","寫作架構：今昔交錯的時空之旅",["he","mom"],"午後的小廚房堆滿金黃鳳梨，小禾和媽媽一起切鳳梨、榨果汁，陽光透過窗戶照在果汁上閃閃發亮。","午後的陽光照進小廚房，金黃的鳳梨汁閃閃發亮，滿室都是香甜。","溫馨的小廚房，午後陽光從窗戶斜照進來，桌上和地上堆著一顆顆金黃的鳳梨。小禾綁起頭髮、繫著圍裙，小心的把切好的鳳梨塊放進果汁機；媽媽在旁邊削鳳梨皮，兩人相視而笑。桌上一排玻璃瓶裝著金黃的鳳梨汁，在陽光下閃閃發亮。窗臺上放著一張泛黃的老照片和一束野花，暗示回憶。空氣中有細細的光塵。（小禾和阿樂現在是六年級，十二歲，接近國中生的身高與氣質；豆豆九歲。）畫面要有細膩的光影與空氣感，色調和諧、構圖有遠近層次，氣氛成熟而優美，適合十一、十二歲的高年級學生，不要幼稚的卡通感。畫面中不要出現任何文字、中文字、英文字母、數字、招牌字或對話框。"],
["g6u06","6上","六上第六課 珍珠奶茶","對話體：表達觀點與理由",["he","le"],"老茶館的窗邊，阿樂捧著一大杯珍珠奶茶，小禾端著一小杯清香的烏龍茶，兩人笑著交換意見。","阿樂捧著珍珠奶茶，小禾端著清香的烏龍茶，兩人各有所好。","臺灣傳統老茶館的木頭窗邊，窗外是細雨中的綠意庭園，室內有木桌、竹椅和吊燈。阿樂雙手捧著一大杯有黑色珍珠的奶茶，吸管插在杯中，一臉滿足；小禾端著一只小巧的白瓷茶杯，杯中是金黃清澈的烏龍茶，旁邊有一把紫砂茶壺冒著熱氣。兩人面對面笑著，像在交換意見。杯子和窗戶上不要有任何字或標誌。（小禾和阿樂現在是六年級，十二歲，接近國中生的身高與氣質；豆豆九歲。）畫面要有細膩的光影與空氣感，色調和諧、構圖有遠近層次，氣氛成熟而優美，適合十一、十二歲的高年級學生，不要幼稚的卡通感。畫面中不要出現任何文字、中文字、英文字母、數字、招牌字或對話框。"],
["g6u07","6上","六上第七課 大小剛好的鞋子","觀察、好奇、提問、找到答案",[],"雨季的緬甸街頭，穿著紗籠的行人腳上都是小一號的紅色絨面拖鞋，踩過積水的街道。","雨季的街頭，行人穿著小一號的拖鞋，輕快的踩過積水。","緬甸仰光雨季的街道，剛下過雨，地面積水映著天空與遠方一座金色佛塔的倒影。近景是低角度構圖，幾位穿著長及腳踝紗籠的男女行人走過，腳上都穿著紅色絨面的夾腳拖鞋，鞋子明顯比腳小一號，腳跟露在鞋外，輕快的踩過水窪、濺起小水花。街邊有撐傘的小販和綠色大樹。色調濕潤、明亮。畫面要有細膩的光影與空氣感，色調和諧、構圖有遠近層次，氣氛成熟而優美，適合十一、十二歲的高年級學生，不要幼稚的卡通感。畫面中不要出現任何文字、中文字、英文字母、數字、招牌字或對話框。"],

["g6u12","6上","六上第十二課 祕密花園","從行為與對話刻畫人物",[],"一位女孩撥開垂掛的常春藤，推開一扇隱藏的木門，門後是在春光中甦醒的祕密花園。","她撥開常春藤推開木門，眼前的祕密花園正在春光裡悄悄甦醒。","英國古老莊園的高聳石牆，牆上垂滿茂密的常春藤。一位身材瘦小、穿著深色洋裝的女孩，一手撥開常春藤，一手推開一扇長滿青苔的舊木門，門縫中透出明亮的春光。門後是一座荒廢已久卻正在甦醒的花園：玫瑰藤爬滿枯枝，草地上冒出番紅花和水仙，一隻紅胸知更鳥停在門邊枝頭。光線從暗到亮，充滿神祕與希望。不要模仿任何電影或動畫的角色造型。畫面要有細膩的光影與空氣感，色調和諧、構圖有遠近層次，氣氛成熟而優美，適合十一、十二歲的高年級學生，不要幼稚的卡通感。畫面中不要出現任何文字、中文字、英文字母、數字、招牌字或對話框。"],

let pics={}, db=null, assets=null, picView=false, activeRow=null, picFilter='all';
const PIC_TABS=[['all','全部'],['todo','還沒放圖'],['上','二上'],['下','二下'],['3上','三上'],['3下','三下'],['4上','四上'],['4下','四下'],['5上','五上'],['5下','五下'],['6上','六上'],['6下','六下'],['extra','角色與加分']];
function picSrc(name){return pics[name]?'/_blob/'+pics[name]:'img/'+name+'.webp'}
function refreshPics(){document.querySelectorAll('figure[data-pic]').forEach(f=>{const img=f.querySelector('img');const s=picSrc(f.dataset.pic);if(img.getAttribute('src')!==s)img.src=s})}
const fullPrompt=it=>{const cast=it[4].map(k=>`${CAST[k][0]}：${CAST[k][1]}`).join('\n');return `請畫一張圖。\n\n${it[7]}\n\n${cast?'角色長相（請參考我上傳的角色設定圖）：\n'+cast+'\n\n':''}${STYLE}`};

// 縮小成最寬 1280px 的 WebP，省空間也載入得快
async function shrink(file){
  try{
    const bmp=await createImageBitmap(file);
    const sc=Math.min(1,1280/bmp.width);
    const c=document.createElement('canvas');c.width=Math.round(bmp.width*sc);c.height=Math.round(bmp.height*sc);
    c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
    const b=await new Promise(r=>c.toBlob(r,'image/webp',.86));
    return b||file;
  }catch(e){return file}
}
async function savePic(name,file,status){
  if(!assets||!db){status.textContent='這個畫面不能存圖，請在 Claude 裡用編輯者身分開啟。';return}
  if(!file||!/^image\//.test(file.type)){status.textContent='貼上的不是圖片。請在 Gemini 的圖上按右鍵選「複製圖片」再貼。';return}
  status.textContent='上傳中……';
  try{
    const blob=await shrink(file);
    const r=await assets.upload(blob,{type:blob.type||'image/webp'});
    const old=pics[name];
    const next={...pics,[name]:r.id};
    await db.doc('config/pictures').set(next);
    pics=next;refreshPics();
    if(old){try{await assets.delete(old)}catch(e){}}
    status.textContent='已存好！學生畫面也會出現這張圖。';
    if(picView)drawPics();
  }catch(e){
    const m={not_granted:'沒有存圖權限，請用編輯者身分開啟。',too_large:'圖片太大了，請換一張。',unsupported_type:'這種圖檔格式不能用，請存成 PNG 或 JPG。',quota_exceeded:'存圖空間滿了，請先移除一些不用的圖。'}[e&&e.code];
    status.textContent=m||'上傳失敗，請再試一次。';
  }
}
async function removePic(name,status){
  const old=pics[name];if(!old)return;
  const next={...pics};delete next[name];
  try{await db.doc('config/pictures').set(next);pics=next;try{await assets.delete(old)}catch(e){};refreshPics();drawPics()}
  catch(e){status.textContent='移除失敗，請再試一次。'}
}
document.addEventListener('paste',e=>{
  if(!picView||!activeRow)return;
  const f=[...(e.clipboardData?.files||[])].find(x=>x.type.startsWith('image/'));
  if(f){e.preventDefault();savePic(activeRow.name,f,activeRow.status)}
  else if(activeRow)activeRow.status.textContent='剪貼簿裡沒有圖片。請在 Gemini 的圖上按右鍵選「複製圖片」。';
});

function drawPics(){
  picView=true;activeRow=null;setGrade(9);
  app.replaceChildren();
  const n=ITEMS.filter(it=>pics[it[0]]).length;
  app.append(h('button',{class:'back',onclick:()=>{picView=false;teacher()}},'← 回到老師・家長說明'),
    h('div',{class:'pat-head',style:'margin-bottom:10px'},h('h2',{style:'color:var(--ink)'},'插圖工作區'),h('span',{class:'from'},`已放好 ${n}／${ITEMS.length} 張`)),
    h('section',{class:'panel'},
      h('ol',{class:'howto'},
        h('li',{},'按「複製提示詞」，到 Gemini 貼上送出（第 0 張以外，請把角色設定圖一起上傳給 Gemini）。'),
        h('li',{},'在 Gemini 畫好的圖上按右鍵，選「複製圖片」。'),
        h('li',{},'回到這裡，點那一張的虛線框，按 Ctrl+V 貼上，就存好了。也可以把圖片檔拖進框裡，或按「選擇檔案」。')),
      h('p',{class:'small'},'只有能編輯這個遊戲的人看得到這一頁。存好的圖會自動出現在學生的「寫一寫」和「句子長大了」。')));
  app.append(h('div',{class:'seg pic-tabs',role:'group','aria-label':'篩選'},PIC_TABS.map(([k,lab])=>h('button',{'aria-pressed':String(picFilter===k),onclick:()=>{picFilter=k;drawPics()}},lab+(k==='todo'?`（${ITEMS.length-n}）`:'')))));
  const list=h('div',{class:'pic-list'});
  ITEMS.filter(it=>picFilter==='all'||(picFilter==='todo'?!pics[it[0]]:it[1]===picFilter)).forEach(it=>{
    const name=it[0];const has=!!pics[name];
    const status=h('p',{class:'small','aria-live':'polite'},has?'已放好。想換的話，直接貼上新的圖。':'');
    const row={name,status};
    const fileIn=h('input',{type:'file',accept:'image/*',id:'file-'+name,hidden:true});
    fileIn.addEventListener('change',()=>{if(fileIn.files[0])savePic(name,fileIn.files[0],status)});
    const zone=h('div',{class:'drop'+(has?' has':''),tabindex:'0',role:'button','aria-label':`${it[3]}的圖片框，點一下後按 Ctrl+V 貼上`},
      has?h('img',{src:'/_blob/'+pics[name],alt:it[3]}):h('span',{},'點這裡，再按 Ctrl+V 貼上圖片'));
    const act=()=>{if(activeRow&&activeRow.zone)activeRow.zone.classList.remove('active');activeRow=row;row.zone=zone;zone.classList.add('active');if(!has)status.textContent='好了，現在按 Ctrl+V 貼上。'};
    zone.addEventListener('click',()=>{act();zone.focus()});
    zone.addEventListener('focus',act);
    zone.addEventListener('dragover',e=>{e.preventDefault();zone.classList.add('active')});
    zone.addEventListener('dragleave',()=>zone.classList.remove('active'));
    zone.addEventListener('drop',e=>{e.preventDefault();const f=[...e.dataTransfer.files].find(x=>x.type.startsWith('image/'));savePic(name,f,status)});
    const copyBtn=h('button',{class:'secondary',onclick:async()=>{const t=fullPrompt(it);try{await navigator.clipboard.writeText(t);copyBtn.textContent='已複製'}catch(e){status.textContent='無法自動複製，請展開「完整提示詞」手動選取。'}setTimeout(()=>copyBtn.textContent='複製提示詞',1800)}},'複製提示詞');
    const det=h('details',{},h('summary',{},'完整提示詞'),h('pre',{class:'prompt'},fullPrompt(it)));
    list.append(h('article',{class:'pic-row'+(has?' done':'')},
      h('div',{class:'pic-info'},
        h('div',{class:'pat-row'},h('span',{class:'f-key',style:'font-size:17px;padding:2px 10px'},it[3]),h('span',{class:'small'},it[2])),
        h('p',{style:'margin:0'},it[5]),
        h('p',{class:'small',style:'margin:0'},'期待孩子說：'+it[6]),
        h('div',{class:'btn-row'},copyBtn,h('button',{class:'ghost',onclick:()=>fileIn.click()},'選擇檔案'),has?h('button',{class:'ghost',onclick:()=>removePic(name,status)},'移除這張'):null,fileIn),
        det,status),
      zone));
  });
  app.append(list);window.scrollTo(0,0);
}

}catch(e){}
