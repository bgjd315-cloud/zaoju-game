  {w:'腳踏實地', mean:'做事踏實認真，一步一步來，不好高騖遠。', ex:['練琴的每個夜晚，姊姊都從最簡單的音階彈起，腳踏實地的練習，終於在比賽中拿下佳績。','想要成績進步沒有捷徑，只有腳踏實地的複習，才能把觀念真正學會。']},
  {w:'意念', mean:'心裡的想法或念頭。', ex:['站在高高的跳臺上，我的雙腿微微發抖，心中卻只有一個意念：「我一定要跳下去！」','這幅畫用一株穿過石縫的小草，表達了「永不放棄」的意念。']},
  {w:'昂貴', mean:'價錢很高。', ex:['週末逛百貨公司時，我在玻璃櫃前停下腳步，盯著那雙昂貴的球鞋，最後還是默默的走開了。','這臺望遠鏡雖然昂貴，但它能讓我們看清楚月球表面的坑洞。']}
 ],
 'w5u03':[
  {w:'陡峭', mean:'山勢或坡度又高又直，很難攀登。', ex:['登山隊走到陡峭的稜線時，冷風呼呼的吹，我抓緊繩索，一步也不敢往下看。','這段步道非常陡峭，下過雨後石階又溼又滑，大家一定要放慢腳步。']},
  {w:'強勁', mean:'力量又大又猛。', ex:['颱風登陸的那個晚上，強勁的風把窗戶吹得砰砰作響，我躲在棉被裡一直睡不著。','這支球隊的投手臂力強勁，投出的快速球讓打者根本來不及揮棒。']},
  {w:'尖銳', mean:'形容東西又尖又利，也可以形容聲音刺耳。', ex:['安靜的考場裡，忽然傳來一陣尖銳的哨音，所有人都嚇了一跳，抬頭往窗外看。','玻璃碎片很尖銳，打掃時要戴上手套，用畚箕小心的收起來。']},
  {w:'堅韌', mean:'堅固又有韌性，不容易折斷；也可以形容人的意志堅強，不怕困難。', ex:['颱風過後的海岸邊，木麻黃被吹得東倒西歪，堅韌的枝幹卻依然緊緊抓住沙地。','經歷三次落榜，阿姨仍不放棄，她堅韌的個性讓全家人都佩服。']},
  {w:'盼望', mean:'殷切的希望、期待。', ex:['連續下了一星期的雨，我每天早上趴在窗邊，盼望陽光快點露臉，好去河濱騎腳踏車。','住在外地的叔叔，每年都盼望過年能回到家鄉，和家人圍爐吃飯。']},
  {w:'頑強', mean:'堅強不屈，面對困難也不肯退讓。', ex:['炎熱的柏油路旁，一株小草從裂縫裡鑽出來，迎著烈日，頑強的向上生長。','雖然比數落後，我們的球員仍頑強抵抗，最後只以一分之差落敗。']},
  {w:'毅力', mean:'長時間堅持下去、不輕易放棄的意志。', ex:['每天天還沒亮，阿伯就到河堤慢跑，十年來從不間斷，他的毅力讓街坊都豎起大拇指。','學好一種樂器需要很大的毅力，每天練一點，不能只憑一時的興趣。']},
  {w:'征服', mean:'用力量或意志戰勝、克服。', ex:['經過八個小時的攀登，哥哥終於站上玉山主峰，望著腳下翻騰的雲海，興奮的大喊自己征服了高山。','她花了一整個暑假練習，終於征服了心中最害怕的游泳池深水區。']},
  {w:'堅定不移', mean:'意志或立場非常堅決，不會改變。', ex:['面對同學的嘲笑，他握緊拳頭，眼神堅定不移，繼續一筆一畫寫著要投給校刊的稿子。','爺爺對家人的愛堅定不移，無論多辛苦，他都撐起了這個家。']},
  {w:'獨特', mean:'和別人不一樣，特別而有自己的風格。', ex:['走進陶藝教室，架上擺滿了學生的作品，每一只杯子都有獨特的花紋，像在說著不同的故事。','這位歌手的嗓音沙啞又溫暖，非常獨特，一開口大家就認出是她。']},
  {w:'巧妙', mean:'靈巧高明，用得恰到好處。', ex:['園遊會前一天，我們在教室裡用紙箱和燈泡，巧妙的搭出一座會發光的鬼屋，大家笑成一團。','偵探小說的作者把線索巧妙的藏在對話裡，讀到最後我才恍然大悟。']},
  {w:'邁進', mean:'大步往前走，常用來形容朝著目標努力前進。', ex:['新學期的第一個早晨，我背著新書包走出家門，暗暗告訴自己，要朝著夢想一步步邁進。','只要每天進步一點點，我們就能朝著全國賽的目標穩穩邁進。']}
 ],
 'w5u04':[
  {w:'飽滿', mean:'充足、豐滿，裡面裝得滿滿的。', ex:['秋天的果園裡，陽光暖暖的照著枝頭，一顆顆柿子又紅又飽滿，把樹枝壓得彎彎的。','睡了一場好覺，早上起床的我精神飽滿，連走路都覺得輕快。']},
  {w:'辛勤', mean:'辛苦勤勞，不怕累的工作。', ex:['天還沒亮，早餐店的老闆娘就在爐子前煎蛋，辛勤的身影在熱氣中忙進忙出。','餐桌上的每一粒米，都是農夫頂著大太陽辛勤耕種得來的。']},
  {w:'喜悅', mean:'愉快、高興的心情。', ex:['成果發表會結束後，臺下響起熱烈的掌聲，我們手牽著手鞠躬，心裡滿是說不出的喜悅。','看到自己親手種的番茄轉紅，那種收成的喜悅，是在超市買不到的。']},
  {w:'喚醒', mean:'叫醒；也可以比喻讓沉睡的記憶或感覺重新出現。', ex:['回到外婆家的三合院，聞到灶房飄來的蘿蔔糕香味，一下子就喚醒了我小時候的記憶。','這部紀錄片喚醒了許多人保護海洋的意識，大家開始自備餐具。']},
  {w:'繁忙', mean:'事情很多，非常忙碌。', ex:['下班時間的火車站裡，廣播聲此起彼落，旅客拖著行李匆匆走過，月臺顯得格外繁忙。','期末考前，老師的工作十分繁忙，還是抽空幫我們複習數學。']},
  {w:'樸素', mean:'簡單不華麗，不刻意打扮或裝飾。', ex:['鄉下的小教堂裡，木頭長椅排得整整齊齊，牆上沒有任何裝飾，樸素得讓人心情平靜。','校長平時總是穿著樸素的白襯衫和布鞋，說話溫和，一點也沒有架子。']},
  {w:'尊嚴', mean:'人應該被尊重、不容受到侮辱的身分和價值。', ex:['寒風中的夜市角落，老爺爺堅持靠賣口香糖過生活，挺直的背影裡，有著不肯低頭的尊嚴。','即使對方犯了錯，我們也應該顧及他的尊嚴，不要當眾取笑。']},
  {w:'寬闊', mean:'又寬又大，面積很廣；也可以形容心胸大方。', ex:['騎著腳踏車來到嘉南平原，眼前是一片寬闊的稻田，風一吹，綠色的稻浪一路翻滾到天邊。','從新蓋的大橋上望出去，河面十分寬闊，幾隻白鷺鷥正低低的飛過。']},
  {w:'意志', mean:'為了達成目標而堅持下去的決心。', ex:['馬拉松跑到最後五公里，選手的雙腿已經抽筋，靠著堅強的意志，他一拐一拐的跑過終點。','生病住院的那段日子，是爺爺不肯認輸的意志，支撐他一天天好起來。']},
  {w:'情操', mean:'高尚的品格和思想，常用在讚美人的品德。', ex:['大雨滂沱的救災現場，消防員一次又一次背起受困的老人，捨己為人的情操令人動容。','這位醫師放棄城市的高薪，到偏鄉服務三十年，他的情操值得我們學習。']},
  {w:'心靈', mean:'人的內心、精神和情感。', ex:['心情煩悶的午後，我坐在湖邊聽著蟲鳴和水聲，彷彿一股清泉流進心靈，煩惱漸漸散去。','一本好書就像一位朋友，能在我們孤單時，給心靈帶來溫暖和力量。']},
  {w:'恆久', mean:'永遠、長久不變。', ex:['站在博物館的油畫前，我看著畫中人溫柔的眼神，雖然過了一百多年，那份感動卻依然恆久。','時光會帶走青春的容貌，但朋友之間真心的關懷，卻能恆久的留在心中。']}
 ],
 'w5u05':[
  {w:'精心', mean:'特別用心、仔細的去做。', ex:['母親節前一晚，我躲在房間裡，用彩色紙和緞帶，精心摺出一束不會凋謝的康乃馨。','這份生日蛋糕是姊姊精心烤出來的，上面還用果醬畫了我最愛的小狗。']},
  {w:'醒目', mean:'形狀或顏色特別明顯，一眼就能看到。', ex:['濃霧籠罩的山路上，車燈只照得到眼前幾公尺，路旁醒目的黃色反光牌，成了我們唯一的依靠。','運動會那天，我們班穿上螢光綠的班服，在操場上非常醒目，家長一眼就找到我們。']},
  {w:'深刻', mean:'感受很深，或理解得很透徹，不容易忘記。', ex:['那年冬天在合歡山，我第一次看見雪花飄落，冰涼的雪片落在手心，那一幕讓我印象深刻。','聽完退役老兵的分享，我對「和平得來不易」有了更深刻的體會。']},
  {w:'期許', mean:'對人或對自己懷著期望，希望能做到某件事。', ex:['升上五年級的開學日，我翻開新的日記本，在第一頁寫下對自己的期許：每個月讀完兩本書。','老師在我的畢業紀念冊上留言，期許我無論走到哪裡，都能保持善良的心。']},
  {w:'永恆', mean:'永遠不變，長久存在。', ex:['站在海邊的燈塔下，看著浪花一次次拍上礁石，我覺得這片海好像會永恆的唱著同一首歌。','金字塔歷經幾千年的風沙，依舊矗立在沙漠中，彷彿象徵著永恆。']},
  {w:'堅毅', mean:'堅定有毅力，遇到困難也不退縮。', ex:['寒冬的清晨，游泳隊的隊員們站在池邊嘴唇凍得發紫，眼神卻十分堅毅的一個接一個躍入水中。','這位登山家失去了一條腿，仍然靠著堅毅的心，再次登上了高峰。']},
  {w:'柔和', mean:'溫和不刺激，給人舒服、溫柔的感覺。', ex:['睡前的房間裡，小夜燈發出柔和的黃光，窗外傳來細細的雨聲，我很快就進入了夢鄉。','這位主持人說話的聲音很柔和，緊張的來賓聽了，心情也放鬆下來。']},
  {w:'靈感', mean:'突然出現在腦中的好想法、好點子。', ex:['坐在公車靠窗的位子上，看著路旁的行道樹一棵棵往後退，我忽然有了寫詩的靈感。','這位設計師從貝殼的螺旋花紋得到靈感，創作出一系列獲獎的燈具。']},
  {w:'簡潔', mean:'簡單清楚，沒有多餘的部分。', ex:['走進新開的圖書館，白色的牆面配上原木書架，設計簡潔明亮，讓人一進門就想安靜坐下來。','報告的投影片要簡潔，每一頁只放重點，觀眾才看得清楚。']},
  {w:'呼應', mean:'彼此互相配合、相互對照，前後連成一氣。', ex:['作文的最後一段，我又寫到開頭那棵老榕樹，首尾呼應，讓整篇文章讀起來更完整。','這間餐廳的擺設用了許多漁網和浮球，正好呼應了它主打海鮮料理的特色。']},
  {w:'願景', mean:'對未來美好情景的想像和目標。', ex:['新任村長站在廟口的戲臺上，指著遠方的海岸，說出把漁村打造成觀光小鎮的願景。','我們社團的願景，是讓每個社員都能自信的站上舞臺表演。']},
  {w:'與眾不同', mean:'和大家都不一樣，很有特色。', ex:['校慶的變裝遊行上，表哥把紙箱改造成一臺會發光的機器人，與眾不同的造型讓大家拍手叫好。','她的畫總是用大膽的配色，與眾不同的風格讓評審印象難忘。']}
 ],
 'w5u06':[
  {w:'不可或缺', mean:'非常重要，絕對不能少。', ex:['登山的前一晚，爸爸把頭燈、雨衣和乾糧一一裝進背包，說這些是上山不可或缺的裝備。','對植物來說，陽光和水是不可或缺的，少了它們就無法好好生長。']},
  {w:'不假思索', mean:'不用經過思考，馬上就說出來或做出來。', ex:['老師在黑板上寫下一道難題，全班還在皺眉的時候，小傑卻不假思索的舉手說出答案。','當有人問我最好的朋友是誰時，我不假思索的說出了她的名字。']},
  {w:'舉世聞名', mean:'全世界的人都知道，非常有名。', ex:['走進巴黎的羅浮宮，我擠在人群中，終於看見那幅舉世聞名的畫作，忍不住屏住了呼吸。','臺灣的珍珠奶茶舉世聞名，許多外國觀光客一下飛機就想喝一杯。']},
  {w:'融化', mean:'冰雪變成水；也可以比喻讓冷硬的心變得溫暖柔軟。', ex:['炎熱的午後，我捧著巧克力冰淇淋走在路上，還來不及吃完，它就在甜筒上融化了。','嬰兒甜甜的笑容，總能融化爺爺嚴肅的臉，讓他笑得合不攏嘴。']},
  {w:'經典', mean:'具有代表性、經得起時間考驗的好作品。', ex:['下雨的週末，我窩在沙發上，重看那部小時候最愛的經典卡通，笑聲和回憶一起湧上心頭。','這首老歌是許多人心中的經典，過了三十年，大街小巷仍然有人在唱。']},
  {w:'獨具一格', mean:'有自己獨特的風格，和別人不一樣。', ex:['走進巷弄裡的小書店，木頭招牌上畫著貓咪，書架用舊窗框改造，處處獨具一格。','這位作家的文字幽默又溫暖，在兒童文學界可說是獨具一格。']},
  {w:'難以忘懷', mean:'印象很深，很難忘記。', ex:['畢業旅行的最後一晚，我們圍著營火唱歌，火光映在大家的臉上，那一幕至今仍讓我難以忘懷。','外婆過年時做的蘿蔔糕香軟可口，那個家的味道讓我難以忘懷。']},
  {w:'觸動', mean:'因為某件事而引起內心的感受。', ex:['電影播到小男孩找到流浪狗的那一幕，戲院裡一片安靜，那份真情觸動了每個人的心。','老師一句「我相信你做得到」，觸動了他，讓他決定重新振作。']},
  {w:'共鳴', mean:'因為別人的想法或感受跟自己相同，而產生同樣的感動。', ex:['朗讀比賽的舞臺上，她念到想念遠方媽媽的句子，聲音微微顫抖，臺下許多觀眾也引起了共鳴。','這本書寫出了轉學生的孤單，讓許多讀者心有同感，產生強烈的共鳴。']},
  {w:'流暢', mean:'順利通暢，不會卡住或中斷。', ex:['學期末的音樂發表會上，妹妹的手指在琴鍵上輕快跳動，一首曲子彈得流暢又動聽。','經過一個月的練習，哥哥說英語已經十分流暢，不再結結巴巴了。']},
  {w:'突破', mean:'打破原有的限制或紀錄，有了新的進展。', ex:['全縣運動會的跳遠場上，我深吸一口氣，助跑、起跳，終於突破了自己的最佳紀錄。','科學家經過多年的研究和失敗，終於在疫苗技術上有了重大突破。']},
  {w:'心血', mean:'花在某件事上的心力和精神。', ex:['熬夜三個晚上，表姊把畢業製作的模型一片片黏好，桌上的每一棟小屋都是她的心血。','這本繪本花了作者整整五年的心血，每一頁都畫得非常細緻。']}
 ],
 'w5u07':[
  {w:'驚訝', mean:'遇到意想不到的事，而覺得奇怪或吃驚。', ex:['打開教室門的那一刻，彩帶從頭頂落下，全班齊聲唱著生日快樂，我驚訝得說不出話來。','聽說那位安靜的同學拿下全國作文比賽冠軍，大家都非常驚訝。']},
  {w:'憐惜', mean:'同情並愛護，捨不得讓對方受苦。', ex:['下著冷雨的傍晚，我在騎樓下看見一隻發抖的小貓，心裡一陣憐惜，趕緊脫下外套包住牠。','看到奶奶的手因為長年做農事而布滿裂痕，我十分憐惜，替她擦上護手霜。']},
  {w:'嚴格', mean:'對規矩或標準要求很高，一點也不馬虎。', ex:['每天放學後的體育館裡，教練吹著哨子，嚴格要求我們把每一個動作重複做到標準為止。','這家工廠對食品衛生的檢查非常嚴格，任何小問題都不放過。']},
  {w:'磨練', mean:'在辛苦的環境中反覆練習，讓自己變得更堅強、更熟練。', ex:['暑假到農場打工的那個月，烈日曬得我滿身大汗，這段磨練讓我懂得了農夫的辛苦。','在國外獨自求學的日子，讓表哥經歷許多磨練，變得更成熟獨立。']},
  {w:'強健', mean:'身體強壯健康。', ex:['每天清晨在公園打太極拳的爺爺，雖然已經八十歲，步伐卻依然輕快，體格十分強健。','想要擁有強健的身體，除了多運動，還要均衡飲食、早睡早起。' ]},
  {w:'逆境', mean:'不順利、充滿困難的環境或處境。', ex:['家裡的小吃店被颱風吹垮的那年，爸媽沒有灰心，在逆境中一磚一瓦的重新撐起了店面。','許多偉大的發明家都是在失敗和逆境中，找到了成功的方法。']},
  {w:'順境', mean:'事事順利、沒有阻礙的環境或處境。', ex:['考試一路得高分的那段日子，我在順境中漸漸懶散，直到這次退步，才驚覺自己太大意了。','人在一切順利的時候，更要記得謙虛，不要因為處於順境就得意忘形。']},
  {w:'奮勇向上', mean:'鼓起勇氣，努力往上、往前進。', ex:['湍急的溪流裡，一群鮭魚迎著水流跳躍，一次次被沖回又一次次衝上去，奮勇向上的模樣令人感動。','雖然家境清寒，他依然奮勇向上，靠著獎學金完成了大學學業。']},
  {w:'脆弱', mean:'容易破碎或受傷，經不起打擊。', ex:['春天的清晨，我蹲在花圃邊看著剛冒出的嫩芽在風中搖晃，那麼小又那麼脆弱，讓人不敢碰它。','失去寵物的那段日子，妹妹的心變得很脆弱，一點小事就會掉眼淚。']},
  {w:'介意', mean:'把不愉快的事放在心上，覺得在乎。', ex:['下課時我不小心把果汁灑在同學的課本上，連忙道歉，他卻笑著搖搖頭，一點也不介意。','如果你不介意的話，午休時我想坐在你旁邊，一起看那本漫畫。']},
  {w:'堅持', mean:'一直撐下去，不改變、不放棄。', ex:['跑到最後一圈時，我的腳像灌了鉛一樣沉重，聽見場邊同學的吶喊，我咬著牙堅持跑完全程。','學書法要每天練習，只要堅持下去，一筆一畫就會越寫越漂亮。']},
  {w:'精緻', mean:'精巧細緻，做得很細心。', ex:['走進傳統藝術中心的工坊，師傅正低頭雕刻木頭，一隻精緻的小鳥慢慢在他手中成形。','這盒手工餅乾包裝得十分精緻，連緞帶都繫成了蝴蝶的形狀。']}
 ],
 'w5u08':[
  {w:'幸運', mean:'運氣好，遇到好的機會或避開了壞事。', ex:['颱風夜裡大樹倒在我家門口，只差幾公尺就壓到車子，全家人圍著它直說真是太幸運了。','我很幸運能遇到一位耐心的鋼琴老師，讓我從討厭練琴變成愛上音樂。']},
  {w:'輕視', mean:'看不起，不重視。', ex:['剛加入籃球隊時，學長們看我個子矮，眼神裡帶著輕視，我暗暗下定決心每天加練投籃。','每一種職業都值得尊重，我們不應該輕視任何認真工作的人。']},
  {w:'抗議', mean:'對不合理的事情表示反對。', ex:['大雨滂沱的午後，一群居民撐著傘站在鄉公所前，舉著標語抗議工廠排放廢水汙染河川。','班上同學對學校取消社團課的決定提出抗議，希望校長重新考慮。']},
  {w:'生命垂危', mean:'生命非常危險，快要死去。', ex:['深夜的急診室裡，燈光白得刺眼，醫生們圍著生命垂危的傷患，手上的動作一刻也不敢停。','那隻被漁網纏住的海龜已經生命垂危，幸好被保育人員及時救起。']},
  {w:'威脅', mean:'用力量逼迫別人，或讓人或物陷入危險。', ex:['颱風季節的海邊，巨浪一波波打上堤防，強風豪雨威脅著沿岸居民的安全，大家連夜撤離。','海上漂流的塑膠垃圾越來越多，嚴重威脅著海龜和鯨魚的生存。']},
  {w:'決心', mean:'下定的堅定心意，不會輕易改變。', ex:['看著體重計上的數字，哥哥嘆了一口氣，第二天清晨就換上球鞋去跑步，展現減重的決心。','她下定決心要在畢業前讀完一百本書，每天睡前都會翻上幾頁。']},
  {w:'壓迫', mean:'用權力或力量強迫別人，使人受苦。', ex:['在那個動盪的年代，村民被強迫交出糧食，面對無情的壓迫，他們只能在夜裡偷偷流淚。','歷史課本記載著許多人民勇敢反抗壓迫、爭取自由與平等的故事。']},
  {w:'軟弱', mean:'缺乏勇氣，意志不堅強，容易屈服。', ex:['被同學嘲笑的那天，我躲在廁所裡哭，後來想通了眼淚不代表軟弱，擦乾後便抬頭走回教室。','面對霸凌時如果一直默默退縮，對方只會以為你軟弱可欺。']},
  {w:'震撼', mean:'受到強烈的衝擊，心裡非常激動。', ex:['站在太魯閣的峽谷底下，抬頭望著高聳的大理石峭壁，眼前的壯麗景色讓我深受震撼。','這部關於北極熊的紀錄片讓全班大受震撼，大家決定從隨手關燈做起。']},
  {w:'信念', mean:'心中堅定相信的想法或道理。', ex:['熬夜趕畫的深夜，表姊望著桌上的草稿，心中只有一個信念：要把家鄉的美畫給全世界看。','爺爺一生秉持「誠實做人」的信念，從來不賣品質不好的水果。']},
  {w:'恐懼', mean:'非常害怕、不安的感覺。', ex:['第一次獨自走進漆黑的地下室，我聽見滴答的水聲，心中的恐懼像潮水一樣湧上來。','只要正確認識地震，就能減少心中的恐懼，冷靜的保護自己。']},
  {w:'險惡', mean:'環境或情勢非常危險可怕。', ex:['暴風雨中的海面上，巨浪一波高過一波，漁船在險惡的天候中搖晃，船長卻緊握著舵不放。','這條山路地勢險惡，一邊是峭壁，一邊是深谷，開車一定要非常小心。']}
 ],
 'w5u09':[
  {w:'逃避', mean:'躲開不想面對的事情或責任。', ex:['數學考卷發下來的那天晚上，我把它塞在書包最底層，想逃避爸媽的追問，心裡卻越來越不安。','遇到問題時一味的逃避，問題並不會消失，只會變得更難解決。']},
  {w:'勇往直前', mean:'勇敢的一直向前進，不畏懼困難。', ex:['龍舟賽的鼓聲咚咚響起，我們握緊船槳，迎著河面的大風，勇往直前的划向終點。','即使前方的路充滿未知，只要目標清楚，就要有勇往直前的決心。']},
  {w:'考驗', mean:'用困難的事情來檢驗一個人的能力或意志。', ex:['第一次參加童軍露營，半夜突然下起大雨，帳篷進了水，這場突如其來的考驗讓我們手忙腳亂。','這次長途的單車環島，對我們的體力和耐心都是很大的考驗。']},
  {w:'滿懷希望', mean:'心中充滿了期待和信心。', ex:['開學的第一天早上，陽光灑進新教室，我坐在靠窗的位子上，滿懷希望的翻開嶄新的課本。','阿姨滿懷希望的把履歷寄出，每天都守在電話旁等待面試的通知。']},
  {w:'失落', mean:'心裡空空的，好像丟了什麼，感到不開心。', ex:['比賽結束的哨聲響起，記分板上的數字定格，我們低著頭走下場，心中滿是失落。','好朋友轉學以後，下課時沒有人陪我聊天，我常常覺得有些失落。']},
  {w:'低潮', mean:'情緒或狀態低落、不順利的時期。', ex:['連續三場比賽落敗後，學長每天坐在球場邊發呆，整個人陷入了低潮，連最愛的籃球都不碰了。','每個人都會遇到低潮，這時候跟信任的人聊一聊，會覺得好過一些。']},
  {w:'調適', mean:'調整自己，讓心情或身體慢慢適應新的狀況。', ex:['剛搬到新城市的那個月，我每晚望著陌生的街燈，努力調適心情，告訴自己要勇敢交新朋友。','從美國回來的表姊，花了整整一個星期，才慢慢把時差調適過來。']},
  {w:'東山再起', mean:'失敗或失意之後，重新振作，再度成功。', ex:['工廠被大火燒毀後，叔叔沒有放棄，他從一間小店面重新開始，三年後終於東山再起。','這支球隊去年降級，今年招募新血、加緊訓練，準備在聯賽中東山再起。']},
  {w:'克服', mean:'戰勝困難或缺點。', ex:['第一次上臺演講時，我的手心一直冒汗，看到臺下同學鼓勵的眼神，終於克服了緊張。','只要找出錯誤的原因，再多練習幾次，任何難題都可以慢慢克服。']},
  {w:'動力', mean:'推動人去做某件事的力量。', ex:['每天清晨鬧鐘一響，我想到週末的游泳比賽，就有了起床晨練的動力，一骨碌跳下床。','家人的笑容是爸爸努力工作的最大動力，再累他也甘之如飴。']},
  {w:'心態', mean:'看待事情的想法和態度。', ex:['輸掉比賽的那個下午，教練把我們叫到樹蔭下，說只要調整好心態，失敗也能變成養分。','用正面的心態面對困難，往往比抱怨更能找到解決的辦法。']},
  {w:'綻放', mean:'花朵盛開；也可以比喻美好的事物展現出來。', ex:['三月的陽明山上，一片片櫻花在枝頭綻放，粉紅色的花瓣隨風飄落，像下了一場溫柔的雨。','站上頒獎臺的那一刻，她接過金牌，臉上綻放出燦爛又自信的笑容。']}
 ],
 'w5u10':[
  {w:'精通', mean:'對某種學問或技能非常了解，而且很熟練。', ex:['寒假的午後，我坐在書房裡看外公寫書法，精通各種字體的他毛筆一揮，字就像在紙上跳舞。','這位導遊精通日語和英語，帶外國遊客逛夜市一點也難不倒她。']},
  {w:'意境', mean:'文學或藝術作品中，讓人感受到的情調和境界。', ex:['讀到「空山松子落」時，我閉上眼睛，彷彿聽見安靜的山中傳來一聲輕響，整首詩的意境就浮現了。','這幅水墨畫只畫了一葉小舟和遠山，留白很多，意境十分悠遠。']},
  {w:'孤單', mean:'只有自己一個人，覺得寂寞、沒有依靠。', ex:['爸媽出差的那個週末，我一個人坐在餐桌前吃泡麵，屋裡安靜得只聽得到時鐘聲，感覺好孤單。','轉學第一天沒有人跟我說話，直到下課有同學主動邀我玩，我才不再覺得孤單。']},
  {w:'看重', mean:'重視，認為很重要。', ex:['畢業典禮上，校長拍拍學長的肩膀說，比起成績，他更看重每個人是否懂得體貼別人。','我很看重這段多年的友誼，所以就算吵架了，也會主動寫卡片去和好。']},
  {w:'耐人尋味', mean:'意思深遠，值得讓人仔細的想、慢慢的體會。', ex:['故事的最後，老爺爺把種子交給小女孩後就走了，這個結局耐人尋味，全班討論了一整節課。','這句話看起來很簡單，其實耐人尋味，每讀一次都有不同的體會。']},
  {w:'品味', mean:'仔細的體會、欣賞其中的味道或意義。', ex:['下雨的午後，奶奶泡了一壺烏龍茶，我們坐在窗邊慢慢品味，茶香和雨聲一起飄進心裡。','好的文章要放慢速度閱讀，才能品味出作者藏在字裡行間的心意。']},
  {w:'清靜', mean:'環境安靜，沒有人打擾。', ex:['清晨的山中小寺，霧氣慢慢散開，只聽得到鳥叫和木魚聲，四周清靜得讓人忘了煩惱。','爺爺退休後搬到鄉下，說是想過幾年清靜的日子，種種菜、釣釣魚。']},
  {w:'流露', mean:'心中的情感或想法，自然的表現出來。', ex:['送別外婆的那天，在高鐵月臺上，媽媽雖然一直笑著揮手，眼神裡卻流露出不捨。','這封信的字句很平凡，卻在字裡行間處處流露出他對家鄉的感情。']},
  {w:'懷念', mean:'想念過去的人、事或地方。', ex:['翻開幼兒園的畢業照，看著照片裡缺了門牙的自己，我好懷念那段無憂無慮的時光。','搬到臺北以後，爸爸常說他最懷念的，是老家門口那碗熱騰騰的米糕。']},
  {w:'情懷', mean:'心中懷有的感情和心意。', ex:['中秋節的夜晚，我和表哥坐在頂樓看月亮，聽阿公念起李白的詩，心中生出一股淡淡的思鄉情懷。','這首民謠唱出了漁村人家守著大海的情懷，聽了讓人鼻頭一酸。']},
  {w:'思念', mean:'想念，心裡惦記著。', ex:['到國外留學的姊姊每晚都會打視訊電話回家，螢幕裡她的笑容，總能稍稍減輕我的思念。','看著窗外綿綿的細雨，我對遠方的好朋友湧起一陣深深的思念。']},
  {w:'掛念', mean:'放心不下，一直惦記著。', ex:['颱風夜裡風雨交加，媽媽守在電話旁，掛念著還在山上值班的爸爸，一夜都沒睡好。','奶奶最掛念的就是我們的身體，每次通電話都提醒我們要多穿衣服。']}
 ],
 'w5u11':[
  {w:'傳奇', mean:'情節奇特、不平凡，讓人津津樂道的人物或故事。', ex:['夏夜的廟口，老人家搖著蒲扇，說起村裡那位赤手抓到大魚的傳奇漁夫，小孩們聽得目不轉睛。','這位投手四十歲還站上大聯盟的球場，是棒球界的傳奇人物。']},
  {w:'盤旋', mean:'在空中繞著圈子飛。', ex:['登上山頂的那一刻，一隻大冠鷲張開翅膀，在藍天中慢慢盤旋，發出響亮的鳴叫聲。','幾隻老鷹在漁港上空不停的繞圈盤旋，等著搶漁船丟下的小魚。']},
  {w:'雜草叢生', mean:'雜亂的野草長得又多又密。', ex:['走進荒廢多年的三合院，院子裡雜草叢生高過膝蓋，一陣風吹來，草叢裡竄出一隻野貓。','這塊空地雜草叢生，經過志工整理後，變成了社區的小菜園。']},
  {w:'智慧', mean:'能分辨是非、懂得解決問題的能力。', ex:['颱風前的傍晚，阿公抬頭看了看泛紅的雲，就叫我們收好曬衣竿，這是他累積一輩子的生活智慧。','古人留下的許多諺語，雖然短短幾個字，都蘊藏著做人處事的智慧。']},
  {w:'呼喚', mean:'大聲的叫喚；也可以比喻某種事物在召喚人。', ex:['黃昏的田埂上，阿嬤站在家門口拉長聲音呼喚我們回家吃飯，聲音飄過了整片稻田。','每到暑假，那片蔚藍的大海彷彿在呼喚我，讓我好想去衝浪。']},
  {w:'崇拜', mean:'非常敬佩、尊敬某個人。', ex:['看著消防員叔叔從濃煙中背出受困的老奶奶，我站在人群裡，心中充滿了崇拜和感動。','弟弟很崇拜那位棒球選手，房間的牆上貼滿了他的海報和簽名球卡。']},
  {w:'自豪', mean:'因為自己或相關的人事物有成就，而感到光榮。', ex:['頒獎典禮上，媽媽看著我捧著獎狀走下臺，眼眶泛紅，臉上露出自豪的笑容。','阿伯對自己種出的有機蔬菜十分自豪，逢人就請大家嘗一嘗。']},
  {w:'禁忌', mean:'因為習俗或信仰，被禁止去做或去說的事。', ex:['跟著布農族的朋友走進山林前，他再三提醒我，在山裡大聲喧嘩是部落的禁忌，我立刻把嘴巴閉上。','每個民族都有自己的習俗和禁忌，旅行時要先了解，才能表示尊重。']},
  {w:'哀鳴', mean:'動物發出悲傷、痛苦的叫聲。', ex:['寒風刺骨的夜裡，巷口傳來小狗一聲聲的哀鳴，我拿著手電筒出門，發現牠的腳被鐵絲纏住了。','受傷的海鷗在沙灘上拍著翅膀哀鳴，保育員趕緊把牠送去治療。']},
  {w:'守護', mean:'看守保護，不讓受到傷害。', ex:['妹妹發燒的那個晚上，媽媽坐在床邊，一次次換著冰毛巾，整夜守護著她直到天亮。','這座燈塔一百多年來默默守護著來往的船隻，照亮回家的航道。']},
  {w:'輕柔', mean:'輕輕的、柔柔的，很溫和。', ex:['春天的早晨，微風輕柔的吹過稻田，嫩綠的秧苗輕輕搖擺，空氣裡帶著泥土的香味。','媽媽用輕柔的聲音唱著搖籃曲，哭鬧的小寶寶慢慢睡著了。']},
  {w:'收穫', mean:'收成的農作物；也可以比喻得到的成果或心得。', ex:['參加完三天的科學營，我坐在回家的車上翻著筆記本，覺得這趟旅程的收穫比想像中還要多。','這次小組報告雖然很辛苦，但學會分工合作，是我最大的收穫。']}
 ],
 'w5u12':[
  {w:'任性', mean:'只照自己的意思去做，不顧別人的感受或勸告。', ex:['那天在百貨公司，弟弟為了玩具躺在地上大哭大鬧，媽媽說他太任性了，轉身就往門口走。','我因為任性不肯聽媽媽的話帶雨衣，結果在放學路上淋成了落湯雞。']},
  {w:'轉折', mean:'事情的發展突然改變了方向。', ex:['原本一路領先的比賽，在第四局出現轉折，對手連續擊出全壘打，看臺上瞬間一片安靜。','這部推理小說的情節充滿轉折，讓人一翻開就停不下來，直到深夜。']},
  {w:'微弱', mean:'又小又弱，不強烈。', ex:['停電的夜裡，我們全家圍坐在客廳，桌上一根蠟燭發出微弱的光，牆上的影子跟著搖晃。','山洞深處的手機訊號十分微弱，我們只好走到洞口才能打電話。']},
  {w:'感恩', mean:'感謝別人給予的幫助或恩惠，並記在心上。', ex:['畢業典禮的最後，我們一起向老師深深鞠躬，在掌聲中我的心裡充滿感恩，眼淚也跟著掉下來。','每次吃飯前，奶奶都會提醒我們，要記得謝謝種菜的農夫，懂得感恩。']},
  {w:'死裡逃生', mean:'從非常危險的處境中逃了出來，保住了性命。', ex:['土石流衝下山的那個深夜，叔叔抱著孩子從後門爬上屋頂，全家人死裡逃生，看著家園被淹沒。','那名登山客在山中迷路五天，靠著溪水和野果死裡逃生，獲救時十分虛弱。']},
  {w:'喪氣', mean:'因為失敗或不順利而失去信心，提不起精神。', ex:['連續三次投籃都沒進，我垂著頭走回場邊，隊長拍拍我的背說：「別喪氣，下一球一定進！」','模型做了一半就塌了，弟弟一臉喪氣，坐在地上不想動了。']},
  {w:'突如其來', mean:'事情突然發生，讓人來不及準備。', ex:['晴朗的午後，我們正在河濱騎車，一場突如其來的大雷雨，把大家淋得全身溼透。','面對突如其來的停電，店員不慌不忙的拿出手電筒，引導客人離開。']},
  {w:'痛楚', mean:'身體或心理上的痛苦。', ex:['滑板摔倒的那一刻，膝蓋重重撞在地上，一陣痛楚從腳底竄上來，我咬著牙不讓眼淚掉下來。','失去陪伴十年的寵物，那種痛楚過了好幾個月，才漸漸平復。']},
  {w:'樂觀', mean:'凡事往好的方面想，對未來有信心。', ex:['住院的那段日子，隔壁床的老伯每天都笑著跟護理師打招呼，他樂觀的態度讓整間病房都亮了起來。','雖然這次沒選上班長，她仍很樂觀，笑著說下學期還有機會。']},
  {w:'自得其樂', mean:'自己在某件事中找到樂趣，感到快樂滿足。', ex:['雨天不能出門的午後，弟弟窩在房間裡用積木蓋城堡，一邊哼歌一邊搭，自得其樂得很。','退休的外公每天在陽臺上種花澆水，雖然一個人，卻過得自得其樂。']},
  {w:'驚恐萬分', mean:'非常害怕，驚慌到了極點。', ex:['露營的深夜，帳篷外傳來沙沙的腳步聲，我們縮在睡袋裡驚恐萬分，後來才發現是一隻覓食的山羌。','電梯突然停在半空中，裡面的乘客驚恐萬分，趕緊按下緊急求救鈴。']},
  {w:'與世無爭', mean:'不和別人爭名爭利，過著平淡安靜的生活。', ex:['海邊小漁村的清晨，老漁夫坐在門口補網，一旁的貓咪曬著太陽，日子過得與世無爭。','山上那位老農夫不在乎名利，只想守著茶園，過著與世無爭的生活。']}
 ],
 'w5d01':[
  {w:'尷尬', mean:'處境為難，不知道該怎麼辦，覺得很不自在。', ex:['朝會上臺領獎時，我一腳踩空差點在全校面前跌倒，臺下響起一陣笑聲，我尷尬得滿臉通紅。','叫錯新同學的名字以後，我們兩個都愣住了，氣氛一時有點尷尬。']},
  {w:'神態自若', mean:'遇到意外或緊張的事，表情和態度仍然很鎮定，像平常一樣。', ex:['演講到一半，麥克風突然沒了聲音，學姊神態自若的走到臺前，提高嗓門繼續把話說完。','面對評審一連串尖銳的提問，她始終神態自若，一一清楚的回答。']},
  {w:'聆聽', mean:'專心、仔細的聽。', ex:['音樂會的燈光一暗，大提琴低沉的聲音緩緩響起，全場觀眾屏住呼吸，靜靜聆聽每一個音符。','好朋友難過的時候，比起急著給建議，有時候用心聆聽更能安慰對方。']},
  {w:'自信', mean:'相信自己的能力，覺得自己做得到。', ex:['畢業公演的舞臺上，聚光燈打在表妹身上，她挺直腰桿，帶著自信的笑容唱出第一句歌詞。','經過不斷的練習，他終於找回了站在打擊區時應有的自信。']},
  {w:'敏感', mean:'對事情感受很快、很深；也指容易引起爭議或讓人不舒服的話題。', ex:['分組名單公布後，小芸低頭不說話，個性敏感的她，擔心自己又被大家冷落了。','談到別人的身材或家境，是很敏感的話題，說話前要先想想對方的感受。']},
  {w:'鴉雀無聲', mean:'連烏鴉和麻雀的聲音都沒有，形容非常安靜。', ex:['期末考的鐘聲一響，原本吵鬧的教室立刻鴉雀無聲，只剩下鉛筆在考卷上沙沙作響。','校長走進禮堂的那一刻，臺下的學生全都停止交談，現場鴉雀無聲。']},
  {w:'不耐煩', mean:'受不了麻煩或等待，心裡急躁、煩悶。', ex:['大太陽底下排隊等了一個小時，隊伍還是不動，前面的大叔不耐煩的一直看錶、踱步。','弟弟一直問同樣的問題，哥哥卻沒有不耐煩，仍然一遍又一遍的解釋。']},
  {w:'榮幸', mean:'覺得光榮又幸運，常用在客氣的場合。', ex:['站在全國科展的頒獎臺上，我握著麥克風，雙手微微發抖的說：「很榮幸能代表學校領這個獎。」','能被選為校慶典禮的司儀，我覺得非常榮幸，每天都對著鏡子練習。']},
  {w:'圓滿', mean:'沒有缺陷，完滿周全，讓人滿意。', ex:['園遊會結束的黃昏，我們收好最後一張桌子，看著賣光的攤位相視而笑，活動圓滿落幕。','經過雙方耐心的溝通和道歉，這場誤會終於得到了圓滿的解決。']},
  {w:'從容', mean:'不慌不忙，非常鎮定。', ex:['大隊接力的最後一棒，對手已經追到身後，學長卻從容的調整步伐，在終點前再次拉開距離。','只要事前準備充分，考試的時候就能從容作答，不必擔心時間不夠。']},
  {w:'幽默', mean:'說話或做事有趣好笑，又讓人回味。', ex:['上課時大家昏昏欲睡，老師忽然模仿起課本裡的人物說話，幽默的模樣逗得全班哈哈大笑。','爸爸說話很幽默，再緊張的氣氛，只要他開口說兩句，大家就都笑了。']},
  {w:'機智', mean:'頭腦靈活，能夠很快想出好辦法來應付狀況。', ex:['戲劇比賽時，道具門突然卡住打不開，演員機智的改成翻窗進場，臺下觀眾還以為是故意設計的。','面對突發的狀況，她機智的轉移話題，化解了現場的緊張氣氛。']}
 ],
 'w5d02':[
  {w:'照料', mean:'照顧、料理，用心的照顧。', ex:['颱風過後的清晨，爺爺頂著細雨走進菜園，一株株扶起倒下的菜苗，細心照料著他的寶貝。','媽媽住院的那幾天，阿姨每天幫忙照料我們的三餐和功課。']},
  {w:'不妥', mean:'不恰當、不妥當。', ex:['討論畢業旅行的地點時，班長看了看預算表，皺著眉頭說太貴的行程有些不妥，大家才冷靜下來。','把別人的照片不經同意就隨便傳到網路上，是非常不妥的行為。']},
  {w:'靈機一動', mean:'突然想出一個好辦法。', ex:['球卡在高高的樹枝上，我們跳了好幾次都搆不到，弟弟靈機一動，拿來曬衣竿輕輕一推就成功了。','作文寫不出結尾時，我看著窗外的夕陽靈機一動，終於寫出滿意的句子。']},
  {w:'大禍臨頭', mean:'很大的災禍就要降臨到身上。', ex:['把老師的花瓶打破的那一刻，我們幾個人愣在教室裡，看著滿地碎片，感覺大禍臨頭了。','颱風逼近時，住在山腳下的居民都知道，再不撤離就要大禍臨頭了。']},
  {w:'不發一語', mean:'一句話也不說。', ex:['聽完比賽輸掉的消息，隊長坐在休息室的角落，抱著球不發一語，大家也不敢上前打擾。','爸爸看完我的成績單，不發一語的簽了名，那份沉默比罵我還讓人難受。']},
  {w:'信任', mean:'相信並且放心交給對方。', ex:['第一次幫鄰居照顧小狗的那個週末，我看著手中的鑰匙，感受到他們對我的信任，一點也不敢馬虎。','一旦說謊被發現，想要重新得到別人的信任，就要花很長的時間。']},
  {w:'面如土色', mean:'臉色像泥土一樣灰暗，形容非常害怕。', ex:['雲霄飛車衝下最高點的那一刻，坐在我旁邊的表哥緊抓扶手，嚇得面如土色，下車後腿還在發抖。','聽到自己被點名上臺解題，完全沒有準備的他頓時面如土色。']},
  {w:'名譽掃地', mean:'名聲完全被破壞，再也得不到別人的尊重。', ex:['那家老字號的餐廳被查出使用過期食材，新聞一播出，門口立刻冷冷清清，多年的招牌名譽掃地。','這位選手被發現服用禁藥，金牌被收回，一時之間名譽掃地。']},
  {w:'恍然大悟', mean:'忽然之間完全明白了。', ex:['數學題算了半個小時都卡住，老師在黑板上畫了一張圖，我盯著它看了幾秒，終於恍然大悟。','聽了媽媽的解釋，我才恍然大悟，原來那天她生氣是因為擔心我。']},
  {w:'後果', mean:'事情最後造成的結果，多半指不好的結果。', ex:['考試前一晚熬夜打電動，第二天在考場上眼皮一直往下垂，我終於嘗到了貪玩的後果。','做任何決定以前，要先想清楚可能帶來的後果，才不會事後後悔。']},
  {w:'臨機應變', mean:'遇到突發的狀況時，能夠隨機想出應付的辦法。', ex:['戶外教學時遊覽車在山路上拋錨，導遊臨機應變，帶大家走到附近的茶園參觀，大家反而玩得更開心。','擔任主持人需要臨機應變的能力，才能應付各種突發的狀況。']},
  {w:'不知如何是好', mean:'遇到難題時，不知道該怎麼做才好。', ex:['畢業典禮前一天，我發現準備送老師的卡片被雨淋得字跡模糊，站在走廊上急得團團轉，不知如何是好。','在異國的車站和家人走散時，她握著沒電的手機，一時之間不知如何是好。']}
 ],
 'w5d03':[
  {w:'觀點', mean:'看事情的角度和想法。', ex:['辯論社的練習課上，大家圍坐成一圈，針對「該不該使用手機」各自說出觀點，討論得非常熱烈。','同一件事從不同的角度看，就會有不同的觀點，我們要學會互相尊重。']},
  {w:'屢戰屢敗', mean:'一次又一次的作戰，每次都失敗。', ex:['那支棒球隊在聯賽中屢戰屢敗，球員們卻每天傍晚照樣在泥濘的球場上練習，從不缺席。','這位發明家屢戰屢敗，做了上百次實驗，仍然沒有放棄他的夢想。']},
  {w:'光彩耀眼', mean:'光芒非常亮麗，讓人睜不開眼睛；也形容非常出色。', ex:['跨年夜的煙火在高空綻開，金色和紫色的火花交錯，把整片夜空妝點得光彩耀眼。','穿上新做的舞衣，在舞臺燈光的照射下，她顯得光彩耀眼。']},
  {w:'可想而知', mean:'不用多說，想一想就能知道。', ex:['看到弟弟抱著被雨淋溼的作業簿衝進家門，一臉快哭的樣子，他今天的心情可想而知。','他連續三天沒睡好，今天考試的成績會怎麼樣，也就可想而知了。']},
  {w:'一馬當先', mean:'騎馬衝在最前面，比喻做事走在別人前面，或帶頭去做。', ex:['路跑比賽的槍聲一響，班上的體育股長一馬當先，衝出起跑線，把其他選手遠遠甩在後面。','每次社區大掃除，里長總是一馬當先，捲起袖子帶頭清水溝。']},
  {w:'會心一笑', mean:'心裡明白了其中的意思，而露出微笑。', ex:['讀到漫畫裡主角把鹽當成糖加進蛋糕的那一頁，我想起自己去年也做過同樣的事，忍不住會心一笑。','老師說出那個只有我們班才懂的笑話時，大家都會心一笑。']},
  {w:'擅長', mean:'在某方面特別拿手，做得特別好。', ex:['社團博覽會的下午，攤位前擠滿了人，擅長魔術的學長站在桌前，把一枚硬幣變得無影無蹤。','她不擅長跑步，卻很會游泳，每次的游泳比賽都拿下第一名。']},
  {w:'優勢', mean:'比別人更好、更有利的條件。', ex:['籃球比賽中，對手的個子都很高，我們便利用速度的優勢一次次快攻上籃，逐漸追上比分。','會說三種語言是她的優勢，讓她在國際志工的面試中脫穎而出。']},
  {w:'挫折', mean:'做事時遇到的失敗或阻礙。', ex:['第一次參加書法比賽就落選，我把作品揉成一團丟在桌上，心中滿是挫折，久久不想再拿起毛筆。','每個成功的人背後，都默默經歷過無數次的挫折，才換來今天的成就。']},
  {w:'重拾信心', mean:'重新找回原本失去的信心。', ex:['連續幾次考試都不理想，直到老師陪我把錯題一一訂正，我才慢慢重拾信心，敢在課堂上舉手發言。','受傷休養半年的投手，回到球場投出第一個三振後，終於重拾信心。']},
  {w:'長處', mean:'一個人的優點或擅長的地方。', ex:['分組準備成果發表時，擅長畫畫的負責海報，口才好的上臺報告，大家各自發揮長處合作得很順利。','了解自己的長處，再好好發揮，就能找到屬於自己的舞臺。']},
  {w:'奮力一搏', mean:'用盡全部的力量，拚一次看看。', ex:['游泳比賽的最後十公尺，我的手臂又痠又重，聽到池邊的加油聲，我咬緊牙關奮力一搏搶先觸到池壁。','雖然勝算不大，但我們決定在決賽中奮力一搏，不留任何遺憾。']}
 ],
 'w5d04':[
  {w:'探索', mean:'對不知道的事物，努力的去尋找和了解。', ex:['暑假的科學營裡，我們戴著頭燈走進漆黑的鐘乳石洞，一邊摸著冰涼的岩壁，一邊興奮的探索。','人類從來沒有停止探索宇宙的腳步，一次次把太空船送上遙遠的星球。']},
  {w:'志願', mean:'心中想要達成的理想和目標。', ex:['作文課上，窗外的蟬聲叫個不停，我咬著筆桿想了很久，才在稿紙上寫下我的志願是當獸醫。','表哥從小的志願就是當機師，所以每天都很認真的鍛鍊身體、學英文。']},
  {w:'一日千里', mean:'一天能跑一千里，形容進步或發展得非常快。', ex:['爺爺看著我用手機視訊和遠在國外的姑姑聊天，笑著說科技真是一日千里，他小時候只能寫信。','經過一年的苦練，她的游泳技術一日千里，從不敢下水變成了校隊選手。']},
  {w:'疑團', mean:'讓人想不通、充滿疑問的事情。', ex:['教室的盆栽連續三天被人偷偷澆水，大家都猜不出是誰，直到某天清晨，我們才揭開這個疑團。','考古學家希望透過這些化石，解開恐龍為什麼會突然滅絕的疑團。']},
  {w:'排解', mean:'想辦法消除煩惱、壓力或紛爭。', ex:['考試前心情煩悶的夜晚，我會走到陽臺上吹吹風、彈彈吉他，用音樂來排解心中的壓力。','兩個好朋友吵架了，班長在中間耐心的排解，最後他們終於握手言和。']},
  {w:'釋放', mean:'把累積的東西放出來，例如情緒或力量。', ex:['比賽結束的哨音一響，全隊衝進場中抱在一起大叫，把幾個月來的緊張和辛苦一口氣釋放出來。','心情不好時去操場跑幾圈，流流汗，就能把悶在心裡的情緒釋放掉。']},
  {w:'恐慌', mean:'因為擔心害怕而慌張不安。', ex:['颱風警報發布的那天傍晚，超市的貨架被搶購一空，大家推著推車擠來擠去，現場充滿了恐慌的氣氛。','面對地震的謠言，政府提醒民眾不要恐慌，應該相信正確的消息。']},
  {w:'不可開交', mean:'忙得或吵得沒辦法擺脫、停止。', ex:['年夜飯的前一天，廚房裡鍋鏟聲叮叮噹噹，媽媽和阿姨又是洗菜又是炸年糕，忙得不可開交。','為了搶同一個玩具，雙胞胎弟弟吵得不可開交，誰也不肯讓誰。']},
  {w:'並肩作戰', mean:'肩膀靠著肩膀一起戰鬥，比喻一起努力面對困難。', ex:['大隊接力決賽前，我們全班圍成一圈，手疊著手大喊口號，約好要並肩作戰跑出最好的成績。','為了完成這次的科展，我和組員們並肩作戰了整整兩個月。']},
  {w:'可遇而不可求', mean:'只能偶然遇到，不能刻意求得，形容非常難得。', ex:['登上合歡山的清晨，眼前忽然出現一片翻騰的雲海和日出，導遊說這樣的美景可遇而不可求。','能遇到一位懂你、陪你的好朋友，是可遇而不可求的緣分。']},
  {w:'奉獻', mean:'把自己的心力或財物，恭敬的獻給他人或社會。', ex:['每週六清晨，退休的陳老師都騎著腳踏車到圖書館說故事，三十年來默默奉獻，從沒缺席。','這位修女把一生都奉獻給偏鄉的孩子，被大家尊稱為「臺灣的媽媽」。']},
  {w:'獨一無二', mean:'只有一個，沒有第二個，非常特別。', ex:['母親節的早晨，我把親手畫的卡片和摺紙花放在餐桌上，媽媽笑著說這是她收過獨一無二的禮物。','每一片雪花的形狀都不一樣，就像每個人都是獨一無二的。']}
 ],
 'w5d05':[
  {w:'心路歷程', mean:'一個人在經歷某件事的過程中，內心想法和感受的變化。', ex:['畢業前的最後一堂課，老師請我們寫下這六年的心路歷程，我望著窗外的鳳凰花，筆尖久久停在紙上。','這位作家在新書裡分享了自己從被退稿到成名的心路歷程，讓讀者十分感動。']},
  {w:'娓娓道來', mean:'不急不慢、生動又有條理的說出來，讓人聽得入迷。', ex:['停電的夏夜，我們圍坐在院子裡，奶奶搖著扇子把年輕時逃難的故事娓娓道來，蟲鳴聲也安靜了。','導覽員站在古廟前，把這座老建築兩百年來的歷史娓娓道來，大家都聽得很專心。']},
  {w:'沉浸', mean:'完全投入在某種情境或感受之中。', ex:['週末的午後，我窩在圖書館角落的懶骨頭上，沉浸在偵探小說的世界裡，連閉館的音樂響起都沒發現。','聽著海浪聲和吉他聲，大家都沉浸在這場海邊音樂會的美好氣氛中。']},
  {w:'稀奇古怪', mean:'少見又奇特，跟平常很不一樣。', ex:['走進科學博物館的特展區，玻璃櫃裡擺滿了稀奇古怪的深海生物標本，有的會發光，有的長著長長的觸鬚。','弟弟的腦袋裡總是裝滿稀奇古怪的問題，常常問得爸爸答不出來。']},
  {w:'再三回味', mean:'一次又一次的想起、體會其中美好的滋味。', ex:['那年在花蓮吃到的剝皮辣椒雞湯，又鮮又辣，喝下去全身暖呼呼的，至今仍讓我再三回味。','這本小說的結局溫暖又出人意料，讀完之後讓人再三回味。']},
  {w:'渴望', mean:'非常迫切的希望得到。', ex:['住院的那兩個星期，我每天望著窗外操場上奔跑的同學，好渴望能早點回到球場上打球。','在偏鄉長大的她，從小就渴望能讀很多很多書，看看外面的世界。']},
  {w:'變化無常', mean:'時常改變，沒有一定的規律，讓人難以預料。', ex:['爬到半山腰時，原本晴朗的天空忽然飄來烏雲，接著下起冰雹，嚮導說高山的天氣就是這樣變化無常。','人生的際遇常常變化無常，所以更要珍惜和家人相處的每一天。']},
  {w:'思緒', mean:'思想的頭緒，心裡想的事情。', ex:['夜深人靜時，我坐在書桌前，望著窗外的月光，思緒飄回了小時候和外公在田裡抓青蛙的夜晚。','窗外工地的噪音一直傳進來，打斷了我的思緒，作文怎麼也寫不下去。']},
  {w:'追尋', mean:'努力的尋找、追求某個目標或答案。', ex:['十八歲那年，表哥背著背包獨自搭上火車，說要去追尋自己真正喜歡的事，臉上帶著興奮又堅定的神情。','這位科學家花了一輩子的時間，追尋宇宙誕生之謎的答案。']},
  {w:'靈光一閃', mean:'腦中突然出現好點子或好想法。', ex:['寫作業寫到一半卡住時，我走到陽臺看著飛過的鴿子，靈光一閃，想到了科展的新題目。','苦思了好幾天，設計師在洗澡時靈光一閃，終於想出新商標的造型。']},
  {w:'奇思妙想', mean:'奇特又巧妙的想法。', ex:['美術課上，我們把舊紙箱、瓶蓋和毛線變成會動的機器人，每件作品都充滿了孩子的奇思妙想。','這本繪本裡有會飛的鯨魚和住在雲上的城市，處處都是作者的奇思妙想。']},
  {w:'開闊', mean:'空間寬廣；也可以形容心胸或想法寬大，不狹窄。', ex:['爬上山頂的那一刻，眼前是一望無際的太平洋，涼風迎面吹來，我的心情也跟著開闊起來。','多讀書、多旅行，能讓人的眼界變得更開闊，不會只看到眼前的小事。']}
 ],
 'w5d06':[
  {w:'經年累月', mean:'經過了很長很長的時間。', ex:['走進老師傅的木工坊，桌上擺滿了磨得發亮的刨刀，那雙長滿厚繭的手，是經年累月練出來的。','海邊的岩石經年累月受到海浪拍打，被磨成了千奇百怪的形狀。']},
  {w:'收放自如', mean:'想收就收、想放就放，能夠完全掌握。', ex:['校慶的舞臺上，學姊的歌聲一會兒高亢嘹亮，一會兒輕柔如風，收放自如的表現讓全場起立鼓掌。','經過多年的練習，這位書法家運筆已經收放自如，每一筆都很有力道。']},
  {w:'無所不在', mean:'到處都有，沒有一個地方沒有。', ex:['走在東京的街頭，不管是車站、便利商店還是路邊，自動販賣機幾乎無所不在，讓我看得目不暇給。','網路的影響無所不在，從購物、學習到交朋友，都離不開它。']},
  {w:'緊湊', mean:'時間或事情安排得很密，中間沒有空檔。', ex:['畢業旅行的三天兩夜行程非常緊湊，我們一大早就出發，玩到天黑才回飯店，一沾枕頭就睡著了。','這部動作電影的情節十分緊湊，每一幕都讓人緊張得捏一把冷汗。']},
  {w:'悅耳動聽', mean:'聲音好聽，讓人聽了很舒服。', ex:['清晨的森林步道上，畫眉鳥在枝頭唱著歌，清亮的叫聲悅耳動聽，讓人忍不住停下腳步。','她的嗓音清亮甜美，唱起歌來悅耳動聽，是學校合唱團裡的領唱。']},
  {w:'低沉', mean:'聲音又低又沉；也可以形容心情不好、情緒低落。', ex:['颱風夜的窗外，遠方傳來一陣陣低沉的雷聲，像巨人在山後打鼓，我抱著棉被不敢睡。','聽到比賽落敗的消息，教練用低沉的聲音說：「大家先回去休息吧。」']},
  {w:'沙啞', mean:'聲音乾乾的、粗粗的，不清亮。', ex:['運動會結束後，我站在操場邊大聲加油了一整天，回家的路上，喉嚨痛得只剩下沙啞的聲音。','感冒的老師聲音沙啞，只好用麥克風上課，大家也特別安靜。']},
  {w:'急促', mean:'又快又急，很緊迫。', ex:['深夜裡，門外忽然傳來一陣急促的敲門聲，爸爸打開門，原來是鄰居阿伯來借車送孩子去醫院。','跑完三千公尺後，他彎著腰喘氣，呼吸十分急促，滿頭都是汗水。']},
  {w:'拿捏', mean:'把握事情的輕重、分寸，做得剛剛好。', ex:['在廚房學做蛋糕的那個下午，媽媽告訴我烤的時間要拿捏得剛好，太久就會焦，太短又不會膨。','說話的分寸要好好拿捏，太直接會傷人，太委婉又讓人聽不懂。']},
  {w:'開懷大笑', mean:'心情非常愉快，痛快的大笑。', ex:['跨年夜的客廳裡，爺爺戴上弟弟的卡通頭套扭著屁股跳舞，全家人都開懷大笑，笑到肚子痛。','看到表演者故意跌了一跤又做鬼臉，臺下的小朋友都開懷大笑。']},
  {w:'喜怒哀樂', mean:'高興、生氣、悲傷、快樂，泛指人的各種情緒。', ex:['翻開這本日記，每一頁都記錄著我的喜怒哀樂，有考滿分的開心，也有和好朋友吵架的難過。','好朋友就是願意分享彼此喜怒哀樂的人，不管開心或難過都會陪著你。']},
  {w:'詮釋', mean:'用自己的方法表現或說明一件作品或角色的意義。', ex:['戲劇比賽的舞臺上，表哥彎著腰、拄著拐杖，用顫抖的聲音詮釋一位年邁的老爺爺，演得維妙維肖。','同一首曲子，不同的鋼琴家會有不同的詮釋，聽起來的感覺也不一樣。']}
 ],
 'w5d07':[
  {w:'多才多藝', mean:'擁有很多方面的才能和技藝。', ex:['校慶的才藝表演上，表姊先彈了一首鋼琴曲，接著又跳了一段街舞，多才多藝的她贏得滿堂喝采。','我們的導師多才多藝，不但會畫畫，還會吹薩克斯風和做木工。']},
  {w:'卓越', mean:'非常優秀，超出一般人。', ex:['國際科展的頒獎典禮上，來自南部的高中生以卓越的研究成果奪下首獎，臺下的父母激動得紅了眼眶。','這家醫院以卓越的醫療技術聞名，許多國外的病人也特地前來求診。']},
  {w:'閱歷', mean:'經歷過的事情，以及從中得到的知識和經驗。', ex:['跑遍五大洲的外公，常在晚飯後泡一壺茶，分享他豐富的人生閱歷，我們總是聽得入迷。','隨著年紀和閱歷的增加，哥哥處理事情變得越來越成熟穩重。']},
  {w:'淵博', mean:'學問又深又廣。', ex:['博物館的老導覽員站在青銅器前，從器物的花紋講到古代的祭典，學識淵博得讓我們嘖嘖稱奇。','這位教授的學問淵博，不論問他歷史、地理或天文，都能回答得頭頭是道。']},
  {w:'雄偉秀麗', mean:'氣勢壯大，景色又美麗清秀。', ex:['站在合歡山的步道上，遠方的群山層層疊疊，雲霧在山谷間流動，雄偉秀麗的景色讓人捨不得離開。','太魯閣峽谷有高聳的大理石峭壁，也有清澈的溪水，風景雄偉秀麗。']},
  {w:'揮毫', mean:'拿起毛筆寫字或畫畫。', ex:['春節前的廟口擺著一張長桌，書法老師捲起袖子揮毫，大紅色的春聯一張張寫好，墨香飄滿了廣場。','這位畫家在眾人面前當場揮毫，不到十分鐘就畫出一幅生動的墨竹。']},
  {w:'姿態', mean:'樣子、模樣；也指一個人的態度。', ex:['清晨的湖面上，一隻白鷺鷥伸長脖子，單腳站在水中，優雅的姿態倒映在平靜的水面上。','即使比賽輸了，她仍然用謙虛有禮的姿態，走上前向對手握手道賀。']},
  {w:'身歷其境', mean:'好像親自到了那個地方，處在那個情境之中。', ex:['戴上虛擬實境眼鏡的那一刻，眼前出現一片珊瑚礁和游來游去的魚群，我彷彿身歷其境，忍不住伸手去摸。','這位作家把戰爭的場面寫得十分逼真，讀者讀了好像身歷其境一般。']},
  {w:'千變萬化', mean:'變化非常多，沒有固定的樣子。', ex:['坐在海邊等日落的時候，天邊的雲從金黃變成橘紅，又慢慢轉成紫色，千變萬化得像一幅畫。','萬花筒裡的圖案千變萬化，只要輕輕一轉，又是全新的樣子。']},
  {w:'哲理', mean:'關於人生、世界的深刻道理。', ex:['寒假的晚上，爸爸陪我讀莊子的寓言故事，一則短短的小故事，卻藏著許多耐人尋味的哲理。','這首詩表面上在寫山景，其實是在說「看事情要跳脫局限」的哲理。']},
  {w:'人情世故', mean:'待人處事的道理和經驗。', ex:['跟著外婆在市場賣菜的那個暑假，我看她對熟客噓寒問暖，對新客多送一把蔥，學到了不少人情世故。','剛出社會的表哥還不太懂人情世故，常常說話太直而得罪人。']},
  {w:'全貌', mean:'事物完整的面貌。', ex:['搭著纜車慢慢升上高空，原本只看得到街道的我，終於看見整座港口城市的全貌，忍不住驚呼出聲。','只聽一方的說法，是無法了解這件事情的全貌的，要兩邊都問清楚。']}
 ],
 'w5d08':[
  {w:'世外桃源', mean:'比喻環境優美、生活安樂，與外界隔絕的理想地方。', ex:['穿過一段長長的山洞，眼前忽然出現一片開滿野花的山谷，溪水潺潺、炊煙裊裊，簡直就是世外桃源。','這座小島沒有汽車和高樓，只有沙灘和椰子樹，被遊客稱為人間的世外桃源。']},
  {w:'謎團', mean:'讓人想不透、還沒有答案的事情。', ex:['露營的第二天清晨，我們發現帳篷外的餅乾全都不見了，沙地上留著小小的腳印，這個謎團讓大家議論紛紛。','金字塔是怎麼建造的？至今仍是考古學家想要解開的謎團。']},
  {w:'隨波逐流', mean:'跟著波浪漂流；也比喻沒有主見，跟著別人走。', ex:['颱風過後的河口，一根斷掉的樹枝在混濁的水面上隨波逐流，一下子就被沖進了大海。','面對同學的起鬨，他沒有隨波逐流，而是勇敢的說出自己的想法。']},
  {w:'占領', mean:'用力量取得某個地方並控制住。', ex:['放暑假回到鄉下老家，推開塵封已久的木門，只見屋裡的角落已經被蜘蛛網占領，到處灰濛濛的。','雜草一下子就占領了沒人整理的菜園，把原本的菜苗都蓋住了。']},
  {w:'駭人', mean:'讓人非常害怕、震驚。', ex:['看完那部海洋紀錄片，畫面裡被塑膠繩勒住脖子的海豹一直浮現在我眼前，那駭人的景象讓我好幾天都吃不下飯。','新聞報導了一場駭人的森林大火，燒毀了上千公頃的樹林。']},
  {w:'觸目驚心', mean:'看到某種嚴重的情況，心裡受到很大的震撼。', ex:['淨灘那天早上，海灘上堆滿了寶特瓶、漁網和保麗龍，一路延伸到看不見的地方，景象觸目驚心。','地震過後，倒塌的房屋和斷裂的道路觸目驚心，讓人不忍再看。']},
  {w:'災難', mean:'天災或人為造成的嚴重損害和痛苦。', ex:['那場強烈颱風過後，整條街泡在泥水裡，店家搬出泡壞的貨品，大家紅著眼說這是一場難忘的災難。','大地震造成了重大的災難，世界各國紛紛派出救難隊前往協助。']},
  {w:'正視', mean:'用認真、嚴肅的態度去面對，不逃避。', ex:['看著體檢單上紅色的數字，爸爸終於正視自己的健康問題，第二天清晨就換上球鞋去公園快走。','我們必須正視網路霸凌的問題，不能把它當成單純的玩笑。']},
  {w:'維護', mean:'維持並保護，使不受到破壞。', ex:['每週六清晨，志工們拿著夾子和麻布袋沿著河岸撿垃圾，默默維護這條溪流的清澈與美麗。','過馬路時遵守交通規則，是維護自己和別人安全最基本的方法。']},
  {w:'喚起', mean:'引起注意或某種感受，使人覺醒。', ex:['那張海龜鼻孔插著吸管的照片在網路上流傳，觸動了無數人，喚起大家對塑膠汙染的重視。','這場畫展希望能喚起民眾對流浪動物的關心，鼓勵大家以領養代替購買。']},
  {w:'日益', mean:'一天比一天更加。', ex:['海邊的老漁夫望著越來越少的漁獲，嘆著氣說海洋的汙染日益嚴重，再這樣下去就吃不到新鮮的魚了。','隨著科技日益進步，許多以前只能想像的事都變成了真的。']},
  {w:'警訊', mean:'提醒人們危險即將發生的訊號。', ex:['夏天的冰河一年比一年融化得快，北極熊在浮冰上越來越瘦，這些都是地球發出的警訊。','經常覺得頭痛、疲倦，可能是身體發出的警訊，要趕快去看醫生。']}
 ],
 'w5d09':[
  {w:'肚量', mean:'能夠包容別人的心胸和氣度。', ex:['球賽輸了以後，對方的隊長走過來跟我們握手，還誇我們打得好，他的肚量讓我們都很佩服。','別人不小心踩到你的腳，笑一笑就原諒他，這才是有肚量的表現。']},
  {w:'涵養', mean:'待人處事時，能控制情緒、寬容有禮的修養。', ex:['餐廳裡客人大聲抱怨菜太鹹，年輕的服務生卻一直微笑著道歉，重新端上一盤，展現了很好的涵養。','爺爺讀了一輩子的書，說話溫和有禮，從來不發脾氣，是個很有涵養的人。']},
  {w:'祕藏', mean:'祕密收藏起來、不讓人知道的東西。', ex:['大掃除那天，我在外公書房的抽屜深處，找到一個生鏽的鐵盒，裡面是他祕藏多年的郵票。','這座古老的圖書館裡，據說有許多從未公開展示的祕藏古書。']},
  {w:'雄偉', mean:'高大壯觀，很有氣勢。', ex:['走出火車站的那一刻，雄偉的總統府就矗立在眼前，紅磚白石的建築在陽光下閃閃發亮，讓我看得入神。','這座橫跨海峽的大橋十分雄偉，是許多攝影愛好者喜歡拍攝的地點。']},
  {w:'壯麗', mean:'雄壯美麗，令人讚嘆。', ex:['凌晨四點爬上阿里山的觀日平臺，太陽從雲海中緩緩升起，把群山染成金色，那壯麗的畫面讓全場一片驚呼。','站在大峽谷的邊緣，望著層層疊疊的紅色岩壁，景色十分壯麗。']},
  {w:'無窮無盡', mean:'沒有窮盡，沒有終點，非常多。', ex:['躺在漆黑的草原上仰望夜空，滿天的星星一顆接著一顆，好像無窮無盡，我覺得自己變得好渺小。','書本裡的知識無窮無盡，只要願意翻開，就能一直學習下去。']},
  {w:'隱祕', mean:'隱藏起來，不容易被發現。', ex:['跟著嚮導撥開比人還高的芒草，我們走進一條隱祕的小路，盡頭竟是一座清澈見底的小瀑布。','這間咖啡店開在巷子裡的二樓，位置很隱祕，沒有人帶路很難找到。']},
  {w:'好奇', mean:'對自己不了解的事物，覺得新奇而想知道。', ex:['第一次走進水族館的海底隧道，頭頂上的魟魚張開翅膀慢慢游過，弟弟好奇的把臉貼在玻璃上，捨不得離開。','妹妹對什麼事都很好奇，看到螞蟻搬家，也能蹲在地上看一個小時。']},
  {w:'讚嘆', mean:'看到美好的事物，忍不住稱讚和感嘆。', ex:['走進故宮的展覽室，看見那顆雕刻得栩栩如生的翠玉白菜，參觀的人都忍不住低聲讚嘆。','看著師傅把一團麵糰捏成精緻的小兔子，大家都讚嘆不已。']},
  {w:'見證', mean:'親眼看到並能證明某件事情的發生。', ex:['廟口那棵三百歲的老榕樹，看過戰亂，也看過熱鬧的廟會，默默見證了這座小鎮的興衰。','我們全班一起見證了班上的蠶寶寶，從小小的卵變成白色蛾子的過程。']},
  {w:'久遠', mean:'時間很長很久。', ex:['參觀古蹟時，我輕輕摸著斑駁的紅磚牆，想像著久遠以前，這裡曾經住著一戶怎樣的人家。','這座石橋的年代已經十分久遠，橋面的石板都被行人踩得光滑發亮。']},
  {w:'優游', mean:'悠閒自在的游動或生活。', ex:['蹲在清澈的溪邊，我看見一群小魚在石縫間優游，陽光照在水面上，魚鱗閃著細細的銀光。','退休以後，舅舅每天種花、讀書，在鄉下過著優游自在的生活。']}
 ],
 'w5d10':[
  {w:'奇蹟', mean:'難得發生、讓人覺得不可思議的事。', ex:['大地震過後的第五天，救難人員從瓦礫堆中救出一隻還在搖尾巴的小狗，圍觀的人都說這是奇蹟。','醫生原本說爺爺可能不能再走路，沒想到他努力復健，竟然創造了奇蹟。']},
  {w:'不約而同', mean:'事先沒有約好，大家的想法或行動卻一樣。', ex:['煙火在夜空中綻放的那一刻，河岸邊的人們不約而同的抬起頭，發出一聲長長的「哇！」','聽到老師宣布明天停課一天，全班不約而同的歡呼起來，差點把屋頂掀翻。']},
  {w:'石破天驚', mean:'石頭破裂、天也震驚，形容事情或聲音非常驚人、出人意料。', ex:['安靜的考場外忽然傳來一聲巨響，像石破天驚一般，原來是工地的鐵架倒了，大家都嚇得跳起來。','他提出的這個想法石破天驚，在場的科學家全都瞪大了眼睛。']},
  {w:'失望透頂', mean:'非常非常的失望。', ex:['等了一整個月的露營，出發當天卻下起傾盆大雨，我坐在窗邊看著被淋溼的帳篷，失望透頂。','期待已久的電影續集內容空洞又無聊，看完之後大家都失望透頂。']},
  {w:'意志薄弱', mean:'決心不夠堅定，容易受到影響而放棄。', ex:['說好要早起讀書的我，每天鬧鐘一響就按掉繼續睡，媽媽搖搖頭說我實在是意志薄弱。','想要減肥卻一看到甜點就投降，他自嘲是個意志薄弱的人。']},
  {w:'崇敬', mean:'推崇尊敬，打從心裡佩服。', ex:['走進紀念館，看著老醫師當年騎著腳踏車出診的照片和舊藥箱，我心中湧起一股深深的崇敬。','這位老校長把一生都奉獻給偏鄉教育，受到全鎮居民的崇敬。']},
  {w:'難堪', mean:'覺得很沒面子，很不好意思，難以忍受。', ex:['在全班面前被老師念出考卷上的錯字，我低著頭，臉頰熱得發燙，心裡覺得十分難堪。','不要在眾人面前大聲指出朋友的錯誤，那樣會讓他覺得很沒面子、很難堪。']},
  {w:'心慌', mean:'心裡慌張、不安。', ex:['在人潮擁擠的夜市裡，我一回頭發現牽著的妹妹不見了，心慌得手心直冒汗，一邊大喊一邊往回找。','考試時間只剩下五分鐘，還有好幾題沒寫，他越寫越心慌，手都在發抖。']},
  {w:'優雅', mean:'高雅美好，舉止大方，讓人看了舒服。', ex:['芭蕾舞表演的燈光亮起，舞者踮起腳尖，雙臂像天鵝的翅膀般輕輕展開，動作優雅得讓人屏住呼吸。','奶奶穿上旗袍、戴著珍珠項鍊，舉手投足都顯得十分優雅。']},
  {w:'領悟力', mean:'理解、體會事物道理的能力。', ex:['圍棋課上，老師只示範了一次，表弟就看出了對手的陷阱，領悟力之強讓老師都忍不住點頭稱讚。','學習樂器除了勤練，還需要好的領悟力，才能彈出曲子的感情。']},
  {w:'虔誠', mean:'恭敬而有誠意，多用在宗教信仰或祈禱上。', ex:['大年初一的清晨，廟裡香煙裊裊，奶奶雙手合十跪在神像前，虔誠的為全家人祈求平安。','參加彌撒的信徒們低頭禱告，表情十分虔誠，教堂裡一片寧靜。']},
  {w:'一望無際', mean:'一眼望去看不到邊，形容非常遼闊。', ex:['騎著單車來到花東縱谷，眼前是一望無際的金黃稻田，遠方的中央山脈靜靜守著，風裡都是稻香。','站在沙漠的沙丘上，四周是一望無際的黃沙，看不到任何一棵樹。']}
 ],
 'w5d11':[
  {w:'貪婪', mean:'貪心，想要很多東西而不知滿足。', ex:['黃昏的漁港邊，一群海鷗圍著漁船盤旋，貪婪的盯著船上的魚，一有機會就俯衝下來搶走一條。','故事裡的國王非常貪婪，想讓碰到的東西都變成黃金，結果連食物也不能吃了。']},
  {w:'祈求', mean:'誠心的請求、希望得到。', ex:['颱風夜裡，屋外的風雨打得窗戶砰砰作響，奶奶點起一炷香，祈求在海上的漁船都能平安回港。','考試前大家都在祈求好運，但平時認真讀書，才是最可靠的方法。']},
  {w:'糾結', mean:'心裡的想法或情緒纏繞在一起，解不開。', ex:['畢業前夕，我拿著兩所學校的報名表坐在床上，既想跟好友同校又想念美術班，心裡十分糾結。','要不要把同學作弊的事告訴老師，讓她在床上糾結了一整個晚上。']},
  {w:'心疼', mean:'看到喜愛的人受苦或東西受損，心裡難過、捨不得。', ex:['看到爸爸下班回家時，襯衫被汗水溼透，還彎著腰揉著痠痛的肩膀，我心疼得趕緊倒了一杯涼水給他。','這件存了半年零用錢買的新外套，第一天穿就被勾破了，讓我心疼了好久。']},
  {w:'費盡心思', mean:'用盡了所有的心力去想辦法。', ex:['為了替媽媽慶生，我們姊弟費盡心思，偷偷把客廳布置成花園，媽媽一推開門就感動得哭了。','這位老師費盡心思設計有趣的遊戲，讓原本討厭數學的學生愛上了上課。']},
  {w:'承擔', mean:'接下責任、工作或後果，不推給別人。', ex:['打破鄰居玻璃的那天傍晚，我站在門口猶豫了很久，最後鼓起勇氣按下門鈴，決定自己承擔錯誤。','身為班長，就要承擔起帶領全班的責任，不能遇到困難就推給別人。']},
  {w:'眉頭深鎖', mean:'眉毛皺在一起，形容心裡憂愁、煩惱。', ex:['看著窗外連下了一個月的大雨，果農伯伯站在果園邊，望著一顆顆裂開的柳丁，眉頭深鎖。','聽完醫生的說明，爸爸眉頭深鎖的坐在走廊上，一句話也說不出來。']},
  {w:'度日如年', mean:'過一天就像過一年那麼久，形容日子很難熬。', ex:['等待手術結果的那幾個小時，我們坐在醫院走廊冰冷的椅子上，看著時鐘一格一格的走，真是度日如年。','好朋友搬到國外以後，沒人陪我上學，每天都覺得度日如年。']},
  {w:'心神不寧', mean:'心裡很不安定，無法專心。', ex:['晚自習時，窗外的雷聲一陣接著一陣，想起忘了關的陽臺窗戶，我心神不寧的把同一行字讀了五遍。','明天就要公布比賽結果了，她整晚心神不寧，翻來覆去睡不著。']},
  {w:'窺視', mean:'偷偷的看。', ex:['夜深的森林營地裡，草叢中閃著一對發亮的眼睛，一隻白鼻心正躲在樹後窺視我們的晚餐。','未經同意就偷看別人的日記或手機，是窺視他人隱私的行為。']},
  {w:'大發雷霆', mean:'像打雷一樣大發脾氣，形容非常生氣。', ex:['看到客廳被小狗咬得滿地棉花，下班回家的爸爸大發雷霆，小狗夾著尾巴躲到了沙發底下。','教練發現隊員偷偷翹掉練習，當場大發雷霆，罰大家多跑十圈。']},
  {w:'依稀', mean:'模模糊糊，不太清楚。', ex:['回到小時候住過的眷村，雖然房子都拆了，我依稀還能聽見巷口叔叔叫賣饅頭的聲音。','那天的事情已經過了很多年，我只依稀記得外婆溫暖的手。']}
 ],
 'w5d12':[
  {w:'愛戴', mean:'敬愛並且擁護。', ex:['老校長退休那天，全校師生在操場兩旁排成長長的隊伍，一路鼓掌送他走出校門，可見他多麼受到愛戴。','這位鎮長處處為居民著想，深受鄉親的愛戴，連任了好幾屆。']},
  {w:'哀號', mean:'因為痛苦或悲傷而大聲哭叫。', ex:['寒冷的雨夜，巷子裡傳來一陣陣小狗的哀號聲，我和哥哥打著手電筒找了好久，才在水溝裡發現牠。','他打球時扭傷了腳踝，痛得坐在地上哀號，同學趕緊去找校護。']},
  {w:'不忍心', mean:'心裡捨不得、不願意看到別人受苦。', ex:['看著路邊的老奶奶在大太陽下吃力的推著回收車，我不忍心，放下書包跑過去幫她推上斜坡。','小狗用溼溼的眼睛看著我，我實在不忍心把牠留在冰冷的街頭。']},
  {w:'嘗試', mean:'試著去做做看。', ex:['第一次站上衝浪板時，冰冷的海水一次次把我打下來，我抹掉臉上的鹹水，又爬上去再嘗試一次。','不要害怕犯錯，勇敢嘗試新的事物，才能發現自己的潛力。']},

  {w:'蘊含', mean:'裡面包含著。多用在道理、情感或美感藏在事物之中。', ex:['讀完這首短短的詩，我才發現，平凡的一顆肉圓，竟蘊含著先人的辛酸。','這則流傳兩千多年的寓言故事雖然簡短，卻蘊含著做人處事的大道理。']}
 ],
 'w6u05':[
  {w:'專屬', mean:'只屬於某個人或某群人。', ex:['放學回家，餐桌上放著一杯溫熱的牛奶，旁邊的便條寫著，這是給我的專屬點心。','圖書館裡的這間閱讀角是低年級的專屬空間，所以裡面的桌椅都特別矮。']},
  {w:'退避三舍', mean:'主動讓步、躲得遠遠的，不敢接近。', ex:['每次看到便當裡的苦瓜，弟弟就皺起眉頭，筷子一縮，退避三舍。','那條巷子裡的大狗叫聲很兇，附近的小朋友每次經過都退避三舍。']},
  {w:'雀躍', mean:'高興得跳起來，形容非常歡喜。', ex:['聽到校外教學要去動物園，全班歡呼起來，大家的心情就像小鳥一樣雀躍。','收到遠在加拿大的好友寄來的明信片，我的心情雀躍了一整天，連走路都輕快起來。']},
  {w:'熬煮', mean:'用小火長時間的煮。', ex:['冬天的廚房裡，爐火微微的燒著，奶奶熬煮了一下午的雞湯，香味飄滿全屋。','這鍋紅豆湯要用小火慢慢熬煮兩個小時，豆子才會變得綿軟香甜。']},
  {w:'判斷', mean:'根據觀察和思考，做出決定或結論。', ex:['爬到山路的岔口，天色漸暗，隊長看了看地圖，冷靜判斷該走哪一條路。','放學路上遇到陌生人搭訕，要冷靜判斷對方的意圖，好好保護自己的安全。']},
  {w:'信任', mean:'相信並且放心交付。', ex:['第一次自己搭公車去補習班，媽媽把悠遊卡交給我，眼神裡滿是信任。','朋友之間的信任要花很長的時間才能建立，一次欺騙就可能讓它破碎。']},
  {w:'自信', mean:'相信自己的能力。', ex:['穿上新球衣，站在罰球線前，她深呼吸，帶著自信投出這一球。','經過一學期的上臺練習，他說話越來越有自信，不再像從前那樣結結巴巴。']},
  {w:'麻痺', mean:'失去感覺；比喻對事情不再敏感。', ex:['坐在電腦前打了一整天遊戲，他揉揉發痠的手指，覺得手腕都快麻痺了。','每天聽到同樣的提醒，有些人漸漸麻痺，反而不把它放在心上。']},
  {w:'濃烈', mean:'味道、情感很濃很強。', ex:['走進咖啡店，烘豆機正在運轉，濃烈的香氣撲鼻而來，讓人精神一振。','榴槤一剖開，氣味非常濃烈，有人愛得要命，有人卻避之唯恐不及。']},
  {w:'豐沛', mean:'充足、豐富。', ex:['梅雨季過後，山谷裡的溪水豐沛，嘩啦嘩啦的沖過大石頭，濺起白花花的水花。','這位作家情感豐沛，筆下每一個平凡的人物，總能讓讀者感動得流下眼淚。']},
  {w:'歡喜', mean:'快樂、高興。', ex:['除夕夜，一家人圍著熱騰騰的火鍋，聽著窗外的鞭炮聲，心裡滿是歡喜。','看到自己在頂樓種的番茄結出紅通通的果實，爺爺歡喜得合不攏嘴。']},
  {w:'轉瞬間', mean:'一眨眼的時間，形容非常快。', ex:['午後的天空還一片晴朗，轉瞬間烏雲密布，豆大的雨點打在操場上。','六年的小學生活彷彿才剛開始，轉瞬間我們就要穿上畢業服離開校園了。']}
 ],
 'w6u06':[
  {w:'風行', mean:'很流行，普遍被大眾接受。', ex:['這幾年，在臺北、東京和巴黎的街頭，手搖飲料店一家家開張，風行全世界。','這款桌遊規則簡單又好玩，推出不到一個月，很快就在校園裡風行起來。']},
  {w:'興隆', mean:'生意興旺，越來越好。', ex:['夜市口那家蔥油餅攤，每天傍晚都大排長龍，老闆忙得滿頭大汗，生意十分興隆。','這家小吃店用料實在、價格公道，開幕不到一年就生意興隆，還開了分店。']},
  {w:'標榜', mean:'公開宣傳自己的優點或特色。', ex:['在百貨公司的美食區，一家新開的餐廳掛著大招牌，標榜使用本地食材。','有些商品在包裝上標榜天然健康，買之前還是要仔細看清楚背面的成分。']},
  {w:'講究', mean:'重視並追求精美或完善。', ex:['泡茶時，爺爺講究水溫和時間，一壺清香的烏龍茶，要等上好幾分鐘。','這位法式餐廳的主廚對擺盤非常講究，連一片薄荷葉的位置都不馬虎。']},
  {w:'在乎', mean:'放在心上，重視。', ex:['比賽結束後，他沒有看成績單，只是走到隊友身邊，說他更在乎大家有沒有受傷。','真正的朋友不在乎你穿什麼名牌、用什麼手機，只關心你過得好不好。']},
  {w:'平衡', mean:'兩方面配合得剛好，沒有偏向任何一邊。', ex:['走在平衡木上，她張開雙臂，眼睛直視前方，一步一步穩住身體的平衡。','想要身體健康、成績進步，就要在讀書、休息和運動之間取得平衡。']},
  {w:'取悅', mean:'討別人喜歡，讓人開心。', ex:['舞臺上的小丑翻著跟斗，又噴出彩色紙花，用盡方法取悅臺下的觀眾。','做人不必刻意取悅身邊的每一個人，勇敢做真實的自己，才是更重要的事。']},
  {w:'徜徉', mean:'自由自在的漫步或遊玩，也可以形容心思沉浸在某個情境裡。', ex:['暑假的傍晚，我赤腳走在沙灘上，任海風吹著頭髮，徜徉在橘紅色的夕陽裡。','翻開這本奇幻小說，就像徜徉在一個有龍、有精靈、充滿魔法的世界裡。']},
  {w:'交集', mean:'彼此有共同、相交的部分。', ex:['剛開學時，我和隔壁的同學興趣完全不同，幾乎沒有交集，直到一起參加了合唱團。','姐姐讀夜間部，哥哥一早就去上班，兩人的作息錯開，平常在家裡很少有交集。']},
  {w:'巧思', mean:'巧妙的構想和心思。', ex:['畢業展的教室裡，同學用回收的寶特瓶，拼出一座發光的城堡，處處可見巧思。','這個書包的設計充滿巧思，只要打開側邊的拉鍊，就能變成一張小桌子。']},
  {w:'激賞', mean:'非常讚賞。', ex:['音樂會的最後一個音落下，臺下安靜了兩秒，接著觀眾起立鼓掌，表達激賞之意。','他在作文比賽裡提出的獨到看法，獲得了每一位評審老師的激賞。']},
  {w:'綿密', mean:'細緻緊密。', ex:['週末的早晨，咖啡師把牛奶打出綿密的奶泡，輕輕倒進杯中，拉出一朵花。','這款乳酪蛋糕口感綿密，入口即化，難怪一推出就大受歡迎，天天賣完。']}
 ],
 'w6u07':[
  {w:'常識', mean:'一般人都應該知道的基本知識。', ex:['露營的第一晚，我把食物放在帳篷外，學長笑著提醒，防範野生動物是基本常識。','過馬路要先看紅綠燈，走在斑馬線上，這是每個人都該具備的交通常識。']},
  {w:'理所當然', mean:'照道理應該如此，被認為本來就是這樣。', ex:['每天回家都有熱騰騰的晚餐，我一直覺得理所當然，直到媽媽出差的那一週。','同學願意借你筆記並不是理所當然的，接受幫助後要記得說聲謝謝。']},
  {w:'恣意', mean:'任意、隨心所欲，不受約束。', ex:['週末的草原上，孩子們脫下鞋子，在草地上恣意奔跑，笑聲傳得好遠。','躲在螢幕後面，在網路上恣意留言攻擊別人，是很不負責任的行為。']},
  {w:'批判', mean:'對人或事提出評論，指出缺點和錯誤。', ex:['在讀書會上，大家輪流發言，有人肯定作者的觀點，有人則嚴厲批判書中的結論。','還沒了解事情的全貌，就急著在大家面前批判別人，對當事人是很不公平的。']},
  {w:'謹記', mean:'牢牢記在心裡。', ex:['出發去比賽的那天早上，教練拍拍我的背，要我謹記，比賽重在盡力。','外公生前常說做人一定要誠實，這句話我一直謹記在心，從來不敢忘記。']},
  {w:'啟發', mean:'引導人思考，讓人有所領悟。', ex:['那場講座結束後，我走在回家的路上，反覆想著講者的話，得到很大的啟發。','據說牛頓看見蘋果落地而受到啟發，因此進一步研究萬有引力的祕密。']},
  {w:'受用不盡', mean:'得到的好處多到用不完。', ex:['小時候，奶奶教我怎麼和人打招呼，那些看似簡單的禮貌，讓我長大後受用不盡。','從小養成每天閱讀、寫日記的好習慣，會讓人一輩子受用不盡。']},
  {w:'乏人問津', mean:'沒有人過問或關心。', ex:['午後的市場裡，隔壁攤的水果堆得像小山，角落那攤卻乏人問津，老闆只好打起瞌睡。','這家店的商品價格太貴，樣式又老舊，擺在櫥窗裡好幾個月仍然乏人問津。']},
  {w:'不屑', mean:'看不起，認為不值得。', ex:['聽到學弟說要挑戰全校紀錄，他撇撇嘴，臉上露出不屑的表情，轉身就走。','對別人辛苦付出的努力露出不屑的態度，只會顯示自己的傲慢與無知。']},
  {w:'嗤之以鼻', mean:'用鼻子冷笑，表示看不起。', ex:['當初她說要用回收紙做禮服，大家都嗤之以鼻，沒想到成品在走秀時驚豔全場。','有人對這個新發明嗤之以鼻，後來它卻成了每家每戶都有的用品。']},
  {w:'胸襟', mean:'心胸、氣度。', ex:['輸掉決賽後，他走向對手，緊緊握住對方的手，真誠的祝賀，展現寬大的胸襟。','有胸襟的人能接納和自己不同的意見，不會因為一點小事就記仇。']},
  {w:'愉悅', mean:'快樂、喜悅。', ex:['雨後的清晨，我騎著單車穿過稻田，聞著泥土的香氣，心情無比愉悅。','聽著輕快的音樂整理房間，讓人心情愉悅，做起事來也特別有勁。']}
 ],
 'w6u08':[
  {w:'急中生智', mean:'在緊急時突然想出好辦法。', ex:['露營時帳篷的營釘不見了，天色漸暗，哥哥急中生智，撿來樹枝削尖代替。','鑰匙掉進水溝裡，爸爸急中生智，用磁鐵綁著繩子把它吸了上來。']},
  {w:'鎮定', mean:'遇到緊急的事情，仍然保持冷靜。', ex:['地震警報突然響起，教室裡一陣騷動，老師鎮定的指揮大家躲到桌子底下。','遇到火災時一定要保持鎮定，摀住口鼻，按照平常演練的逃生路線離開。']},
  {w:'半信半疑', mean:'有點相信，又有點懷疑。', ex:['聽說學校後山有螢火蟲，我們半信半疑的拿著手電筒，在夜色中慢慢往上走。','弟弟聽說多吃胡蘿蔔眼睛會變好，皺著眉頭，半信半疑的咬了一小口。']},
  {w:'落荒而逃', mean:'形容狼狽的逃走。', ex:['躲在草叢裡的貓突然撲出來，正在偷吃飼料的老鼠嚇得一溜煙，落荒而逃。','躲在暗巷裡的小偷一聽到遠處傳來的警笛聲，就丟下偷來的東西落荒而逃。']},
  {w:'狡猾', mean:'詭詐、不老實。', ex:['在森林的紀錄片裡，狐狸假裝受傷趴在地上，等烏鴉靠近，再狡猾的一撲而上。','這名詐騙集團的成員非常狡猾，換了好幾個電話號碼四處行騙。']},
  {w:'盲目', mean:'沒有判斷，糊裡糊塗的跟著做。', ex:['看到網路上流行的減肥法，阿姨沒有查證，就盲目跟著做，結果餓到頭暈。','選擇社團要看自己的興趣和能力，不要只是盲目跟著好朋友一起報名。']},
  {w:'招搖撞騙', mean:'假借名義到處欺騙。', ex:['夜市的角落，一名男子穿著白袍，自稱名醫，到處推銷神奇藥水，招搖撞騙。','有人假冒慈善團體的名義招搖撞騙，民眾捐款前一定要先查證清楚。']},
  {w:'誇大', mean:'把事情說得比實際更大、更多。', ex:['釣魚回來的叔叔張開雙臂，比出一條大魚，大家都笑他又在誇大其詞。','這則減肥茶的廣告誇大了商品的效果，讓許多消費者花冤枉錢上當。']},
  {w:'分辨', mean:'仔細區別、辨認。', ex:['在漆黑的山路上，我們只能靠著遠處的燈火，努力分辨回營地的方向。','網路上的消息真假混雜，轉傳之前，我們要學會分辨哪些是可靠的來源。']},
  {w:'警惕', mean:'提高警覺，讓自己不再犯同樣的錯。', ex:['看著新聞裡溺水的報導，媽媽放下筷子，語重心長的提醒我們要時時警惕。','這次因為粗心大意丟了分數，正好可以警惕自己下次交卷前要仔細檢查。']},
  {w:'蒙蔽', mean:'遮蓋住，使人看不清真相。', ex:['在熱鬧的拍賣會上，大家被主持人的話術蒙蔽，搶著出價，買下一個假古董。','買東西時不要被華麗的包裝蒙蔽了雙眼，要看清楚商品真正的品質。']},
  {w:'虛張聲勢', mean:'故意誇大氣勢，用來嚇唬別人。', ex:['巷口的小狗遇到大狗時，弓起身子，汪汪大叫，其實只是虛張聲勢。','對方隊伍在場邊喊得很大聲，其實只是虛張聲勢，實力並不強。']}
 ],
 'w6u09':[
  {w:'不時之需', mean:'隨時可能出現的需要。', ex:['颱風來臨前，爸爸搬回好幾箱礦泉水，又買了手電筒和電池，以備不時之需。','山上的天氣變化很快，背包裡最好多帶一件外套和雨衣，以備不時之需。']},
  {w:'蜂擁而來', mean:'像蜂群一樣成群的湧過來。', ex:['百貨公司的大門一打開，排隊一整夜的顧客蜂擁而來，搶著衝向特價區。','偶像一走出機場，記者和歌迷就蜂擁而來，把出口擠得水洩不通。']},
  {w:'驚慌失措', mean:'害怕慌張，不知道該怎麼辦。', ex:['停電的那一刻，電梯突然停住，裡面的人驚慌失措，有人哭喊，有人猛按按鈕。','遇到強烈地震時不要驚慌失措，要記得先躲在堅固的桌子下保護頭部。']},
  {w:'喧鬧', mean:'聲音吵雜熱鬧。', ex:['下課鐘一響，走廊上立刻充滿喧鬧的笑聲，同學們你追我跑的衝向操場。','圖書館裡請勿喧鬧，說話要輕聲細語，以免打擾正在專心閱讀的人。']},
  {w:'氣定神閒', mean:'神情平靜、從容，一點也不慌張。', ex:['考試只剩五分鐘，大家都在拚命寫，班長卻氣定神閒的放下筆，靜靜檢查答案。','面對評審一連串刁鑽的問題，她氣定神閒的一一回答，令人十分佩服。']},
  {w:'旁若無人', mean:'好像旁邊沒有人一樣，形容神態自然或態度傲慢。', ex:['捷運車廂裡，一位大叔講著電話，聲音大到整節車廂都聽得見，簡直旁若無人。','他一拿起畫筆就專心得旁若無人，連媽媽在門口叫他吃飯都沒聽見。']},
  {w:'可疑', mean:'令人懷疑，不太對勁。', ex:['深夜的社區停車場，警衛發現一個戴著口罩的人，在車子旁走來走去，形跡可疑。','收到要求匯款的簡訊時，只要內容看起來可疑，就要先打電話向家人確認。']},
  {w:'謹慎', mean:'小心慎重，不輕易冒險。', ex:['走在結冰的山路上，嚮導放慢腳步，每一步都踩得謹慎，提醒大家抓好繩子。','做重大決定之前要謹慎思考，多聽聽別人的意見，不要因為一時衝動而後悔。']},
  {w:'驚魂未定', mean:'受到驚嚇後，心情還沒恢復平靜。', ex:['差點被機車撞到的阿婆坐在路邊，雙手發抖，臉色蒼白，顯然還驚魂未定。','剛從雲霄飛車下來，妹妹驚魂未定的抓著我的手，說再也不坐了。']},
  {w:'迫不得已', mean:'被逼得沒有辦法，只好這樣做。', ex:['大雨下了三天，山路坍方，我們迫不得已取消行程，在民宿裡玩了一整天桌遊。','要不是車子在山路上拋錨、手機又沒電，迫不得已，爸爸絕不會半夜敲門求救。']},
  {w:'折服', mean:'打從心裡佩服。', ex:['在辯論比賽的決賽中，學姐引用數據，條理分明，連對手都不禁點頭折服。','這位老師傅只用一把小刀就刻出栩栩如生的龍，讓每位參觀的人都深深折服。']},
  {w:'臨危不亂', mean:'遇到危險時，仍然冷靜不慌亂。', ex:['飛機遇到強烈亂流，機身劇烈搖晃，機長臨危不亂，穩穩的把飛機降落。','火警鈴聲響起時，班長臨危不亂，一面清點人數，一面帶領同學從安全梯撤離。']}
 ],
 'w6u10':[
  {w:'慈祥', mean:'和善、充滿愛心，多用來形容長輩。', ex:['每天早上，巷口的老奶奶坐在門前，揮手向上學的孩子道早安，笑容十分慈祥。','外公慈祥的摸摸我的頭，說考不好也沒關係，下次再努力就好。']},
  {w:'薄暮', mean:'傍晚，太陽快下山的時候。', ex:['薄暮時分，田埂上的白鷺鷥飛回林間，遠處農家的煙囪冒出縷縷炊煙。','直到薄暮降臨，天色漸漸暗了，球場上的少年們才依依不捨的收拾球具回家。']},
  {w:'抱怨', mean:'因為心裡不滿而埋怨別人或環境。', ex:['排了一個小時的隊，前面的人還是不動，後面的客人開始抱怨，嘆氣聲此起彼落。','與其坐在書桌前一直抱怨作業太多，不如趕快動手把它一題一題寫完。']},
  {w:'辛勞', mean:'辛苦勞累。', ex:['天還沒亮，送報的阿伯就騎著機車出門，風雨無阻，一做就是二十年，十分辛勞。','母親節那天，我和弟弟親手做了卡片和蛋糕，感謝媽媽一整年的辛勞。']},
  {w:'厭倦', mean:'對某件事感到厭煩，不想再繼續。', ex:['連續一個月每天吃泡麵，哥哥看著桌上的碗，終於厭倦的嘆了一口氣。','他每天重複一樣的工作，看不見任何改變，漸漸對這樣的生活感到厭倦。']},
  {w:'懷念', mean:'想念過去的人、地方或時光。', ex:['搬到城市後，每到夏天的夜晚，我總會想起鄉下的蟬聲和螢火蟲，十分懷念。','畢業多年後再聚首，大家仍然懷念那位總是笑咪咪、從不罵人的導師。']},
  {w:'辯護', mean:'為了保護某人或某個觀點而說明理由。', ex:['看到弟弟被誤會偷吃餅乾，我立刻站出來，把事情經過說清楚，替他辯護。','律師在法庭上為被告辯護，一項一項提出證據，努力證明他是清白的。']},
  {w:'苦惱', mean:'因為困難而煩悶、痛苦。', ex:['月考前一天晚上，我盯著數學課本，一題也看不懂，苦惱得直抓頭髮。','姐姐為了不知道該選哪一所高中、讀哪一個科系，已經苦惱了好幾天。']},
  {w:'罕見', mean:'很少見到。', ex:['那天清晨，海面平靜無波，一群海豚躍出水面，是賞鯨船上罕見的景象。','平常不苟言笑的校長，在畢業典禮上竟然露出罕見的笑容，大家都看呆了。']},
  {w:'體貼', mean:'細心的體會別人的心情和需要，並給予照顧。', ex:['下雨的放學時間，哥哥把唯一的雨傘撐在我頭上，自己的肩膀溼了一大片，真體貼。','知道奶奶牙齒不好，表姐體貼的把蘋果削皮，再切成一小塊一小塊。']},
  {w:'衷心', mean:'發自內心的、真誠的。', ex:['頒獎典禮結束後，我走到冠軍面前，握住她的手，衷心祝賀她的成功。','站在頒獎臺上，我衷心感謝每一位在比賽中替我加油、陪我練習的同學。']},
  {w:'聆聽', mean:'專心的聽。', ex:['黃昏的森林步道上，我們停下腳步，閉上眼睛，聆聽遠方的鳥鳴和溪水聲。','好朋友心情不好的時候，安靜的聆聽他說話，往往比說大道理更有用。']}
 ],
 'w6u11':[
  {w:'美景如畫', mean:'景色美得像一幅畫。', ex:['十一月的合歡山上，滿山的芒草在夕陽下閃著金光，雲海翻湧，美景如畫。','清晨的日月潭籠著一層薄霧，美景如畫，吸引許多攝影師早起守候拍照。']},
  {w:'手足無措', mean:'手腳不知道放哪裡，形容慌張不知該怎麼辦。', ex:['第一次照顧剛出生的小表弟，他突然大哭起來，我抱著他手足無措，只能大喊媽媽。','面對學生突如其來的提問，新來的實習老師一時手足無措，臉都紅了。']},
  {w:'暴跳如雷', mean:'跳著腳大吼大叫，形容非常生氣。', ex:['發現新買的手機被摔出裂痕，叔叔氣得暴跳如雷，在客廳裡來回走個不停。','鄰居的狗把王伯伯細心照顧了一整年的花園挖得亂七八糟，氣得他暴跳如雷。']},
  {w:'無心之過', mean:'不是故意犯下的錯。', ex:['打掃時，我不小心撞倒了同學的作品，連忙道歉，好在她笑著說那只是無心之過。','弟弟打破花瓶是無心之過，而且他馬上承認，所以爸爸並沒有責罵他。']},
  {w:'央求', mean:'懇切的請求。', ex:['在玩具店門口，妹妹拉著媽媽的衣角，眼睛水汪汪的，不停央求買那隻兔子玩偶。','弟弟拉著哥哥的手，央求哥哥帶他去看球賽，答應一定會乖乖坐好不吵鬧。']},
  {w:'諒解', mean:'了解對方的情況，原諒對方。', ex:['遲到了半小時，我氣喘吁吁的跑到電影院，向朋友說明公車拋錨，終於得到他的諒解。','因為工作太忙，沒能參加我的鋼琴發表會，爸爸寫了一張卡片，希望得到我的諒解。']},
  {w:'垂頭喪氣', mean:'低著頭，提不起精神，形容失望沮喪。', ex:['球賽以一分之差輸了，隊員們走出球場，垂頭喪氣，誰也不想說話。','哥哥沒考上理想的學校，一整天都垂頭喪氣的待在房間裡，連晚餐都不吃。']},
  {w:'無精打采', mean:'沒有精神，提不起勁。', ex:['熬夜看完小說的隔天，我在數學課上無精打采，眼皮重得像掛了石頭。','連續下了一個星期的雨，不能出門散步的小狗，無精打采的趴在門口。']},
  {w:'熟練', mean:'做事技術很好，非常順手。', ex:['在早餐店的鐵板前，老闆熟練的翻動蛋餅，一邊收錢，一邊和客人聊天。','經過一整個暑假的練習，她已經能熟練的彈奏這首曲子，不用再看樂譜了。']},
  {w:'不眠不休', mean:'不睡覺也不休息，形容非常辛勞。', ex:['颱風過後，電力公司的工人頂著風雨，在電線桿上不眠不休的搶修了一整夜。','為了趕在比賽截止前完成機器人，社團的學長們不眠不休的修改程式。']},
  {w:'清脆悅耳', mean:'聲音清亮好聽。', ex:['風吹過屋簷下的玻璃風鈴，叮叮噹噹，聲音清脆悅耳，讓炎熱的午後也涼快起來。','清晨的公園裡，樹梢上的畫眉鳥一聲接著一聲的唱著，叫聲清脆悅耳。']},
  {w:'迴盪', mean:'聲音來回的回響。', ex:['站在空曠的山谷裡，我對著遠方大喊，自己的聲音在群山之間迴盪了好久。','畢業典禮結束後，我們走出禮堂，那首驪歌仍然在耳邊不停的迴盪。']}
 ],
 'w6u12':[
  {w:'芬芳', mean:'香氣，也形容香味很好聞。', ex:['四月的午後，陽臺上的茉莉花開了，微風一吹，芬芳的香氣飄進了書房。','走進這片紫色的薰衣草花田，空氣中滿是芬芳，讓人忍不住深呼吸。']},
  {w:'訝異', mean:'覺得驚奇、意外。', ex:['打開成績單的那一刻，我睜大眼睛，訝異的發現數學竟然考了滿分。','大家都很訝異，平常說話細聲細氣的她，竟然報名了全校的演講比賽。']},
  {w:'蓬勃', mean:'旺盛、充滿活力的樣子。', ex:['雨季過後，荒地上冒出一片綠意，野草和小花蓬勃生長，蝴蝶也飛來了。','這座海港城市的觀光產業蓬勃發展，每年都吸引了大量的國內外遊客。']},
  {w:'置身', mean:'把自己放在某個地方或環境中。', ex:['走進科學館的星空劇場，燈光一暗，滿天星斗在頭頂旋轉，彷彿置身外太空。','戴上虛擬實境眼鏡後，魚群從身邊游過，我感覺自己就像置身在深海之中。']},
  {w:'嚴肅', mean:'態度認真、表情莊重，不嘻笑。', ex:['開班會的時候，平常愛說笑的老師，忽然收起笑容，表情嚴肅的談起霸凌事件。','討論校園安全這麼重要的問題時，請大家收起玩笑，用嚴肅的態度看待。']},
  {w:'妥當', mean:'穩當、合適。', ex:['出國前一晚，媽媽把護照、機票和藥品一一檢查，確認都收拾妥當，才放心去睡。','在安靜的圖書館裡大聲講電話，會打擾別人，這樣的行為實在不太妥當。']},
  {w:'彬彬有禮', mean:'文雅有禮貌的樣子。', ex:['在飯店的大廳裡，服務生穿著筆挺的制服，彎腰問好，對每位客人都彬彬有禮。','新來的轉學生說話溫和，對老師和同學都彬彬有禮，很快就交到了朋友。']},
  {w:'任性', mean:'只照自己的意思做事，不顧別人的感受。', ex:['在百貨公司裡，那個小男孩躺在地上哭鬧，非要買玩具不可，真是任性。','不能因為在學校心情不好，回到家就任性的把脾氣發在家人身上。']},
  {w:'自尊心', mean:'尊重自己、不願被人看不起的心理。', ex:['上課被老師當眾指正，他滿臉通紅，低著頭不說話，自尊心受到了很大的打擊。','給別人建議時要注意說話的語氣和方式，不要不小心傷了對方的自尊心。']},
  {w:'思索', mean:'用心的想，反覆思考。', ex:['夜深了，我坐在書桌前，咬著鉛筆，思索作文的最後一段該怎麼寫才動人。','面對這道難題，他托著下巴思索了很久，終於想出解題的方法。']},
  {w:'瀰漫', mean:'煙霧、氣味或氣氛布滿了空間。', ex:['清晨的山谷裡，白茫茫的霧氣瀰漫，遠處的山頭若隱若現，像一幅水墨畫。','決賽開始前的休息室裡瀰漫著緊張的氣氛，大家低著頭，沒有人開口說話。']},
  {w:'濃郁', mean:'香氣、色彩或氣氛很濃厚。', ex:['走進麵包店，剛出爐的奶油麵包冒著熱氣，濃郁的香味讓人忍不住吞口水。','這碗牛肉湯用骨頭熬了一整夜，喝起來味道特別濃郁，讓人回味無窮。']}
 ],
 'w6d01':[
  {w:'秀麗', mean:'清秀美麗。', ex:['搭著遊艇駛進峽灣，兩岸青山倒映在水面上，瀑布從山壁垂下，風景十分秀麗。','這座湖畔小鎮四周群山環繞，風光秀麗，每年都吸引許多旅人前來拍照。']},
  {w:'錯落有致', mean:'高低參差、排列得自然有美感。', ex:['從山頂往下望，梯田一層一層向下延伸，農舍散落其間，錯落有致。','日式庭院裡的石頭、青苔和盆栽擺得錯落有致，看起來非常有層次感。']},
  {w:'瀕危', mean:'面臨滅絕的危險。', ex:['在海洋館的展示區，解說員指著一隻緩慢游動的海龜，說牠是瀕危的物種。','石虎是臺灣的瀕危動物，數量越來越少，需要大家一起保護牠們的棲地。']},
  {w:'稀有', mean:'很少，難得見到。', ex:['那天清晨，我們在溼地蹲了兩個小時，終於看見一隻稀有的黑面琵鷺，興奮得說不出話。','這種蘭花非常稀有，只生長在高山的峭壁上，一般人很難親眼看見。']},
  {w:'察覺', mean:'發現、感覺到。', ex:['吃晚飯時，媽媽看了我一眼，馬上察覺我心情不好，便輕輕放下筷子問我怎麼了。','他太專心畫圖了，完全沒有察覺窗外的天色已經暗了，連晚餐都忘了吃。']},
  {w:'奇妙', mean:'新奇、巧妙，讓人感到驚訝。', ex:['第一次透過顯微鏡看洋蔥表皮，細胞像一格格小房間排列著，那種感覺真奇妙。','一隻胖胖的毛毛蟲，經過幾週竟然變成美麗的蝴蝶，這真是大自然奇妙的魔法。']},
  {w:'籠罩', mean:'像籠子一樣罩在上面，也可以形容氣氛布滿四周。', ex:['清晨的湖面上，籠罩著一層薄薄的霧，遠處的小船像浮在雲上一樣。','以一分之差輸掉比賽以後，整個休息室都籠罩在低落的氣氛裡。']},
  {w:'迷濛', mean:'模模糊糊、看不清楚。', ex:['下著細雨的黃昏，我站在橋上遠望，街燈在雨中暈開，整座城市一片迷濛。','鬧鐘響了，他睜著一雙迷濛的睡眼，想了半天才想起今天要去校外教學。']},
  {w:'悠揚', mean:'聲音高低起伏，長而和諧。', ex:['午後的校園裡，音樂教室傳出悠揚的笛聲，飄過走廊，讓人不自覺放慢腳步。','每到星期天早上，教堂的鐘聲悠揚響起，在小鎮的上空久久不散。']},
  {w:'沉浸', mean:'深深的投入在某種情境或心情中。', ex:['週末的午後，我躺在吊床上讀小說，微風輕輕吹，我完全沉浸在故事裡。','大家還沉浸在勝利的喜悅中，教練就拍拍手，提醒下一場比賽快到了。']},
  {w:'岌岌可危', mean:'形容非常危險，快要倒塌或失去。', ex:['連續下了一週的大雨，山坡上的老房子地基鬆動，牆壁出現裂縫，岌岌可危。','由於人類過度捕撈和汙染海洋，這種魚的數量越來越少，已經岌岌可危。']},
  {w:'生生不息', mean:'不斷的生長繁衍，永不停止。', ex:['每年春天，溪流裡的小魚苗一群群游過，岸邊的草又長了出來，生命生生不息。','只要人類好好保護森林和溪流，這裡的動植物就能一代一代生生不息。']}
 ],
 'w6d02':[
  {w:'璀璨', mean:'光彩明亮、耀眼。', ex:['跨年夜的河岸邊，煙火一朵朵在夜空綻放，璀璨的光芒倒映在水面上。','在沒有光害的高山上，抬頭就能看見滿天璀璨的星星，美得讓人屏住呼吸。']},
  {w:'愜意', mean:'心情舒服、滿足。', ex:['週日的早晨，我坐在窗邊喝著溫熱的豆漿，聽著雨聲讀小說，真是愜意。','泡在山上的露天溫泉裡，看著遠方的山景和雲霧，讓人覺得十分愜意。']},
  {w:'振奮', mean:'精神振作，情緒高昂。', ex:['落後的比賽進入下半場，看臺上的加油聲忽然響起，球員們精神振奮，一路追分。','聽到國家隊在奧運奪得金牌的消息，全國人民都感到非常振奮。']},
  {w:'陡然', mean:'突然。', ex:['午後的山路上，天色陡然變暗，一陣狂風吹過，豆大的雨點打在我們的雨衣上。','聽到自己被選為全校代表，她的心跳陡然加快，臉也一下子紅了起來。']},
  {w:'氛圍', mean:'周圍的氣氛和情調。', ex:['走進那家小書店，木頭書架、昏黃燈光和輕柔的爵士樂，營造出溫暖的氛圍。','新年到了，街上掛滿紅燈籠，商店播著賀歲歌曲，到處充滿喜氣洋洋的氛圍。']},
  {w:'井然有序', mean:'整齊而有條理。', ex:['在醫院的掛號大廳，民眾拿著號碼牌坐在椅子上，等候叫號，一切井然有序。','圖書館的書依照分類號排列在書架上，井然有序，找起書來非常方便。']},
  {w:'澎湃', mean:'波浪互相撞擊；比喻心情激動，像波浪洶湧。', ex:['終於站上玉山的頂峰，看著腳下翻騰的雲海，我的心情澎湃，忍不住大聲歡呼。','聽著國歌在國際賽的頒獎臺上響起，選手眼眶泛淚，內心澎湃不已。']},
  {w:'嘆為觀止', mean:'讚嘆所看到的事物好到了極點。', ex:['在故宮的展覽室裡，一顆小小的橄欖核上，竟刻著一艘有門有窗的小船，令人嘆為觀止。','特技團員在高空中翻轉、接力，每個動作都精準無比，讓觀眾嘆為觀止。']},
  {w:'玄妙', mean:'深奧奇妙，難以理解。', ex:['夜裡躺在草地上看星空，想到星光走了千萬年才來到眼前，真是玄妙。','宇宙是怎麼誕生的，至今仍是一個玄妙的問題，科學家還在努力研究。']},
  {w:'百思不得其解', mean:'反覆思考仍然想不通。', ex:['冰箱裡的蛋糕少了一塊，門窗都關得好好的，全家人百思不得其解，最後才發現是小貓。','這道數學題我翻遍課本、想了一整晚，還是百思不得其解，只好隔天請教老師。']},
  {w:'圓滿', mean:'完美、沒有缺憾。', ex:['畢業公演的最後一幕落下，臺下響起熱烈的掌聲，我們為這學期畫下圓滿的句點。','在全校師生的通力合作下，這次的園遊會圓滿落幕，所得全數捐給慈善機構。']},
  {w:'期盼', mean:'期待盼望。', ex:['除夕的傍晚，奶奶站在巷口張望，期盼在外地工作的叔叔，能趕回家吃團圓飯。','經過三年的施工，大家期盼已久的社區新圖書館終於開幕了，門口排滿了人。']}
 ],
 'w6d03':[
  {w:'朝氣', mean:'精神飽滿、充滿活力的樣子。', ex:['星期一的早晨，操場上響起輕快的音樂，全校師生一起做早操，處處充滿朝氣。','新來的體育老師年輕又充滿朝氣，每堂課都帶著笑容和大家一起奔跑。']},
  {w:'永續', mean:'長長久久的延續下去。', ex:['在海邊的淨灘活動中，我們撿起寶特瓶和漁網，希望為海洋的永續盡一份心力。','政府推動太陽能和風力發電，是為了讓地球的資源能夠永續利用。']},
  {w:'普及', mean:'普遍推廣到各地，人人都能使用。', ex:['十幾年前，手機還很少見，如今在捷運車廂裡，幾乎人手一機，已經十分普及。','隨著網路越來越普及，就算住在偏遠的山區，學生在家也能上線學習。']},
  {w:'名列前茅', mean:'名次排在前面。', ex:['期末成績公布那天，平常不起眼的他，竟然名列前茅，全班都為他鼓掌。','這所山區小學的學生連續三年在全國科展中名列前茅，表現非常亮眼。']},
  {w:'得天獨厚', mean:'擁有特別好的天然條件或環境。', ex:['臺灣四面環海，高山林立，得天獨厚的地形，孕育出許多珍貴的動植物。','這座小島擁有得天獨厚的珊瑚礁海景，成為潛水愛好者心中的天堂。']},
  {w:'捨棄', mean:'放棄、拋開。', ex:['整理房間時，我看著堆滿書架的舊玩具，猶豫了很久，才決定捨棄一部分送給育幼院。','為了專心準備下個月的鋼琴比賽，他毅然捨棄了每天打電動的休閒時間。']},
  {w:'決心', mean:'堅定不變的意志。', ex:['看著鏡子裡氣喘吁吁的自己，哥哥握緊拳頭，下定決心每天早起慢跑。','只要有堅定的決心，再困難的目標也能一步一步完成，千萬不要輕易放棄。']},
  {w:'和諧', mean:'配合得恰當、協調，彼此相處融洽。', ex:['傍晚的公園裡，老人打太極，小孩追著泡泡跑，鴿子在草地上散步，畫面十分和諧。','合唱團的高音和低音配合得很和諧，像溪水一樣流進耳朵，聽起來非常舒服。']},
  {w:'致力', mean:'把力量集中用在某件事情上。', ex:['這位醫師離開大城市，來到偏遠的山區，三十年來致力於照顧部落的長輩。','這個基金會多年來致力於保護海洋生物，經常舉辦各種淨灘活動。']},
  {w:'嬉戲', mean:'遊戲、玩耍。', ex:['夏日的溪邊，孩子們脫下鞋子在淺水中嬉戲，水花濺得滿身都是，笑聲不斷。','假日的公園裡，有一群小狗在草地上追逐嬉戲，主人們坐在一旁聊天。']},
  {w:'見證', mean:'親眼看到，可以作為證明。', ex:['在醫院的產房外，爸爸緊握著我的手，我們一起見證了妹妹出生的那一刻。','這棵三百歲的老榕樹，靜靜站在廟口，見證了小鎮百年來的變化與發展。']},
  {w:'美譽', mean:'美好的名聲。', ex:['每到春天，阿里山的櫻花滿山盛開，遊客絡繹不絕，享有賞櫻勝地的美譽。','這位老師一生熱心教學，總是陪著學生解決問題，因此享有「孩子王」的美譽。']}
 ],
 'w6d04':[
  {w:'感傷', mean:'因為感觸而難過、憂傷。', ex:['搬家的那一天，我站在空蕩蕩的房間裡，看著牆上的身高刻痕，心中不禁感傷。','在機場看著好友搭上前往國外的班機，她忍不住感傷的掉下眼淚。']},
  {w:'抒發', mean:'把心中的感情表達出來。', ex:['心情煩悶的夜晚，我打開日記本，把一整天的委屈寫下來，好好的抒發一番。','古代許多詩人離家遠行時，常常藉著寫詩來抒發思念家鄉的心情。']},
  {w:'浪跡天涯', mean:'到處漂泊流浪，沒有固定的住所。', ex:['那位街頭藝人背著吉他，從北方的小鎮唱到南方的海港，浪跡天涯，四海為家。','他年輕時曾經背著一個大背包浪跡天涯，走過世界上三十多個國家。']},
  {w:'漂泊', mean:'像水上的東西隨波流動，比喻到處流浪、生活不安定。', ex:['在外地工作的叔叔，十幾年來換了好多個城市，每次打電話回家，都說漂泊久了想回來。','一艘無人的小船在茫茫大海上漂泊了好幾天，才被出海捕魚的漁民發現。']},
  {w:'重逢', mean:'分別很久後再次相見。', ex:['畢業十年後的同學會上，大家一見面就緊緊擁抱，聊著從前的趣事，重逢的喜悅寫在臉上。','失散多年的兄弟在大家的幫忙下，終於在機場重逢，兩人激動得抱頭痛哭。']},
  {w:'離愁', mean:'離別時的愁苦心情。', ex:['月臺上，火車緩緩駛離，我望著窗外揮手的外婆越來越小，滿心都是離愁。','畢業典禮上，一首驪歌唱出了同學們心中的離愁，許多人都紅了眼眶。']},
  {w:'別出心裁', mean:'想出跟別人不一樣的新點子。', ex:['班級布置比賽那天，我們用回收紙箱做出一座城堡，還裝上小燈泡，設計別出心裁。','這家咖啡店別出心裁，把菜單印成一份舊報紙，讓客人一邊點餐一邊閱讀。']},
  {w:'象徵', mean:'用具體的東西來代表某種抽象的意義。', ex:['在畢業典禮的舞臺上，校長把一株小樹苗交給我們，象徵我們將在新的地方成長。','在世界上許多國家的文化裡，白鴿和橄欖枝都被用來象徵和平與希望。']},
  {w:'心境', mean:'心裡的狀態和感受。', ex:['同一條回家的小路，心情好時看起來充滿花香，難過時卻顯得冷清，原來是心境不同。','經歷了這場大病之後，爺爺的心境變得更加平和，不再為小事生氣。']},
  {w:'情景交融', mean:'描寫的景物和抒發的情感融合在一起。', ex:['這首詩寫夕陽、寫落葉，也寫詩人對故鄉的思念，字字句句，情景交融。','好的寫景作文要情景交融，讓讀者從景物中感受到作者的心情。']},
  {w:'真摯', mean:'真誠懇切。', ex:['畢業紀念冊的最後一頁，好友用歪歪扭扭的字寫著祝福，雖然簡單，卻十分真摯。','他在一封手寫的長信中表達了真摯的歉意，終於得到對方的原諒。']},
  {w:'感同身受', mean:'雖然不是自己的遭遇，卻像親身經歷一樣感受深刻。', ex:['看著新聞裡災民失去家園的畫面，媽媽眼眶泛紅，感同身受的說要捐些物資。','我也曾經因為生病錯過期待已久的比賽，所以對他的失落感同身受。']}
 ],
 'w6d05':[
  {w:'熟悉', mean:'知道得很清楚，非常了解。', ex:['暑假結束回到學校，走進教室的那一刻，熟悉的黑板、桌椅和笑聲，讓我安心不少。','在國外旅行時，忽然在街頭聽到熟悉的中文，讓人感到特別親切。']},
  {w:'專注', mean:'把心思集中在一件事上。', ex:['在安靜的木工教室裡，師傅低著頭，手握刨刀，專注的削著一塊木頭。','寫作業時最好把手機放到客廳，才能專注的思考，不會一直分心。']},
  {w:'笨拙', mean:'動作或手法不靈巧。', ex:['第一次學包水餃，我捏著薄薄的餃子皮，手指笨拙的摺來摺去，餡料還是掉了出來。','剛滿一歲的小姪子正在學走路，踩著笨拙的步伐，搖搖晃晃的撲向媽媽。']},
  {w:'疲憊', mean:'非常勞累。', ex:['深夜十一點，爸爸拖著疲憊的身體回到家，脫下外套，靠在沙發上就睡著了。','經過一整天的爬山和露營準備，隊員們都疲憊得說不出話來，倒頭就睡。']},
  {w:'律動', mean:'有規律的起伏動作或節奏。', ex:['站在海堤上，浪花一波接著一波拍打岸邊，帶著大海的律動，好像在呼吸一樣。','舞蹈課上，大家跟著音樂的律動擺動身體，跳得滿身大汗卻忘了所有煩惱。']},
  {w:'無憂無慮', mean:'沒有任何憂愁和煩惱。', ex:['小時候的暑假，我和表哥在外婆家的稻田邊捉青蛙、放風箏，過得無憂無慮。','看著小狗在草地上無憂無慮的打滾，我的煩惱好像也跟著消失了。']},
  {w:'傳承', mean:'把技藝、文化或精神傳給下一代。', ex:['在老街的布袋戲工作室裡，老師傅手把手教孫子操偶，把幾十年的技藝傳承下去。','學校每年舉辦客家文化週，希望把母語、山歌和傳統傳承給下一代。']},
  {w:'沸騰', mean:'液體燒開冒泡；比喻情緒高漲、非常熱烈。', ex:['冠軍賽的最後一球落地，全場觀眾跳了起來，歡呼聲震耳欲聾，整座體育館都沸騰了。','鍋裡的水咕嘟咕嘟的沸騰了，媽媽把麵條放下去，再撒上一把青菜。']},
  {w:'洋溢', mean:'情緒、氣氛充分流露出來。', ex:['畢業典禮上，大家穿著學士服，手捧鮮花拍照，臉上洋溢著青春的笑容。','聖誕節的晚會上，大家交換禮物、一起唱歌，整個會場洋溢著溫馨的氣氛。']},
  {w:'感觸', mean:'因為接觸外界事物而引起的感想和情緒。', ex:['回到小時候住過的眷村，看著被拆得只剩一半的老房子，爸爸沉默許久，感觸很深。','參加完這次的志工服務，我對「付出」兩個字有了很深的感觸。']},
  {w:'寧靜', mean:'安靜、平靜。', ex:['天剛亮的湖邊，沒有車聲，也沒有人聲，只有水鳥輕輕掠過水面，四周一片寧靜。','住在山上的小木屋裡，聽不到車聲，夜晚的寧靜讓人睡得特別安穩。']},
  {w:'神采', mean:'人臉上顯露出的精神和光采。', ex:['頒獎臺上，剛拿下金牌的選手高舉雙手，汗水還在臉上，卻充滿了自信的神采。','病好之後的奶奶神采奕奕，又開始每天清晨到公園和朋友跳土風舞了。']}
 ],
 'w6d06':[
  {w:'扶疏', mean:'枝葉茂盛、高低疏密有致的樣子。', ex:['盛夏的午後，校園裡的老榕樹枝葉扶疏，篩下點點陽光，蟬聲在樹梢間此起彼落。','外婆家的庭院裡種了一排竹子，竹影扶疏，風一吹就發出沙沙的聲響。']},
  {w:'自得其樂', mean:'自己從中得到樂趣。', ex:['下雨的週末不能出門，弟弟坐在地板上，用積木蓋了一座城堡，玩得自得其樂。','退休後的爺爺每天種花、寫書法、和老朋友下棋，日子過得自得其樂。']},
  {w:'蓬鬆', mean:'鬆軟膨大的樣子。', ex:['冬天的早晨，剛晒過太陽的棉被又暖又蓬鬆，我把臉埋進去，聞到陽光的味道。','小貓洗完澡被吹風機吹乾後，全身的毛變得又蓬鬆又柔軟，像一團棉花。']},
  {w:'戀戀不捨', mean:'非常留戀，捨不得離開。', ex:['校外教學的最後一站是海邊，夕陽西下，大家站在沙灘上，戀戀不捨的不想上車。','暑假結束要回臺北了，表妹抱著外婆家的小狗，戀戀不捨的和我們揮手道別。']},
  {w:'若有若無', mean:'好像有，又好像沒有，形容非常細微、不明顯。', ex:['走在初春的山路上，空氣中飄來一陣若有若無的花香，讓人忍不住停下腳步尋找。','夜深人靜的時候，遠方的寺廟傳來若有若無的鐘聲，在山谷裡輕輕迴響。']},
  {w:'詩意盎然', mean:'充滿詩的意境和美感。', ex:['細雨中的江南小鎮，石板路泛著水光，烏篷船緩緩划過拱橋，處處詩意盎然。','這幅水墨畫只畫了幾筆遠山、一葉小舟和一位漁翁，卻顯得詩意盎然。']},
  {w:'出人意料', mean:'超出大家的預料。', ex:['躲避球比賽的最後一刻，個子最小的學妹接住了強力的一球，出人意料的反敗為勝。','這部電影的結局出人意料，原來最溫柔的角色才是幕後主使，讓觀眾看得目瞪口呆。']},
  {w:'清寂', mean:'清靜、冷清。', ex:['寒假的校園空無一人，我走過長長的走廊，只聽見自己的腳步聲，四周一片清寂。','颱風過後的海邊格外清寂，遊客都不見了，只剩下浪花一遍遍拍打著岸邊。']},
  {w:'簇擁', mean:'許多人緊緊的圍繞著。', ex:['球賽一結束，球迷們衝下看臺，簇擁著剛贏得冠軍的球員，一路歡呼走向休息室。','穿著白紗的新娘在親友的簇擁下走進會場，臉上帶著幸福的微笑。']},
  {w:'童趣', mean:'孩子的天真趣味。', ex:['幼兒園的牆上，貼滿了小朋友的蠟筆畫，紫色的太陽、長翅膀的魚，充滿童趣。','這本繪本的插畫色彩鮮豔，充滿童趣，大人看了也會會心一笑。']},
  {w:'悄然', mean:'安靜、不聲不響的樣子。', ex:['深夜的書房裡，我還在趕作業，窗外的月亮悄然移到西邊，桌上的茶早已涼了。','在大家忙著準備考試、沒有注意的時候，秋天已經悄然來臨，樹葉也慢慢變黃了。']},

 {id:'g5-bujingeng',img:'g5u06',g:5,b:'上',l:'六、故事「動」起來',p:'不僅……更……',rel:'遞進',k:['不僅','更'],

 {id:'g5-zhiyoucai',img:'g5u07',g:5,b:'上',l:'七、為生命找出口',p:'只有……才……',rel:'條件',k:['只有','才'],

 {id:'g5-xinqing',img:'g5u12',g:5,b:'上',l:'十二、荒島上的國王',p:'原本……，後來……（寫心情轉折）',rel:'心情轉折',k:['原本','後來'],

 {id:'g5-zhisuoyi',img:'g5d03',g:5,b:'下',l:'三、真正的「聰明」',p:'之所以……是因為……',rel:'因果',k:['之所以','是因為'],

 {id:'g5-jishiye',img:'g5d05',g:5,b:'下',l:'五、奇幻光芒的祕密',p:'即使……也……',rel:'讓步',k:['即使','也'],
  cmp:'和四年級的「就算……也……」意思相近；「即使」比較正式，常用在寫作中。',
  tip:'「即使」後面寫一個假設的困難或極端情況，「也」後面寫不會改變的決心或結果，語氣堅定。',
  ex:'即使腦中靈感暫時卡住，我也不會放下筆，而是出門走走，等待新的火花。',
  det:[{q:'哪一句的「即使……也……」用得最恰當？',o:[['即使外面下著大雨，阿伯也照常推著攤車出來賣豆花。',1,'下雨是困難，照常出攤是不變的行動。'],['即使外面下著大雨，阿伯就不出來賣豆花了。',0,'「即使」要和「也」搭配，後面要寫不受影響的結果。'],['因為外面下著大雨，阿伯也照常出攤。',0,'「因為」表示原因，和後面的結果不合。']]},
   {q:'「即使有了素材，創作過程也不會從此順利。」這句話想強調什麼？',o:[['有了素材，仍然會遇到困難。',1,'即使條件具備，困難依然存在。'],['有了素材就一定很順利。',0,'和原句的意思相反。'],['不需要素材也能創作。',0,'句子沒有這個意思。']]},

 {id:'g5-jiaodu',img:'g5d07',g:5,b:'下',l:'七、題西林壁',p:'從……看，……；從……看，卻……',rel:'對比觀點',k:['從','看','從','看','卻'],

 {id:'g6-qingxu',img:'g6u01',g:6,b:'上',l:'一、跑道',p:'借物品、動作、獨白寫心情',rel:'人物描寫：情緒變化',k:[],re:'(覺得|頓覺|彷彿|握|低下|咬|跺|攥|抓|心想|告訴自己|默默|顫)',kl:'透過物品的感覺、動作或內心獨白寫出心情，不直接說「我很緊張」',

  det:[{q:'哪一句「與其……不如……」用得正確？',o:[['與其考前熬夜苦讀，不如每天踏實複習。',1,'「與其」放比較差的做法，「不如」放比較好的做法，取捨清楚。'],['與其每天踏實複習，不如考前熬夜苦讀。',0,'把好做法放在「與其」後面，取捨顛倒了。'],['與其考前熬夜苦讀，而且每天踏實複習。',0,'「與其」要和「不如」搭配，不能接「而且」。']]},
   {q:'「宜未雨而綢繆，毋臨渴而掘井。」用「與其……不如……」改寫，哪一句最恰當？',o:[['與其口渴了才挖井，不如在下雨前就做好準備。',1,'「臨渴掘井」放在「與其」後，「未雨綢繆」放在「不如」後，意思正確。'],['與其在下雨前做好準備，不如口渴了才挖井。',0,'取捨顛倒，變成鼓勵臨時抱佛腳。'],['與其下雨，不如口渴。',0,'只留下字面，失去了「事先準備」的意思。']]},
   {q:'「與其抱怨教室太吵，＿＿＿。」後半句接哪一個最合適？',o:[['不如先把自己的聲音放輕',1,'從抱怨轉向行動，是比較好的做法。'],['不如繼續大聲抱怨',0,'後面的做法沒有比前面好，不合句意。'],['所以教室很吵',0,'沒有用「不如」，也沒有提出更好的選擇。']]},

  fix2:[{c:['與其','事事都依賴別人','，','不如','凡事都請別人代勞','。'],w:4,o:['學著自己動手','凡事都請別人代勞','什麼都不做'],a:'學著自己動手',why:'「不如」後面要接比「依賴別人」更好的做法。'},
   {c:['與其','一個人悶著頭煩惱','，','不如','把心事藏得更深','。'],w:4,o:['找信任的人說一說','把心事藏得更深','假裝什麼都沒發生'],a:'找信任的人說一說',why:'把心事藏得更深，並沒有比悶著煩惱更好；「不如」後面要寫更好的選擇。'}],
  fr:['與其',0,'，不如',1,'，',2,'。'],bk:[['臨時抱佛腳','羨慕別人跑得快','花大錢買新玩具','一直抱怨天氣熱'],['平時一點一滴累積','每天清晨練跑十分鐘','把舊玩具修好','動手在陽臺種一排綠蔭'],['才不會手忙腳亂','總有一天追得上','還能省下零用錢','讓夏天也變得清涼']]},

 {id:'g6-zhengfan',img:'g6u03',g:6,b:'上',l:'三、談遇見更好的自己',p:'正例、反例對照說理',rel:'議論：正反論據',k:[],re:'反之|相反|然而|卻|但',kl:'先舉正面例子，再用「反之」「然而」「卻」帶出反面例子，兩相對照',
  cmp:'只舉正面例子，讀者可能以為「那是運氣好」；再加上反面例子對照，道理就更站得住。',
  tip:'先寫一個做到的人得到什麼結果，再寫一個沒做到的人有什麼下場，正反兩面圍繞同一個論點，觀點自然清楚。',
  ex:'嚴長壽把每次磨練都當成學習的機會，越做越好；反之，方仲永停止學習，最後和普通人一樣。',
  det:[{q:'想證明「持續練習才會進步」，哪一句同時用了正例和反例？',o:[['小提琴家天天練琴才站上國際舞臺；反之，只靠天分不肯練習的人，琴藝反而退步。',1,'先舉做到的正例，再用「反之」帶出沒做到的反例，對照鮮明。'],['小提琴家天天練琴，最後站上國際舞臺。',0,'只有正例，沒有反面的對照。'],['有人喜歡小提琴，有人喜歡鋼琴。',0,'這是說喜好不同，和論點無關。']]},
   {q:'「方仲永小時候很會寫詩，長大後卻和普通人一樣。」這個例子最適合支持哪一個論點？',o:[['天分若不持續學習，也會被埋沒。',1,'方仲永是反面例子，說明停止學習的後果。'],['天分高的人一定會成功。',0,'例子的結果正好相反。'],['寫詩是最重要的才能。',0,'例子的重點不在寫詩，而在有沒有持續學習。']]},
   {q:'下列哪一句的正反例子「沒有對準同一個論點」？',o:[['勤奮的農夫收成滿倉；反之，有人喜歡吃白米飯。',1,'反例要說「不勤奮」的後果，這裡卻談喜好，沒有對準論點。'],['勤奮的農夫收成滿倉；反之，懶惰的農夫只能看著雜草叢生。',0,'正反兩面都圍繞「勤不勤奮」，對準了論點。'],['肯聽建議的隊長帶隊奪冠；然而，固執的隊長卻讓隊伍四分五裂。',0,'正反兩面都圍繞「肯不肯聽建議」，對準了論點。']]},
   {q:'正反例子舉完以後，最好再加上什麼，讓說服力更強？',o:[['一句小結論，點出兩個例子共同說明的道理。',1,'小結論把例子收束回觀點，讀者才知道作者要證明什麼。'],['再寫一段和論點無關的趣事。',0,'離題的內容會讓論點變模糊。'],['把同一個正例再重複寫一遍。',0,'重複例子不會增加說服力。']]}],
  fix:{c:['肯多做一點的志工','，','學到的本事最多','；反之，','肯多做一點的人','，','常常停在原地','。'],w:4,o:['只想少做一點的人','肯多做一點的人','喜歡當志工的人'],a:'只想少做一點的人',why:'「反之」後面要接反面的例子，才能和前面的正例形成對照。'},
  fix2:[{c:['肯虛心請教的同學','，','很快就弄懂難題','；然而，','愛面子不敢問的同學','，','也很快就弄懂了','。'],w:6,o:['往往一直卡在原地','也很快就弄懂了','都考了滿分'],a:'往往一直卡在原地',why:'反例的結果要和正例相反，才能突顯「虛心請教」的重要。'},
   {c:['守時的人','贏得大家的信任','；反之，','常遲到的人','更受朋友歡迎','。'],w:4,o:['漸漸失去朋友的信任','更受朋友歡迎','一定很有錢'],a:'漸漸失去朋友的信任',why:'反例要寫出「不守時」帶來的壞結果，正反才對得起來。'}],
  fr:[0,'，',1,'；反之，',2,'，',3,'。'],bk:[['每天閱讀的人','按時保養的單車','肯接受批評的作者','珍惜水源的村莊'],['眼界越來越寬廣','騎了十年依然輕快','作品一篇比一篇精采','乾旱時仍有井水可喝'],['從不翻書的人','任它生鏽的單車','聽不進意見的作者','浪費水源的村莊'],['想法只能停在原地','不到兩年就騎不動了','始終寫不出突破','一遇乾旱就慌了手腳']]},

 {id:'g6-buzhishi',img:'g6u04',g:6,b:'上',l:'四、臺灣美食詩選',p:'不只是……更是……',rel:'遞進（意義加深）',k:['不只是','更是'],
  cmp:'和學過的「不但……而且……」相似，但「不只是……更是……」常用來說明一樣東西在表面之外更深的意義，就像詩歌簡介讓我們讀出肉圓背後的歷史。',
  tip:'「不只是」後面寫事物表面的身分或功能，「更是」後面寫它背後的故事、情感或價值，意思一層比一層深。',
  ex:'一顆肉圓不只是小吃，更是先民在洪水過後互相扶持的記憶。',
  det:[{q:'哪一句「不只是……更是……」的意思由淺到深？',o:[['那碗牛肉麵不只是一頓晚餐，更是爸爸離鄉多年的鄉愁。',1,'從表面的「晚餐」推進到深層的「鄉愁」，意義加深。'],['那碗牛肉麵不只是爸爸的鄉愁，更是一頓晚餐。',0,'深淺順序顛倒，越說越淺。'],['那碗牛肉麵不只是一頓晚餐，更是一碗麵。',0,'前後意思差不多，沒有加深。']]},
   {q:'「臺灣小吃＿＿填飽肚子的食物，＿＿各地生活智慧的縮影。」空格依序填什麼？',o:[['不只是／更是',1,'先說表面功能，再說深層意義，是遞進關係。'],['因為／所以',0,'前後不是因果關係。'],['與其／不如',0,'前後不是在做選擇。']]},
   {q:'讀了簡介，知道肉圓源自水災後的救急食物。哪一句最能寫出這份背景？',o:[['肉圓不只是Ｑ彈的點心，更是災民度過飢荒的救命恩情。',1,'結合簡介裡的歷史事件，寫出食物背後的意義。'],['肉圓不只是Ｑ彈的點心，更是用豬肉做成的。',0,'後半句只是做法，沒有推進到更深的意義。'],['肉圓是Ｑ彈的點心，大家都喜歡。',0,'沒有寫出背景，也沒有用句型。']]},
   {q:'哪一句的「更是」用得不恰當？',o:[['這本日記不只是紙張，更是很多頁。',1,'「很多頁」沒有比「紙張」更深一層，遞進不成立。'],['這本日記不只是紙張，更是我成長的足跡。',0,'由物品推進到成長的意義，恰當。'],['這座老橋不只是交通要道，更是全村人共同的回憶。',0,'由功能推進到情感，恰當。']]}],
  fix:{c:['外婆的醃梅子','不只是','酸甜的零嘴','，','更是','裝在玻璃罐裡的','。'],w:5,o:['藏在玻璃罐裡的思念','裝在玻璃罐裡的','用梅子做成的'],a:'藏在玻璃罐裡的思念',why:'「更是」後面要寫比零嘴更深一層的意義，例如思念、情感。'},
  fix2:[{c:['這座廟口','不只是','熱鬧的市集','，','更是','賣小吃的地方','。'],w:5,o:['三代人共同的回憶','賣小吃的地方','停機車的空地'],a:'三代人共同的回憶',why:'「賣小吃的地方」和「市集」意思差不多，沒有往深一層推進。'},
   {c:['一碗熱湯','不只是','暖胃的食物','，','因此是','媽媽深夜等門的心意','。'],w:4,o:['更是','因此是','可是'],a:'更是',why:'「不只是」要和「更是」搭配，才能表現意思一層比一層深。'}],
  fr:[0,'不只是',1,'，更是',2,'。'],bk:[['一杯珍珠奶茶','一盒鳳梨酥','一碗擔仔麵','一顆粽子'],['消暑的飲料','送禮的點心','漁夫的宵夜','端午的應景食物'],['臺灣走向世界的名片','遊子回家的甜蜜記憶','府城人刻苦謀生的見證','家人團聚的溫暖味道']]},

 {id:'g6-jinxijin',img:'g6u05',g:6,b:'上',l:'五、最好的味覺禮物',p:'今—昔—今：從現在回到過去，再拉回現在',rel:'寫作架構：今昔今',k:[],re:'(想起|回到|記得|浮現|回想).*(如今|現在|此刻|直到今天)',kl:'先寫眼前的事，用「想起」「記得」帶出回憶，最後用「如今」「此刻」回到現在',
  cmp:'第五課整篇文章用「今昔今」安排，這裡把它濃縮成一句話來練習。',
  tip:'句子開頭寫眼前的事，中間用「想起」「記得」帶入童年回憶，最後用「如今」「此刻」回到現在，說出現在的感受。',
  ex:'聞到巷口飄來的烤地瓜香，我想起阿嬤常把熱地瓜塞進我手心；如今，換我買一條帶回家給她。',
  det:[{q:'哪一句符合「今—昔—今」的順序？',o:[['看著弟弟學騎車，我想起爸爸當年在後面扶著我；如今，換我扶著弟弟向前。',1,'先寫現在，再回憶過去，最後回到現在，順序完整。'],['小時候爸爸教我騎車，後來我學會了。',0,'只寫過去，沒有從現在出發，也沒有回到現在。'],['今天我教弟弟騎車，他很快就學會了。',0,'只寫現在，沒有帶入回憶。']]},
   {q:'「今昔今」架構中，最後拉回「現在」有什麼作用？',o:[['傳達作者現在的想法或感悟。',1,'回到現在，才能說出回憶帶給自己的體會。'],['把回憶再重複說一次。',0,'重複回憶會讓文章拖沓，不是結尾的作用。'],['介紹一個全新的人物。',0,'突然加入新人物，會讓結構散掉。']]},
   {q:'下列哪一個詞語最適合把句子從「現在」帶到「過去」？',o:[['想起',1,'「想起」可以自然帶出回憶。'],['如今',0,'「如今」是回到現在時用的。'],['明天',0,'「明天」指未來，不是過去。']]},
   {q:'「＿＿＿，我想起第一次上臺演講時雙腿發抖的模樣；此刻，我已能從容面對臺下的同學。」開頭填哪一句最合適？',o:[['看著學弟妹緊張的站上講臺',1,'用眼前的畫面觸發回憶，最後又回到此刻，結構完整。'],['十年後',0,'未來的時間點，和「想起」「此刻」對不上。'],['我小時候',0,'開頭就寫過去，少了「今」的起點。']]}],
  fix:{c:['翻開舊相簿','，','我想起幼兒園第一天哭著不肯進教室','；','明年','，我已經能笑著送妹妹去上學','。'],w:4,o:['如今','明年','從前'],a:'如今',why:'最後要回到「現在」，用「如今」才符合今昔今的架構。'},
  fix2:[{c:['走過熟悉的小學圍牆','，','我','忘記了','當年和同學在榕樹下彈彈珠的午後','；如今，那棵榕樹依然綠意盎然','。'],w:3,o:['想起了','忘記了','計畫著'],a:'想起了',why:'要用「想起了」才能從現在帶進回憶。'},
   {c:['站在畢業典禮的舞臺上','，','我記得一年級時連國歌都唱不完整','；','從前','，我卻能代表全校致詞','。'],w:4,o:['如今','從前','當時'],a:'如今',why:'最後一句要拉回現在，「從前」「當時」都是過去。'}],
  fr:[0,'，我想起',1,'；如今，',2,'。'],bk:[['聽見遠方傳來的火車汽笛','看見書架上那本破舊的童話書','嘗到這碗熟悉的米苔目','經過那間已經歇業的柑仔店'],['阿公牽著我在月臺上數車廂','媽媽每晚坐在床邊為我朗讀','阿嬤在廚房裡揉粉的背影','我曾捏著五元硬幣站在糖果罐前'],['阿公的手已經牽不動我了','我也開始讀故事給妹妹聽','我學會了自己動手做給家人吃','那份單純的快樂仍藏在心底']]},

 {id:'g6-ningke',img:'g6u06',g:6,b:'上',l:'六、珍珠奶茶',p:'寧可……也不……',rel:'選擇（堅決取捨）',k:['寧可','也不'],
  cmp:'課文提到「寧可三日無糧，不可一日無茶」。「與其……不如……」是比較兩種做法；「寧可……也不……」語氣更堅決，寧願付出代價，也要守住某件事。',
  tip:'「寧可」後面寫願意承受的代價，「也不」後面寫堅決不做的事，能表現人物的堅持與原則。',
  ex:'茶農寧可少採一季，也不願讓剛冒出的嫩芽受傷。',
  det:[{q:'哪一句「寧可……也不……」用得最恰當？',o:[['他寧可多花一小時排隊，也不願插隊破壞規矩。',1,'「寧可」後是願意付出的代價，「也不」後是堅持不做的事。'],['他寧可插隊破壞規矩，也不願多花一小時排隊。',0,'取捨顛倒，把不好的行為當成堅持。'],['他寧可排隊，所以不插隊。',0,'「寧可」要和「也不」搭配，不是接「所以」。']]},
   {q:'「寧可三日無糧，不可一日無茶。」這句話表現了什麼？',o:[['有些人愛茶的程度，甚至勝過吃飯。',1,'寧願三天沒糧食，也不能一天沒茶，表示非常重視茶。'],['大家都應該三天不吃飯。',0,'這是誇張的說法，不是真的要人不吃飯。'],['茶比糧食便宜。',0,'句子在說重視的程度，和價錢無關。']]},
   {q:'「寧可＿＿，也不＿＿。」哪一組填入後最能表現誠實的品格？',o:[['承認打破花瓶被罵／說謊推給弟弟',1,'寧願被罵也不說謊，表現誠實。'],['說謊推給弟弟／承認打破花瓶被罵',0,'取捨顛倒，變成寧可說謊。'],['吃冰淇淋／吃蛋糕',0,'只是口味的選擇，看不出品格。']]},
   {q:'「寧可……也不……」和「與其……不如……」最大的不同是什麼？',o:[['「寧可」語氣較堅決，常帶著願意付出代價的決心。',1,'「寧可……也不……」強調堅守原則，即使吃虧也願意。'],['「寧可」只能用在飲食上。',0,'「寧可」可以用在各種情境。'],['兩者都不能用來表示選擇。',0,'兩者都是表示選擇的關聯詞語。']]}],
  fix:{c:['老師傅','寧可','少賣幾杯','，','也要','用便宜的劣質粉圓','。'],w:4,o:['也不肯','也要','因此'],a:'也不肯',why:'「寧可」要搭配「也不肯」，表示堅決不做偷工減料的事。'},
  fix2:[{c:['姊姊','寧可','熬夜看漫畫','，','也不肯','交出敷衍了事的報告','。'],w:2,o:['熬夜把報告重寫一遍','熬夜看漫畫','早早上床睡覺'],a:'熬夜把報告重寫一遍',why:'「寧可」後面要寫為了堅持品質而願意付出的代價，熬夜看漫畫和報告無關。'},

 {id:'g6-zhisuoyi',img:'g6u07',g:6,b:'上',l:'七、大小剛好的鞋子',p:'之所以……是因為……',rel:'因果（先果後因）',k:['之所以','是因為'],
  cmp:'一般因果句先說原因；「之所以……是因為……」先說結果，再揭開原因，最適合寫「仔細觀察、提問探索、得到答案」的過程。',
  tip:'先寫出觀察到的奇怪現象，用「之所以」帶出，再用「是因為」說出探索後找到的答案。',
  ex:'緬甸人之所以愛穿小一號的拖鞋，是因為雨季很長，鞋子太大會把紗籠濺溼。',
  det:[{q:'哪一句「之所以……是因為……」的因果順序正確？',o:[['向日葵的花盤之所以總朝著太陽，是因為它要追著陽光生長。',1,'先說現象（結果），再說原因，順序正確。'],['向日葵之所以要追著陽光生長，是因為花盤總朝著太陽。',0,'因果顛倒，把結果當成原因。'],['向日葵之所以朝著太陽，所以要追著陽光。',0,'「之所以」要和「是因為」搭配。']]},
   {q:'觀察到「校門口有一塊地磚特別亮」，探索後寫成句子，哪一句最好？',o:[['那塊地磚之所以特別亮，是因為每天上千雙鞋子從那裡走過，把它磨得發亮。',1,'先寫觀察到的現象，再說探索得到的答案，句意完整。'],['那塊地磚特別亮，很漂亮。',0,'只寫現象，沒有探究原因。'],['每天上千雙鞋子走過校門口。',0,'只寫原因，沒有點出要解釋的現象。']]},
   {q:'「之所以……是因為……」最適合用在哪一個寫作步驟？',o:[['提問探索後得到答案',1,'先提出現象，再揭開原因，正好呈現「得到答案」的過程。'],['列出購物清單',0,'清單不需要說明因果。'],['描寫晚霞的顏色',0,'單純描寫不需要追問原因。']]},
   {q:'「駱駝＿＿能好幾天不喝水，＿＿牠能把體內的水分保存得很好。」空格依序填什麼？',o:[['之所以／是因為',1,'先說結果「好幾天不喝水」，再說原因，搭配正確。'],['雖然／但是',0,'前後不是轉折關係。'],['不但／而且',0,'前後不是遞進關係。']]}],
  fix:{c:['陸龜','之所以','走得很慢','，','因此','牠背著又厚又重的殼','。'],w:4,o:['是因為','因此','而且'],a:'是因為',why:'「之所以」先說結果，後面要用「是因為」說原因，不能用「因此」。'},
  fix2:[{c:['奶奶醃的蘿蔔乾','之所以','特別香','，','是因為','她買了很漂亮的玻璃罐','。'],w:5,o:['她堅持在大太陽下曬足七天','她買了很漂亮的玻璃罐','蘿蔔乾是黃色的'],a:'她堅持在大太陽下曬足七天',why:'「是因為」後面的原因要能真正解釋「特別香」。'},
   {c:['他的成績','之所以','突飛猛進','，','是因為','他上課經常發呆','。'],w:5,o:['他每天都把錯題弄懂才休息','他上課經常發呆','他換了新書包'],a:'他每天都把錯題弄懂才休息',why:'原因要能合理解釋「突飛猛進」，上課發呆只會讓成績退步。'}],
  fr:[0,'之所以',1,'，是因為',2,'。'],bk:[['蝸牛','老街的屋簷','螢火蟲','阿公的菜園'],['總在雨後爬出來','都做得特別長','只在乾淨的溪邊出現','從不噴灑農藥'],['潮溼的空氣讓牠不怕身體乾掉','要替行人遮擋午後的雷陣雨','牠的幼蟲需要清澈的水才能長大','他想讓孫子吃得安心']]},

 {id:'g6-chengyu',img:'g6u08',g:6,b:'上',l:'八、狐假虎威',p:'讀典故、懂寓意、用成語',rel:'成語運用：寓言成語',k:[],re:'狐假虎威|鷸蚌相爭|漁翁得利|狡兔三窟|守株待兔|畫蛇添足|井底之蛙|揠苗助長|亡羊補牢|自相矛盾|刻舟求劍|塞翁失馬|愚公移山|朝三暮四|對牛彈琴|濫竽充數|掩耳盜鈴|杯弓蛇影|杞人憂天|南轅北轍',kl:'在句子裡用上一個寓言成語，情境要符合成語的寓意',

   {q:'兩隊爭得不可開交，結果第三隊撿到便宜奪冠。這個情境最適合用哪個成語？',o:[['鷸蚌相爭，漁翁得利',1,'雙方相爭，讓第三者得到好處，完全符合。'],['亡羊補牢',0,'亡羊補牢是指出錯後及時補救。'],['畫蛇添足',0,'畫蛇添足是指多此一舉。']]},
   {q:'「狡兔三窟」的寓意是什麼？',o:[['多準備幾個退路或藏身處，以防萬一。',1,'兔子有三個洞穴，比喻預先準備多條退路。'],['兔子非常狡猾，不能相信。',0,'只看字面，沒有理解寓意。'],['做事要專心，不要三心二意。',0,'和成語的意思無關。']]},
   {q:'哪一句的成語用錯了？',o:[['她畫蛇添足的把作文刪得精簡有力，得到老師稱讚。',1,'畫蛇添足是多此一舉，和「精簡有力」意思相反。'],['考前發現沒帶准考證，他趕緊亡羊補牢，請家人火速送來。',0,'出錯後及時補救，用得恰當。'],['他不肯努力，只等著好運掉下來，簡直是守株待兔。',0,'比喻妄想不勞而獲，用得恰當。']]}],

  fix2:[{c:['作業交出去以前','，','他','又在每頁畫滿花邊','，','結果字反而看不清楚','，真是','杞人憂天','。'],w:7,o:['畫蛇添足','杞人憂天','愚公移山'],a:'畫蛇添足',why:'多此一舉反而弄巧成拙，是「畫蛇添足」。'},
   {c:['雖然一天只走二十公里','，','他','憑著','杯弓蛇影','的精神','，','最後還是完成了環島','。'],w:4,o:['愚公移山','杯弓蛇影','朝三暮四'],a:'愚公移山',why:'一點一點堅持到底，是「愚公移山」的精神；杯弓蛇影是疑神疑鬼。'}],

 {id:'g6-bingfei',img:'g6u09',g:6,b:'上',l:'九、空城計',p:'並非……而是……',rel:'轉折（否定與肯定）',k:['並非','而是'],
  cmp:'原文「吾非行險，蓋因不得已而用之」，「非」就是「並非」，「蓋因」就是「而是因為」。把文言翻成白話，就成了「並非……而是……」。',
  tip:'「並非」後面否定別人可能誤會的想法，「而是」後面說出真正的原因或真相，句意更清楚有力。',
  ex:'孔明並非喜歡冒險，而是城中兵少，實在迫不得已。',
  det:[{q:'「吾非行險，蓋因不得已而用之。」翻成白話，哪一句最貼切？',o:[['我並非想冒險，而是不得已才用這個方法。',1,'「非」是並非，「蓋因」是而是因為，翻譯正確。'],['我非常喜歡冒險，所以用了這個方法。',0,'把「非」誤解成「非常」，意思完全相反。'],['我並非不得已，而是想要冒險。',0,'肯定和否定的部分顛倒了。']]},
   {q:'哪一句「並非……而是……」用得最恰當？',o:[['他沒來參加聚會，並非不重視友情，而是那天要照顧生病的奶奶。',1,'先否定可能的誤會，再說真正的原因。'],['他沒來參加聚會，並非要照顧奶奶，而是要照顧奶奶。',0,'前後內容一樣，沒有否定與肯定的對比。'],['他沒來參加聚會，並非不重視友情，所以要照顧奶奶。',0,'「並非」要和「而是」搭配。']]},
   {q:'「司馬懿退兵，＿＿害怕孔明的琴聲，＿＿懷疑城中埋伏了大軍。」空格依序填什麼？',o:[['並非／而是',1,'否定表面的原因，說出真正的原因。'],['因為／所以',0,'前後是否定與肯定的對照，不是單純因果。'],['不但／而且',0,'兩件事不是一層加一層的遞進。']]},
   {q:'原文「司馬懿乃魏之名將」中的「乃」，白話意思是什麼？',o:[['是',1,'這句在說明身分，「乃」當「是」用，譯成「司馬懿是魏國名將」。'],['並非',0,'「乃」是肯定的「是」，不是否定。'],['於是',0,'「乃」有時可當「於是」，但這句在說明身分，應譯成「是」。']]}],
  fix:{c:['媽媽','並非','不讓我玩手機','，','因為','擔心我的眼睛太累','。'],w:4,o:['而是','因為','並且'],a:'而是',why:'「並非」要搭配「而是」，說出真正的原因。'},
  fix2:[{c:['這片森林寂靜無聲','，','並非','充滿了鳥叫蟲鳴','，','而是','動物們都屏住了呼吸','。'],w:3,o:['沒有動物居住','充滿了鳥叫蟲鳴','下著大雨'],a:'沒有動物居住',why:'「並非」後面要否定別人可能的誤會：寂靜不是因為沒有動物，而是動物屏住呼吸。'},
   {c:['她能當選模範生','，','並非','靠著運氣','，','而是','靠著運氣','。'],w:6,o:['六年來每天默默幫助同學','靠著運氣','老師特別偏心'],a:'六年來每天默默幫助同學',why:'「而是」後面要說出和前面不同的真正原因。'}],
  fr:[0,'並非',1,'，而是',2,'。'],bk:[['孔明撫琴','老農夫放慢腳步','那位選手放棄最後一球','螞蟻排成長長的隊伍'],['不知道敵軍逼近','因為年紀大了走不動','因為害怕失敗','只是在散步'],['要讓司馬懿起疑','怕踩傷剛冒出的秧苗','把機會讓給位置更好的隊友','用氣味傳遞找到食物的消息']]},

 {id:'g6-changjing',img:'g6u10',g:6,b:'上',l:'十、耶誕節',p:'以一樣物品為核心，寫人物的位置與動作',rel:'場景描寫：烘托氣氛',k:[],re:'(圍著|圍在|靠在|坐在|站在|擠在|守在|蹲在|趴在|倚在)',kl:'以一樣物品為中心，寫出兩個以上人物的位置、動作或對話',

  det:[{q:'哪一句以物品為核心，寫出了家人的位置和動作？',o:[['蛋糕端上桌，爺爺坐在正中央，表妹趴在桌邊數蠟燭，舅舅則站在後面舉著手機。',1,'以蛋糕為核心，寫出每個人的位置和動作，畫面清楚。'],['蛋糕端上桌，大家都很開心。',0,'只寫心情，看不到每個人的位置和動作。'],['蛋糕是巧克力口味的，上面有草莓。',0,'只描寫物品，沒有寫到人物。']]},
   {q:'課文中喬走到母親背後看信，是為了什麼？',o:[['怕自己被信感動得落淚時被母親看見。',1,'從位置可以看出喬想藏起感動的心思。'],['因為母親身邊已經沒有椅子。',0,'課文寫的是她的想法，不是沒有位置。'],['因為她不想看爸爸的信。',0,'她從母親肩頭窺看信上的字，其實很想看。']]},
   {q:'寫場景時加上人物的「位置」，有什麼好處？',o:[['讓讀者看見人與人的距離，感受到彼此的關係和氣氛。',1,'誰靠得近、誰站在後面，都能透露人物的關係與心情。'],['讓文章的字數變多。',0,'位置描寫的目的不是湊字數。'],['讓讀者知道房間有多大。',0,'重點在人物關係，不在空間大小。']]},
   {q:'以「全家一起看跨年煙火」為場景，選哪一樣做核心最合適？',o:[['夜空中綻放的煙火',1,'大家的目光都集中在煙火上，適合做為描寫的核心。'],['家裡的冰箱',0,'和看煙火的場景無關。'],['鄰居的機車',0,'不是大家共同關注的焦點。']]}],
  fix:{c:['抽獎箱擺在講臺上','，','全班同學','都很想中獎','，','班長則站在箱子旁緊盯著每一張籤','。'],w:3,o:['擠在講臺前踮起腳尖','都很想中獎','都在寫作業'],a:'擠在講臺前踮起腳尖',why:'場景描寫要寫出人物的位置和動作，「都很想中獎」只是說明心情。'},
  fix2:[{c:['奶奶打開那本舊相簿','，','我','坐在客廳另一頭打電動','，','姑姑也湊過來指著照片笑','。'],w:3,o:['靠在她的肩膀上','坐在客廳另一頭打電動','走出了家門'],a:'靠在她的肩膀上',why:'要以相簿為核心，人物的位置應該圍繞著它，才能烘托溫馨的氣氛。'},
   {c:['比賽剩下最後一球','，','隊友們','圍在場邊','，','手緊緊握在一起','，','教練則坐在休息室裡睡覺','。'],w:7,o:['教練則蹲在場邊屏住呼吸','教練則坐在休息室裡睡覺','教練則去買便當'],a:'教練則蹲在場邊屏住呼吸',why:'所有人的位置和動作都要圍繞「最後一球」，才能烘托緊張的氣氛。'}],

 {id:'g6-zhengdang',img:'g6u11',g:6,b:'上',l:'十一、下午茶風波',p:'正當……的時候，卻……',rel:'轉折（目標遇到阻礙）',k:['正當','卻'],

   {c:['正當','大家','早就放棄','的時候','，','老師卻宣布比賽延期了','。'],w:2,o:['興沖沖排好隊準備出發','早就放棄','在教室裡睡覺'],a:'興沖沖排好隊準備出發',why:'「正當」後面要寫人物正在努力達成目標，阻礙才有衝擊力。'}],

 {id:'g6-renwu',img:'g6u12',g:6,b:'上',l:'十二、祕密花園',p:'用行為和對話刻畫人物性格',rel:'人物描寫：性格',k:[],re:'「[^」]+」',kl:'寫出人物的動作，再用一句對話（加上引號）表現性格',

  det:[{q:'哪一句最能表現人物「細心體貼」的性格？',o:[['她把雨傘往我這邊斜了一半，輕聲說：「你明天還要比賽，別淋溼了。」',1,'用動作和對話具體表現體貼，不必直接說。'],['她是一個很細心體貼的人。',0,'直接說出性格，沒有透過言行表現。'],['她今天帶了一把藍色的雨傘。',0,'只說物品，看不出性格。']]},
   {q:'「你們也必須跟我一起這麼說！」這句話透露科林什麼性格？',o:[['習慣命令別人，說話不夠有禮貌。',1,'「必須」帶著命令的口氣，顯示他不懂得尊重別人。'],['非常害羞，不敢說話。',0,'敢命令別人，一點也不害羞。'],['謙虛有禮，總是替人著想。',0,'命令的語氣和謙虛有禮正好相反。']]},
   {q:'想表現一位「急性子」的哥哥，哪一句最傳神？',o:[['紅燈還沒轉綠，哥哥就猛跺腳：「怎麼還不變？我快來不及了！」',1,'跺腳的動作加上催促的話，急性子躍然紙上。'],['哥哥慢慢走到路口，耐心等著紅燈。',0,'這是有耐心的表現，不是急性子。'],['哥哥是個急性子的人。',0,'直接說明，沒有刻畫。']]},
   {q:'用對話刻畫人物時，要注意什麼？',o:[['說話的口氣和用詞要符合人物的性格與身分。',1,'人物說的話要「像他」，讀者才會相信這個角色。'],['每個人物說的話都要一模一樣。',0,'人物說話一樣，就分不出性格。'],['對話越長越好，內容不重要。',0,'冗長無關的對話反而模糊性格。']]}],
  fix:{c:['老闆娘','冷冰冰的','多舀了一匙花生給我','，說：','「多吃點，考試加油喔！」'],w:1,o:['笑咪咪的','冷冰冰的','不耐煩的'],a:'笑咪咪的',why:'多給花生又替人加油，是熱情的老闆娘，神情要和話語相配，性格才一致。'},
  fix2:[{c:['學姊','蹲下來替跌倒的學弟拍掉膝蓋上的沙','，','溫柔的說','：「哭什麼哭，真麻煩！」'],w:4,o:['：「痛不痛？我陪你去健康中心。」','：「哭什麼哭，真麻煩！」','：「你自己走過去。」'],a:'：「痛不痛？我陪你去健康中心。」',why:'溫柔的動作要配上關心的話，人物性格才前後一致。'},

  fr:[0,1,'，說：「',2,'」'],bk:[['阿姨','科林','學長','阿嬤'],['把剛煮好的湯推到我面前','皺著眉頭指著大家','把獎盃交給受傷的隊友捧著','顫巍巍的從口袋掏出一顆糖'],['趁熱喝，喝完再添！','你們都必須照我說的做！','這座獎盃，是我們一起贏的。','乖孫，這是阿嬤特地留給你的。']]},

 {id:'g6-dongwu',img:'g6d01',g:6,b:'下',l:'一、馬達加斯加，出發！',p:'從外形、動作、覓食等面向描寫動物',rel:'描寫：動物的特點',k:[],re:'(身|毛|眼|耳|尾|爪|鱗|翅|皮|殼|色|舌|嘴|喙|脖).*(爬|跳|飛|游|跑|走|捕|吃|覓食|吐|鑽|吞|啄|攀|睡|休息|划)',kl:'至少寫出動物的兩個面向，例如外形特徵加上運動方式或覓食方式',

 {id:'g6-jiejing',img:'g6d04',g:6,b:'下',l:'四、送友人',p:'藉景抒情',rel:'抒情：情景交融',k:[],re:'(看著|望著|看見|望見|看到|聽著|聽見|聽到).*(想|思念|捨不得|彷彿|好像|心)',kl:'先寫看到或聽到的景物，再寫景物引起的心情',

 {id:'g6-xijie',img:'g6d05',g:6,b:'下',l:'五、蚵鄉風情',p:'藉事件與細節，間接表達情感',rel:'抒情：間接抒情',k:[],re:'^(?!.*(很感謝|很愛|很想念|很感動|很難過|很傷心|很開心|很感激)).+$',kl:'寫出事件中的動作與細節，不直接說「我很感謝」「我很想念」',

   {q:'「間接抒情」和「直接抒情」最大的不同是什麼？',o:[['間接抒情透過事件和細節，讓讀者自己感受到情感。',1,'不把情感說破，讀者在細節裡體會，印象更深。'],['間接抒情完全沒有情感。',0,'間接抒情仍有情感，只是不直接說出來。'],['直接抒情一定比間接抒情好。',0,'兩種寫法各有用處，沒有一定好壞。']]},

  {plain:'早餐很好吃。', o:[

   ['早餐非常好吃，真的超級好吃。',0,'只是重複「好吃」，沒有寫出味道和口感。'],
   ['早餐很好吃，我吃得很飽，心情很好。',0,'只寫結果和心情，沒有用感官描寫。']]},
  {plain:'公園很熱鬧。', o:[
   ['公園很熱鬧，大家都玩得很熱鬧。',0,'重複詞語，讀不出聽到、看到什麼。'],
   ['公園裡，直排輪喀啦喀啦滑過，孩子的笑聲一陣高過一陣，遠處還有人在拉二胡。',1,'用好幾種聲音把熱鬧具體寫出來，是生動的聽覺摹寫。'],
   ['公園像一個熱鬧的菜市場。',0,'這是譬喻，沒有寫出實際看到或聽到的細節。']]},
  {plain:'海邊的風景很美。', o:[
   ['海邊的風景很美，美得讓人說不出話來。',0,'只有感嘆，讀者看不到景色。'],
   ['海浪生氣的拍打岩石，大聲向天空抗議。',0,'這是擬人，偏離了「寫出眼睛所見的美景」。'],
   ['退潮後的沙灘閃著水光，遠方的海由淺綠漸漸變成深藍，白浪一道道捲上岸。',1,'用光影、顏色的漸層和浪的動態，寫出豐富的視覺畫面。']]},
  {plain:'教室裡很安靜。', o:[
   ['考試時，教室裡只聽得見筆尖沙沙劃過紙面，和窗外偶爾一聲鳥叫。',1,'用細小的聲音反過來凸顯安靜，是很細膩的聽覺摹寫。'],
   ['教室裡安靜得要命，安靜到不行。',0,'只是加強語氣，沒有感官細節。'],
   ['教室裡很安靜，大家都沒有說話。',0,'換個說法而已，沒有寫出聽到了什麼。']]},
  {plain:'這杯茶很香。', o:[
   ['這杯茶很香很香，香得不得了。',0,'重複「香」字，沒有寫出是什麼樣的香。'],
   ['掀開杯蓋，一縷帶著蜜香的熱氣飄上來，喝一口，先是微苦，再慢慢回甘。',1,'嗅覺加上味覺，還寫出味道先苦後甘的變化。'],
   ['這杯茶像花一樣香。',0,'只用了簡單的比喻，沒有寫出聞到、嘗到的細節。']]},
  {plain:'冬天的水很冷。', o:[
   ['冬天的水很冷，所以我不喜歡冬天。',0,'只加上自己的想法，沒有描寫碰觸的感覺。'],
   ['冬天的水很冷，冷得很冷。',0,'語句重複又不通順。'],
   ['冬天清晨洗臉，自來水一碰到皮膚，冰得我縮起肩膀，指尖立刻發紅。',1,'寫出皮膚的冰冷，再加上身體的反應，觸覺非常鮮明。']]}
 ],
 mx:[
  {s:'颱風來前的傍晚，天空悶成一片暗黃，空氣又黏又熱，連蟬聲都顯得有氣無力。', note:'同時用視覺、觸覺和聽覺，把「快要變天」的氣氛寫出來。可以換成考試前、比賽前的場景。'},
  {s:'夜市的轉角，炭火嗶嗶剝剝的響，烤玉米的焦香混著醬油味，一路飄進鼻子裡。', note:'聽覺加嗅覺，讀者彷彿站在攤位前。仿寫時可以換成廚房、麵包店或早餐店。'},
  {s:'捧起剛摘的桑椹，指尖染成紫紅，放進嘴裡一咬，酸甜的汁液立刻在舌尖散開。', note:'從顏色寫到味道，一個動作接一個感官，層次清楚。可以換成剝橘子、咬芭樂。'}
 ],
 task:'選一個場景，至少用兩種感官，寫出你看到、聽到、聞到、嘗到或摸到的細節。',
 kl:'至少用到兩種感官（視覺、聽覺、嗅覺、味覺、觸覺），寫出具體的顏色、聲音、氣味、味道或觸感，而不是只寫「很美」「很好吃」。'},

{id:'xc-zhuanhua', name:'轉化', from:'五下 學習地圖一',
 what:'寫作時發揮想像力，把物比擬成人，讓物擁有人的動作、表情、個性或情感，這是轉化中的「擬人」。轉化把人與物巧妙的連結起來，讓原本沒有生命的事物變得有情有感，達到自然生動的效果。進一步，也可以把人當成物來寫，或把抽象的概念寫成具體的東西。',
 kinds:[
  {n:'擬人', d:'把物當成人來寫，讓它會說話、會做事、有心情。這是課本學的重點。', ex:'老榕樹伸長了手臂，替放學的孩子撐起一大片陰涼。'},
  {n:'擬物', d:'把人當成物來寫，用物品的特性形容人的樣子或狀態。', ex:'比賽一結束，他整個人洩了氣，癱坐在場邊的長椅上。'},
  {n:'形象化', d:'把看不見、摸不著的抽象概念，寫成可以拿、可以看的具體東西。', ex:'她把那份思念摺得小小的，夾進了日記本裡。'}
 ],
 spot:[
  {s:'溪水一路哼著歌，蹦蹦跳跳的穿過山谷。', a:'轉化', why:'讓溪水會「哼歌」「蹦蹦跳跳」，擁有人的動作和快樂的心情，是擬人。'},
  {s:'路燈整夜站崗，默默守護著每一個晚歸的人。', a:'轉化', why:'「站崗」「守護」是人的行為，讓路燈像一位盡責的守衛，是擬人。'},
  {s:'鬧鐘一大早就扯開嗓門，把全家人都吵醒了。', a:'轉化', why:'鬧鐘沒有嗓門，句子讓它像人一樣大聲叫喊，是擬人。'},
  {s:'書架上的舊相簿靜靜等著，等著有人翻開它，聽它說說從前的故事。', a:'轉化', why:'讓相簿會「等待」、會「說故事」，擁有人的情感，是擬人。'},
  {s:'颱風過後，向日葵慢慢抬起頭，又對著太陽笑了。', a:'轉化', why:'「抬頭」「笑」是人的動作和表情，讓向日葵有了堅強的個性，是擬人。'},
  {s:'輸了比賽，他整個人洩了氣，垂著頭慢慢走下球場。', a:'轉化', why:'沒有用喻詞，直接把人當成會「洩氣」的皮球來寫，用物的狀態寫人的失落，是轉化中的擬物。'},
  {s:'花園裡的蝴蝶有鵝黃、粉白、寶藍，在花叢間閃閃發亮。', a:'摹寫', why:'句子只描寫蝴蝶的顏色和光彩，蝴蝶沒有做人的動作，是視覺摹寫。'},
  {s:'天上的雲朵彷彿一團團剛拉好的棉花糖。', a:'譬喻', why:'用喻詞「彷彿」把雲比成棉花糖，雲並沒有做人的動作，是譬喻。'},
  {s:'從一棵樹，到一片林，再到一整座山，志工們一年年把荒地種回了綠色。', a:'層遞', why:'從一棵樹、一片林到一座山，範圍一層比一層大，是層遞。'},
  {s:'難道路邊的小草，就不值得我們停下腳步看一眼嗎？', a:'設問', why:'用反問語氣表達「小草也值得我們注意」，答案在問題的反面，是設問中的激問。'}
 ],
 redo:[
  {plain:'風吹動了窗簾。', o:[
   ['風溜進房間，調皮的掀起窗簾，想看看我在做什麼。',1,'讓風有人「溜進來」「好奇偷看」的動作和個性，生動又有趣。'],
   ['風很大，把窗簾吹得一直動。',0,'仍是單純敘述，沒有讓風擁有人的特性。'],
   ['風呼呼的吹，窗簾飄來飄去。',0,'這是聽覺和視覺摹寫，不是擬人。']]},
  {plain:'花開了。', o:[
   ['杜鵑花開了，紅紅粉粉的，很漂亮。',0,'只描寫顏色，是摹寫，不是擬人。'],
   ['一夜春雨後，杜鵑花紛紛睜開眼睛，對著路過的人微笑。',1,'「睜開眼睛」「微笑」讓花擁有人的表情，畫面溫柔。'],
   ['杜鵑花開了，開得像杜鵑花一樣美。',0,'拿自己比自己，既不是擬人，也不是好的比喻。']]},
  {plain:'書桌很亂。', o:[
   ['我的書桌皺著眉頭，被課本、考卷和橡皮擦屑壓得喘不過氣。',1,'用「皺眉」「喘不過氣」寫出書桌的辛苦，俏皮又生動。'],
   ['書桌上堆著課本、考卷和橡皮擦屑。',0,'只是列出物品，沒有擬人。'],
   ['書桌開心的唱著歌，被雜物壓得喘不過氣。',0,'「開心唱歌」和「喘不過氣」的心情互相矛盾，擬人要符合情境。']]},
  {plain:'雨一直下。', o:[
   ['雨像斷了線的珠子，一顆顆落下。',0,'用了喻詞「像」，這是譬喻，不是轉化。'],
   ['雨下了一整天，滴滴答答，一直沒停。',0,'這是聽覺摹寫，雨沒有人的特性。'],
   ['天空哭了一整天，把滿腹的心事，一滴一滴說給大地聽。',1,'讓天空會哭、會傾訴，綿綿細雨變得有情感。']]},
  {plain:'太陽下山了。', o:[
   ['太陽下山了，天色慢慢變暗了。',0,'平鋪直敘，沒有擬人。'],
   ['太陽氣沖沖的跳下山，溫柔的向大家道晚安。',0,'「氣沖沖」和「溫柔」互相矛盾，「跳下山」也不合夕陽緩緩落下的樣子。'],
   ['太陽玩累了，慢慢躲到山的背後，拉上橘紅色的被子睡覺。',1,'用「玩累了」「拉被子睡覺」寫出夕陽緩慢下沉，動作符合景物的特點。']]},
  {plain:'巷口的老房子很舊了。', o:[
   ['巷口的老房子駝著背，斑駁的牆上寫滿了一家人的故事。',1,'「駝背」符合老房子年老的特點，又讓牆面承載回憶。'],
   ['巷口的老房子很舊很舊，牆壁都斑駁了。',0,'只是描寫外觀，沒有擬人。'],
   ['巷口的老房子活蹦亂跳的，牆上寫滿了故事。',0,'「活蹦亂跳」不符合老房子年邁的特點，擬人要找合適的動作。']]}
 ],
 mx:[
  {s:'放學後的操場空蕩蕩的，只剩籃球架孤單的站著，等待明天早晨的第一聲歡呼。', note:'讓籃球架會「孤單」、會「等待」，把放學後的寂靜寫出情感。可以換成鞦韆、教室的椅子。'},
  {s:'山嵐慢慢爬上山頭，替每一棵杉木披上輕紗，連鳥兒都忍不住放低了歌聲。', note:'山嵐「爬」「披」、鳥兒「放低歌聲」，一連串擬人讓山景安靜又溫柔。可以換成海霧、晚霞。'},
  {s:'冬夜的老街裡，路燈眨著惺忪的眼睛，陪著晚歸的人一步一步走回家。', note:'「眨眼睛」寫路燈閃爍，「陪伴」寫出溫暖。仿寫時要找符合物品特點的人的動作。'}
 ],
 task:'選一樣身邊的物品或景物，想一想它像人一樣會有什麼動作、表情或心情，寫成一句擬人句。',
 kl:'讓物擁有人的動作、表情、個性或情感，而且符合這樣事物本身的特點，前後心情不矛盾。'},

{id:'xc-yinyong', name:'引用', from:'五下 學習地圖三',
 what:'在文章中使用中外名人的話語、俗諺、格言、詩文和典故，來增加文章的說服力，就是引用。運用得當能增加文章內涵、提升氣勢；要做到「二要二不」：來源要正確、含義要與主旨契合，不引用不適當的文句，也避免艱深冷僻的典故。',
 kinds:[
  {n:'明引', d:'清楚寫出引用內容的來歷和出處，讓讀者知道這句話是誰說的、出自哪裡。', ex:'孔子說：「三人行，必有我師焉。」每位同學身上，都有值得我學習的地方。'},
  {n:'暗引', d:'不寫出處，把引文自然的融入句子，或用引號特別標示出來。', ex:'颱風來前，全家忙著加固門窗，畢竟「未雨綢繆」，總比事後懊悔好。'}
 ],
 spot:[
  {s:'老子說：「千里之行，始於足下。」再遠大的夢想，也得從今天的第一步走起。', a:'引用', why:'寫出出處，引用老子的話說明夢想要從小步做起，是明引。'},
  {s:'站在山頂俯瞰整座城市，我終於體會「欲窮千里目，更上一層樓」的心境。', a:'引用', why:'把王之渙的詩句融入句子，沒有寫出作者，是暗引。'},
  {s:'俗話說得好：「一分耕耘，一分收穫。」他每天清晨練琴，終於站上了音樂廳的舞臺。', a:'引用', why:'引用俗話，再用練琴的例子證明，讓道理更有說服力。'},
  {s:'和同學爭得面紅耳赤時，我想起「不識廬山真面目，只緣身在此山中」，提醒自己換個角度想想。', a:'引用', why:'引用蘇軾〈題西林壁〉的詩句，說明身在其中容易看不清，是暗引。'},
  {s:'母親節那天，我把卡片遞給媽媽，心裡默念著「誰言寸草心，報得三春暉」。', a:'引用', why:'引用孟郊〈遊子吟〉的詩句，表達子女難以報答母愛的心情。'},
  {s:'愛迪生曾說，天才是百分之一的靈感，加上百分之九十九的汗水。', a:'引用', why:'寫出說話的人是愛迪生，引用他的名言強調努力的重要，是明引。'},
  {s:'什麼是真正的朋友？就是在你跌倒時，願意蹲下來陪你的人。', a:'設問', why:'作者先提出問題，再自己回答，是設問中的自問自答；句子沒有引用別人的話。'},
  {s:'月光如水，靜靜的流進窗內，鋪滿了整張書桌。', a:'譬喻', why:'用「如」把月光比成水，抓住柔和流動的相似點，是譬喻。'},
  {s:'讀書讓我們看見遠方，讀書讓我們理解他人，讀書也讓我們認識自己。', a:'排比', why:'連續三句「讀書讓我們……」，結構相似、性質相同，是排比。'},
  {s:'他的成績不是全班最好的，得到的掌聲卻是最響亮的。', a:'映襯', why:'把不突出的成績和響亮的掌聲對照，凸顯他贏得眾人肯定的另一面，是映襯。'}
 ],
 redo:[
  {plain:'我們要從小事開始做起。', o:[
   ['老子說：「千里之行，始於足下。」再大的目標，也要從眼前的小事做起。',1,'出處正確，引文的意思和主旨完全契合。'],
   ['孔子說：「千里之行，始於足下。」再大的目標，也要從眼前的小事做起。',0,'出處錯誤，這句話出自老子，不是孔子。'],
   ['所謂「一失足成千古恨」，我們要從小事開始做起。',0,'引文是說一時犯錯造成終身遺憾，和「從小事做起」不契合。']]},
  {plain:'每個人都有值得學習的地方。', o:[
   ['俗話說：「人不可貌相。」每個人都有值得學習的地方。',0,'「人不可貌相」是說不能只看外表判斷人，和主旨不完全契合。'],
   ['孔子說：「三人行，必有我師焉。」每位同學身上，都有值得我學習的優點。',1,'引文的意思正是「身邊的人都可能是老師」，和主旨契合。'],
   ['正所謂「青出於藍，而勝於藍」，每個人都有值得學習的地方。',0,'這句話是說學生勝過老師，意思和主旨不符。']]},
  {plain:'努力就會有收穫。', o:[
   ['俗話說：「一分耕耘，一分收穫。」所以考前一晚熬夜苦讀，就一定能考滿分。',0,'引文正確，但例子用錯了：耕耘是長期付出，不是臨時抱佛腳。'],
   ['所謂「書中自有黃金屋」，努力就會有收穫。',0,'這句話是在說讀書的好處，用來說明各種努力，含義不夠契合。'],
   ['俗話說：「一分耕耘，一分收穫。」只要肯一天天下苦功，汗水就不會白流。',1,'引文和後面的說明互相呼應，道理清楚。']]},
  {plain:'站得高才看得遠。', o:[
   ['李白寫道：「欲窮千里目，更上一層樓。」想看得更遠，就要讓自己站得更高。',0,'出處錯誤，這是王之渙〈登鸛雀樓〉的詩句。'],
   ['王之渙寫道：「欲窮千里目，更上一層樓。」想看得更遠，就要讓自己站得更高。',1,'出處正確，詩句的意思和主旨相符。'],
   ['所謂「舉頭望明月，低頭思故鄉」，站得高才看得遠。',0,'這兩句寫的是思鄉之情，和主旨無關。']]},
  {plain:'中秋夜我很想念遠方的家人。', o:[
   ['中秋夜望著月亮，我想起「舉頭望明月，低頭思故鄉」，更加想念在國外工作的爸爸。',1,'李白的詩句寫望月思鄉，和想念家人的情境契合。'],
   ['中秋夜望著月亮，我想起「一寸光陰一寸金」，更加想念在國外工作的爸爸。',0,'引文是勸人珍惜時間，和思念家人無關。'],
   ['中秋夜望著月亮，我非常非常想念在國外工作的爸爸。',0,'沒有引用，只是加強語氣。']]},
  {plain:'旁觀的人比較看得清楚。', o:[
   ['正所謂「當局者迷，旁觀者清」，看到同學有困難，在一旁看著就好。',0,'誤解了引文，「旁觀者清」不是叫人袖手旁觀。'],
   ['正所謂「眼見為憑」，旁觀的人比較看得清楚。',0,'「眼見為憑」是說親眼看到才可信，和主旨不同。'],
   ['正所謂「當局者迷，旁觀者清」，和朋友起爭執時，不妨聽聽第三個人的看法。',1,'引文用得正確，也接上了具體的做法。']]}
 ],
 mx:[
  {s:'孔子說：「學而不思則罔。」每讀完一本書，我總會闔上書頁，問問自己真正懂了什麼。', note:'先引名言，再寫自己的做法，引文和生活互相印證。可以換成其他關於學習的名言。'},
  {s:'每當練球累得想放棄，我就想起「滴水穿石」：一滴水雖小，日子久了也能鑿穿石頭。', note:'引用成語後立刻解釋它的意思，讓讀者明白自己為什麼堅持。可以換成「鐵杵磨成繡花針」。'},
  {s:'離家前一晚，看著媽媽在燈下縫補我的書包，我才真正讀懂了「誰言寸草心，報得三春暉」。', note:'用具體的畫面帶出詩句，詩句不再只是背誦，而是自己的體會。仿寫時要選意思真的相符的詩句。'}
 ],
 task:'為一個你想說的道理或心情，找一句合適的名言、俗語或詩句引用在句子裡，再接著說明或舉例。',
 kl:'有引用名言、俗語、詩句或典故（用引號標示或寫出出處），來源正確，而且意思和你要表達的主旨相符。',
 re:'「'},

{id:'xc-cengdi', name:'層遞', from:'五下 第八課〈海洋的殺手〉語文讀寫',
 what:'把兩個或兩個以上的句子，依照範圍由小到大、數量由少到多、程度由淺到深的順序排列，讓後面的意思比前面更進一層，就是層遞。層遞能讓語意一步步加強，使讀者的感受越來越深刻。',
 kinds:[
  {n:'範圍遞進', d:'範圍由小到大，例如從一個人、一個班到全校。', ex:'這首歌先在班上傳唱，接著紅遍全校，最後連附近的社區都有人哼著。'},
  {n:'數量遞進', d:'數量由少到多，常用具體的數字來呈現。', ex:'第一天只有三個人來淨灘，第二週來了三十人，到了月底，整條海岸線站滿了三百位志工。'},
  {n:'程度遞進', d:'程度由淺到深，例如從有點、更加到非常。', ex:'起初他只是有點不耐煩，接著皺起眉頭，到最後，他氣得連一句話都說不出來。'}
 ],
 spot:[
  {s:'不只是我們班，連全年級，甚至全校師生都加入了減塑行動。', a:'層遞', why:'從一個班、全年級到全校，範圍一層比一層大，是層遞。'},
  {s:'一個人一天少用一個塑膠袋，一年就少用三百多個，全臺灣一起做，就能少用好幾億個。', a:'層遞', why:'數量由少到多，範圍也由一個人擴大到全臺灣，意思層層推進。'},
  {s:'學一種樂器，起初是喜歡，後來是熱愛，最後成了一輩子的陪伴。', a:'層遞', why:'從喜歡、熱愛到一輩子的陪伴，感情的程度由淺到深。'},
  {s:'這場豪雨先打溼了屋簷，接著淹過了街道，最後連整座村莊都泡在水裡。', a:'層遞', why:'從屋簷、街道到整座村莊，受災的範圍越來越大。'},
  {s:'他不但能背出這首詩，還能說出詩的意思，甚至能用自己的話寫出一首新詩。', a:'層遞', why:'從背誦、理解到創作，能力的程度一層比一層深。'},
  {s:'起初只是一個人的堅持，後來變成一群人的行動，最後成了全國人民的共識。', a:'層遞', why:'從一個人、一群人到全國人民，範圍和影響力逐層擴大。'},
  {s:'春天的山是綠的，夏天的海是藍的，秋天的楓是紅的。', a:'排比', why:'三句結構相似，但彼此只是並列，沒有由小到大或由淺到深的次序，所以是排比。'},
  {s:'海面上波光粼粼，一片寧靜；海底下卻塞滿了塑膠袋和廢棄漁網，滿目瘡痍。', a:'映襯', why:'把海面的寧靜和海底的髒亂放在一起對照，凸顯汙染的嚴重，是映襯。'},
  {s:'如果海洋會說話，它最想對人類說什麼呢？', a:'設問', why:'提出問題讓讀者思考，卻沒有給答案，是設問中的懸問。'},
  {s:'海浪一次又一次撲向沙灘，把人類丟下的寶特瓶悄悄送了回來。', a:'轉化', why:'讓海浪像人一樣把東西「送回來」，帶有責備人類的意味，是擬人。'}
 ],
 redo:[
  {plain:'很多人喜歡這家麵店。', o:[
   ['這家麵店起初只有街坊知道，後來全鎮的人都來排隊，現在連外縣市的遊客都慕名而來。',1,'範圍由街坊、全鎮到外縣市，一層比一層廣。'],
   ['這家麵店有全鎮的人來，有街坊鄰居來，也有外縣市的遊客來。',0,'範圍忽大忽小，順序亂排，失去層層推進的效果。'],
   ['這家麵店非常受歡迎，很多很多人都喜歡。',0,'只是加強語氣，沒有層次。']]},
  {plain:'他很生氣。', o:[
   ['他把課本重重摔在桌上，接著握緊拳頭，最後抿著嘴不說話。',0,'動作由強到弱，怒氣反而一路消退，表現不出「很生氣」。'],
   ['他先是抿著嘴不說話，接著握緊了拳頭，最後忍不住把課本重重摔在桌上。',1,'情緒的程度一層比一層強烈，怒氣越積越高。'],
   ['他很生氣，非常生氣，超級生氣。',0,'只是堆疊程度副詞，沒有具體的層次。']]},
  {plain:'海灘上的塑膠垃圾越來越多。', o:[
   ['海灘上有寶特瓶，有塑膠袋，也有廢棄漁網。',0,'只是並列垃圾的種類，看不出數量的變化。'],
   ['十年前，海灘上偶爾撿到幾個瓶子；五年前，一個下午就能撿滿一袋；如今，垃圾多到看不見沙子。',1,'時間往前推進，數量由少到多，讓人感受到問題越來越嚴重。'],
   ['如今垃圾多到看不見沙子，五年前一個下午能撿滿一袋，十年前偶爾撿到幾個瓶子。',0,'由多寫到少，語氣越來越弱，削弱了「越來越多」的感受。']]},
  {plain:'閱讀對我們很有幫助。', o:[
   ['閱讀很有幫助，對我們的幫助非常大。',0,'意思重複，沒有層次。'],
   ['閱讀能改變我們看待世界的方式，也能讓我們認識一個新詞。',0,'先深後淺，前後落差太大，沒有逐層推進。'],
   ['閱讀能讓我們認識一個新詞，理解一個新觀念，甚至改變我們看待世界的方式。',1,'從字詞、觀念到眼光，程度由淺到深。']]},
  {plain:'練習讓他進步了。', o:[
   ['剛開始，他只能跑完一圈；一個月後，能跑三圈；到了學期末，他已經能輕鬆跑完五千公尺。',1,'數量由少到多，進步的軌跡清清楚楚。'],
   ['他每天都練習跑步、跳繩和游泳。',0,'只是並列項目，看不出進步的層次。'],
   ['剛開始，他能跑五千公尺；後來能跑三圈；最後只能跑一圈。',0,'數量越來越少，意思變成退步，和原句相反。']]},
  {plain:'保護環境人人有責。', o:[
   ['保護環境要從社區做起，再到自己，然後是家人。',0,'範圍的順序混亂，沒有一層一層擴大。'],
   ['保護環境很重要，人人都有責任，大家都要做。',0,'意思重複，沒有層次。'],
   ['保護環境要從自己做起，再帶動家人，進而影響整個社區。',1,'範圍由個人、家庭到社區，層層擴大。']]}
 ],
 mx:[
  {s:'一盆花能點亮一扇窗，一排花能妝點一條街，一整座城的花，能讓春天在這裡住下來。', note:'數量和範圍一起擴大，最後一句收在春天，意境最開闊。可以換成一盞燈、一本書。'},
  {s:'起初我只敢在房間裡練習，後來能在全班面前朗讀，到了畢業典禮，我站上臺代表全校致詞。', note:'舞臺一層比一層大，勇氣也一層比一層強。仿寫時可以寫學游泳、學樂器的過程。'},
  {s:'這片濕地先是吸引了幾隻白鷺鷥，接著來了成群的黑面琵鷺，如今已是上千隻候鳥過冬的家。', note:'用數量由少到多，寫出生態慢慢恢復。可以換成一座公園、一條溪流的改變。'}
 ],
 task:'選一件會慢慢擴大或加深的事，依照範圍由小到大、數量由少到多，或程度由淺到深，寫出至少三層。',
 kl:'至少有三個層次，而且一層比一層更進一步，不能前後顛倒或亂排；可以用「先、接著、最後」「不但、還、甚至」幫忙串連。'},

{id:'xc-shewen', name:'設問', from:'六上 學習地圖四',
 what:'寫作或說話時，為了引起讀者的注意和思考，故意「設」計「問」題，把原本平鋪直敘的語氣改成詢問語氣，就是設問。設問能引人注意、啟發思考，還能增強語意，凸顯作者要表達的重點和想法。',
 kinds:[
  {n:'懸問', d:'作者提出問題讓讀者思考，但不提供答案。', ex:'如果有一天，城市裡再也聽不見鳥叫，我們會不會懷念清晨的歌聲？'},
  {n:'提問', d:'作者自問自答：先用問題引起注意，再寫出答案，強調自己的想法。', ex:'什麼是勇氣？勇氣不是不害怕，而是害怕了仍然向前走。'},
  {n:'激問', d:'作者明知故問，答案就在問題的反面，讓文章更有氣勢。', ex:'只要肯一點一滴的累積，又有什麼夢想是遙不可及的呢？'}
 ],
 spot:[
  {s:'為什麼秋天的楓葉會變紅？原來是葉綠素逐漸分解，紅色的花青素便顯露了出來。', a:'設問', why:'先提出問題，再自己說出原因，是自問自答的提問。'},
  {s:'一個連自己都不相信的人，又怎能說服別人相信他呢？', a:'設問', why:'答案在問題的反面：「不能說服別人」，是語氣強烈的激問。'},
  {s:'多年以後，當我們再回到這間教室，還會記得今天的笑聲嗎？', a:'設問', why:'只提出問題，讓讀者自己去想，沒有給答案，是懸問。'},
  {s:'人生最珍貴的是什麼？不是名牌和獎盃，而是身邊真心陪伴的人。', a:'設問', why:'先問再答，用問題引起注意，凸顯作者的想法，是提問。'},
  {s:'看著滿地的垃圾，難道我們還要假裝沒看見嗎？', a:'設問', why:'用「難道……嗎」反問，真正的意思是「不能再假裝沒看見」，是激問。'},
  {s:'星星為什麼會一閃一閃的？那是星光穿過大氣層時被擾動的緣故。', a:'設問', why:'自問自答，先問現象再說明原因，是提問。'},
  {s:'古人說：「學然後知不足。」讀得越多，我越發現自己懂得太少。', a:'引用', why:'句子引用了《禮記》的話來印證自己的體會，沒有設計問題，是引用。'},
  {s:'月亮悄悄爬上樹梢，偷看著窗內熬夜讀書的我。', a:'轉化', why:'讓月亮會「爬」、會「偷看」，擁有人的動作，是擬人。'},
  {s:'哥哥在球場上衝鋒陷陣、毫不退讓，回到家卻溫柔的陪妹妹拼拼圖。', a:'映襯', why:'把哥哥在球場和在家裡兩種不同的樣子放在一起對照，是映襯。'},
  {s:'她的眼睛彷彿兩汪清澈的湖水，盛滿了好奇。', a:'譬喻', why:'用「彷彿」把眼睛比成湖水，是譬喻。'}
 ],
 redo:[
  {plain:'閱讀很重要。', o:[
   ['為什麼要閱讀？因為書本能帶我們去雙腳到不了的地方。',1,'自問自答，先引起好奇，再說出有畫面的答案。'],
   ['閱讀很重要嗎？',0,'只在句尾改成問句，沒有答案也沒有啟發，反而像在懷疑閱讀的重要。'],
   ['閱讀很重要，真的非常重要。',0,'沒有設計問題，只是加強語氣。']]},
  {plain:'浪費食物是不對的。', o:[
   ['浪費食物是不對的嗎？是的，是不對的。',0,'雖然自問自答，但答案只是重複原句，顯得囉嗦，沒有增強語意。'],
   ['農夫辛苦耕種了一整季，我們怎麼忍心把飯菜隨手倒掉呢？',1,'用激問帶出農夫的辛苦，答案在反面：「不忍心」，語氣更有力量。'],
   ['農夫辛苦耕種，我們絕對不應該浪費食物！',0,'這是感嘆句，加強了語氣，但不是設問。']]},
  {plain:'我們應該保護地球。', o:[
   ['地球是我們的家，大家都應該好好保護。',0,'平鋪直敘，沒有設問。'],
   ['我們應該保護地球？',0,'只在句尾加問號，語氣變得像在懷疑，意思反而模糊。'],
   ['如果地球生病了，我們還能搬到哪裡去呢？',1,'激問讓讀者自然想到「無處可去」，更明白保護地球的重要。']]},
  {plain:'友誼很珍貴。', o:[
   ['什麼是朋友？朋友是在你失意時，默默遞上一杯熱茶的人。',1,'自問自答，答案用具體畫面呈現，讓人印象深刻。'],
   ['友誼很珍貴，你知道嗎？我知道。',0,'問答沒有內容，只是硬湊出問句。'],
   ['友誼像一杯熱茶，溫暖我們的心。',0,'這是譬喻，不是設問。']]},
  {plain:'沒有人知道未來的世界會變成怎樣。', o:[
   ['二十年後的世界會怎樣？不知道。',0,'回答得太草率，破壞了思考的餘韻。'],
   ['二十年後抬起頭，天空還會是我們今天看見的這片湛藍嗎？',1,'懸問不給答案，留下想像和擔憂的空間，讓讀者自己思考。'],
   ['未來的世界一定會變得很不一樣。',0,'平鋪直敘，沒有設問。']]},
  {plain:'堅持下去就會成功。', o:[
   ['只要每天前進一小步，就有機會到達山頂。',0,'平鋪直敘，沒有設問。'],
   ['只要每天前進一小步，還有什麼山頂是到得了的呢？',0,'激問的答案要在反面，這樣寫意思變成「什麼山頂都到不了」，和原意相反。'],
   ['只要每天前進一小步，還有什麼山頂是到不了的呢？',1,'答案在反面：「沒有到不了的山頂」，語氣堅定有力。']]}
 ],
 mx:[
  {s:'什麼是長大？長大是終於懂得，媽媽每天早起的那份辛苦，從來都不是理所當然。', note:'自問自答的提問，答案落在一個生活細節上，溫柔而深刻。可以換成「什麼是勇氣」「什麼是幸福」。'},
  {s:'當最後一片森林倒下，最後一條河流乾涸，我們還能把什麼樣的世界交給下一代？', note:'懸問不給答案，讓沉重的問題留在讀者心裡。仿寫時可以換成海洋、空氣等環境議題。'},
  {s:'既然汗水已經一滴滴灑在跑道上，我又怎麼會在終點前輕易停下腳步呢？', note:'激問的答案在反面：「不會停下」，表現出堅定的決心。可以換成練琴、讀書的情境。'}
 ],
 task:'選一個你想強調的想法，用提問、懸問或激問其中一種方式，把平鋪直敘的句子改成設問句。',
 kl:'有用問句引起讀者思考；提問要自己回答，懸問不給答案，激問的答案要在問題的反面。',
 re:'？'},

{id:'xc-paibi', name:'排比', from:'六下 學習地圖一',
 what:'用連續三個或三個以上結構相似的語句，表達同範圍、同性質的意思，就是排比。排比能加深作者的情感或思想，加強文句氣勢，使文章富有節奏感；適當運用，不僅能把情感寫得更動人，也能把道理說得更透澈。',
 kinds:[
  {n:'詞組排比', d:'用三個以上結構相同的詞組（短語）排列在一起。', ex:'她的畫裡有清晨的露珠、午後的蟬聲、黃昏的炊煙。'},
  {n:'單句排比', d:'用三個以上結構相似的句子排列在一起。', ex:'春天的田是嫩綠的，夏天的海是湛藍的，秋天的稻穗是金黃的。'},
  {n:'複句排比', d:'用三組以上結構相同的複句排列在一起，常帶有關聯詞。', ex:'樹因為有根，所以能站得穩；河因為有源，所以能流得遠；人因為有夢，所以能走得長。'}
 ],
 spot:[

    card.textContent=pass?'挑戰成功！答對 '+right+'／'+order.length+' 題！':'答對 '+right+'／'+order.length+' 題，再挑戰一次！';
    if(pass){done();fb.replaceChildren(winLine('詞義快閃過關！'),h('button',{class:'secondary',onclick:()=>wFlash(w,panel,done,next)},'再玩一次'),next)}else fb.replaceChildren(h('button',{class:'primary',onclick:()=>wFlash(w,panel,done,next)},'再挑戰一次'))};
